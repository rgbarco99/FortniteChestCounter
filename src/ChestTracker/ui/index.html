// What a square shows. Three sources, each beating the one before it: what the game's own
// catalogue turned up (objFound), what is written down here and was checked by hand against the
// game (OBJ_WEEK_ITEMS), and what you typed, which always wins.
//
// The one exception is an announced entry: a name Epic gave out before the item existed, with no
// picture. That is a placeholder, so anything found beats it.
const getItem = (strKey) => {
    const objOfficial = OBJ_WEEK_ITEMS[strKey] ?? {};
    const objFound = objApp.objTreasure.objFound?.[strKey] ?? {};
    const objTyped = objApp.objTreasure.objItems[strKey] ?? {};
    return objOfficial.bAnnounced
        ? { ...objOfficial, ...objFound, ...objTyped }
        : { ...objFound, ...objOfficial, ...objTyped };
};

const normalizeTreasure = (objSaved) => {
    const objDefault = defaultTreasure();
    if (!objSaved || !Array.isArray(objSaved.arrRewards)) return objDefault;
    const objOut = { ...objDefault, ...objSaved, objItems: { ...(objSaved.objItems ?? {}) }, objFound: { ...(objSaved.objFound ?? {}) }, objWon: { ...(objSaved.objWon ?? {}) }, objExtraWeek: { ...(objSaved.objExtraWeek ?? {}) }, arrWindows: [...(objSaved.arrWindows ?? [])] };

    // Treasure Hours that Epic announced after this copy last saved. Folded in by start time and
    // only once, so a window edited or deleted on purpose does not come back on every start.
    const intSaved = Number(objSaved.intVersion) || 1;
    if (intSaved < 2) {
        const setStarts = new Set(objOut.arrWindows.map((objWindow) => objWindow.strStart));
        for (const objWindow of objDefault.arrWindows) if (!setStarts.has(objWindow.strStart)) objOut.arrWindows.push(objWindow);
        objOut.arrWindows.sort((objLeft, objRight) => String(objLeft.strStart).localeCompare(String(objRight.strStart)));
    }
    // Gizmos put away, without losing how many were counted
    if (intSaved < 3) {
        objOut.arrRewards = objOut.arrRewards.map((objReward) => (objReward.strId === "gizmo" ? { ...objReward, bHidden: true } : objReward));
    }
    // Until now there was no official list, so whatever was written in those squares was a
    // stand-in: a pasted screenshot, or a name picked while trying the search. The official
    // treasure takes over once, and "Volver al oficial" keeps it reversible from here on.
    // Only where the official entry brings its picture too: the pirate token has no icon in the
    // API, so a screenshot pasted for it is better than nothing and stays put.
    if (intSaved < 4) {
        for (const [strKey, objOfficial] of Object.entries(OBJ_WEEK_ITEMS)) {
            if (objOfficial.strImage) delete objOut.objItems[strKey];
        }
    }
    // The first Treasure Hour of 14 Nov was extended to four hours while it was running, so a
    // copy that saved the announced end has it wrong. Only that one window is corrected, and
    // only when it still holds the old end: an end edited by hand stays as it was.
    if (intSaved < 5) {
        for (const objWindow of objOut.arrWindows) {
            if (objWindow.strStart === "2026-11-14T19:00:00Z" && objWindow.strEnd === "2026-11-14T21:00:00Z") {
                objWindow.strEnd = "2026-11-14T23:00:00Z";
            }
        }
    }
    // Semanas 3 y 4: hasta ahora no estaban en la lista oficial, así que lo que hubiera escrito
    // en esas casillas era un apaño mientras no la había. El tesoro oficial toma el relevo una
    // vez, y solo donde trae su propia foto: lo pegado en una casilla que aquí va sin imagen
    // (los cuatro tesoros de la semana 4 que el juego todavía no ha publicado) se queda.
    if (intSaved < 6) {
        for (const [strKey, objOfficial] of Object.entries(OBJ_WEEK_ITEMS)) {
            if (objOfficial.strImage && (strKey.startsWith("2026-11-15T14|") || strKey.startsWith("2026-11-22T14|"))) delete objOut.objItems[strKey];
        }
    }
    // The night session of 15 Nov was written down with the double token of the week before,
    // which Epic never announced for it: it ran with the same multipliers as the afternoon one.
    // Corrected only where those wrong figures are still there, so a window changed by hand or
    // a multiplier typed in the tab stays as it was.
    if (intSaved < 7) {
        for (const objWindow of objOut.arrWindows) {
            if (objWindow.strStart === "2026-11-15T02:00:00Z" && Number(objWindow.objMultipliers?.token) === 2) {
                objWindow.objMultipliers = { token: 1.5, gold: 7.5, vehicle: 10 };
            }
        }
    }
    // Las dos Horas del tesoro del 21 y el 22 de noviembre. Se añaden por hora de comienzo y solo
    // una vez, como las del principio: una franja borrada a propósito no vuelve en cada arranque,
    // y lo que ya estuviera apuntado para esas horas se queda tal cual.
    if (intSaved < 8) {
        const setStarts = new Set(objOut.arrWindows.map((objWindow) => objWindow.strStart));
        for (const objWindow of objDefault.arrWindows) if (!setStarts.has(objWindow.strStart)) objOut.arrWindows.push(objWindow);
        objOut.arrWindows.sort((objLeft, objRight) => String(objLeft.strStart).localeCompare(String(objRight.strStart)));
    }
    // Semana 4: los cuatro tesoros que iban con el nombre anunciado por Epic y sin foto ya están
    // en el juego, así que ahora traen su imagen oficial. Lo que se hubiera escrito o pegado en
    // esas casillas era un apaño mientras no la había, y el tesoro oficial toma el relevo una
    // vez, como en las semanas anteriores: solo donde el oficial trae su propia foto, y «Volver
    // al oficial» lo deja reversible de aquí en adelante.
    if (intSaved < 9) {
        for (const [strKey, objOfficial] of Object.entries(OBJ_WEEK_ITEMS)) {
            if (objOfficial.strImage && strKey.startsWith("2026-11-22T14|")) delete objOut.objItems[strKey];
        }
    }
    if (intSaved < INT_TREASURE_VERSION) objOut.intVersion = INT_TREASURE_VERSION;
    return objOut;
};

let intTreasureTimer = 0;
const saveTreasure = () => {
    clearTimeout(intTreasureTimer);
    intTreasureTimer = setTimeout(() => api("PUT", "/api/treasure", objApp.objTreasure).catch(() => {}), 300);
};
const changeTreasure = (fnChange) => { fnChange(objApp.objTreasure); saveTreasure(); renderTreasure(); };

// Start of the reward week that contains a moment: the last "weekday at hour, UTC" before it
const getWeekStart = (dtMoment) => {
    const objTreasure = objApp.objTreasure;
    const dtStart = new Date(Date.UTC(dtMoment.getUTCFullYear(), dtMoment.getUTCMonth(), dtMoment.getUTCDate(), objTreasure.intWeekStartHourUtc));
    while (dtStart.getUTCDay() !== objTreasure.intWeekStartDay || dtStart > dtMoment) dtStart.setUTCDate(dtStart.getUTCDate() - 1);
    return dtStart;
};
const INT_WEEK_MS = 7 * 24 * 3600 * 1000;

// What the event spans. Both dates count whole, in the PC's own time: the end date is included.
const getSeasonBounds = () => {
    const objTreasure = objApp.objTreasure;
    const dtTo = new Date(`${objTreasure.strSeasonEnd}T00:00:00`);
    dtTo.setDate(dtTo.getDate() + 1);
    return { dblFrom: new Date(`${objTreasure.strSeasonStart}T00:00:00`).getTime(), dblTo: dtTo.getTime() };
};

// The reset that opens the event's first week: the first weekly reset from the start date on.
// An event starts on a reset, not at midnight, so its first week is whole and not a few hours.
const getFirstWeekStart = () => {
    const dblFrom = getSeasonBounds().dblFrom;
    const dtReset = getWeekStart(new Date(dblFrom));
    if (dtReset.getTime() < dblFrom) dtReset.setUTCDate(dtReset.getUTCDate() + 7);
    return dtReset;
};

// One reward week, cut to the event. The event ends on a day of its own, so the last week is
// short: the key stays the uncut start, which is what the crossed squares are saved under.
const makeWeek = (dtRawStart, objBounds, intIndex, intCount) => {
    const dblRawEnd = dtRawStart.getTime() + INT_WEEK_MS;
    const dtStart = new Date(Math.max(dtRawStart.getTime(), objBounds.dblFrom));
    const dtEnd = new Date(Math.min(dblRawEnd, objBounds.dblTo));
    return {
        dtStart, dtEnd, intIndex, intCount,
        strKey: dtRawStart.toISOString().slice(0, 13),
        bShort: dtEnd.getTime() - dtStart.getTime() < INT_WEEK_MS
    };
};

// Every reward week of the event, in order. Capped so an end date typed wrong cannot hang the tab.
const getEventWeeks = () => {
    const objBounds = getSeasonBounds();
    const arrStarts = [];
    for (let dblStart = getFirstWeekStart().getTime(); dblStart < objBounds.dblTo && arrStarts.length < 520; dblStart += INT_WEEK_MS) arrStarts.push(dblStart);
    if (!arrStarts.length) arrStarts.push(getWeekStart(new Date()).getTime());     // end date before the start
    return arrStarts.map((dblStart, intIndex) => makeWeek(new Date(dblStart), objBounds, intIndex, arrStarts.length));
};

// The event week we are in now; before the event that is the first, after it the last
const getNowWeekIndex = (arrWeeks) => {
    const dblNow = Date.now();
    const intIndex = arrWeeks.findIndex((objWeek) => dblNow < objWeek.dtEnd.getTime());
    return intIndex < 0 ? arrWeeks.length - 1 : intIndex;
};

// Where the week on screen falls in time. The weeks ahead can be looked at now: their treasures
// are written down before they start, and from inside the tab a week that has not begun looks
// exactly like the one being played — same squares, same zero chests. This is what tells them
// apart, and it is why the forward arrow is allowed to leave the current week.
const getWeekWhen = (objWeek) => {
    const dblNow = Date.now();
    if (dblNow >= objWeek.dtEnd.getTime()) return { strLabel: "Ya terminada", strTone: "done" };
    if (dblNow < objWeek.dtStart.getTime()) return { strLabel: "Próximamente", strTone: "soon" };
    return { strLabel: "Actual", strTone: "now" };
};

// The week on screen. The offset is kept inside the event, so the arrows cannot walk out of it.
const getSelectedWeek = () => {
    const arrWeeks = getEventWeeks();
    const intNow = getNowWeekIndex(arrWeeks);
    const intWanted = Math.min(arrWeeks.length - 1, Math.max(0, intNow + objApp.intWeekOffset));
    objApp.intWeekOffset = intWanted - intNow;
    return arrWeeks[intWanted];
};

// Every chest the tab counts, in one pass, together with what each figure is made of. With
// "squad" it also counts what your squadmates opened in those same matches: a treasure that
// drops for any of you is a treasure the group got, so the odds that matter are the ones over
// all your chests.
//
// Their cards carry counts, not timestamps, so their chests are placed at the start of the match.
// A match lasts about ten minutes and a Treasure Hour two, so this only shifts a chest across a
// window's edge in the few minutes either side of it.
//
// And then there is the seat nobody shares. Counted over one week of 65 matches, the 192 squad
// slots were 55 covered by somebody sharing, 46 of regulars who cannot share (one of them plays
// on PlayStation) and 91 of ninety-one different strangers, one match each: matchmaking fills
// that seat with somebody new almost every time, so "squad" cannot be exact by design and not
// for want of adoption. Counting those slots as no chests at all left the denominator at about
// half of the real one, so each of them is worth the average of the people who do share. That
// makes it an estimate, which is why arrEstimated and arrGaps travel with the moments: a figure
// that is part estimate has to be able to say so wherever it is shown.
const getChestTally = (strScope) => {
    const arrMoments = [];
    const arrEstimated = [];
    const arrGaps = [];                     // the start of the match of every slot nobody shared
    const bSquad = strScope === "squad";
    let intSharedChests = 0;                // what the squadmates who do share opened...
    let intSharedCards = 0;                 // ...and in how many matches, which is their average
    let intYourChests = 0;
    let intYourMatches = 0;

    for (const objMatch of (objApp.objState?.matches ?? [])) {
        if (objMatch.excluded) continue;
        const dblStart = new Date(objMatch.startedAt).getTime();
        for (const objOpening of objMatch.openings) {
            if (!ARR_CHEST_CATEGORIES.includes(objOpening.category)) continue;
            arrMoments.push(dblStart + objOpening.t * 1000);
            intYourChests++;
        }
        intYourMatches++;
        if (!bSquad) continue;
        for (const objMate of (objMatch.squad ?? [])) {
            if (objMate.isYou) continue;
            if (objMate.sharedChests == null) { arrGaps.push(dblStart); continue; }
            intSharedChests += objMate.sharedChests;
            intSharedCards++;
            for (let intChest = 0; intChest < objMate.sharedChests; intChest++) arrMoments.push(dblStart);
        }
    }

    // What a slot nobody shared is worth. Worked out here every time and never written down: how
    // much people play changes from week to week, and a number frozen in the code would go stale
    // without telling anybody. With nobody sharing, your own matches are the only measure there is.
    const dblAverage = intSharedCards ? intSharedChests / intSharedCards
        : intYourMatches ? intYourChests / intYourMatches
        : 0;

    // Chests do not come in halves, so what one slot leaves over is carried to the next instead
    // of being rounded away: forty slots of 37,5 are 1.500 chests and not 1.520.
    let dblOwed = 0;
    for (const dblStart of arrGaps) {
        dblOwed += dblAverage;
        while (arrEstimated.length < Math.round(dblOwed)) arrEstimated.push(dblStart);
    }
    for (const dblMoment of arrEstimated) arrMoments.push(dblMoment);

    return { arrMoments, arrEstimated, arrGaps, dblAverage };
};

// How many of a list of moments fall inside a stretch of time
const countBetween = (arrMoments, dblFrom, dblTo) => arrMoments.filter((dblMoment) => dblMoment >= dblFrom && dblMoment < dblTo).length;

// What an estimated figure is made of, which travels with the figure wherever it is shown. A
// number that reads as measured when a good part of it was worked out from an average is worse
// than no number at all.
const sayEstimated = (intTotal, intEstimated, intGaps) => intEstimated
    ? `${fmtWhole(intTotal - intEstimated)} contados + ${fmtWhole(intEstimated)} estimados de ${plural(intGaps, "compañero sin datos", "compañeros sin datos")}`
    : null;

// How many squads' worth of chests the treasure tab is counting
const getTreasureScope = () => {
    if (!(objApp.objState?.shared ?? []).length) return "mine";     // nothing shared: no choice to make
    try { return localStorage.getItem("contador-cofres-tesoro-ambito") === "mine" ? "mine" : "squad"; }
    catch (objError) { return "squad"; }
};

const setTreasureScope = (strScope) => {
    try { localStorage.setItem("contador-cofres-tesoro-ambito", strScope); } catch (objError) { /* storage unavailable */ }
    renderTreasure();
};

// The reward week a given moment falls in. A match from outside the event keeps its own plain
// week, so the squares it was counted against are still found under the same key.
const getWeekAt = (dtMoment) => {
    const arrWeeks = getEventWeeks();
    const dblMoment = dtMoment.getTime();
    return arrWeeks.find((objWeek) => dblMoment >= objWeek.dtStart.getTime() && dblMoment < objWeek.dtEnd.getTime())
        ?? makeWeek(getWeekStart(dtMoment), getSeasonBounds(), -1, arrWeeks.length);
};

// Treasures still to get in a week: not crossed out, and never the repeatable ones (Gizmos)
// The squares the tab shows. A hidden one keeps its data and its tally; it just stays out of sight.
const getShownRewards = () => objApp.objTreasure.arrRewards.filter((objReward) => !objReward.bHidden);

const getMissingRewards = (objWeek) => getShownRewards().filter((objReward) => !objReward.bRepeatable && !objApp.objTreasure.objWon[getScopeKey(objReward, objWeek)]);

const getScopeKey = (objReward, objWeek) => `${objReward.bWeekly ? objWeek.strKey : "season"}|${objReward.strId}`;

// Chance per chest at a given moment, with any Treasure Hours multiplier applied
const chanceAt = (objReward, dblMoment) => {
    let dblMultiplier = 1;
    for (const objWindow of objApp.objTreasure.arrWindows) {
        if (dblMoment >= new Date(objWindow.strStart).getTime() && dblMoment < new Date(objWindow.strEnd).getTime()) {
            dblMultiplier = Math.max(dblMultiplier, Number(objWindow.objMultipliers?.[objReward.strId]) || 1);
        }
    }
    return Math.min(1, dblMultiplier / objReward.dblOneIn);
};

// Odds of a reward over the chests in its scope: this week for weekly rewards, the season for the rest
const getRewardOdds = (objReward, objWeek, objTally) => {
    const objTreasure = objApp.objTreasure;
    const objBounds = getSeasonBounds();
    const dblFrom = objReward.bWeekly ? objWeek.dtStart.getTime() : objBounds.dblFrom;
    const dblTo = objReward.bWeekly ? objWeek.dtEnd.getTime() : objBounds.dblTo;
    const arrInScope = objTally.arrMoments.filter((dblMoment) => dblMoment >= dblFrom && dblMoment < dblTo);
    const intExtra = Math.max(0, Number(objReward.bWeekly ? objTreasure.objExtraWeek[objWeek.strKey] : objTreasure.intExtraSeason) || 0);
    const dblBase = 1 / objReward.dblOneIn;

    let dblNone = Math.pow(1 - dblBase, intExtra);
    let dblExpected = intExtra * dblBase;
    let intBoosted = 0;
    for (const dblMoment of arrInScope) {
        const dblChance = chanceAt(objReward, dblMoment);
        if (dblChance > dblBase * 1.0001) intBoosted++;
        dblNone *= 1 - dblChance;
        dblExpected += dblChance;
    }
    return {
        intChests: arrInScope.length + intExtra,
        // How much of that denominator nobody counted, and over how many squad slots
        intEstimated: countBetween(objTally.arrEstimated, dblFrom, dblTo),
        intGaps: countBetween(objTally.arrGaps, dblFrom, dblTo),
        intBoosted,
        dblPerChest: dblBase,
        dblAtLeastOne: 1 - dblNone,
        dblExpected,
        intForHalf: Math.ceil(Math.log(0.5) / Math.log(1 - dblBase))
    };
};

// The season as a whole: squares, the ones crossed off, and how many of them your chests should
// have given you by now. The expectation is the sum of each square's own odds over its own
// chests, which is what makes it comparable to the count: for a square that can only drop once,
// the chance of having got it IS the expected number of them.
//
// Weeks that have not started add nothing: they have no chests behind them and counting them
// would drag the expectation down towards zero and call it luck.
const getSeasonSummary = (objTally) => {
    const arrWeeks = getEventWeeks();
    const dblNow = Date.now();
    let intTotal = 0;
    let intWon = 0;
    let dblExpected = 0;

    for (const objReward of getShownRewards()) {
        if (objReward.bRepeatable) continue;        // a square that keeps dropping is not a tick
        for (const objWeek of (objReward.bWeekly ? arrWeeks : [arrWeeks[0]])) {
            intTotal++;
            if (objApp.objTreasure.objWon[getScopeKey(objReward, objWeek)]) intWon++;
            if (objWeek.dtStart.getTime() <= dblNow) {
                dblExpected += getRewardOdds(objReward, objWeek, objTally).dblAtLeastOne;
            }
        }
    }

    return { intTotal, intWon, dblExpected };
};

// Whether the treasures are coming faster or slower than the odds say they should. Said in words
// and only when there is enough behind it: with less than a third of a treasure expected, having
// none is the most ordinary thing in the world and calling it bad luck would be noise.
const describeLuck = (intWon, dblExpected) => {
    if (dblExpected < 0.3) return "todav\u00eda es pronto para saber si tienes suerte";
    const dblRatio = intWon / dblExpected;
    if (dblRatio > 1.25) return "vas con suerte";
    if (dblRatio < 0.8) return "te est\u00e1 costando";
    return "justo lo esperado";
};

// Chests a day, and what that leaves before the event closes. The rate is the season's own, not
// a lifetime average: how much is played changes, and what is being projected is the rest of
// this season and nothing else.
const getPace = (arrMoments, objWeek) => {
    const { dblFrom, dblTo } = getSeasonBounds();
    const dblNow = Date.now();
    const intSoFar = arrMoments.filter((dblMoment) => dblMoment >= dblFrom && dblMoment < dblNow).length;
    const dblDaysPlayed = Math.max(0.5, (Math.min(dblNow, dblTo) - dblFrom) / 86400000);
    const dblPerDay = intSoFar / dblDaysPlayed;
    const dblDaysLeft = Math.max(0, (dblTo - dblNow) / 86400000);
    const dblWeekLeft = Math.max(0, (Math.min(objWeek.dtEnd.getTime(), dblTo) - dblNow) / 86400000);
    return {
        dblPerDay,
        dblDaysLeft,
        intSoFar,
        intLeft: Math.round(dblPerDay * dblDaysLeft),
        intWeekLeft: Math.round(dblPerDay * dblWeekLeft),
        bOver: dblDaysLeft <= 0
    };
};

// Where a square's odds would stand after a few thousand more chests at the ordinary rate. The
// Treasure Hours are left out on purpose: the ones to come have not been announced, and counting
// hours nobody has promised would be inventing the best part of the answer.
const chanceAfter = (dblNow, objReward, intMoreChests) =>
    1 - (1 - dblNow) * Math.pow(1 - 1 / objReward.dblOneIn, Math.max(0, intMoreChests));

// Small percentages need more digits than big ones to say anything
const fmtPercent = (dblShare) => {
    const dblPercent = dblShare * 100;
    if (dblPercent === 0) return "0 %";
    const intDigits = dblPercent >= 10 ? 1 : dblPercent >= 1 ? 2 : dblPercent >= 0.01 ? 3 : dblPercent >= 0.0001 ? 5 : 7;
    return `${new Intl.NumberFormat(STR_LOCALE, { maximumFractionDigits: intDigits, minimumFractionDigits: Math.min(intDigits, 2) }).format(dblPercent)} %`;
};
const fmtWhole = (dblValue) => new Intl.NumberFormat(STR_LOCALE, { maximumFractionDigits: 0 }).format(dblValue);
const fmtDay = (dtDate) => dtDate.toLocaleDateString(STR_LOCALE, { day: "numeric", month: "short" });

// Shrinks a pasted or chosen picture and stores it inside the treasure data
const storeImage = async (strItemKey, objBlob) => {
    const objBitmap = await createImageBitmap(objBlob);
    const dblScale = Math.min(1, 480 / Math.max(objBitmap.width, objBitmap.height));
    const elCanvas = document.createElement("canvas");
    elCanvas.width = Math.round(objBitmap.width * dblScale);
    elCanvas.height = Math.round(objBitmap.height * dblScale);
    elCanvas.getContext("2d").drawImage(objBitmap, 0, 0, elCanvas.width, elCanvas.height);
    let strData = elCanvas.toDataURL("image/webp", 0.85);
    if (!strData.startsWith("data:image/webp")) strData = elCanvas.toDataURL("image/jpeg", 0.85);
    changeTreasure((objTreasure) => { objTreasure.objItems[strItemKey] = { ...(objTreasure.objItems[strItemKey] ?? {}), strImage: strData }; });
};

document.addEventListener("paste", (objEvent) => {
    if (objApp.strTab !== "tesoros" || !objApp.bTreasureEditing || !objApp.strPasteTarget) return;
    const objItem = [...(objEvent.clipboardData?.items ?? [])].find((objEntry) => objEntry.type.startsWith("image/"));
    if (!objItem) return;
    objEvent.preventDefault();
    storeImage(objApp.strPasteTarget, objItem.getAsFile());
});

const elTreasure = document.getElementById("elTreasure");

// ---------------------------------------------------------------------------
// The official name and icon, from fortnite-api.com
//
// The weekly item's picture used to be a screenshot pasted by hand. The API serves the icon
// Epic ships and the name already translated, so searchLanguage has to be the same language the
// name is typed in: searching "Banano" while the API looks in English finds nothing at all.
// ---------------------------------------------------------------------------

const STR_FIND_URL = "https://fortnite-api.com/v2/cosmetics/br/search/all";

// Cars, jam tracks and instruments are not in the battle royale catalogue and have no search
// endpoint of their own, so each whole list is fetched once and sifted here: about 1,5 MB between
// the three. The battle royale catalogue is searched by the API instead, because downloading it
// means 20 MB. Without this, "Cadillac CT5" — a real weekly treasure — could not be found at all.
const ARR_CATALOGUES = [
    { strFamily: "cars", strUrl: "https://fortnite-api.com/v2/cosmetics/cars" },
    { strFamily: "tracks", strUrl: "https://fortnite-api.com/v2/cosmetics/tracks" },
    { strFamily: "instruments", strUrl: "https://fortnite-api.com/v2/cosmetics/instruments" }
];

// The shapes the API answers with, made into one. Battle royale items carry images.icon, cars and
// instruments only small and large, and a jam track has no name at all: it has a title and an
// artist, with the album art for a picture.
const readCosmetic = (objItem, strFamily) => {
    if (strFamily === "tracks") return { strName: objItem?.title, strKind: objItem?.artist ?? "", strImage: objItem?.albumArt ?? null };
    const strKind = [objItem?.type?.displayValue, objItem?.rarity?.displayValue].filter(Boolean).join(" · ");
    if (strFamily === "br") return { strName: objItem?.name, strKind, strImage: objItem?.images?.icon ?? objItem?.images?.smallIcon ?? objItem?.images?.featured ?? null };
    return { strName: objItem?.name, strKind, strImage: objItem?.images?.large ?? objItem?.images?.small ?? null };
};

// Accents and capitals out of the way, so "cadillac" finds "Cadillac CT5-V Blackwing"
const foldText = (strText) => String(strText ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

// The three lists, asked for once a run and kept. Started when the editing begins, so by the time
// anything is typed they are usually already here.
let objCataloguesWait = null;
const loadCatalogues = () => {
    if (objCataloguesWait) return objCataloguesWait;
    objCataloguesWait = Promise.all(ARR_CATALOGUES.map(async (objWhich) => {
        try {
            const objUrl = new URL(objWhich.strUrl);
            objUrl.search = new URLSearchParams({ language: STR_LANG });
            const objResponse = await fetch(objUrl);
            if (!objResponse.ok) throw new Error(String(objResponse.status));
            return [].concat((await objResponse.json())?.data ?? [])
                .map((objItem) => readCosmetic(objItem, objWhich.strFamily))
                .filter((objHit) => objHit.strName && objHit.strImage);
        } catch (objError) {
            return [];                 // one list missing must not sink the whole search
        }
    })).then((arrLists) => arrLists.flat());
    return objCataloguesWait;
};

// ---------------------------------------------------------------------------
// The treasures of the week, found instead of typed
//
// Epic announces the week's five treasures in a blog post and inside the game: there is no list
// a program can ask for, and writing them down by hand every Sunday is the kind of chore that
// gets skipped. What can be asked for is the items themselves, which reach the catalogue the day
// the week starts and carry a mark in Epic's own internal id:
//
//   Backpack_FledGravelReward      the pickaxe or backbling square: the suffix "Reward"
//   loadingscreen_delilahthw3      the loading screen: "thw", for treasure-hunt week
//   CarSkin_EagleTreasureHunt01    the vehicle square
//
// Week four showed that the marks move: the backpack came in as Backpack_JuniperBurlapGold, with
// "Gold" where the three weeks before it had "Reward", and the gold outfit stopped sharing the
// backpack's code name — Character_YarnPuzzling went with it, two different names. So the marks
// are no longer the only thing holding this up. What has held every week is the moment: the
// week's five treasures go into the catalogue in the same instant, the loading screen among
// them, and the loading screen is the one that can always be asked for by id. It is the anchor,
// and the rest of the lot is read off its clock:
//
//   Character_YarnPuzzling         the gold outfit: the only outfit of that instant
//   Backpack_JuniperBurlapGold     by its mark, or the only backbling or pickaxe of that instant
//   sid_placeholder_971            the jam track, which carries no mark at all
//
// Asked in the reader's own language, the API answers with the name already translated, which is
// the whole difference between this and a list of code names.
//
// Everything in here is a guess that knows it is one. It fills a square that has nothing in it,
// it never touches what you typed, and when it cannot tell which item it is it leaves the square
// alone rather than putting the wrong thing in it.
// ---------------------------------------------------------------------------
const STR_NEW_URL = "https://fortnite-api.com/v2/cosmetics/new";
const STR_BR_URL = "https://fortnite-api.com/v2/cosmetics/br";
const STR_CARS_URL = "https://fortnite-api.com/v2/cosmetics/cars";

// The stem of this season's loading-screen ids, so a week can be asked for by name even when the
// patch that brought it is no longer the last one. It is the season's code name and it will
// change with the season; when it does, this route stops finding anything and the one through
// the new-items list keeps working, which is why there are two.
const STR_SCREEN_STEM = "loadingscreen_delilahthw";

// Hours either side of a week's opening that its treasures can be in the catalogue. Measured:
// week three's backpack went in on the 14th and the week began on the 15th.
//
// The window hangs off the week's start and not off the week itself, which it did first and got
// wrong: a week ends exactly when the next one begins, so a window covering the whole week swept
// up the next week's treasures and put them in this one's squares. Week two came out holding
// week three's five items, all of them right and all of them in the wrong week. Narrow and
// sometimes empty beats wide and sometimes wrong: an empty square asks to be filled in, a square
// filled with the wrong thing does not.
const INT_FOUND_WINDOW_HOURS = 48;

// Las dos marcas vistas en el id del accesorio: «Reward» las tres primeras semanas y «Gold» la
// cuarta. Se guarda cuál de las dos ha casado, porque solo «Reward» nombraba también al atuendo.
const RE_FOUND_REWARD = /^(?:Backpack|Pickaxe)_(.+?)(Reward|Gold)$/i;
const RE_FOUND_SCREEN = /loadingscreen_.*thw\d*$/i;
const RE_FOUND_CAR = /^CarSkin_(.+?)TreasureHunt\d*$/i;

// Cuánto se aparta del instante de la pantalla de carga el resto del lote de la semana. Medido:
// lo del catálogo de battle royale y el coche entran en el mismo segundo que ella, y la pista de
// improvisación un minuto después (semana 3: 13:30:42 y 13:31:05; semana 4: 13:30:46 y 13:31:49).
const INT_DROP_MINUTES = 5;

const fetchCosmetics = async (strUrl) => {
    const objUrl = new URL(strUrl);
    objUrl.searchParams.set("language", STR_LANG);
    const objResponse = await fetch(objUrl);
    if (!objResponse.ok) throw new Error(String(objResponse.status));
    return (await objResponse.json())?.data ?? null;
};

// One item by its internal id. Null when the game has not published it yet, which is the normal
// answer for a week that has not started.
const fetchCosmeticById = async (strId) => {
    try { return await fetchCosmetics(`${STR_BR_URL}/${encodeURIComponent(strId)}`); }
    catch (objError) { return null; }
};

// What the last patch added: 70 KB, asked for once a run
let objNewWait = null;
const loadNewCosmetics = () => {
    if (!objNewWait) objNewWait = fetchCosmetics(STR_NEW_URL).catch(() => null);
    return objNewWait;
};

// The car list with its ids, which the search catalogue throws away. Only fetched when a vehicle
// square needs one, because it is 1,5 MB: the golden car's own icon is a filler with the
// Fortnite logo on it, so the picture has to come from the car underneath the paint.
let objCarsWait = null;
const loadCarsById = () => {
    if (!objCarsWait) {
        objCarsWait = fetchCosmetics(STR_CARS_URL)
            .then((arrCars) => new Map([].concat(arrCars ?? []).map((objCar) => [String(objCar.id ?? "").toLowerCase(), objCar])))
            .catch(() => new Map());
    }
    return objCarsWait;
};

// An item of the catalogue as a square: the name the game gives it in this language, its icon,
// and the id it was recognised by, which is what makes the guess checkable afterwards.
const asFoundItem = (objItem, strFamily) => {
    const objRead = readCosmetic(objItem, strFamily);
    if (!objRead.strName) return null;
    const objOut = { strName: objRead.strName, strFoundId: objItem.id ?? null };
    if (objRead.strImage) objOut.strImage = objRead.strImage;
    return objOut;
};

/// The five squares of one week, as far as the catalogue can answer for them today.
const findWeekTreasures = async (objWeek) => {
    const objOut = {};
    const objNew = await loadNewCosmetics();
    const dblFrom = objWeek.dtStart.getTime() - INT_FOUND_WINDOW_HOURS * 3600000;
    const dblTo = Math.min(objWeek.dtStart.getTime() + INT_FOUND_WINDOW_HOURS * 3600000, objWeek.dtEnd.getTime());
    const bInWeek = (objItem) => {
        const dblAdded = Date.parse(objItem?.added ?? "");
        return dblAdded >= dblFrom && dblAdded < dblTo;
    };

    const arrBr = (objNew?.items?.br ?? []).filter(bInWeek);
    const arrCars = (objNew?.items?.cars ?? []).filter(bInWeek);
    const arrTracks = (objNew?.items?.tracks ?? []).filter(bInWeek);

    // The loading screen goes first because it is the anchor: by its mark among the new items
    // and, failing that, by the id this season builds them with
    let objScreen = arrBr.find((objItem) => RE_FOUND_SCREEN.test(String(objItem.id ?? "")));
    if (!objScreen) {
        objScreen = await fetchCosmeticById(objWeek.intIndex === 0 ? STR_SCREEN_STEM : `${STR_SCREEN_STEM}${objWeek.intIndex + 1}`);
    }
    const objScreenFound = objScreen ? asFoundItem(objScreen, "br") : null;
    if (objScreenFound) objOut.loading = objScreenFound;

    // The rest of the lot: what Epic put into the catalogue at that same moment. When the screen
    // could not be found there is no clock to read, and every route below falls back to its mark.
    const dblDrop = Date.parse(objScreen?.added ?? "");
    const bSameDrop = (objItem) => Number.isFinite(dblDrop)
        && Math.abs(Date.parse(objItem?.added ?? "") - dblDrop) <= INT_DROP_MINUTES * 60000;
    const objOnlyOne = (arrItems) => (arrItems.length === 1 ? arrItems[0] : null);
    const strKind = (objItem) => String(objItem?.type?.value ?? "").toLowerCase();

    // The backpack or pickaxe: by its mark, and failing that the only one of its kind in the
    // lot. Neither route covers the other: the mark has already changed once, and week three's
    // backpack went into the catalogue a day before its week opened, on its own.
    const objReward = arrBr.find((objItem) => RE_FOUND_REWARD.test(String(objItem.id ?? "")))
        ?? objOnlyOne(arrBr.filter((objItem) => bSameDrop(objItem) && ["backpack", "pickaxe"].includes(strKind(objItem))));
    if (objReward) {
        const objFound = asFoundItem(objReward, "br");
        if (objFound) objOut.pickaxe = objFound;
    }

    // The gold outfit: the only outfit of the lot. The old route, the backpack's code name
    // without its suffix, stays behind it for a week whose outfit the new-items list no longer
    // carries — but only from a "Reward" mark, which named the outfit for three weeks running.
    // Not from a "Gold" one: JuniperBurlap is Captain X's set and Character_JuniperBurlap does
    // exist, so that guess would quietly put somebody else's outfit in the square.
    const arrMark = RE_FOUND_REWARD.exec(String(objReward?.id ?? ""));
    const strCodeName = arrMark && /^reward$/i.test(arrMark[2]) ? arrMark[1] : null;
    const objOutfit = objOnlyOne(arrBr.filter((objItem) => bSameDrop(objItem) && strKind(objItem) === "outfit"))
        ?? (strCodeName ? await fetchCosmeticById(`Character_${strCodeName}`) : null);
    if (objOutfit) {
        const objFound = asFoundItem(objOutfit, "br");
        if (objFound) objOut.gold = objFound;
    }

    // The vehicle: the golden paint names the treasure, the car underneath gives the picture
    const objSkin = arrCars.find((objItem) => RE_FOUND_CAR.test(String(objItem.id ?? "")));
    if (objSkin) {
        const objFound = asFoundItem(objSkin, "cars");
        const strCarName = RE_FOUND_CAR.exec(String(objSkin.id ?? ""))?.[1];
        if (objFound && strCarName) {
            const objBody = (await loadCarsById()).get(`carbody_${strCarName}`.toLowerCase());
            const objBodyRead = objBody ? readCosmetic(objBody, "cars") : null;
            if (objBodyRead?.strImage) objFound.strImage = objBodyRead.strImage;
            if (objBodyRead?.strName) objFound.strName = `${objFound.strName} (${objBodyRead.strName})`;
        }
        if (objFound) objOut.vehicle = objFound;
    }

    // The jam track carries no mark at all, so what tells it apart is when it went in: with the
    // rest of the lot, a minute after the loading screen. Failing that, the day the week opened,
    // because the week's treasures go in when the week opens and the patch's other music does
    // not. Two in the same day is a tie that one cannot break, and a wrong name in the square is
    // worse than an empty one, so it leaves it.
    const strWeekDay = objWeek.dtStart.toISOString().slice(0, 10);
    const objTrack = objOnlyOne(arrTracks.filter(bSameDrop))
        ?? objOnlyOne(arrTracks.filter((objItem) => String(objItem.added ?? "").slice(0, 10) === strWeekDay));
    if (objTrack) {
        const objFound = asFoundItem(objTrack, "tracks");
        if (objFound) objOut.jam = objFound;
    }

    return objOut;
};

// Squares of this week with nothing in them, or holding a name Epic announced before the item
// existed. These are the ones worth looking for; the rest are already answered.
const getUnknownSquares = (objWeek) => getShownRewards().filter((objReward) => {
    if (!objReward.bWeekly) return false;
    const objItem = getItem(getScopeKey(objReward, objWeek));
    return !objItem.strName || (objItem.bAnnounced && !objItem.strImage);
});

// Weeks already looked for in this run, so that redrawing the tab does not ask again
const setWeeksLookedUp = new Set();

const discoverWeek = async (objWeek, bByHand = false) => {
    if (objApp.objDiscover?.bBusy) {
        // Another week is being looked up right now. Forgetting this one puts it back in the
        // queue: the render that comes with the answer will reach it, and without this it would
        // count as looked for and never be tried again this run.
        setWeeksLookedUp.delete(objWeek.strKey);
        return;
    }
    setWeeksLookedUp.add(objWeek.strKey);
    objApp.objDiscover = { strKey: objWeek.strKey, bBusy: true, intFound: 0, bByHand };
    renderTreasure();

    let objFound = {};
    try { objFound = await findWeekTreasures(objWeek); }
    catch (objError) { objFound = {}; }

    const arrSquares = Object.keys(objFound);
    if (arrSquares.length) {
        changeTreasure((objData) => {
            objData.objFound = objData.objFound ?? {};
            for (const [strSquare, objValue] of Object.entries(objFound)) {
                objData.objFound[`${objWeek.strKey}|${strSquare}`] = objValue;
            }
        });
    }

    objApp.objDiscover = { strKey: objWeek.strKey, bBusy: false, intFound: arrSquares.length, bByHand };
    renderTreasure();

    // Said out loud only when it was asked for by hand, or when it actually filled something in:
    // a silent look that found nothing is the normal state of a week that has not started.
    if (arrSquares.length) {
        showToast("Tesoros de la semana encontrados",
            `${arrSquares.length === 1 ? "Una casilla se ha rellenado sola" : `${arrSquares.length} casillas se han rellenado solas`} con el nombre y la imagen que el juego da. Comprueba que cuadran con lo que ves en Fortnite; puedes cambiarlas en «Editar tesoros».`,
            "good", 9000);
    } else if (bByHand) {
        showToast("Todavía no están",
            "Los tesoros de una semana llegan al juego el día que empieza. Si la semana ya ha empezado y siguen sin aparecer, escríbelos a mano en «Editar tesoros».",
            "info", 9000);
    }
};

let objFindAbort = null;
let bFindFocus = false;

const findCosmetics = async (strKey, strQuery) => {
    objFindAbort?.abort();
    const strTerm = strQuery.trim();
    bFindFocus = true;
    if (strTerm.length < 2) {
        objApp.objFind = { strKey, strQuery, bBusy: false, arrHits: [], strSaid: "Escribe al menos dos letras." };
        renderTreasure();
        return;
    }
    objApp.objFind = { strKey, strQuery, bBusy: true, arrHits: [], strSaid: "" };
    renderTreasure();

    const objAbort = new AbortController();
    objFindAbort = objAbort;
    let bFailed = false;

    // Battle royale is searched by the API; cars, tracks and instruments, here
    const findBattleRoyale = async () => {
        const objUrl = new URL(STR_FIND_URL);
        objUrl.search = new URLSearchParams({ language: STR_LANG, searchLanguage: STR_LANG, matchMethod: "contains", name: strTerm });
        const objResponse = await fetch(objUrl, { signal: objAbort.signal });
        if (!objResponse.ok && objResponse.status !== 404) throw new Error(String(objResponse.status));
        // 404 is how the API says "nothing by that name"
        const arrData = objResponse.status === 404 ? [] : [].concat((await objResponse.json())?.data ?? []);
        return arrData.map((objItem) => readCosmetic(objItem, "br")).filter((objHit) => objHit.strName && objHit.strImage);
    };
    const findInCatalogues = async () => {
        const strWanted = foldText(strTerm);
        return (await loadCatalogues()).filter((objHit) => foldText(objHit.strName).includes(strWanted));
    };

    const [arrBattleRoyale, arrRest] = await Promise.all([
        findBattleRoyale().catch(() => { bFailed = true; return []; }),
        findInCatalogues().catch(() => { bFailed = true; return []; })
    ]);
    if (objAbort.signal.aborted) return;

    const arrHits = [...arrBattleRoyale, ...arrRest].slice(0, 36);
    objApp.objFind = {
        strKey, strQuery, bBusy: false, arrHits,
        strSaid: arrHits.length ? "" : bFailed
            ? "No se pudo consultar fortnite-api.com. Revisa la conexión o pega una captura."
            : "Nada con ese nombre. Un objeto recién salido puede tardar en estar en la API: pega una captura."
    };
    bFindFocus = true;
    renderTreasure();
};

// Takes the name and the icon of the chosen one. The address shows straight away; then a copy is
// shrunk into the data, so the picture is still there without internet, like a pasted screenshot.
const takeCosmetic = async (strItemKey, objHit) => {
    changeTreasure((objData) => {
        const objItem = objData.objItems[strItemKey] ?? {};
        objData.objItems[strItemKey] = { ...objItem, strName: objHit.strName, strImage: objHit.strImage ?? objItem.strImage ?? null };
    });
    objApp.objFind = null;
    if (!objHit.strImage) { renderTreasure(); return; }
    try {
        const objResponse = await fetch(objHit.strImage);
        if (objResponse.ok) await storeImage(strItemKey, await objResponse.blob());
    } catch (objError) { /* the address stays, and that still shows while there is internet */ }
    renderTreasure();
};

// ---------------------------------------------------------------------------
// Treasure Hours: the same instant everywhere, so every PC shows its own clock
//
// Epic announces one world-wide window, and the press writes it in whatever zone it happens to
// use. Stored in UTC, read here in the zone this PC is set to, with the zone named next to it so
// it can be checked: a player in Madrid and one in Los Angeles see different hours, same moment.
// ---------------------------------------------------------------------------

const STR_TIME_ZONE = (() => {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (objError) { return ""; }
})();

const fmtZoneOffset = (dtMoment) => {
    const intMinutes = -dtMoment.getTimezoneOffset();
    const intAbs = Math.abs(intMinutes);
    return `UTC${intMinutes < 0 ? "−" : "+"}${Math.floor(intAbs / 60)}${intAbs % 60 ? `:${String(intAbs % 60).padStart(2, "0")}` : ""}`;
};
const strZoneLabel = (dtMoment) => (STR_TIME_ZONE ? `${STR_TIME_ZONE} (${fmtZoneOffset(dtMoment)})` : fmtZoneOffset(dtMoment));
const fmtTimeOfDay = (dtMoment) => dtMoment.toLocaleTimeString(STR_LOCALE, { hour: "2-digit", minute: "2-digit" });
const fmtWeekDay = (dtMoment) => dtMoment.toLocaleDateString(STR_LOCALE, { weekday: "short", day: "numeric", month: "short" });
const fmtUtcTime = (dtMoment) => `${String(dtMoment.getUTCHours()).padStart(2, "0")}:${String(dtMoment.getUTCMinutes()).padStart(2, "0")}`;

// "2 h 14 min", "14 min", "45 s": the closer it gets, the finer
const fmtLeft = (dblMs) => {
    const intSeconds = Math.max(0, Math.round(dblMs / 1000));
    if (intSeconds >= 3600) return `${Math.floor(intSeconds / 3600)} h ${Math.floor((intSeconds % 3600) / 60)} min`;
    if (intSeconds >= 60) return `${Math.floor(intSeconds / 60)} min`;
    return `${intSeconds} s`;
};

const renderTreasureHours = () => {
    const objTreasure = objApp.objTreasure;
    const dblNow = Date.now();
    const objBounds = getSeasonBounds();

    const arrAll = objTreasure.arrWindows
        .map((objWindow) => ({ objWindow, dblStart: new Date(objWindow.strStart).getTime(), dblEnd: new Date(objWindow.strEnd).getTime() }))
        .filter((objRow) => Number.isFinite(objRow.dblStart) && Number.isFinite(objRow.dblEnd) && objRow.dblEnd > objRow.dblStart && objRow.dblEnd > objBounds.dblFrom)
        .sort((objLeft, objRight) => objLeft.dblStart - objRight.dblStart);

    // Everything still to come, and the last one that went by, so the panel stays small
    const arrGone = arrAll.filter((objRow) => objRow.dblEnd <= dblNow);
    const arrShown = [...arrGone.slice(-1), ...arrAll.filter((objRow) => objRow.dblEnd > dblNow)];

    const arrRows = arrShown.map(({ objWindow, dblStart, dblEnd }) => {
        const dtStart = new Date(dblStart);
        const dtEnd = new Date(dblEnd);
        const bLive = dblNow >= dblStart && dblNow < dblEnd;
        const bGone = dblEnd <= dblNow;
        const bSameDay = dtStart.toDateString() === dtEnd.toDateString();
        const arrBoost = getShownRewards()
            .filter((objReward) => Number(objWindow.objMultipliers?.[objReward.strId]) > 1)
            .map((objReward) => el("span", { class: "mult" }, [
                el("b", { "data-notr": true, text: `×${fmtNumber(Number(objWindow.objMultipliers[objReward.strId]))}` }),
                objReward.strName
            ]));

        return el("li", { class: bLive ? "live" : bGone ? "past" : "soon" }, [
            // Already the reader's own clock and language, so the translator leaves it alone
            el("div", { class: "when", "data-notr": true }, [
                el("b", { text: `${fmtWeekDay(dtStart)}, ${fmtTimeOfDay(dtStart)} – ${bSameDay ? "" : `${fmtWeekDay(dtEnd)}, `}${fmtTimeOfDay(dtEnd)}` }),
                el("small", { text: `${fmtUtcTime(dtStart)} – ${fmtUtcTime(dtEnd)} UTC` })
            ]),
            el("div", { class: "state", text: bLive ? `en directo, queda ${fmtLeft(dblEnd - dblNow)}` : bGone ? "ya pasó" : `empieza en ${fmtLeft(dblStart - dblNow)}` }),
            el("div", { class: "boost" }, arrBoost.length ? arrBoost : el("span", { class: "none", text: "sin multiplicadores apuntados" }))
        ]);
    });

    return el("section", { class: "t-hours", id: "elTreasureHours" }, [
        el("header", {}, [
            el("h2", { text: "Horas del tesoro" }),
            el("p", {}, [
                "Son el mismo instante en todo el mundo. Tu PC está en ",
                el("b", { "data-notr": true, text: strZoneLabel(new Date()) }),
                ", así que las horas de abajo ya son las tuyas."
            ])
        ]),
        arrRows.length ? el("ul", {}, arrRows) : el("p", { class: "empty", text: "Aún no hay Horas del tesoro apuntadas. Se añaden en «Editar tesoros»." })
    ]);
};

    // What it costs on average: one chest in dblOneIn, so dblOneIn chests is the ordinary price

        elEditor = el("div", { class: "editor" }, [
            el("label", {}, [objReward.bWeekly ? "Nombre del objeto de esta semana" : "Nombre del objeto", el("input", { type: "text", value: objItem.strName ?? "", placeholder: "Como aparece en el juego", onchange: (objEvent) => setItem("strName", objEvent.target.value.trim()) })]),
            el("div", { class: "findhint", text: "Busca el objeto de esta semana para coger su nombre e imagen oficiales" }),
            el("div", { class: "find" }, [
                elFindInput,
                el("button", { class: `btn small${objFind?.bBusy ? " working" : ""}`, text: "Buscar", onclick: () => findCosmetics(strKey, elFindInput.value) })
            ]),
            objFind?.strSaid ? el("div", { class: "said", text: objFind.strSaid }) : null,

            el("div", {
                class: `drop${bArmed ? " armed" : ""}`, tabindex: 0, role: "button",

            el("div", { class: "odds left", text: intToGo > 0

                        objData.arrWindows[intIndex].objMultipliers = { ...(objData.arrWindows[intIndex].objMultipliers ?? {}) };
                        if (dblValue > 1) objData.arrWindows[intIndex].objMultipliers[objReward.strId] = dblValue; else delete objData.arrWindows[intIndex].objMultipliers[objReward.strId];
                    })
                }))),

            ])))
        ]),

// The squares of this week that nothing can answer yet. The treasures reach the game the day
// the week opens, so an empty square before that is simply early and an empty square afterwards
// is something to go and look at. Both are worth one line; neither is worth a paragraph.
const renderTreasureFound = (objWeek) => {

// Where the chests still to come leave each square. The event ends on a day, so the question
// stops being "how likely is this" and becomes "how likely will this be when it is over", which
// is the one that decides whether it is worth chasing.
//
// Weekly squares are projected to the end of the week and the season ones to the end of the
// event, because that is when each of them stops being winnable. Treasure Hours are left out:
// the ones still to come have not been announced, and counting hours nobody has promised would
// be inventing the best part of the answer.
const renderTreasurePace = (objPace, objWeek, arrMissing, objTally) => {
    if (objPace.bOver || !arrMissing.length) return null;
    if (objPace.intSoFar < 25 || objPace.dblPerDay <= 0) return null;    // too little behind it to project anything

    const { dblTo } = getSeasonBounds();
    const dblWeekDays = Math.max(0, (Math.min(objWeek.dtEnd.getTime(), dblTo) - Date.now()) / 86400000);

    const arrRows = arrMissing.map((objReward) => {
        const dblNow = getRewardOdds(objReward, objWeek, objTally).dblAtLeastOne;
        const intMore = objReward.bWeekly ? objPace.intWeekLeft : objPace.intLeft;
        return { objReward, dblNow, intMore, dblThen: chanceAfter(dblNow, objReward, intMore), dblDays: objReward.bWeekly ? dblWeekDays : objPace.dblDaysLeft };
    }).sort((objLeft, objRight) => objRight.dblThen - objLeft.dblThen);

    // The one worth chasing is the one that would end up closest, and the only useful thing to
    // say about it is the price of a coin flip: how many chests a day would make it even odds.
    const objBest = arrRows[0];
    const dblWanted = Math.log(0.5 / (1 - objBest.dblNow)) / Math.log(1 - 1 / objBest.objReward.dblOneIn);
    const intPerDay = objBest.dblDays > 0.2 ? Math.ceil(dblWanted / objBest.dblDays) : Infinity;
    const bWorthSaying = objBest.dblThen < 0.5 && Number.isFinite(intPerDay) && intPerDay > objPace.dblPerDay && intPerDay < 20000;

    return el("div", { class: "t-pace" }, [
        el("h2", { text: `A tu ritmo de ${fmtNumber(objPace.dblPerDay)} cofres al día` }),
        el("p", { class: "hint", text: `Hasta el ${fmtDay(new Date(dblTo - 1))} te quedan unos ${fmtWhole(objPace.intLeft)} cofres, y unos ${fmtWhole(objPace.intWeekLeft)} antes de que termine esta semana.` }),
        el("div", { class: "rows" }, arrRows.map((objRow) => el("div", { class: "row" }, [
            el("span", { class: "who", text: objRow.objReward.strName }),
            el("span", { class: "was", text: fmtPercent(objRow.dblNow) }),
            el("span", { class: "arrow", "data-notr": true, text: "→" }),
            // Never quite one: it is a probability, and "100 %" promises something the maths
            // does not. The last tenth stays open however many chests go in.
            el("b", { class: "now", text: fmtPercent(Math.min(objRow.dblThen, 0.999)) })
        ]))),
        bWorthSaying
            ? el("p", { class: "hint", text: `Para llegar al 50 % en «${objBest.objReward.strName}» harían falta unos ${fmtWhole(intPerDay)} cofres al día.` })
            : el("p", { class: "hint", text: "El de arriba del todo es el que más cerca acabaría." })
    ]);
};

            el("button", { class: "btn small", text: "Semana anterior", disabled: objWeek.intIndex === 0, onclick: () => { objApp.intWeekOffset--; renderTreasure(); } }),
            el("button", { class: "btn small", text: "Semana siguiente", disabled: objWeek.intIndex >= objWeek.intCount - 1, onclick: () => { objApp.intWeekOffset++; renderTreasure(); } }),
            objWeek.bShort ? el("span", { class: "short", text: `más corta: el evento acaba el ${fmtDay(new Date(dblSeasonTo - 1))}` }) : null,

        ]),

            el("p", { text: "Los dos porcentajes de arriba cuentan solo los tesoros sin tachar. Probabilidades por cofre publicadas por Epic (Fortnite Status, 7 de noviembre de 2026) para partidas normales. El cálculo usa los cofres, cofres especiales y cofres de espíritu de las partidas leídas, abiertos o rotos; Epic no ha dicho si todos los tipos de cofre cuentan igual. El cambio de semana (domingo, 14:00 UTC) no lo publica Epic: ajústalo en «Editar tesoros». Los objetos de cada semana tampoco salen en ninguna lista, así que el programa los busca en el catálogo del juego por el identificador interno con el que Epic marca los tesoros y rellena solo las casillas vacías; lo que escribas tú gana siempre. Las Horas del tesoro también se apuntan a mano: las horas son las que anunció Epic, pero algunos multiplicadores vienen de la prensa y no de Epic, así que conviene comprobarlos ahí mismo." })

// The Treasure Hours are a countdown, so that panel redraws itself. Only that panel: the rest of
// the tab has boxes being typed into and must not be rebuilt under the player's fingers.
setInterval(() => {
    if (objApp.strTab !== "tesoros" || !objApp.objState || !objApp.objTreasure) return;
    document.getElementById("elTreasureHours")?.replaceWith(renderTreasureHours());
}, 1000);

// ---------------------------------------------------------------------------
// Map tab: where on the island you open your chests.
//
// The replay gives the position of each opening in the game's own metres, and the season's
// places come in those same metres, so both land on the picture with one transform. The
// picture covers 1350 m either side of the world's origin, which makes a pixel 1.32 m.
// ---------------------------------------------------------------------------

const INT_MAP_PIXELS = 2048;      // the picture is square, and this is its side

// What slice of the world the picture shows, in metres. Measured, not assumed: the obvious guess
// (1350 m each way from the origin) is close enough to look plausible and still lands chests tens
// of metres off, which is a whole building. These come from fitting this season's picture against
// 5.384 chests of known position and checking the named places by eye afterwards. The island is
// not quite centred, and the two axes are not quite the same scale.
const OBJ_MAP_FRAME = { dblHalfWidth: 1476, dblHalfHeight: 1512, dblMiddleX: 80, dblMiddleY: 14 };

// World metres to a 0..1 place on the picture. The world's Y grows southwards, like the image.
const mapFraction = (dblX, dblY) => ({
    dblLeft: (dblX - OBJ_MAP_FRAME.dblMiddleX) / (2 * OBJ_MAP_FRAME.dblHalfWidth) + 0.5,
    dblTop: (dblY - OBJ_MAP_FRAME.dblMiddleY) / (2 * OBJ_MAP_FRAME.dblHalfHeight) + 0.5
});

// Every opening of the given matches that the replay managed to place
const getMapOpenings = (arrMatches) => {
    const arrPoints = [];
    for (const objMatch of arrMatches) {
        for (const objOpening of objMatch.openings) {
            if (objOpening.x != null && objOpening.y != null && ARR_CHEST_CATEGORIES.includes(objOpening.category)) {
                arrPoints.push(objOpening);
            }
        }
    }
    return arrPoints;
};

// Each chest belongs to the nearest named place, as long as it is not out in the middle of nowhere
const INT_PLACE_REACH = 260;      // metres; beyond this a chest counts as being nowhere in particular
const nearestPlace = (arrPlaces, objPoint) => {
    let objNearest = null;
    let dblBest = INT_PLACE_REACH * INT_PLACE_REACH;
    for (const objPlace of arrPlaces) {
        const dblDistance = (objPlace.x - objPoint.x) ** 2 + (objPlace.y - objPoint.y) ** 2;
        if (dblDistance < dblBest) { dblBest = dblDistance; objNearest = objPlace; }
    }
    return objNearest;
};

const ARR_MAP_SCOPES = [
    { strId: "todas", strLabel: "Todas tus partidas" },
    { strId: "partida", strLabel: "Solo la partida elegida" }
];

// ---------------------------------------------------------------------------
// The way you went
//
// The replay knows where the player stood five times a second; the record keeps a couple of
// hundred of those points, which draw the same shape (see ReplayParser.BuildOwnRoute). It goes
// over the same picture as the chests and through the same projection, so a corner of the line
// and the chest opened at that corner land on the same spot.
//
// The colour carries the time, from the drop to the last frame, and an arrowhead every so often
// says which way it was walked. A route with no direction is a scribble: the whole reason to
// look at one is to see the order things happened in.
//
// Asked for one match at a time and kept once it comes. It never travels with the rest of the
// state: three hundred routes is a megabyte of line for a drawing of one of them.
// ---------------------------------------------------------------------------
const dicRoutes = new Map();
const INT_ROUTE_ARROWS = 14;          // over the whole way, however many points it is made of

const loadRoute = async (strFile) => {
    if (!dicRoutes.has(strFile)) {
        // An empty one is worth keeping too: it is the answer, and asking again every redraw
        // would be a request per second for a match that never had a route
        try {
            const objAnswer = await api("GET", `/api/route?file=${encodeURIComponent(strFile)}`);
            dicRoutes.set(strFile, objAnswer?.route ?? []);
        } catch (objIgnored) {
            dicRoutes.set(strFile, []);
        }
    }
    return dicRoutes.get(strFile);
};

// Pale blue where they landed, through to violet at the end. Never the reds and oranges of the
// heat, which this is drawn on top of in the Map tab.
const routeColour = (dblPart) => `hsl(${Math.round(192 + 96 * dblPart)} 90% ${Math.round(70 - 8 * dblPart)}%)`;

const routeOverlay = (arrRoute) => {
    if (!arrRoute || arrRoute.length < 2) return null;

    const arrSpots = arrRoute.map((objPoint) => {
        const { dblLeft, dblTop } = mapFraction(objPoint.x, objPoint.y);
        return { dblX: dblLeft * 1000, dblY: dblTop * 1000 };
    });
    const intLast = arrSpots.length - 1;
    const strPoints = arrSpots.map((objSpot) => `${objSpot.dblX.toFixed(1)},${objSpot.dblY.toFixed(1)}`).join(" ");

    // One line per pair, so the colour can run along the way. A single path with a gradient would
    // run its colours across the picture instead, which says nothing about when anything happened.
    const arrLegs = [];
    for (let intAt = 1; intAt <= intLast; intAt++) {
        arrLegs.push(svg("line", {
            x1: arrSpots[intAt - 1].dblX.toFixed(1), y1: arrSpots[intAt - 1].dblY.toFixed(1),
            x2: arrSpots[intAt].dblX.toFixed(1), y2: arrSpots[intAt].dblY.toFixed(1),
            stroke: routeColour((intAt - 1) / intLast), "stroke-width": 5, "stroke-linecap": "round"
        }));
    }

    // Spread evenly along the way and never one per point: enough to read the direction, few
    // enough to leave the line visible under them
    const arrHeads = [];
    const intStep = Math.max(1, Math.round(intLast / INT_ROUTE_ARROWS));
    for (let intAt = intStep; intAt <= intLast; intAt += intStep) {
        const objFrom = arrSpots[intAt - 1];
        const objTo = arrSpots[intAt];
        const dblAngle = Math.atan2(objTo.dblY - objFrom.dblY, objTo.dblX - objFrom.dblX) * 180 / Math.PI;
        if (!Number.isFinite(dblAngle)) continue;
        arrHeads.push(svg("path", {
            d: "M 0 0 L -13 -7.5 L -13 7.5 Z",
            transform: `translate(${objTo.dblX.toFixed(1)} ${objTo.dblY.toFixed(1)}) rotate(${dblAngle.toFixed(1)})`,
            fill: routeColour(intAt / intLast), stroke: "rgba(8, 6, 20, 0.75)", "stroke-width": 2, "stroke-linejoin": "round"
        }));
    }

    const objStart = arrSpots[0];
    const objEnd = arrSpots[intLast];
    return svg("svg", { class: "m-route", viewBox: "0 0 1000 1000", "aria-hidden": "true" }, [
        // A dark line under the coloured one. The island is bright in places, and a thin line
        // over a beach is a line nobody can follow.
        svg("polyline", {
            points: strPoints, fill: "none", stroke: "rgba(8, 6, 20, 0.7)",
            "stroke-width": 11, "stroke-linejoin": "round", "stroke-linecap": "round"
        }),
        ...arrLegs,
        ...arrHeads,
        // Where they landed: a ring, because the drop is a place you arrive at, not a thing you leave
        svg("circle", { cx: objStart.dblX.toFixed(1), cy: objStart.dblY.toFixed(1), r: 13, fill: "none", stroke: "rgba(8, 6, 20, 0.8)", "stroke-width": 6.5 }),
        svg("circle", { cx: objStart.dblX.toFixed(1), cy: objStart.dblY.toFixed(1), r: 13, fill: "none", stroke: routeColour(0), "stroke-width": 3.5 }),
        // And where it ended
        svg("circle", { cx: objEnd.dblX.toFixed(1), cy: objEnd.dblY.toFixed(1), r: 8, fill: routeColour(1), stroke: "rgba(8, 6, 20, 0.8)", "stroke-width": 4 })
    ]);
};

// The chests of one match, as dots. The Map tab blurs them into heat, which is what a hundred
// matches need; a single one has forty chests and every one of them is worth seeing where it was.
const chestDots = (arrPoints) => {
    if (!arrPoints.length) return null;
    return svg("svg", { class: "m-dots", viewBox: "0 0 1000 1000", "aria-hidden": "true" }, arrPoints.map((objPoint) => {
        const { dblLeft, dblTop } = mapFraction(objPoint.x, objPoint.y);
        return svg("circle", {
            cx: (dblLeft * 1000).toFixed(1), cy: (dblTop * 1000).toFixed(1), r: 5.5,
            fill: "rgba(240, 180, 41, 0.92)", stroke: "rgba(8, 6, 20, 0.7)", "stroke-width": 2
        });
    }));
};

// The picture, the chests of this match, the way it was walked, and the names on top
const routeBoardParts = (objMatch, arrRoute) => {
    const objMap = objApp.objMap;
    return [
        objMap?.hasImage ? el("img", { src: "/api/map/image", alt: "", draggable: "false" }) : el("div", { class: "m-noimage" }),
        routeOverlay(arrRoute),
        // On top of the line and not under it: a chest is something that happened on the way, and
        // the line is as wide as a dot, so underneath it they are simply not there
        chestDots(getMapOpenings([objMatch])),
        ...(objMap?.places ?? []).map((objPlace) => {
            const { dblLeft, dblTop } = mapFraction(objPlace.x, objPlace.y);
            return el("span", { class: "m-place", style: { left: `${dblLeft * 100}%`, top: `${dblTop * 100}%` } }, [
                el("i"), el("b", { "data-notr": true, text: objPlace.name })
            ]);
        })
    ].filter(Boolean);
};

// The route on its own, over the map, without leaving the tab being read. The Map tab draws the
// same thing beside its own figures; this is for the minute right after a match ends, which is
// when somebody wants to see where they went.
const openRouteDialog = async (objMatch) => {
    const elDialog = document.getElementById("elRouteDialog");
    const elBoard = el("div", { class: "m-board" }, el("p", { class: "m-wait", text: "Leyendo por dónde fuiste…" }));
    const elFoot = el("p", { class: "m-legend" });
    elDialog.replaceChildren(
        el("div", { class: "head" }, [
            el("b", {}, ["Por dónde fuiste · partida de las ", el("span", { "data-notr": true, text: fmtTimeOfDay(new Date(objMatch.startedAt)) })]),
            el("span", { class: "grow" }),
            el("button", { class: "x", text: "×", title: "Cerrar", "aria-label": "Cerrar", onclick: () => elDialog.close() })
        ]),
        el("div", { class: "body", tabindex: "-1", autofocus: true }, [elBoard, elFoot])
    );
    if (!elDialog.open) elDialog.showModal();

    if (!objApp.objMap) await loadMap();
    const arrRoute = await loadRoute(objMatch.file);
    // Reading it takes a moment, and the dialog may be gone by the time it lands
    if (!elDialog.open) return;

    if (arrRoute.length < 2) {
        elBoard.replaceChildren(el("p", { class: "m-wait", text: "Esta partida se contó con una versión anterior, que no guardaba el recorrido. Las nuevas sí." }));
        return;
    }
    elBoard.replaceChildren(...routeBoardParts(objMatch, arrRoute));
    elFoot.replaceChildren(
        el("span", { class: "k-start" }),
        el("span", { text: "donde caíste" }),
        el("span", { class: "k-end" }),
        el("span", { text: "donde acabó" }),
        el("span", { class: "k-chest" }),
        el("span", { text: `${getMapOpenings([objMatch]).length} cofres situados` }),
        el("span", { class: "grow" }),
        el("span", { class: "quiet", text: "El color de la línea va del principio al final de la partida." })
    );
};

// The heat: every chest a soft blob, the blobs piling up, then the pile coloured
const drawHeat = (elCanvas, arrPoints, intSide) => {
    const objPaint = elCanvas.getContext("2d");
    objPaint.clearRect(0, 0, intSide, intSide);
    if (!arrPoints.length) return;

    const dblRadius = Math.max(6, intSide / 120);
    objPaint.globalCompositeOperation = "lighter";
    for (const objPoint of arrPoints) {
        const { dblLeft, dblTop } = mapFraction(objPoint.x, objPoint.y);
        const dblX = dblLeft * intSide;
        const dblY = dblTop * intSide;
        const objBlob = objPaint.createRadialGradient(dblX, dblY, 0, dblX, dblY, dblRadius);
        objBlob.addColorStop(0, "rgba(255, 255, 255, 0.22)");
        objBlob.addColorStop(1, "rgba(255, 255, 255, 0)");
        objPaint.fillStyle = objBlob;
        objPaint.beginPath();
        objPaint.arc(dblX, dblY, dblRadius, 0, Math.PI * 2);
        objPaint.fill();
    }

    objPaint.globalCompositeOperation = "source-over";
    const objImage = objPaint.getImageData(0, 0, intSide, intSide);
    const arrPixels = objImage.data;

    // Measured against its own busy spots, so one match reads like a hundred do. Not against the
    // single busiest pixel: one corner you emptied twenty times would leave the rest invisible.
    const arrHistogram = new Uint32Array(256);
    let intLit = 0;
    for (let intIndex = 3; intIndex < arrPixels.length; intIndex += 4) {
        const intAlpha = arrPixels[intIndex];
        if (intAlpha > 2) { arrHistogram[intAlpha]++; intLit++; }
    }
    let intPeak = 1;
    for (let intLevel = 255, intSeen = 0; intLevel > 0; intLevel--) {
        intSeen += arrHistogram[intLevel];
        if (intSeen >= intLit * 0.02) { intPeak = Math.max(1, intLevel); break; }
    }

    // Chest gold where you pass by, through orange, to white where you farm hardest
    for (let intIndex = 0; intIndex < arrPixels.length; intIndex += 4) {
        const dblHeat = Math.pow(Math.min(1, arrPixels[intIndex + 3] / intPeak), 0.7);
        if (dblHeat <= 0.04) { arrPixels[intIndex + 3] = 0; continue; }
        arrPixels[intIndex] = 255;
        arrPixels[intIndex + 1] = Math.round(150 + 105 * Math.max(0, dblHeat - 0.3) / 0.7);
        arrPixels[intIndex + 2] = Math.round(20 + 225 * Math.max(0, dblHeat - 0.6) / 0.4);
        arrPixels[intIndex + 3] = Math.round(235 * Math.min(1, 0.3 + dblHeat * 0.9));
    }
    objPaint.putImageData(objImage, 0, 0);
};

const renderMap = () => {
    const objMap = objApp.objMap;
    if (!objMap) { loadMap().then(() => { if (objApp.strTab === "mapa") renderMap(); }); }

    const arrAll = getNumberedMatches();
    const strScope = objApp.objLayout?.strMapScope ?? "todas";
    const objSelected = getSelectedMatch(arrAll);
    const arrMatches = strScope === "partida" && objSelected ? [objSelected] : arrAll;
    const arrPoints = getMapOpenings(arrMatches);
    const arrPlaces = objMap?.places ?? [];

    const elHeat = el("canvas", { class: "heat", width: INT_MAP_PIXELS, height: INT_MAP_PIXELS });
    const elBoardMap = el("div", { class: "m-board" }, [
        objMap?.hasImage ? el("img", { src: "/api/map/image", alt: "", draggable: "false" }) : el("div", { class: "m-noimage" }),
        elHeat,
        ...arrPlaces.map((objPlace) => {
            const { dblLeft, dblTop } = mapFraction(objPlace.x, objPlace.y);
            return el("span", { class: "m-place", style: { left: `${dblLeft * 100}%`, top: `${dblTop * 100}%` } }, [
                el("i"), el("b", { "data-notr": true, text: objPlace.name })
            ]);
        })
    ]);

    // One match on screen: the way it was walked goes over its own chests. Never with all of
    // them at once -- three hundred routes over one island draw nothing anybody can read, which
    // is why this hangs off the chosen match and not off the heat.
    if (strScope === "partida" && objSelected?.hasRoute) {
        const strFile = objSelected.file;
        loadRoute(strFile).then((arrRoute) => {
            const elOverlay = routeOverlay(arrRoute);
            // The tab may have been left, the scope changed or another match picked while it was read
            if (!elOverlay || !elBoardMap.isConnected
                || objApp.objLayout?.strMapScope !== "partida"
                || getSelectedMatch(getNumberedMatches())?.file !== strFile) return;
            elBoardMap.insertBefore(elOverlay, elBoardMap.querySelector(".m-place"));
        });
    }

    // Chests per place, which is the question somebody farming actually asks
    const dicByPlace = new Map(arrPlaces.map((objPlace) => [objPlace.name, { strName: objPlace.name, intChests: 0 }]));
    let intNowhere = 0;
    for (const objPoint of arrPoints) {
        const objPlace = nearestPlace(arrPlaces, objPoint);
        if (objPlace) dicByPlace.get(objPlace.name).intChests++; else intNowhere++;
    }
    const arrRanking = [...dicByPlace.values()].filter((objPlace) => objPlace.intChests > 0).sort((objLeft, objRight) => objRight.intChests - objLeft.intChests);
    const intTop = arrRanking[0]?.intChests ?? 1;

    const intPlaced = arrPoints.length;
    const intChestsTotal = sum(arrMatches, (objMatch) => objMatch.chestsTotal);

    elMap.replaceChildren(
        el("div", { class: "m-top" }, [
            el("div", { class: "segmented" }, ARR_MAP_SCOPES.map((objScope) => el("button", {
                text: objScope.strLabel, "aria-pressed": String(objScope.strId === strScope),
                disabled: objScope.strId === "partida" && !objSelected,
                onclick: () => { objApp.objLayout.strMapScope = objScope.strId; saveLayout(); renderMap(); }
            }))),
            el("span", { class: "grow" }),
            el("span", { class: "m-count" }, [el("b", { text: fmtNumber(intPlaced) }), intPlaced === 1 ? " cofre situado en el mapa" : " cofres situados en el mapa"])
        ]),
        el("div", { class: "m-grid" }, [
            elBoardMap,
            el("div", { class: "m-side" }, [
                el("h2", { text: "Dónde abres los cofres" }),
                arrRanking.length
                    ? el("div", { class: "table-wrap scroll-y" }, el("table", { class: "m-rank" }, el("tbody", {}, arrRanking.map((objPlace) => el("tr", { style: { cursor: "default" } }, [
                        el("td", { class: "left", "data-notr": true, text: objPlace.strName }),
                        el("td", { class: "bar" }, el("i", { style: { width: `${(objPlace.intChests / intTop) * 100}%` } })),
                        el("td", { text: objPlace.intChests }),
                        el("td", { class: "share", text: fmtPercent(objPlace.intChests / Math.max(1, intPlaced)) })
                    ])))))
                    : el("p", { class: "hint", text: "Todavía no hay cofres situados en estas partidas." }),
                intNowhere ? el("p", { class: "hint", text: `${plural(intNowhere, "cofre lejos de cualquier sitio con nombre", "cofres lejos de cualquier sitio con nombre")}: barcos, islotes y lo que hay entre zonas.` }) : null,
                intChestsTotal > intPlaced ? el("p", { class: "hint", text: `${plural(intChestsTotal - intPlaced, "cofre no está en el mapa", "cofres no están en el mapa")}: son de partidas leídas antes de que el programa guardara la posición.` }) : null
            ])
        ])
    );

    drawHeat(elHeat, arrPoints, INT_MAP_PIXELS);
};

// ---------------------------------------------------------------------------
// Live tab: the match being played, read from the replay while Fortnite records it
// ---------------------------------------------------------------------------

const elLive = document.getElementById("elLive");
const elMap = document.getElementById("elMap");
const elSquad = document.getElementById("elSquad");
// Fallback for when there are not enough saved matches to work the best minute out: the first
// ten minutes used to be the rule of thumb. getBestMinute() replaces it once there is data.
const INT_RUSH_SECONDS = 600;

// Seconds the summary of the last match stays after the next one starts (loading screen, bus)
const INT_HOLD_SECONDS = 60;

// What the program is doing while the squad's figures are missing. A spinner says that something
// is happening; it does not say whether anything is being tried, which is exactly what somebody
// watching an empty card for two minutes wants to know. The waiting is mostly the cloud's, and
// the only honest thing to show is how often this end has looked and how often it will look again.
// Everybody who shares with you, with the moment each of them last wrote their file.
const publisherOf = (strId) => (objApp.objState?.sharing?.publishers ?? [])
    .find((objOne) => objOne.id.toLowerCase() === (strId ?? "").toLowerCase());

// A sync client that is not running turns the shared folder into an ordinary folder: your own
// file keeps being written and nobody else's ever changes, which from in here looks exactly
// like a squad that has stopped playing. It is worth saying out loud, because it is silent.
const cloudWarning = () => {
    const objSharing = objApp.objState?.sharing;
    if (!objSharing?.cloudName || objSharing.cloudRunning !== false) return null;
    return el("p", { class: "warnbox" }, [
        el("b", {}, [el("span", { "data-notr": true, text: objSharing.cloudName }), " ", "no está abierto en este PC."]),
        el("br"),
        "Mientras esté cerrado, vuestra carpeta compartida es una carpeta normal: ni llegan los cofres de tu squad ni salen los tuyos. Ábrelo y se pondrá al día solo."
    ]);
};

// Somebody who shares with you but whose file has not changed since before this match began is
// not a cloud taking its time: there is nothing on the way. Telling the two apart is the whole
// question while a figure does not arrive, and only the moment they last published answers it.
const quietPublishers = (objMatch) => {
    const dblStart = new Date(objMatch.startedAt).getTime();
    return (objApp.objState?.sharing?.publishers ?? [])
        .filter((objOne) => new Date(objOne.publishedUtc).getTime() < dblStart);
};

// What is missing, and why, under the card that is waiting for it
const waitingNotes = (objMatch) => {
    const arrPublishers = objApp.objState?.sharing?.publishers ?? [];
    const arrQuiet = quietPublishers(objMatch);
    const setPending = new Set((objMatch.squad ?? [])
        .filter((objMate) => !objMate.isYou && objMate.pending)
        .map((objMate) => objMate.id.toLowerCase()));

    // Nobody in this match is waited for: whoever played it is either in the card with their own
    // figure or never shared at all. Explaining a cloud that is not delivering would be a warning
    // about nothing, on a card that has everything it is ever going to have.
    if (!setPending.size) return [];

    const arrOut = [cloudWarning()];
    // All of them frozen at once is not a squad that stopped playing: it is this PC not receiving
    if (arrPublishers.length > 1 && arrQuiet.length === arrPublishers.length) {
        arrOut.push(el("p", { class: "quiet", text: "Ninguna ficha de tu squad ha cambiado desde antes de esta partida. Que estén todas paradas a la vez no es que no jueguen: es que tu nube no está trayendo nada." }));
    }
    for (const objOne of arrQuiet) {
        if (!setPending.has(objOne.id.toLowerCase())) continue;
        arrOut.push(el("p", { class: "quiet" }, [
            el("b", { "data-notr": true, text: objOne.name ?? objOne.id.slice(0, 8) }), " ",
            "no publica nada desde el", " ",
            el("span", { "data-notr": true, text: fmtDate(objOne.publishedUtc) })
        ]));
    }
    return arrOut.filter(Boolean);
};

const sharingNote = () => {
    const objSharing = objApp.objState?.sharing;
    if (!objSharing) return null;
    const intEvery = Math.round(objSharing.everySec ?? 8);
    if (!objSharing.waitingSinceUtc || objSharing.waitReads < 2) {
        return el("p", { class: "quiet", text: `Acabo de mirar; vuelvo a hacerlo cada ${intEvery} s.` });
    }
    const dblWaited = Math.max(0, (Date.now() - new Date(objSharing.waitingSinceUtc).getTime()) / 1000);
    return el("p", { class: "quiet", text: `Lo he mirado ${objSharing.waitReads} veces en ${fmtClock(dblWaited)}, una cada ${intEvery} s.` });
};

// Seconds the comparison of the match just played keeps the live slot once every figure has
// landed. Before this it sat there for a quarter of an hour whether or not anything was still on
// the way, so most of a match was spent looking at the previous one.
const INT_SQUAD_SEEN_SECONDS = 90;

// Minutes after a match ends that its comparison is worth the slot at all. A figure that lands
// later lands for nothing: by then nobody is looking at that match any more.
const INT_SQUAD_STALE_MINUTES = 15;

// This match's teammates, you aside.
const matesOf = (objMatch) => (objMatch?.squad ?? []).filter((objMate) => !objMate.isYou);

// Of those, the ones who are in your shared folder: they publish, so their real figures are here
// or on the way. Somebody a fill dropped into your team never will, and telling the two apart is
// the whole question of whether there is anything to wait for.
const sharingMates = (objMatch) => matesOf(objMatch)
    .filter((objMate) => objMate.pending || objMate.sharedChests != null);

// When a match's comparison stopped having anything pending, by this PC's clock. It is asked
