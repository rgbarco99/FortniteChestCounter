const SVG_NS = "http://www.w3.org/2000/svg";

// Creates an HTML element. Text always goes in through textContent, never innerHTML.
// Opening and closing in one place: the body class has to follow the drawer, or the page
// behind it keeps its own scrollbar and the wheel moves the wrong one.
const setDrawerOpen = (bOpen) => {
    // Measured before locking, while the scrollbar is still there to be measured
    const intBar = window.innerWidth - document.documentElement.clientWidth;
    elDrawer.classList.toggle("open", bOpen);
    document.body.classList.toggle("drawer-open", bOpen);
    document.body.style.paddingRight = bOpen && intBar > 0 ? `${intBar}px` : "";
};

const el = (strTag, objProps = {}, arrChildren = []) => {
    const elNode = document.createElement(strTag);
    for (const [strKey, varValue] of Object.entries(objProps)) {
        if (varValue == null || varValue === false) continue;
        if (strKey === "text") elNode.textContent = varValue;
        else if (strKey === "class") elNode.className = varValue;
        else if (strKey.startsWith("on")) elNode.addEventListener(strKey.slice(2), varValue);
        else if (strKey === "style") {
            // Custom properties (--span) need setProperty; plain ones can be assigned
            for (const [strProp, varProp] of Object.entries(varValue)) {
                if (strProp.startsWith("--")) elNode.style.setProperty(strProp, varProp); else elNode.style[strProp] = varProp;
            }
        }
        else elNode.setAttribute(strKey, varValue === true ? "" : varValue);
    }
    for (const varChild of [].concat(arrChildren)) {
        if (varChild == null || varChild === false) continue;
        elNode.append(varChild);
    }
    return elNode;
};

const svg = (strTag, objAttrs = {}, arrChildren = []) => {
    const elNode = document.createElementNS(SVG_NS, strTag);
    for (const [strKey, varValue] of Object.entries(objAttrs)) {
        if (varValue == null) continue;
        if (strKey === "text") elNode.textContent = varValue;
        else elNode.setAttribute(strKey, varValue);
    }
    for (const elChild of [].concat(arrChildren)) if (elChild) elNode.append(elChild);
    return elNode;
};

// Ordinal places: 2.º, 2nd, 2e
const fmtPosition = (intPosition) => {
    if (intPosition == null) return "–";
    if (STR_LANG === "en") { const intTen = intPosition % 100; return `${intPosition}${intTen >= 11 && intTen <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" })[intPosition % 10] ?? "th"}`; }
    if (STR_LANG === "fr") return intPosition === 1 ? "1er" : `${intPosition}e`;
    return `${intPosition}.º`;
};
const fmtDate = (strLocalTime) => new Date(strLocalTime).toLocaleString(STR_LOCALE, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const fmtPlayed = (dblSeconds) => {
    const intMinutes = Math.round(dblSeconds / 60);
    return intMinutes >= 60 ? `${Math.floor(intMinutes / 60)} h ${intMinutes % 60} min` : `${intMinutes} min`;
};
const sum = (arrItems, fnValue) => arrItems.reduce((dblTotal, objItem) => dblTotal + (fnValue(objItem) || 0), 0);

// Matches that count, oldest first, each with its running number
const getNumberedMatches = () => {
    const arrMatches = (objApp.objState?.matches ?? []).filter((objMatch) => !objMatch.excluded);
    arrMatches.forEach((objMatch, intIndex) => { objMatch.intNumber = intIndex + 1; });
    return arrMatches;
};

// A session ends when more than three hours pass between two matches
const getLastSession = (arrMatches) => {
    const arrSession = [];
    for (let intIndex = arrMatches.length - 1; intIndex >= 0; intIndex--) {
        const objNewer = arrSession[0];
        if (objNewer && new Date(objNewer.startedAt) - new Date(arrMatches[intIndex].startedAt) > 3 * 3600 * 1000) break;
        arrSession.unshift(arrMatches[intIndex]);
    }
    return arrSession;
};

const getMatchesInRange = () => {
    const arrMatches = getNumberedMatches();
    const dtNow = new Date();
    switch (objApp.objLayout.strRange) {
        case "sesion": return getLastSession(arrMatches);
        case "hoy": return arrMatches.filter((objMatch) => new Date(objMatch.startedAt).toDateString() === dtNow.toDateString());
        case "semana": return arrMatches.filter((objMatch) => dtNow - new Date(objMatch.startedAt) < 7 * 24 * 3600 * 1000);
        default: return arrMatches;
    }
};

// What the filter is covering right now, said out loud. The label alone explains nothing:
// «Última sesión» means these matches, from this hour to that one, and the only way to know
// which is to be told. The status line and the squad block both say it.
const describeRange = (arrMatches) => {
    const objRange = ARR_RANGES.find((objItem) => objItem.strId === objApp.objLayout.strRange) ?? ARR_RANGES[0];
    const arrParts = [objRange.strLabel, `${arrMatches.length} ${arrMatches.length === 1 ? "partida" : "partidas"}`];
    if (arrMatches.length) {
        const dtFirst = new Date(arrMatches[0].startedAt);
        const dtLast = new Date(arrMatches[arrMatches.length - 1].startedAt);
        arrParts.push(dtFirst.toDateString() === dtLast.toDateString()
            ? `${fmtWeekDay(dtFirst)}, ${fmtTimeOfDay(dtFirst)} – ${fmtTimeOfDay(dtLast)}`
            : `${fmtWeekDay(dtFirst)} – ${fmtWeekDay(dtLast)}`);
    }
    return arrParts;
};

// Each piece in its own node. Joined into one string, a short pattern meant for one of them
// can straddle two pieces and translate the wrong half of the sentence.
const dotted = (arrParts) => arrParts
    .filter(Boolean)
    .flatMap((strPart, intIndex) => intIndex ? [" · ", el("span", { text: strPart })] : [el("span", { text: strPart })]);

const getSelectedMatch = (arrMatches) =>
    arrMatches.find((objMatch) => objMatch.file === objApp.strSelectedFile) ?? arrMatches[arrMatches.length - 1] ?? null;

const getTotals = (arrMatches) => {
    const intMatches = arrMatches.length;
    const dblAliveMinutes = sum(arrMatches, (objMatch) => objMatch.aliveSec) / 60;
    const intChests = sum(arrMatches, (objMatch) => objMatch.chestsTotal);
    const arrWithStats = arrMatches.filter((objMatch) => objMatch.stats);
    const arrWithPosition = arrMatches.filter((objMatch) => objMatch.position != null);
    const arrWithFirstChest = arrMatches.filter((objMatch) => objMatch.firstChestSec != null);
    const arrWithAccuracy = arrMatches.filter((objMatch) => objMatch.stats?.accuracy != null);
    const best = (fnValue) => arrMatches.reduce((objBest, objMatch) => (objBest == null || fnValue(objMatch) > fnValue(objBest)) ? objMatch : objBest, null);

    return {
        intMatches,
        intChests,
        objCounts: Object.fromEntries(Object.keys(OBJ_SERIES).map((strCategory) => [strCategory, sum(arrMatches, (objMatch) => objMatch.counts[strCategory])])),
        intKills: sum(arrMatches, (objMatch) => objMatch.kills),
        intWins: arrMatches.filter((objMatch) => objMatch.position === 1).length,
        dblAliveSeconds: dblAliveMinutes * 60,
        dblChestsPerMin: dblAliveMinutes > 0 ? intChests / dblAliveMinutes : 0,
        dblAveragePosition: arrWithPosition.length ? sum(arrWithPosition, (objMatch) => objMatch.position) / arrWithPosition.length : null,
        intBestPosition: arrWithPosition.length ? Math.min(...arrWithPosition.map((objMatch) => objMatch.position)) : null,
        dblAccuracy: arrWithAccuracy.length ? sum(arrWithAccuracy, (objMatch) => objMatch.stats.accuracy) / arrWithAccuracy.length : null,
        intDamage: sum(arrWithStats, (objMatch) => objMatch.stats.damageDealt),
        intDamageTaken: sum(arrWithStats, (objMatch) => objMatch.stats.damageTaken),
        dblDistanceKm: sum(arrWithStats, (objMatch) => objMatch.stats.distanceKm),
        dblFirstChest: arrWithFirstChest.length ? sum(arrWithFirstChest, (objMatch) => objMatch.firstChestSec) / arrWithFirstChest.length : null,
        objBestChests: best((objMatch) => objMatch.chestsTotal),
        objBestKills: best((objMatch) => objMatch.kills)
    };
};

const elTip = document.getElementById("elTip");

const showTip = (objEvent, strValue, arrLines = []) => {
    elTip.replaceChildren(el("strong", { text: strValue }), ...arrLines.filter(Boolean).map((strLine) => el("span", { text: strLine })));
    elTip.style.display = "block";
    const objRect = elTip.getBoundingClientRect();
    const dblLeft = Math.min(objEvent.clientX + 14, window.innerWidth - objRect.width - 8);
    const dblTop = objEvent.clientY - objRect.height - 12 < 8 ? objEvent.clientY + 16 : objEvent.clientY - objRect.height - 12;
    elTip.style.left = `${Math.max(8, dblLeft)}px`;
    elTip.style.top = `${dblTop}px`;
};

const hideTip = () => { elTip.style.display = "none"; };

// Axis top as four whole steps (1, 2, 5, 10, 20, 50...) so every tick is a clean number
const niceMax = (dblMax) => {
    for (let dblPower = 1; ; dblPower *= 10) {
        for (const intStep of [1, 2, 5]) if (dblMax <= intStep * dblPower * 4) return intStep * dblPower * 4;
    }
};

// Column chart, optionally stacked. Bars are at most 24px wide, grow from one baseline,
// stacked parts are separated by a 2px gap and only the top end is rounded.
const drawColumns = (elHost, { arrBars, arrSeries, intHeight = 230 }) => {
    const intWidth = Math.max(elHost.clientWidth, 260);
    const objPad = { intTop: 22, intRight: 8, intBottom: arrBars.some((objBar) => objBar.strSubLabel) ? 40 : 26, intLeft: 30 };
    const dblPlotWidth = intWidth - objPad.intLeft - objPad.intRight;
    const dblPlotHeight = intHeight - objPad.intTop - objPad.intBottom;
    const dblMax = niceMax(Math.max(1, ...arrBars.map((objBar) => sum(objBar.arrParts, (objPart) => objPart.dblValue))));
    const dblBand = dblPlotWidth / Math.max(arrBars.length, 1);
    const dblBarWidth = Math.max(4, Math.min(24, dblBand - 6));
    const toY = (dblValue) => objPad.intTop + dblPlotHeight - (dblValue / dblMax) * dblPlotHeight;
    // Label only as many bars as fit without touching
    const intLabelEvery = Math.max(1, Math.ceil(30 / dblBand));
    // A value on every bar only when there are few; otherwise just the tallest one
    const dblTallest = Math.max(...arrBars.map((objBar) => sum(objBar.arrParts, (objPart) => objPart.dblValue)));
    const bLabelAll = arrBars.length <= 8 && dblBand >= 26;
    let bTallestLabelled = false;

    const elSvg = svg("svg", { width: intWidth, height: intHeight, viewBox: `0 0 ${intWidth} ${intHeight}`, role: "img" });

    for (let intTick = 0; intTick <= 4; intTick++) {
        const dblValue = (dblMax / 4) * intTick;
        const dblY = toY(dblValue);
        elSvg.append(
            svg("line", { class: "grid", x1: objPad.intLeft, x2: intWidth - objPad.intRight, y1: dblY, y2: dblY }),
            svg("text", { x: objPad.intLeft - 6, y: dblY + 4, "text-anchor": "end", text: fmtNumber(dblValue) })
        );
    }

    arrBars.forEach((objBar, intIndex) => {
        const dblCenter = objPad.intLeft + dblBand * (intIndex + 0.5);
        const elGroup = svg("g", { class: `bar${objBar.bSelected ? " selected" : ""}`, tabindex: 0 });
        const arrVisible = objBar.arrParts.filter((objPart) => objPart.dblValue > 0);
        let dblRunning = 0;

        arrVisible.forEach((objPart, intPartIndex) => {
            const dblBottom = toY(dblRunning);
            dblRunning += objPart.dblValue;
            const dblTop = toY(dblRunning);
            const bIsTop = intPartIndex === arrVisible.length - 1;
            const dblGap = bIsTop ? 0 : 2;
            const dblHeight = Math.max(1, dblBottom - dblTop - dblGap);
            const strColor = arrSeries.find((objSeries) => objSeries.strKey === objPart.strKey).strColor;
            const dblX = dblCenter - dblBarWidth / 2;

            if (bIsTop) {
                // Rounded data end, square towards the baseline
                const dblRadius = Math.min(4, dblHeight, dblBarWidth / 2);
                const dblYTop = dblTop + dblGap;
                elGroup.append(svg("path", {
                    class: "seg", fill: strColor,
                    d: `M${dblX},${dblYTop + dblHeight} V${dblYTop + dblRadius} Q${dblX},${dblYTop} ${dblX + dblRadius},${dblYTop} H${dblX + dblBarWidth - dblRadius} Q${dblX + dblBarWidth},${dblYTop} ${dblX + dblBarWidth},${dblYTop + dblRadius} V${dblYTop + dblHeight} Z`
                }));
            } else {
                elGroup.append(svg("rect", { class: "seg", x: dblX, y: dblTop + dblGap, width: dblBarWidth, height: dblHeight, fill: strColor }));
            }
        });

        const bLabelThis = dblRunning > 0 && (bLabelAll || (!bTallestLabelled && dblRunning === dblTallest));
        if (bLabelThis) {
            bTallestLabelled = true;
            elGroup.append(svg("text", { class: "value-label", x: dblCenter, y: toY(dblRunning) - 6, "text-anchor": "middle", text: fmtNumber(dblRunning) }));
        }
        if (intIndex % intLabelEvery === 0 || objBar.bSelected) {
            elGroup.append(svg("text", { x: dblCenter, y: intHeight - objPad.intBottom + 16, "text-anchor": "middle", text: objBar.strLabel }));
            if (objBar.strSubLabel) elGroup.append(svg("text", { x: dblCenter, y: intHeight - objPad.intBottom + 31, "text-anchor": "middle", text: objBar.strSubLabel }));
        }
        // The selected match is marked under its label, never by repainting the bar
        if (objBar.bSelected) {
            elGroup.append(svg("rect", { x: dblCenter - 9, y: intHeight - objPad.intBottom + (objBar.strSubLabel ? 36 : 21), width: 18, height: 2, rx: 1, fill: "var(--gold)" }));
        }

        // Hit area: the whole band, far bigger than the painted bar
        const elHit = svg("rect", { x: dblCenter - dblBand / 2, y: objPad.intTop, width: dblBand, height: dblPlotHeight + objPad.intBottom, fill: "transparent" });
        elGroup.append(elHit);
        elGroup.addEventListener("pointermove", (objEvent) => showTip(objEvent, objBar.strTipValue, objBar.arrTipLines));
        elGroup.addEventListener("pointerleave", hideTip);
        elGroup.addEventListener("focus", () => {
            const objRect = elHit.getBoundingClientRect();
            showTip({ clientX: objRect.left + objRect.width / 2, clientY: objRect.top }, objBar.strTipValue, objBar.arrTipLines);
        });
        elGroup.addEventListener("blur", hideTip);
        if (objBar.fnClick) {
            elGroup.addEventListener("click", objBar.fnClick);
            elGroup.addEventListener("keydown", (objEvent) => { if (objEvent.key === "Enter") objBar.fnClick(); });
        }
        elSvg.append(elGroup);
    });

    elHost.append(elSvg);
    if (arrSeries.length > 1) {
        elHost.append(el("div", { class: "legend" }, arrSeries.map((objSeries) =>
            el("span", {}, [el("i", { style: { background: objSeries.strColor } }), objSeries.strLabel]))));
    }
};

// The match on one line: every chest, kill and death at the minute it happened
const drawTimeline = (elHost, objMatch) => {
    const intWidth = Math.max(elHost.clientWidth, 320);
    const intLabelWidth = 76;
    const objLanes = { dblChests: 16, dblOther: 36, dblKills: 56, dblYou: 76 };
    const intHeight = 108;
    const dblDuration = Math.max(objMatch.durationSec, 60);
    const dblPlotWidth = intWidth - intLabelWidth - 14;
    const toX = (dblSeconds) => intLabelWidth + (Math.min(dblSeconds, dblDuration) / dblDuration) * dblPlotWidth;

    const elSvg = svg("svg", { width: intWidth, height: intHeight, viewBox: `0 0 ${intWidth} ${intHeight}`, role: "img" });

    // Minute grid
    const intMinutes = Math.floor(dblDuration / 60);
    const intStep = intMinutes > 24 ? 5 : intMinutes > 12 ? 2 : 1;
    for (let intMinute = 0; intMinute <= intMinutes; intMinute += intStep) {
        const dblX = toX(intMinute * 60);
        elSvg.append(
            svg("line", { class: "grid", x1: dblX, x2: dblX, y1: 5, y2: 88 }),
            svg("text", { x: dblX, y: 101, "text-anchor": "middle", text: `${intMinute}'` })
        );
    }

    // Time spent watching after your last elimination
    if (objMatch.aliveSec < objMatch.durationSec - 5) {
        const dblX = toX(objMatch.aliveSec);
        elSvg.append(
            svg("rect", { x: dblX, y: 5, width: intWidth - 14 - dblX, height: 83, fill: "var(--page)", opacity: 0.55 }),
            svg("text", { x: Math.min(dblX + 8, intWidth - 80), y: 14, text: "espectador" })
        );
    }

    for (const [strLabel, dblY] of [["Cofres", objLanes.dblChests], ["Otros", objLanes.dblOther], ["Kills", objLanes.dblKills], ["Tú", objLanes.dblYou]]) {
        elSvg.append(svg("text", { class: "lane-label", x: 0, y: dblY + 4, text: strLabel }));
    }

    // Every mark also goes in this list so the pointer only has to be near one
    const arrMarks = [];

    for (const objOpening of objMatch.openings) {
        const bChest = ARR_CHEST_CATEGORIES.includes(objOpening.category);
        const dblX = toX(objOpening.t);
        const dblY = bChest ? objLanes.dblChests : objLanes.dblOther;
        const intTickHeight = bChest ? 15 : 9;
        elSvg.append(svg("rect", {
            x: dblX - 2, y: dblY - intTickHeight / 2, width: 4, height: intTickHeight, rx: 2,
            fill: OBJ_SERIES[objOpening.category]?.strColor ?? "var(--quiet)",
            stroke: "var(--card)", "stroke-width": 1
        }));
        arrMarks.push({ dblX, dblY, strValue: fmtClock(objOpening.t), arrLines: [OBJ_SERIES[objOpening.category]?.strLabel ?? "Contenedor", describeMethod(objOpening), objOpening.containerClass] });
    }

    for (const objKill of objMatch.killEvents) {
        const dblX = toX(objKill.t);
        const dblY = objLanes.dblKills;
        // Diamond: filled for an elimination, hollow for a knock
        elSvg.append(svg("path", {
            d: `M${dblX},${dblY - 6} L${dblX + 5},${dblY} L${dblX},${dblY + 6} L${dblX - 5},${dblY} Z`,
fill: objKill.isKnock ? "var(--card)" : "var(--ink)", stroke: objKill.isKnock ? "var(--ink)" : "var(--card)", "stroke-width": 1.5
        }));
        arrMarks.push({
            dblX, dblY, strValue: fmtClock(objKill.t),
            arrLines: [objKill.isKnock ? "Derribo" : "Eliminación", objKill.victimName, objKill.distanceM != null ? `a ${fmtNumber(objKill.distanceM)} m` : null]
        });
    }

    for (const objDeath of objMatch.deaths) {
        const dblX = toX(objDeath.t);
        const dblY = objLanes.dblYou;
        if (objDeath.isKnock) {
            elSvg.append(svg("circle", { cx: dblX, cy: dblY, r: 4.5, fill: "var(--card)", stroke: "var(--danger)", "stroke-width": 1.5 }));
        } else {
            elSvg.append(svg("path", { d: `M${dblX - 5},${dblY - 5} L${dblX + 5},${dblY + 5} M${dblX + 5},${dblY - 5} L${dblX - 5},${dblY + 5}`, stroke: "var(--danger)", "stroke-width": 2.5, "stroke-linecap": "round" }));
        }
        arrMarks.push({ dblX, dblY, strValue: fmtClock(objDeath.t), arrLines: [objDeath.isKnock ? "Te derriban" : "Te eliminan"] });
    }

    const elOverlay = svg("rect", { x: intLabelWidth - 8, y: 4, width: dblPlotWidth + 16, height: 92, fill: "transparent" });
    elOverlay.addEventListener("pointermove", (objEvent) => {
        const objRect = elSvg.getBoundingClientRect();
        const dblPointerX = objEvent.clientX - objRect.left;
        const dblPointerY = objEvent.clientY - objRect.top;
        let objNearest = null;
        let dblNearest = 18;
        for (const objMark of arrMarks) {
            const dblDistance = Math.abs(objMark.dblX - dblPointerX) + (Math.abs(objMark.dblY - dblPointerY) > 16 ? 100 : 0);
            if (dblDistance < dblNearest) { dblNearest = dblDistance; objNearest = objMark; }
        }
        if (objNearest) showTip(objEvent, objNearest.strValue, objNearest.arrLines); else hideTip();
    });
    elOverlay.addEventListener("pointerleave", hideTip);
    elSvg.append(elOverlay);
    elHost.append(elSvg);

    const key = (elMark, strText) => el("span", {}, [elMark, strText]);
    const miniSvg = (elShape) => { const elMini = svg("svg", { width: 14, height: 14, viewBox: "0 0 14 14" }); elMini.append(elShape); return elMini; };
    elHost.append(el("div", { class: "legend" }, [
        key(el("i", { style: { background: "var(--chest)" } }), "Cofre"),
        key(el("i", { style: { background: "var(--special)" } }), "Cofre especial"),
        key(el("i", { style: { background: "var(--spirit)" } }), "Cofre de espíritu"),
        key(el("i", { style: { background: "var(--quiet)" } }), "Munición y otros"),
        key(miniSvg(svg("path", { d: "M7,1 L13,7 L7,13 L1,7 Z", fill: "var(--ink)" })), "Eliminación"),
        key(miniSvg(svg("path", { d: "M7,1.5 L12.5,7 L7,12.5 L1.5,7 Z", fill: "none", stroke: "var(--ink)", "stroke-width": 1.5 })), "Derribo"),
        key(miniSvg(svg("path", { d: "M2,2 L12,12 M12,2 L2,12", stroke: "var(--danger)", "stroke-width": 2.5, "stroke-linecap": "round" })), "Te eliminan")
    ]));
};

// ---------------------------------------------------------------------------
// Widgets. Each one: id, title, default size in grid columns, whether it starts
// hidden, and a render function that fills its body.
// ---------------------------------------------------------------------------

const selectMatch = (strFile) => {
    if (objApp.strSelectedFile === strFile) return;
    objApp.strSelectedFile = strFile;
    const arrAll = getNumberedMatches();
    objApp.bFollowLatest = arrAll.length > 0 && arrAll[arrAll.length - 1].file === strFile;
    renderBoard();
};

const kpiWidget = (strId, strTitle, bHidden, fnContent, strSwatch = null) => ({
    strId, strTitle, strKind: "kpi", intSize: 2, bHidden,
    fnRender: (elBody, objContext) => {
        const { strValue, arrSubs = [] } = fnContent(objContext.objTotals, objContext);
        elBody.classList.add("kpi");
        elBody.append(el("div", { class: "value figure", text: strValue }));
        arrSubs.filter(Boolean).forEach((strSub) => elBody.append(el("div", { class: "sub", text: strSub })));
    },
    strSwatch
});

const perMatch = (dblTotal, objTotals) => objTotals.intMatches ? `${fmtNumber(dblTotal / objTotals.intMatches)} por partida` : null;

const ARR_WIDGETS = [
    {
        strId: "partida", strTitle: "Partida", strKind: "panel", intSize: 6, bHidden: false, bNoHeading: true,
        fnRender: (elBody, { arrMatches, objSelected, elCollapse }) => {

            elBody.append(el("div", { class: "match-head" }, [
                el("span", { class: "title", text: `Partida ${objSelected.intNumber}${bLatest ? ", la última" : ""}` }),
                el("span", { class: "meta", text: fmtDate(objSelected.startedAt) }),
                el("span", { class: "meta", text: objSelected.modeLabel }),
                objSelected.ownerName ? el("span", { class: "meta", text: objSelected.ownerName }) : null,
                el("span", { class: "grow" }),
                el("button", { class: "btn small", text: "Anterior", disabled: intIndex <= 0, onclick: () => selectMatch(arrMatches[intIndex - 1].file) }),
                el("button", { class: "btn small", text: "Siguiente", disabled: intIndex >= arrMatches.length - 1, onclick: () => selectMatch(arrMatches[intIndex + 1].file) }),

            const score = (strValue, strLabel, strSwatch = null, strSmall = null) => el("div", { class: "score" }, [

            elBody.append(el("div", { class: "scoreline" }, [
                score(String(objSelected.counts.cofre), "Cofres", "var(--chest)"),
                score(String(objSelected.counts.especial), "Cofres especiales", "var(--special)"),
                score(String(objSelected.counts.espiritu), "Cofres de espíritu", "var(--spirit)"),
                score(String(objSelected.kills), "Kills"),
                score(fmtPosition(objSelected.position), "Puesto", null, objSelected.totalPlayers ? `de ${objSelected.totalPlayers}` : null),
                score(fmtClock(objSelected.aliveSec), "Minutos de partida")

            const elTimeline = el("div");
            elBody.append(elTimeline);

            const objStats = objSelected.stats;
            const chip = (strLabel, strValue) => el("span", {}, [`${strLabel} `, el("b", { text: strValue })]);
            elBody.append(el("div", { class: "chips" }, [
                chip("Cofres por minuto", objNumberFormat2.format(objSelected.chestsPerMin)),
                objSelected.chestsTotal ? chip("Cofres rotos en vez de abiertos", `${objSelected.chestsBroken} de ${objSelected.chestsTotal}`) : null,
                objSelected.firstChestSec != null ? chip("Primer cofre", fmtClock(objSelected.firstChestSec)) : null,
                chip("Munición", String(objSelected.counts.municion)),
                chip("Otros contenedores", String(objSelected.counts.otros)),
                objStats ? chip("Daño hecho", fmtNumber(objStats.damageDealt)) : null,
                objStats ? chip("Daño recibido", fmtNumber(objStats.damageTaken)) : null,
                objStats?.accuracy != null ? chip("Precisión", `${fmtNumber(objStats.accuracy * 100)} %`) : null,
                objStats ? chip("Asistencias", String(objStats.assists)) : null,
                objStats ? chip("Reanimaciones", String(objStats.revives)) : null,
                objStats ? chip("Distancia", `${fmtNumber(objStats.distanceKm)} km`) : null,
                chip("Repetición completa", fmtClock(objSelected.durationSec))
            ]));
        }
    },

    kpiWidget("kpi-cofres", "Cofres", false, (objTotals) => ({
        strValue: fmtNumber(objTotals.objCounts.cofre),
        arrSubs: [perMatch(objTotals.objCounts.cofre, objTotals), objTotals.objBestChests ? `Récord: ${objTotals.objBestChests.chestsTotal} en la partida ${objTotals.objBestChests.intNumber}` : null]
    }), "var(--chest)"),
    kpiWidget("kpi-especiales", "Cofres especiales", false, (objTotals) => ({
        strValue: fmtNumber(objTotals.objCounts.especial), arrSubs: [perMatch(objTotals.objCounts.especial, objTotals)]
    }), "var(--special)"),
    kpiWidget("kpi-espiritu", "Cofres de espíritu", false, (objTotals) => ({
        strValue: fmtNumber(objTotals.objCounts.espiritu), arrSubs: [perMatch(objTotals.objCounts.espiritu, objTotals)]
    }), "var(--spirit)"),
    kpiWidget("kpi-kills", "Kills", false, (objTotals) => ({
        strValue: fmtNumber(objTotals.intKills),
        arrSubs: [perMatch(objTotals.intKills, objTotals), objTotals.objBestKills ? `Récord: ${objTotals.objBestKills.kills} en la partida ${objTotals.objBestKills.intNumber}` : null]
    })),
    kpiWidget("kpi-partidas", "Partidas", false, (objTotals) => ({
        strValue: fmtNumber(objTotals.intMatches),
        arrSubs: [
            `${objTotals.intWins} ${objTotals.intWins === 1 ? "victoria" : "victorias"}`,
            objTotals.dblAveragePosition != null ? `Puesto medio ${fmtNumber(objTotals.dblAveragePosition)}` : null
        ]
    })),
    kpiWidget("kpi-ritmo", "Cofres por minuto", false, (objTotals) => ({
        strValue: objNumberFormat2.format(objTotals.dblChestsPerMin),
        arrSubs: [`${fmtNumber(objTotals.intChests)} cofres en ${fmtPlayed(objTotals.dblAliveSeconds)}`]
    })),
    kpiWidget("kpi-total", "Cofres de los tres tipos", true, (objTotals) => ({
        strValue: fmtNumber(objTotals.intChests), arrSubs: [perMatch(objTotals.intChests, objTotals)]
    })),
    kpiWidget("kpi-primer-cofre", "Primer cofre", true, (objTotals) => ({
        strValue: objTotals.dblFirstChest != null ? fmtClock(objTotals.dblFirstChest) : "–", arrSubs: ["Minuto medio en que abres el primero"]
    })),
    kpiWidget("kpi-municion", "Cajas de munición", true, (objTotals) => ({
        strValue: fmtNumber(objTotals.objCounts.municion), arrSubs: [perMatch(objTotals.objCounts.municion, objTotals), `Otros contenedores: ${fmtNumber(objTotals.objCounts.otros)}`]
    })),
    kpiWidget("kpi-tiempo", "Tiempo jugado", true, (objTotals) => ({
        strValue: fmtPlayed(objTotals.dblAliveSeconds), arrSubs: ["Hasta tu última eliminación en cada partida"]
    })),
    kpiWidget("kpi-precision", "Precisión", true, (objTotals) => ({
        strValue: objTotals.dblAccuracy != null ? `${fmtNumber(objTotals.dblAccuracy * 100)} %` : "–", arrSubs: ["Media de las partidas"]
    })),
    kpiWidget("kpi-danio", "Daño hecho", true, (objTotals) => ({
        strValue: fmtNumber(objTotals.intDamage), arrSubs: [perMatch(objTotals.intDamage, objTotals), `Recibido: ${fmtNumber(objTotals.intDamageTaken)}`]
    })),
    kpiWidget("kpi-distancia", "Distancia recorrida", true, (objTotals) => ({
        strValue: `${fmtNumber(objTotals.dblDistanceKm)} km`, arrSubs: [objTotals.intMatches ? `${fmtNumber(objTotals.dblDistanceKm / objTotals.intMatches)} km por partida` : null]
    })),

    {
        strId: "grafico-cofres", strTitle: "Cofres por partida", strKind: "panel", intSize: 7, bHidden: false,
        fnRender: (elBody, { arrMatches, objSelected }) => {
            const arrShown = arrMatches.slice(-40);
            drawColumns(elBody, {
                arrSeries: ARR_CHEST_CATEGORIES.map((strKey) => ({ strKey, ...OBJ_SERIES[strKey] })),
                arrBars: arrShown.map((objMatch) => ({
                    strLabel: String(objMatch.intNumber),
                    bSelected: objMatch === objSelected,
                    arrParts: ARR_CHEST_CATEGORIES.map((strKey) => ({ strKey, dblValue: objMatch.counts[strKey] })),
                    strTipValue: `${objMatch.chestsTotal} cofres`,
                    arrTipLines: [
                        `Partida ${objMatch.intNumber}, ${fmtDate(objMatch.startedAt)}`,
                        `${objMatch.counts.cofre} normales, ${objMatch.counts.especial} especiales, ${objMatch.counts.espiritu} de espíritu`
                    ],
                    fnClick: () => selectMatch(objMatch.file)
                }))
            });
            if (arrMatches.length > arrShown.length) elBody.append(el("p", { class: "hint", text: `Se muestran las últimas ${arrShown.length} partidas de ${arrMatches.length}.` }));
        }
    },
    {
        strId: "grafico-minutos", strTitle: "En qué minuto abres los cofres", strKind: "panel", intSize: 5, bHidden: false,
        fnRender: (elBody, { arrMatches }) => {
            const arrBuckets = [];
            for (const objMatch of arrMatches) {
                for (const objOpening of objMatch.openings) {
                    if (!ARR_CHEST_CATEGORIES.includes(objOpening.category)) continue;
                    const intMinute = Math.floor(objOpening.t / 60);
                    arrBuckets[intMinute] = (arrBuckets[intMinute] ?? 0) + 1;
                }
            }
            const intLast = Math.max(arrBuckets.length, 10);
            drawColumns(elBody, {
                arrSeries: [{ strKey: "cofres", strLabel: "Cofres", strColor: "var(--chest)" }],
                arrBars: Array.from({ length: intLast }, (varUnused, intMinute) => ({
                    strLabel: `${intMinute}'`,
                    arrParts: [{ strKey: "cofres", dblValue: arrBuckets[intMinute] ?? 0 }],
                    strTipValue: `${arrBuckets[intMinute] ?? 0} cofres`,
                    arrTipLines: [`Entre el minuto ${intMinute} y el ${intMinute + 1}`, `Suma de ${arrMatches.length} ${arrMatches.length === 1 ? "partida" : "partidas"}`]
                }))
            });
        }
    },
    {
        strId: "tabla", strTitle: "Partidas", strKind: "panel", intSize: 12, bHidden: false,
        fnRender: (elBody, objContext) => renderTable(elBody, objContext)
    },
    {
        strId: "grafico-kills", strTitle: "Kills por partida", strKind: "panel", intSize: 4, bHidden: false,
        fnRender: (elBody, { arrMatches, objSelected }) => {
            drawColumns(elBody, {
                intHeight: 220,
                arrSeries: [{ strKey: "kills", strLabel: "Kills", strColor: "var(--ink-2)" }],
                arrBars: arrMatches.slice(-40).map((objMatch) => ({
                    strLabel: String(objMatch.intNumber),
                    strSubLabel: fmtPosition(objMatch.position),
                    bSelected: objMatch === objSelected,
                    arrParts: [{ strKey: "kills", dblValue: objMatch.kills }],
                    strTipValue: `${objMatch.kills} kills`,
                    arrTipLines: [`Partida ${objMatch.intNumber}, puesto ${fmtPosition(objMatch.position)}`, `${fmtClock(objMatch.aliveSec)} de partida`],
                    fnClick: () => selectMatch(objMatch.file)
                }))
            });
            elBody.append(el("p", { class: "hint", text: "Debajo de cada número de partida, el puesto en que quedaste." }));
        }
    },
    {
        strId: "escuadra", strTitle: "Tu squad", strKind: "panel", intSize: 8, bHidden: false,
        fnRender: (elBody, { arrMatches, objSelected }) => {
            // This used to read one match, the selected one, which is not what anybody expects
            // from a board with a filter at the top: you pick «Hoy» and the squad table stays on
            // a match from last night, showing the people you usually play with whether or not
            // they were in it. It adds up what the filter leaves, and the line above the table
            // says which matches those are. One match on its own is a click away, and then it
            // says which one, so the table is never about a match you are not looking at.
            const bOneMatch = objApp.bSquadOneMatch && objSelected != null;
            const arrScope = bOneMatch ? [objSelected] : arrMatches;

            elBody.append(el("div", { class: "squad-bar" }, [
                el("span", { class: "scope" }, bOneMatch
                    ? [`Partida ${objSelected.intNumber}`, el("small", { text: fmtDate(objSelected.startedAt) })]
                    : dotted(describeRange(arrScope))),
                el("span", { class: "grow" }),
                el("button", {
                    class: bOneMatch ? "btn small" : "btn small primary", text: "Estas partidas", "aria-pressed": String(!bOneMatch),
                    onclick: () => { objApp.bSquadOneMatch = false; renderBoard(); }
                }),
                el("button", {
                    class: bOneMatch ? "btn small primary" : "btn small", text: "Solo esta partida", "aria-pressed": String(bOneMatch), disabled: objSelected == null,
                    onclick: () => { objApp.bSquadOneMatch = true; renderBoard(); }
                })
            ]));

            if (!arrScope.some((objMatch) => objMatch.squad.length)) {
                elBody.append(el("p", { class: "hint", text: bOneMatch ? "Esta repetición no trae datos de equipo." : "Ninguna de estas partidas trae datos de equipo." }));
                return;
            }

            // One row per person who was on your team in any of these matches, you included.
            // Chests are the one figure a replay cannot hold for anybody but its owner: a
            // teammate's come from what they published into the shared folder, so their total
            // only covers the matches whose card arrived, and intChestMatches says how many.
            const dicPeople = new Map();
            for (const objMatch of arrScope) {
                for (const objMate of objMatch.squad) {
                    let objRow = dicPeople.get(objMate.id);
                    if (!objRow) {
                        objRow = {
                            strId: objMate.id, strName: null, bYou: objMate.isYou, strPlatform: null, strLast: "",
                            intMatches: 0, intKills: 0, intKnocks: 0, intKnocked: 0, intBus: 0,
                            intChests: 0, intChestMatches: 0, intNearby: 0
                        };
                        dicPeople.set(objMate.id, objRow);
                    }
                    objRow.intMatches++;
                    objRow.intKills += objMate.kills ?? 0;
                    objRow.intKnocks += objMate.knocks ?? 0;
                    objRow.intKnocked += objMate.timesKnocked ?? 0;
                    if (objMate.thankedBusDriver) objRow.intBus++;
                    const intChests = objMate.isYou ? objMatch.chestsTotal : objMate.sharedChests;
                    if (intChests != null) { objRow.intChests += intChests; objRow.intChestMatches++; }
                    else objRow.intNearby += objMate.nearbyChests ?? 0;
                    // Matches come oldest first, so the last one seen is the current name and platform
                    if (objMatch.startedAt >= objRow.strLast) {
                        objRow.strLast = objMatch.startedAt;
                        objRow.strName = objMate.name ?? objRow.strName;
                        objRow.strPlatform = objMate.platform ?? objRow.strPlatform;
                    }
                }
            }

            // Per match is the only figure that compares two people who played a different
            // number of matches, so it is what the crown follows. Only a published figure can
            // win: an estimate is a floor, not a total.
            const perMatch = (objRow) => objRow.intChestMatches ? objRow.intChests / objRow.intChestMatches : null;
            const arrRows = [...dicPeople.values()].sort((objLeft, objRight) =>
                Number(objRight.bYou) - Number(objLeft.bYou)
                || objRight.intMatches - objLeft.intMatches
                || (perMatch(objRight) ?? -1) - (perMatch(objLeft) ?? -1));
            // You are always on screen, whatever the cut: it is your own block.
            const arrOthers = arrRows.filter((objRow) => !objRow.bYou);
            const intShown = Math.min(objApp.intSquadRows, arrOthers.length);
            let intRoom = intShown;
            const arrVisible = arrRows.filter((objRow) => objRow.bYou || intRoom-- > 0);

            const arrWithFigure = arrRows.filter((objRow) => objRow.intChestMatches > 0);
            const dblBest = Math.max(...arrWithFigure.map(perMatch));
            const bRace = arrWithFigure.length > 1 && arrWithFigure.some((objRow) => !objRow.bYou);
            const winsIt = (objRow) => bRace && objRow.intChestMatches > 0 && perMatch(objRow) === dblBest;

            const arrColumns = [
                // The nick and the marker are separate pieces: glued together the whole string
                // carries a name, so it matches nothing in ARR_I18N and "(tú)" stays Spanish.
                // The crown belongs beside the name, which is what anybody reads first.
                ["Jugador", (objRow) => {
                    const bWinner = winsIt(objRow);
                    return el("span", { class: bWinner ? "champ" : null }, [
                        objRow.bYou
                            ? el("span", { "data-notr": true, text: objRow.strName ?? objRow.strId.slice(0, 8) })
                            : nameLink(objRow.strId, objRow.strName ?? objRow.strId.slice(0, 8)),
                        objRow.bYou ? el("span", { text: " (tú)" }) : null,

ARR_WIDGETS.push({
    strId: "amigos", strTitle: "Amigos con los que más juegas", strKind: "panel", intSize: 8, bHidden: false,
    fnRender: (elBody, { arrMatches }) => {
        // What each of them published, totalled over the matches you played together
        const dicShared = new Map((objApp.objState?.shared ?? []).map((objPlayer) => [objPlayer.id, objPlayer]));
        // One row per teammate, over the matches of the selected range
        const dicFriends = new Map();
        for (const objMatch of arrMatches) {
            for (const objMate of objMatch.squad) {
                if (objMate.isYou) continue;
                const objFriend = dicFriends.get(objMate.id) ?? { strId: objMate.id, strName: null, intMatches: 0, intKills: 0, intYourChests: 0, dblYourMinutes: 0, arrPositions: [], strLast: "" };
                dicFriends.set(objMate.id, objFriend);
                objFriend.intMatches++;
                objFriend.intKills += objMate.kills ?? 0;
                objFriend.intYourChests += objMatch.chestsTotal;
                objFriend.dblYourMinutes += objMatch.aliveSec / 60;
                if (objMatch.position) objFriend.arrPositions.push(objMatch.position);
                // Matches come oldest first, so the last name seen is the current one
                if (objMatch.startedAt >= objFriend.strLast) { objFriend.strLast = objMatch.startedAt; objFriend.strName = objMate.name ?? objFriend.strName; }
            }
        }
        const arrEveryone = [...dicFriends.values()].sort((objLeft, objRight) => objRight.intMatches - objLeft.intMatches || objRight.strLast.localeCompare(objLeft.strLast));
        if (!arrEveryone.length) {
            elBody.append(el("p", { class: "hint", text: "En estas partidas no has jugado con nadie." }));
            return;
        }
        // Someone you met once is most likely a random fill; show them only when nobody repeats
        const arrRepeated = arrEveryone.filter((objFriend) => objFriend.intMatches > 1);
        const arrFriends = arrRepeated.length ? arrRepeated : arrEveryone;
        const intOneOff = arrEveryone.length - arrFriends.length;

        const intSolo = arrMatches.filter((objMatch) => !objMatch.squad.some((objMate) => !objMate.isYou)).length;
        const dblOverall = arrMatches.length ? sum(arrMatches, (objMatch) => objMatch.chestsTotal) / arrMatches.length : 0;
        const arrColumns = [
            ["Amigo", (objFriend) => objFriend.strName ?? objFriend.strId.slice(0, 8), "left"],
            ["Partidas juntos", (objFriend) => objFriend.intMatches],
            ["Sus kills por partida", (objFriend) => fmtNumber(objFriend.intKills / objFriend.intMatches)],
            ["Puesto medio", (objFriend) => objFriend.arrPositions.length ? fmtNumber(sum(objFriend.arrPositions, (intPosition) => intPosition) / objFriend.arrPositions.length) : "–"],
            ["Mejor puesto", (objFriend) => objFriend.arrPositions.length ? fmtPosition(Math.min(...objFriend.arrPositions)) : "–"],
            ["Tus cofres en esas partidas", (objFriend) => fmtNumber(objFriend.intYourChests / objFriend.intMatches)],
            // Their own chests exist only if they share them: a replay never holds anyone else's
            ["Sus cofres contigo", (objFriend) => {
                const objShared = dicShared.get(objFriend.strId);
                if (objShared) return el("span", { class: "shared", "data-notr": true, text: fmtWhole(objShared.chests) });
                // Not sharing: add up what your own replays saw them open nearby
                const intNear = sum(arrMatches, (objMatch) =>
                    objMatch.squad.find((objMate) => objMate.id === objFriend.strId)?.nearbyChests ?? 0);
                return intNear
                    ? el("span", { class: "guess", title: "No está en tu escuadrón: es lo que tus repeticiones le vieron abrir cerca de ti", "data-notr": true, text: `≥${fmtWhole(intNear)}` })
                    : el("span", { class: "nodata", text: "Sin datos" });
            }],
            ["Última vez", (objFriend) => new Date(objFriend.strLast).toLocaleDateString(STR_LOCALE, { day: "numeric", month: "short" })]
        ];
        elBody.append(el("div", { class: "table-wrap scroll-y" }, el("table", {}, [
            el("thead", {}, el("tr", {}, arrColumns.map(([strHead, , strAlign]) => el("th", { class: strAlign ?? null, text: strHead, style: { cursor: "default" } })))),
            el("tbody", {}, arrFriends.slice(0, 25).map((objFriend) => el("tr", { style: { cursor: "default" } },
                arrColumns.map(([, fnValue, strAlign]) => {
                    const varValue = fnValue(objFriend);
                    return varValue instanceof Node
                        ? el("td", { class: strAlign ?? null }, varValue)
                        : el("td", { class: strAlign ?? null, text: varValue });
                }))))
        ])));
        elBody.append(el("p", { class: "hint" }, [
            `«Tus cofres en esas partidas» es tu media de cofres cuando jugáis juntos; tu media general en este periodo es ${fmtNumber(dblOverall)}.`,
            intOneOff ? ` No se muestran ${intOneOff} ${intOneOff === 1 ? "compañero" : "compañeros"} de una sola partida.` : null,
            intSolo ? ` ${intSolo} ${intSolo === 1 ? "partida la jugaste" : "partidas las jugaste"} sin compañeros.` : null
        ]));
    }
});

// Whether you are getting better. Its own windows of time, so the range buttons at the top
// never change what it compares: a period against the one right before it, like for like.
const ARR_PROGRESS_SPANS = [
    { strId: "semana", strLabel: "Esta semana", strBefore: "la anterior", intDays: 7, strWindow: "los últimos 7 días con los 7 anteriores" },
    { strId: "dia", strLabel: "Hoy", strBefore: "ayer", intDays: 1, strWindow: "las últimas 24 horas con las 24 anteriores" },
    { strId: "mes", strLabel: "Este mes", strBefore: "el anterior", intDays: 30, strWindow: "los últimos 30 días con los 30 anteriores" }
];

// Matches of the window that ends now and goes intDays back, and of the one just before it
const splitForProgress = (arrMatches, intDays) => {
    const dblNow = Date.now();
    const dblSpan = intDays * 86400000;
    const inWindow = (objMatch, dblFrom, dblTo) => {
        const dblWhen = new Date(objMatch.startedAt).getTime();
        return dblWhen >= dblFrom && dblWhen < dblTo;
    };
    return {
        arrNow: arrMatches.filter((objMatch) => inWindow(objMatch, dblNow - dblSpan, dblNow + 1)),
        arrBefore: arrMatches.filter((objMatch) => inWindow(objMatch, dblNow - 2 * dblSpan, dblNow - dblSpan))
    };
};

ARR_WIDGETS.push({
    strId: "progreso", strTitle: "¿Vas mejorando?", strKind: "panel", intSize: 6, bHidden: false,
    fnRender: (elBody) => {
        const arrAll = getNumberedMatches();
        const strSpan = objApp.objLayout.strProgressSpan ?? "semana";
        const objSpan = ARR_PROGRESS_SPANS.find((objItem) => objItem.strId === strSpan) ?? ARR_PROGRESS_SPANS[0];

        elBody.append(el("div", { class: "segmented", style: { marginBottom: "12px" } }, ARR_PROGRESS_SPANS.map((objItem) => el("button", {
            text: objItem.strLabel, "aria-pressed": String(objItem.strId === objSpan.strId),
            onclick: () => { objApp.objLayout.strProgressSpan = objItem.strId; saveLayout(); renderBoard(); }
        }))));

        const { arrNow, arrBefore } = splitForProgress(arrAll, objSpan.intDays);
        if (!arrNow.length && !arrBefore.length) {
            elBody.append(el("p", { class: "hint", text: "Todavía no hay partidas en este periodo ni en el anterior." }));
            return;
        }

        // Average per match, so a period with more matches does not look better just for being longer
        const per = (arrMatches, fnValue) => arrMatches.length ? sum(arrMatches, fnValue) / arrMatches.length : null;
        const arrRows = [
            { strLabel: "Partidas", fnNow: (arrMatches) => arrMatches.length, bMoreIsBetter: null, intDecimals: 0 },
            { strLabel: "Cofres por partida", fnNow: (arrMatches) => per(arrMatches, (objMatch) => objMatch.chestsTotal), bMoreIsBetter: true },
            { strLabel: "Cofres por minuto", fnNow: (arrMatches) => per(arrMatches, (objMatch) => objMatch.chestsPerMin), bMoreIsBetter: true, intDecimals: 2 },
            { strLabel: "Primer cofre (min)", fnNow: (arrMatches) => per(arrMatches.filter((objMatch) => objMatch.firstChestSec != null), (objMatch) => objMatch.firstChestSec / 60), bMoreIsBetter: false },
            { strLabel: "Kills por partida", fnNow: (arrMatches) => per(arrMatches, (objMatch) => objMatch.kills ?? 0), bMoreIsBetter: true },
            { strLabel: "Puesto medio", fnNow: (arrMatches) => per(arrMatches.filter((objMatch) => objMatch.position != null), (objMatch) => objMatch.position), bMoreIsBetter: false },
            { strLabel: "Victorias", fnNow: (arrMatches) => arrMatches.filter((objMatch) => objMatch.position === 1).length, bMoreIsBetter: true, intDecimals: 0 },
            { strLabel: "Minutos por partida", fnNow: (arrMatches) => per(arrMatches, (objMatch) => objMatch.aliveSec / 60), bMoreIsBetter: null }
        ];

        // Chests per minute move in hundredths: rounded to one, two periods look equal and still differ
        const fmtCell = (dblValue, intDecimals) =>
            dblValue == null ? "–"
                : intDecimals === 0 ? String(Math.round(dblValue))
                : intDecimals ? dblValue.toLocaleString(STR_LOCALE, { minimumFractionDigits: intDecimals, maximumFractionDigits: intDecimals })
                : fmtNumber(dblValue);

        elBody.append(el("div", { class: "table-wrap" }, el("table", { class: "progress" }, [
            el("thead", {}, el("tr", {}, [
                el("th", { class: "left", text: "", style: { cursor: "default" } }),
                el("th", { text: objSpan.strLabel, style: { cursor: "default" } }),
                el("th", { text: objSpan.strBefore, style: { cursor: "default" } }),
                el("th", { text: "Cambio", style: { cursor: "default" } })
            ])),
            el("tbody", {}, arrRows.map((objRow) => {
                const dblNow = objRow.fnNow(arrNow);
                const dblBefore = objRow.fnNow(arrBefore);
                const bComparable = dblNow != null && dblBefore != null && dblBefore !== 0;
                const dblChange = bComparable ? (dblNow - dblBefore) / Math.abs(dblBefore) : null;
                const bUp = dblNow != null && dblBefore != null && dblNow > dblBefore;
                const bSame = dblNow != null && dblBefore != null && dblNow === dblBefore;
                // Fewer minutes to the first chest, or a lower place, is better
                const strTone = objRow.bMoreIsBetter == null || bSame || dblChange == null ? ""
                    : bUp === objRow.bMoreIsBetter ? "good" : "bad";
                return el("tr", { style: { cursor: "default" } }, [
                    el("td", { class: "left", text: objRow.strLabel }),
                    el("td", { class: "now", text: fmtCell(dblNow, objRow.intDecimals) }),
                    el("td", { class: "before", text: fmtCell(dblBefore, objRow.intDecimals) }),
                    el("td", { class: `change ${strTone}`, text: dblChange == null ? "–" : `${bSame ? "=" : bUp ? "▲" : "▼"} ${fmtNumber(Math.abs(dblChange) * 100)} %` })
                ]);
            }))
        ])));

        elBody.append(el("p", { class: "hint" }, [
            `Compara ${objSpan.strWindow}. `,
            arrBefore.length ? null : el("b", { text: "Todavía no hay partidas en el periodo anterior, así que aún no hay con qué comparar. " }),
            "El color dice si el cambio es a mejor, no si el número sube. Las cifras son medias por partida, para que un periodo con más partidas no parezca mejor solo por ser más largo."
        ]));
    }
});

    const header = (strId, strLabel, bLeft) => el("th", {
        class: bLeft ? "left" : null,
        text: `${strLabel}${objApp.strSortColumn === strId ? (objApp.bSortDescending ? " ↓" : " ↑") : ""}`,
        title: "Ordenar por esta columna",
        onclick: () => {
            if (objApp.strSortColumn === strId) objApp.bSortDescending = !objApp.bSortDescending;
            else { objApp.strSortColumn = strId; objApp.bSortDescending = true; }
            renderBoard();
        }
    });

    const row = (objMatch) => el("tr", {
        class: [objMatch === objSelected ? "selected" : "", objMatch.excluded ? "excluded" : ""].join(" ").trim() || null,
        onclick: () => { if (!objMatch.excluded) selectMatch(objMatch.file); }
    }, [
        el("td", {}, objMatch.excluded ? "–" : [
            String(objMatch.intNumber),
            objMatch.outdated ? el("button", {
                class: "star",
                text: "*",
                title: "Recuento de una versión anterior: su repetición ya no está y no se puede recontar",
                "aria-label": "Por qué esta partida lleva un asterisco",
                onclick: (objEvent) => { objEvent.stopPropagation(); explainOutdated(); }
            }) : null
        ]),
        ...arrColumns.map((objColumn) => {
            const elCell = el("td", { class: OBJ_CELLS[objColumn.strId].bLeft ? "left" : null });
            const varText = OBJ_CELLS[objColumn.strId].fnText(objMatch);
            if (objColumn.strId === "puesto" && objMatch.position === 1) elCell.append(el("span", { class: "win", text: varText }));
            else elCell.textContent = varText;
            return elCell;
        }),
        el("td", {}, el("button", {
            class: "btn small ghost",
            text: objMatch.excluded ? "Volver a contar" : "No contar",
            title: objMatch.excluded ? "Incluir esta partida en las estadísticas" : "Sacar esta partida de las estadísticas",
            onclick: async (objEvent) => {
                objEvent.stopPropagation();
                await api("POST", "/api/matches/exclude", { file: objMatch.file, excluded: !objMatch.excluded });
                await refresh(true);
            }
        }))
    ]);

    if (arrFiltered.length === 0) {
        elBody.append(el("p", { class: "hint", text: "Ninguna partida cumple esos filtros." }));
    } else {
        elBody.append(el("div", { class: "table-wrap" }, el("table", {}, [
            el("thead", {}, el("tr", {}, [
                header("numero", "N.º", true),
                ...arrColumns.map((objColumn) => header(objColumn.strId, objColumn.strLabel, OBJ_CELLS[objColumn.strId].bLeft)),
                el("th", { style: { cursor: "default" } })
            ])),
            el("tbody", {}, [...arrRows.map(row), ...arrExcluded.map(row)])
        ])));
    }

    if (arrFiltered.length > arrRows.length) {
        elBody.append(el("div", { class: "table-more" }, [
            el("button", { class: "btn small", text: `Ver las ${arrFiltered.length}`, onclick: () => setTableOption("intRows", 0) }),
            el("span", { text: "Los totales y gráficos cuentan todas, se vean o no en la tabla." })
        ]));
    }
};
