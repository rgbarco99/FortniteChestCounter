// ---------------------------------------------------------------------------
// The item shop: what is on sale, what came in today and what leaves tonight.
//
// None of this is in a replay. The program brings it from fortnite-api.com and keeps it in the
// data folder; this side only draws it and counts down to the next change, which Fortnite does
// at midnight UTC every day wherever you are.
//
// Every word that comes from the API is already in the reader's language, so each one carries
// data-notr: the names of things on sale are names, and translating them again would be wrong.
// ---------------------------------------------------------------------------
const elShop = document.getElementById("elShop");

const ARR_SHOP_VIEWS = [
    { strId: "destacado", strLabel: "Lo importante" },
    { strId: "todo", strLabel: "Toda la tienda" },
    { strId: "ofertas", strLabel: "Rebajas y lotes" },
    { strId: "musica", strLabel: "Música" }
];

// The shop arrives in the game's own order, which is the one worth keeping by default inside
// each section. The rest are the questions anybody actually asks of a shop: what is dear, what
// is cheap, what is new, what is about to go and where something is by name.
const ARR_SHOP_SORTS = [
    { strId: "caro", strLabel: "Precio: de más a menos" },
    { strId: "barato", strLabel: "Precio: de menos a más" },
    { strId: "juego", strLabel: "Como en el juego" },
    { strId: "nuevo", strLabel: "Lo último en entrar" },
    { strId: "sale", strLabel: "Lo que antes se va" },
    { strId: "rebaja", strLabel: "Rebaja: de más a menos" },
    { strId: "nombre", strLabel: "Nombre (A-Z)" }
];

// Until it is chosen, each subtab gets the order that suits what it is for: the discounts open
// on the biggest saving, everything else on the dearest first.
const shopSort = () => objApp.strShopSort ?? (objApp.strShopView === "ofertas" ? "rebaja" : "caro");

const sortShop = (arrItems) => {
    const arrOut = [...arrItems];
    const byName = (objLeft, objRight) => objLeft.name.localeCompare(objRight.name, STR_LOCALE);
    const dblTime = (strWhen) => new Date(strWhen).getTime();
    switch (shopSort()) {
        case "juego": return arrOut;        // as it came: the shop is already in the game's order
        case "barato": return arrOut.sort((objLeft, objRight) => objLeft.price - objRight.price || byName(objLeft, objRight));
        case "nuevo": return arrOut.sort((objLeft, objRight) => dblTime(objRight.inUtc) - dblTime(objLeft.inUtc) || objRight.price - objLeft.price);
        case "sale": return arrOut.sort((objLeft, objRight) => dblTime(objLeft.outUtc) - dblTime(objRight.outUtc) || objRight.price - objLeft.price);
        case "rebaja": return arrOut.sort((objLeft, objRight) => (objRight.was - objRight.price) - (objLeft.was - objLeft.price) || objRight.price - objLeft.price);
        case "nombre": return arrOut.sort(byName);
        default: return arrOut.sort((objLeft, objRight) => objRight.price - objLeft.price || byName(objLeft, objRight));
    }
};

// Midnight UTC, wherever you are. Worked out here as well as read from the shop, so the clock
// can tick before the shop arrives, and so that an old copy — whose own change is already in the
// past — counts down to the next real one instead of standing at zero for ever.
const getNextShopReset = () => {
    const strWhen = objApp.objShop?.nextResetUtc;
    if (strWhen && !objApp.objShop.stale && getShopEntries().length) return new Date(strWhen).getTime();
    const dtNow = new Date();
    return Date.UTC(dtNow.getUTCFullYear(), dtNow.getUTCMonth(), dtNow.getUTCDate() + 1);
};

const getShopEntries = () => objApp.objShop?.entries ?? [];

// Legendary, anything with a series behind it, whatever the game is promoting on its own tile,
// and the bundles. This is «the important stuff» the rest of the shop is not.
const isShopBig = (objItem) => objItem.rarityKey === "legendary"
    || !!objItem.series
    || (!!objItem.banner && objItem.bannerKey !== "AmountOff")
    || !!objItem.tag
    || objItem.isBundle;

const loadShop = async (bForce = false) => {
    if (objApp.bShopLoading) return;
    objApp.bShopLoading = true;
    objApp.bShopFailed = false;
    objApp.dblShopTried = Date.now();
    renderShop();
    try {
        const objShop = await api("GET", `/api/shop?lang=${STR_LANG}`);
        objApp.objShop = objShop;
        objApp.bShopFailed = !!objShop?.failed;
    } catch (objError) {
        objApp.bShopFailed = !objApp.objShop;
    }
    objApp.bShopLoading = false;
    renderShop();
};

// The clock ticks only while the tab is on screen. The numbers live in their own nodes, away
// from the words, so the translator has nothing to look at a second later.
const startShopClock = () => {
    if (objApp.intShopClock) return;
    objApp.intShopClock = setInterval(() => {
        if (objApp.strTab !== "tienda") { stopShopClock(); return; }
        const dblLeft = getNextShopReset() - Date.now();
        const elClock = document.getElementById("elShopClock");
        if (elClock) {
            const arrParts = countdownParts(dblLeft);
            const arrNumbers = elClock.querySelectorAll("b");
            if (arrNumbers.length !== arrParts.length) renderShop();
            else arrParts.forEach((strValue, intIndex) => { arrNumbers[intIndex].textContent = strValue; });
        }
        // Once it has turned over it is another shop, so ask for it again; and while what is on
        // screen is old or missing, try again every so often in case the connection came back
        const dblSince = Date.now() - objApp.dblShopTried;
        const bOld = !getShopEntries().length || !!objApp.objShop?.stale;
        if (!objApp.bShopLoading && ((dblLeft <= 0 && dblSince > 20000) || (bOld && dblSince > 300000))) loadShop(true);
    }, 1000);
};

const stopShopClock = () => {
    if (objApp.intShopClock) clearInterval(objApp.intShopClock);
    objApp.intShopClock = null;
};

const countdownParts = (dblMs) => {
    const intLeft = Math.max(0, Math.floor(dblMs / 1000));
    const strPad = (intValue) => String(intValue).padStart(2, "0");
    const intHours = Math.floor(intLeft / 3600);
    const arrParts = [strPad(Math.floor((intLeft % 3600) / 60)), strPad(intLeft % 60)];
    return intHours > 0 ? [String(intHours), ...arrParts] : arrParts;
};

// h, min and s are written the same way in the three languages, so they are left alone
const shopClock = (dblLeft) => {
    const arrParts = countdownParts(dblLeft);
    const arrUnits = arrParts.length === 3 ? ["h", "min", "s"] : ["min", "s"];
    return el("div", { class: "sh-clock", id: "elShopClock", "data-notr": true },
        arrParts.flatMap((strValue, intIndex) => [el("b", { text: strValue }), el("small", { text: arrUnits[intIndex] })]));
};

// A tile is small on purpose: four columns of them is what makes a shop readable at a glance.
// The picture, though, is the thing being sold, and the game shows it big. One click and it is
// big here too, with the name, what it costs and what it costs less than.
const openShopItem = (objItem) => {
    const elDialog = document.getElementById("elShopDialog");
    const intSaved = objItem.was - objItem.price;
    elDialog.replaceChildren(
        el("div", { class: "head" }, [
            el("b", { "data-notr": true, text: objItem.name }),
            el("span", { class: "grow" }),
            el("button", { class: "x", text: "×", title: "Cerrar", "aria-label": "Cerrar", onclick: () => elDialog.close() })
        ]),
        // The scrolling body takes the focus, so it opens ready for the keyboard instead of with
        // a ring drawn around the close button
        el("div", { class: "body", tabindex: "-1", autofocus: true }, [
            el("div", { class: "shot" }, [
                objItem.image
                    ? el("img", { src: objItem.image, alt: "" })
                    : el("span", { class: "glyph", "data-notr": true, text: objItem.name.slice(0, 1) }),
                el("div", { class: "flags" }, [
                    objItem.isNew ? el("span", { class: "sh-flag new", text: "Nuevo" }) : null,
                    objItem.leaving ? el("span", { class: "sh-flag out", text: "Se va" }) : null
                ])
            ]),
            el("p", { class: "what", "data-notr": true, text: [objItem.kind, objItem.series ?? objItem.rarity].filter(Boolean).join(" · ") }),
            el("p", { class: "price" }, [
                objApp.objShop?.vbucksIcon ? el("img", { src: objApp.objShop.vbucksIcon, alt: "" }) : null,
                el("span", { "data-notr": true, text: fmtWhole(objItem.price) }),
                intSaved > 0 ? el("s", { "data-notr": true, text: fmtWhole(objItem.was) }) : null,
                intSaved > 0 ? el("span", { class: "saved", text: `Ahorras ${fmtWhole(intSaved)}` }) : null
            ]),
            // What the game itself says about this offer, when it says anything
            objItem.tag ? el("p", { class: "note", "data-notr": true, text: objItem.tag }) : null,
            objItem.isBundle && objItem.pieces > 1 ? el("p", { class: "note", text: `Lleva ${objItem.pieces} cosas` }) : null,
            el("p", { class: "when" }, dotted([
                objItem.section,
                objItem.isNew ? "Ha entrado hoy" : `En la tienda desde el ${fmtDay(new Date(objItem.inUtc))}`,
                objItem.leaving ? "Se va en el próximo cambio" : null
            ]))
        ])
    );
    if (!elDialog.open) elDialog.showModal();
};

const shopCard = (objItem) => el("article", {
    class: `sh-card r-${objItem.rarityKey ?? "none"}`, tabindex: "0", role: "button",
    onclick: () => openShopItem(objItem),
    onkeydown: (objEvent) => {
        if (objEvent.key !== "Enter" && objEvent.key !== " ") return;
        objEvent.preventDefault();
        openShopItem(objItem);
    }
}, [
    el("div", { class: "pic" }, [
        objItem.image
            ? el("img", { src: objItem.image, alt: "", loading: "lazy", decoding: "async" })
            : el("span", { class: "glyph", "data-notr": true, text: objItem.name.slice(0, 1) }),
        el("div", { class: "flags" }, [
            objItem.isNew ? el("span", { class: "sh-flag new", text: "Nuevo" }) : null,
            objItem.leaving ? el("span", { class: "sh-flag out", text: "Se va" }) : null,
            objItem.was > objItem.price ? el("span", { class: "sh-flag off", "data-notr": true, text: `−${fmtWhole(objItem.was - objItem.price)}` }) : null
        ])
    ]),
    el("div", { class: "info" }, [
        el("h3", { "data-notr": true, title: objItem.name, text: objItem.name }),
        el("p", { class: "what", "data-notr": true, text: [objItem.kind, objItem.series ?? objItem.rarity].filter(Boolean).join(" · ") }),
        el("p", { class: "price" }, [
            objApp.objShop?.vbucksIcon ? el("img", { src: objApp.objShop.vbucksIcon, alt: "", loading: "lazy" }) : null,
            el("b", { "data-notr": true, text: fmtWhole(objItem.price) }),
            objItem.was > objItem.price ? el("s", { "data-notr": true, text: fmtWhole(objItem.was) }) : null,
            objItem.isBundle && objItem.pieces > 1 ? el("span", { class: "what", text: `${objItem.pieces} cosas` }) : null
        ]),
        objItem.section ? el("p", { class: "where", "data-notr": true, text: objItem.section }) : null
    ])
]);

// Esc already closes a modal dialog; this is the click outside it
document.getElementById("elShopDialog").addEventListener("click", (objEvent) => {
    if (objEvent.target.id === "elShopDialog") objEvent.target.close();
});

// The same way out as the shop's: the backdrop closes it, and Esc already does
document.getElementById("elRouteDialog").addEventListener("click", (objEvent) => {
    if (objEvent.target.id === "elRouteDialog") objEvent.target.close();
});

const shopBlock = (strTitle, strWhy, arrItems) => arrItems.length ? el("section", { class: "sh-block" }, [
    el("div", { class: "sh-head" }, [
        el("h2", { text: strTitle }),
        el("span", { class: "count", "data-notr": true, text: String(arrItems.length) })
    ]),
    strWhy ? el("p", { class: "why", text: strWhy }) : null,
    el("div", { class: "sh-grid" }, arrItems.map(shopCard))
]) : null;

const renderShopFeatured = () => {
    const arrAll = getShopEntries();
    const arrNew = arrAll.filter((objItem) => objItem.isNew);
    const setNew = new Set(arrNew.map((objItem) => objItem.id));
    const arrBig = arrAll.filter((objItem) => isShopBig(objItem) && !setNew.has(objItem.id));
    const arrOut = arrAll.filter((objItem) => objItem.leaving);
    return [
        shopBlock("Lo nuevo de hoy", "Lo que ha entrado con el cambio de esta madrugada.", sortShop(arrNew)),
        shopBlock("Legendarios, series y destacados", "Lo legendario, lo que pertenece a una serie y lo que el juego promociona en su propia baldosa, quitando lo que ya sale arriba.", sortShop(arrBig)),
        shopBlock("Se van en el próximo cambio", "Última oportunidad: mañana ya no estarán.", sortShop(arrOut))
    ].filter(Boolean);
};

// The whole shop, in the game's own order, section by section. Typing in the box redraws the
// list and nothing else: rebuilding the page around the box would take the cursor with it.
const shopSections = () => {
    const strFind = objApp.strShopFind.trim().toLowerCase();
    const arrAll = getShopEntries().filter((objItem) => !strFind
        || `${objItem.name} ${objItem.kind ?? ""} ${objItem.series ?? ""} ${objItem.section ?? ""}`.toLowerCase().includes(strFind));
    if (!arrAll.length) {
        return [el("p", { class: "hint", text: "No hay nada en la tienda que se llame así." })];
    }
    const arrSections = [];
    for (const objItem of arrAll) {
        const strSection = objItem.section ?? "";
        const objSection = arrSections.find((objOne) => objOne.strName === strSection);
        if (objSection) objSection.arrItems.push(objItem);
        else arrSections.push({ strName: strSection, arrItems: [objItem] });
    }
    return arrSections.map((objSection) => el("section", { class: "sh-block" }, [
        el("div", { class: "sh-head" }, [
            objSection.strName ? el("h2", { "data-notr": true, text: objSection.strName }) : el("h2", { text: "Fuera de las secciones" }),
            el("span", { class: "count", "data-notr": true, text: String(objSection.arrItems.length) })
        ]),
        el("div", { class: "sh-grid" }, sortShop(objSection.arrItems).map(shopCard))
    ]));
};

const renderShopEverything = () => [el("div", { id: "elShopList" }, shopSections())];

const shopTools = () => el("div", { class: "sh-tools" }, [
    objApp.strShopView === "todo" ? el("input", {
        type: "search", class: "sh-find", value: objApp.strShopFind, placeholder: "Buscar en la tienda",
        "aria-label": "Buscar en la tienda", spellcheck: "false",
        oninput: (objEvent) => {
            objApp.strShopFind = objEvent.target.value;
            document.getElementById("elShopList")?.replaceChildren(...shopSections());
        }
    }) : null,
    el("label", { class: "sh-sort" }, [
        "Ordenar por", " ",
        el("select", {
            "aria-label": "Ordenar la tienda",
            onchange: (objEvent) => { objApp.strShopSort = objEvent.target.value; renderShop(); }
        }, ARR_SHOP_SORTS.map((objSort) => el("option", {
            value: objSort.strId, selected: shopSort() === objSort.strId, text: objSort.strLabel
        })))
    ])
]);

const renderShopDeals = () => {
    const arrAll = getShopEntries();
    const arrOff = sortShop(arrAll.filter((objItem) => objItem.was > objItem.price));
    const arrBundles = sortShop(arrAll.filter((objItem) => objItem.isBundle));
    const arrOut = [
        shopBlock("Rebajas", "Cuesta menos de lo que suele costar.", arrOff),
        shopBlock("Lotes", "Varias cosas juntas por un precio.", arrBundles)
    ].filter(Boolean);
    return arrOut.length ? arrOut : [el("p", { class: "hint", text: "Hoy no hay ni rebajas ni lotes." })];
};

const renderShopMusic = () => {
    const arrTracks = getShopEntries().filter((objItem) => objItem.isTrack);
    return arrTracks.length
        ? [shopBlock("Pistas de improvisación", "Las canciones que hay hoy, con su autor y lo que cuestan.", sortShop(arrTracks))]
        : [el("p", { class: "hint", text: "Hoy no hay ninguna canción en la tienda." })];
};

const renderShop = () => {
    if (objApp.strTab !== "tienda") return;
    const objShop = objApp.objShop;
    const dblLeft = getNextShopReset() - Date.now();
    const arrAll = getShopEntries();

    const elBar = el("div", { class: "sh-bar" }, [
        el("div", { class: "count-down" }, [
            el("span", { class: "label", text: dblLeft > 0 ? "La tienda cambia en" : "La tienda está cambiando" }),
            shopClock(dblLeft),
            el("span", { class: "at", text: `a las ${fmtTimeOfDay(new Date(getNextShopReset()))} de tu hora` })
        ]),
        el("span", { class: "grow" }),
        ...ARR_SHOP_VIEWS.map((objView) => el("button", {
            class: objApp.strShopView === objView.strId ? "btn small primary" : "btn small",
            text: objView.strLabel, "aria-pressed": String(objApp.strShopView === objView.strId),
            onclick: () => { objApp.strShopView = objView.strId; renderShop(); }
        })),
        el("button", {
            class: "btn small ghost", text: objApp.bShopLoading ? "Trayendo la tienda…" : "Actualizar",
            disabled: objApp.bShopLoading, onclick: () => loadShop(true)
        })
    ]);

    const arrBody = [];
    if (!arrAll.length) {
        arrBody.push(el("p", { class: "hint", text: objApp.bShopLoading
            ? "Trayendo la tienda…"
            : "No he podido traer la tienda. Hace falta conexión a internet: compruébala y vuelve a intentarlo." }));
    } else {
        if (objShop?.stale) {
            arrBody.push(el("p", { class: "sh-sum" }, el("span", { class: "old", text: `Esta es la tienda del ${fmtDay(new Date(objShop.dateUtc))}: no he podido traer la de hoy.` })));
        }
        arrBody.push(el("p", { class: "sh-sum" }, dotted([
            `${arrAll.length} artículos en la tienda`,
            `${arrAll.filter((objItem) => objItem.isNew).length} nuevos hoy`,
            `${arrAll.filter((objItem) => objItem.leaving).length} se van en el próximo cambio`
        ])));
        arrBody.push(shopTools());
        if (objApp.strShopView === "todo") arrBody.push(...renderShopEverything());
        else if (objApp.strShopView === "ofertas") arrBody.push(...renderShopDeals());
        else if (objApp.strShopView === "musica") arrBody.push(...renderShopMusic());
        else arrBody.push(...renderShopFeatured());
    }

    elShop.replaceChildren(elBar, ...arrBody);
};

// Tabs: matches board, live match, treasure card
const ARR_TABS = [["partidas", "Partidas", ""], ["vivo", "En vivo", "#vivo"], ["mapa", "Mapa", "#mapa"], ["tesoros", "Tesoros", "#tesoros"], ["escuadron", "Escuadrón", "#escuadron"], ["tienda", "Tienda", "#tienda"]];
const renderTabs = () => {
    document.body.dataset.tab = objApp.strTab;
    document.getElementById("elTabs").replaceChildren(...ARR_TABS.map(([strId, strLabel, strHash]) => el("button", {
        text: strId === "vivo" && objApp.objState?.live ? `${tr(strLabel)} ●` : strLabel, role: "tab", "aria-pressed": String(objApp.strTab === strId),
        onclick: () => { objApp.strTab = strId; history.replaceState(null, "", strHash || location.pathname); showTab(); }
    })));
};
// bFromPoll: a background refresh must not redraw a tab while the user is typing in it
const showTab = (bFromPoll = false) => {
    renderTabs();
    elBoard.hidden = objApp.strTab !== "partidas";
    elTreasure.hidden = objApp.strTab !== "tesoros";
    elLive.hidden = objApp.strTab !== "vivo";
    elMap.hidden = objApp.strTab !== "mapa";
    elSquad.hidden = objApp.strTab !== "escuadron";
    elShop.hidden = objApp.strTab !== "tienda";
    if (objApp.strTab !== "escuadron") stopSquadWatch();
    if (objApp.strTab !== "tienda") stopShopClock();
    if (objApp.strTab === "partidas") { renderBoard(); return; }
    renderChrome();
    if (objApp.strTab === "vivo") { renderLive(); return; }
    if (objApp.strTab === "mapa") { renderMap(); return; }
    if (objApp.strTab === "escuadron") {
        // Entrar en la pestaña es motivo para mirar el disco otra vez
        if (!bFromPoll) loadSquad(true).then(renderSquad);
        renderSquad();
        return;
    }
    if (objApp.strTab === "tienda") {
        renderShop();
        startShopClock();
        if (!objApp.objShop && !objApp.bShopLoading) loadShop();
        return;
    }
    const bTyping = bFromPoll && elTreasure.contains(document.activeElement) && ["INPUT", "SELECT"].includes(document.activeElement.tagName);
    if (!bTyping) renderTreasure();
};

// ---------------------------------------------------------------------------
// Layout: order, hidden widgets, sizes, table columns, range
// ---------------------------------------------------------------------------

const INT_LAYOUT_VERSION = 2;

const defaultLayout = () => ({
    // La partida y «¿Vas mejorando?» comparten la primera fila
    arrOrder: (() => {
        const arrIds = ARR_WIDGETS.map((objWidget) => objWidget.strId).filter((strId) => strId !== "progreso");
        arrIds.splice(arrIds.indexOf("partida") + 1, 0, "progreso");
        return arrIds;
    })(),
    objHidden: Object.fromEntries(ARR_WIDGETS.filter((objWidget) => objWidget.bHidden).map((objWidget) => [objWidget.strId, true])),
    objSizes: {},
    objColumns: {},
    objCollapsed: {},
    objTable: {},
    strRange: "todo",
    intVersion: INT_LAYOUT_VERSION
});

// A layout saved before the top row was split in two keeps «¿Vas mejorando?» at the very bottom,
// where it goes unnoticed. This moves it up beside the match once, and leaves it alone after that.
// intSavedVersion is the version of what was on disk: the merged layout always carries the
// current one, because the defaults do, so asking it would say every layout is already upgraded.
const upgradeLayout = (objLayout, intSavedVersion) => {
    if (intSavedVersion >= INT_LAYOUT_VERSION) return;
    objLayout.intVersion = INT_LAYOUT_VERSION;
    const arrOrder = objLayout.arrOrder.filter((strId) => strId !== "progreso");
    const intMatch = arrOrder.indexOf("partida");
    arrOrder.splice(intMatch < 0 ? 0 : intMatch + 1, 0, "progreso");
    objLayout.arrOrder = arrOrder;
    objLayout.objHidden = { ...objLayout.objHidden, progreso: false };
    // Both halves of the row go back to their new default width
    delete objLayout.objSizes.partida;
    delete objLayout.objSizes.progreso;
};

// Saved layouts survive new versions: unknown widgets are dropped, new ones appended
const normalizeLayout = (objSaved) => {
    // A layout with no version written in it was saved before versions existed: that is version 1
    const intSavedVersion = objSaved ? (objSaved.intVersion ?? 1) : INT_LAYOUT_VERSION;
    const objLayout = { ...defaultLayout(), ...(objSaved ?? {}) };
    const arrKnown = (objLayout.arrOrder ?? []).filter((strId) => OBJ_WIDGETS[strId]);
    const arrMissing = ARR_WIDGETS.map((objWidget) => objWidget.strId).filter((strId) => !arrKnown.includes(strId));
    objLayout.arrOrder = [...arrKnown, ...arrMissing];
    objLayout.objHidden = { ...(objLayout.objHidden ?? {}) };
    if (objSaved) arrMissing.forEach((strId) => { if (OBJ_WIDGETS[strId].bHidden) objLayout.objHidden[strId] = true; });
    objLayout.objSizes = { ...(objLayout.objSizes ?? {}) };
    objLayout.objColumns = { ...(objLayout.objColumns ?? {}) };
    objLayout.objCollapsed = { ...(objLayout.objCollapsed ?? {}) };
    objLayout.objTable = { ...(objLayout.objTable ?? {}) };
    if (!ARR_RANGES.some((objRange) => objRange.strId === objLayout.strRange)) objLayout.strRange = "todo";
    upgradeLayout(objLayout, intSavedVersion);
    return objLayout;
};

let intSaveTimer = 0;
const saveLayout = () => {
    try { localStorage.setItem("contador-cofres-layout", JSON.stringify(objApp.objLayout)); } catch (objError) { /* storage unavailable */ }
    clearTimeout(intSaveTimer);
    intSaveTimer = setTimeout(() => api("PUT", "/api/layout", objApp.objLayout).catch(() => {}), 400);
};

const getSize = (objWidget) => objApp.objLayout.objSizes[objWidget.strId] ?? objWidget.intSize;

const moveWidget = (strId, intDelta) => {
    const arrVisible = objApp.objLayout.arrOrder.filter((strOther) => !objApp.objLayout.objHidden[strOther]);
    const intFrom = arrVisible.indexOf(strId);
    const intTo = intFrom + intDelta;
    if (intTo < 0 || intTo >= arrVisible.length) return;
    arrVisible.splice(intTo, 0, arrVisible.splice(intFrom, 1)[0]);
    applyVisibleOrder(arrVisible);
};

const applyVisibleOrder = (arrVisible) => {
    const arrHidden = objApp.objLayout.arrOrder.filter((strId) => objApp.objLayout.objHidden[strId]);
    objApp.objLayout.arrOrder = [...arrVisible, ...arrHidden];
    saveLayout();
    renderBoard();
};

const resizeWidget = (objWidget, intDelta) => {
    const intSize = getSize(objWidget) + intDelta;
    if (intSize < INT_MIN_SIZE || intSize > INT_MAX_SIZE) return;
    objApp.objLayout.objSizes[objWidget.strId] = intSize;
    saveLayout();
    renderBoard();
};

const toggleCollapsed = (strId) => {
    if (objApp.objLayout.objCollapsed[strId]) delete objApp.objLayout.objCollapsed[strId]; else objApp.objLayout.objCollapsed[strId] = true;
    saveLayout();
    renderBoard();
};

const setHidden = (strId, bHidden) => {
    if (bHidden) objApp.objLayout.objHidden[strId] = true; else delete objApp.objLayout.objHidden[strId];
    saveLayout();
    renderBoard();
};

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

const elBoard = document.getElementById("elBoard");
let strDraggedId = null;

const buildWidget = (objWidget, objContext, intVisibleIndex, intVisibleCount) => {
    const intSize = getSize(objWidget);
    const elBody = el("div", { class: "body" });

    // Panels can be minimised to their title; the small figure tiles cannot
    const bCollapsible = objWidget.strKind !== "kpi";
    const bCollapsed = bCollapsible && !!objApp.objLayout.objCollapsed[objWidget.strId];
    const elCollapse = bCollapsible ? el("button", {
        class: "btn small ghost collapse", text: bCollapsed ? "Desplegar" : "Minimizar", "aria-expanded": String(!bCollapsed),
        "aria-label": `${bCollapsed ? "Desplegar" : "Minimizar"} ${objWidget.strTitle}`, onclick: () => toggleCollapsed(objWidget.strId)
    }) : null;
    const elTitle = el("h2", {}, [objWidget.strSwatch ? el("i", { class: "swatch", style: { display: "inline-block", width: "10px", height: "10px", borderRadius: "2px", marginRight: "7px", background: objWidget.strSwatch } }) : null, objWidget.strTitle]);
    // A widget that names itself in its own content only needs this heading while minimised
    const bOwnHeading = objWidget.bNoHeading && !bCollapsed;

    const elWidget = el("section", {
        class: `widget${bCollapsed ? " collapsed" : ""}`, "data-id": objWidget.strId, "data-kind": objWidget.strKind,
        style: { "--span": intSize }, draggable: objApp.bEditing ? "true" : null
    }, [
        el("div", { class: "edit-bar" }, [
            el("span", { class: "name", text: "Arrastra para mover" }),
            el("button", { text: "←", title: "Mover antes", "aria-label": `Mover ${objWidget.strTitle} antes`, disabled: intVisibleIndex === 0, onclick: () => moveWidget(objWidget.strId, -1) }),
            el("button", { text: "→", title: "Mover después", "aria-label": `Mover ${objWidget.strTitle} después`, disabled: intVisibleIndex === intVisibleCount - 1, onclick: () => moveWidget(objWidget.strId, 1) }),
            el("button", { text: "−", title: "Más estrecho", "aria-label": `Hacer ${objWidget.strTitle} más estrecho`, disabled: intSize <= INT_MIN_SIZE, onclick: () => resizeWidget(objWidget, -1) }),
            el("button", { text: "+", title: "Más ancho", "aria-label": `Hacer ${objWidget.strTitle} más ancho`, disabled: intSize >= INT_MAX_SIZE, onclick: () => resizeWidget(objWidget, 1) }),
            el("button", { class: "wide", text: "Ocultar", onclick: () => setHidden(objWidget.strId, true) })
        ]),
        bOwnHeading ? null : (bCollapsible ? el("div", { class: "head" }, [elTitle, elCollapse]) : elTitle),
        bCollapsed ? null : elBody
    ]);

    elWidget.addEventListener("dragstart", (objEvent) => {
        strDraggedId = objWidget.strId;
        objEvent.dataTransfer.effectAllowed = "move";
        objEvent.dataTransfer.setData("text/plain", objWidget.strId);
        requestAnimationFrame(() => elWidget.classList.add("dragging"));
    });
    elWidget.addEventListener("dragover", (objEvent) => {
        if (!strDraggedId || strDraggedId === objWidget.strId) return;
        objEvent.preventDefault();
        const elDragged = elBoard.querySelector(`[data-id="${strDraggedId}"]`);
        const objRect = elWidget.getBoundingClientRect();
        const bAfter = objEvent.clientX > objRect.left + objRect.width / 2;
        const elReference = bAfter ? elWidget.nextSibling : elWidget;
        if (elReference !== elDragged && elDragged.nextSibling !== elReference) elBoard.insertBefore(elDragged, elReference);
    });
    elWidget.addEventListener("dragend", () => {
        strDraggedId = null;
        applyVisibleOrder([...elBoard.querySelectorAll(".widget")].map((elItem) => elItem.dataset.id));
    });

    return { elWidget, elBody, bCollapsed, elCollapse };
};

const renderEmpty = () => {
    const objStatus = objApp.objState.status;
    const objSettings = objApp.objState.settings;
    const bHasExcluded = objApp.objState.matches.length > 0;
    const elEmpty = el("div", { class: "empty widget", style: { "--span": 12 } });

    if (!objStatus.demosFolderExists) {
        elEmpty.append(
            el("strong", { text: "No encuentro la carpeta de repeticiones" }),
            el("p", {}, ["Busco en ", el("code", { text: objSettings.demosPath }), ". Si Fortnite guarda las repeticiones en otro sitio, cambia la carpeta en Ajustes."])
        );
    } else if (bHasExcluded) {
        elEmpty.append(el("strong", { text: "No hay partidas en este periodo" }), el("p", { text: "Elige «Todas» arriba para ver el historial completo." }));
    } else if (objStatus.liveFile) {
        elEmpty.append(el("strong", { text: "Partida en curso" }), el("p", { text: "Aparecerá aquí en cuanto termine y Fortnite cierre la repetición." }));
    } else {

            el("p", { text: "Juega una partida con la grabación de repeticiones activada en los ajustes de Fortnite. Al terminar aparecerá aquí sola." })
        );
    }
    return elEmpty;
};

const renderBoard = () => {
    if (!objApp.objState) return;
    hideTip();
    if (objApp.strTab !== "partidas") { renderChrome(); return; }

    const arrMatches = getMatchesInRange();
    const objContext = { arrMatches, objSelected: getSelectedMatch(arrMatches), objTotals: getTotals(arrMatches) };
    const arrVisible = objApp.objLayout.arrOrder.filter((strId) => !objApp.objLayout.objHidden[strId]).map((strId) => OBJ_WIDGETS[strId]);

    // The board is rebuilt from scratch: hold its height and put every scroll back where it was,
    // so a click on a filter or a column never throws the page to the top
    const dblPageScroll = window.scrollY;
    const objInnerScroll = Object.fromEntries([...elBoard.querySelectorAll(".widget")].map((elItem) => [elItem.dataset.id, elItem.querySelector(".scroll-y")?.scrollTop ?? 0]));
    elBoard.style.minHeight = `${elBoard.offsetHeight}px`;
    elBoard.replaceChildren();

    if (arrMatches.length === 0) {
        elBoard.append(renderEmpty());
    } else {
        // Attach first, fill second: charts measure their host to size themselves
        const arrBuilt = arrVisible.map((objWidget, intIndex) => ({ objWidget, ...buildWidget(objWidget, objContext, intIndex, arrVisible.length) }));
        arrBuilt.forEach((objBuilt) => elBoard.append(objBuilt.elWidget));
        arrBuilt.forEach((objBuilt) => {
            if (objBuilt.bCollapsed) return;
            try { objBuilt.objWidget.fnRender(objBuilt.elBody, { ...objContext, elCollapse: objBuilt.elCollapse }); }
            catch (objError) { console.error(objBuilt.objWidget.strId, objError); objBuilt.elBody.append(el("p", { class: "hint", text: "No se pudo dibujar este bloque." })); }
            const elScroller = objBuilt.elBody.querySelector(".scroll-y");
            if (elScroller && objInnerScroll[objBuilt.objWidget.strId]) elScroller.scrollTop = objInnerScroll[objBuilt.objWidget.strId];
        });
    }

    renderChrome();
    elBoard.style.minHeight = "";
    if (Math.abs(window.scrollY - dblPageScroll) > 1) window.scrollTo(0, dblPageScroll);
};

    document.getElementById("elRange").replaceChildren(...ARR_RANGES.map((objRange) => el("button", {

        if (objStatus.liveFile) elStatus.append(el("span", { class: "live", text: "Partida en curso: síguela en la pestaña En vivo" }));
        const objGame = objApp.objState.game ?? {};

// ---------------------------------------------------------------------------
// What the program is doing: toasts, top bar, progress chip
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Winning the chest count. Only worth saying once everybody in the squad has published:
// until then the figures are incomplete and a crown would be a lie. Celebrated matches are
// remembered so the news does not come round again on every refresh or restart.
// ---------------------------------------------------------------------------
const STR_CROWNED_KEY = "contador-cofres-coronas";

const loadCrowned = () => {
    try { return new Set(JSON.parse(localStorage.getItem(STR_CROWNED_KEY)) ?? []); }
    catch (objError) { return new Set(); }
};

const rememberCrowned = (setDone) => {
    // Only the recent ones are worth keeping: this is a reminder, not a record
    try { localStorage.setItem(STR_CROWNED_KEY, JSON.stringify([...setDone].slice(-40))); }
    catch (objError) { /* storage unavailable */ }
};

const celebrateChestWin = () => {
    const objMatch = getNumberedMatches().at(-1);
    if (!objMatch?.sessionId || !objMatch.squad?.length) return;

    // Enough that one of them published: waiting for all four can mean waiting forever
    const arrShared = objMatch.squad.filter((objMate) => !objMate.isYou && objMate.sharedChests != null);
    if (!arrShared.length) return;

    const intBest = Math.max(...arrShared.map((objMate) => objMate.sharedChests));
    if (objMatch.chestsTotal <= intBest) return;

    const setDone = loadCrowned();
    if (setDone.has(objMatch.sessionId)) return;
    setDone.add(objMatch.sessionId);
    rememberCrowned(setDone);

    const objRunnerUp = arrShared.find((objMate) => objMate.sharedChests === intBest);
    showToast(
        `♛ ${objMatch.chestsTotal} cofres: ganas la partida`,
        `${objMatch.chestsTotal - intBest} más que ${objRunnerUp?.name ?? "el segundo"}, que llevó ${intBest}.`,
        "gold", 9000
    );
};

// ---------------------------------------------------------------------------
// The best minute to leave. Two short notes, made on the spot rather than loaded from a file,
// so the program carries no audio and works offline. Browsers refuse to make a sound before
// the page has been clicked once, so a failure here is normal and silent.
// ---------------------------------------------------------------------------
let objAudio = null;

const playLeaveCue = () => {
    try {
        objAudio ??= new (window.AudioContext ?? window.webkitAudioContext)();
        if (objAudio.state === "suspended") objAudio.resume();
        [0, 0.18].forEach((dblWhen, intIndex) => {
            const objOsc = objAudio.createOscillator();
            const objGain = objAudio.createGain();
            objOsc.type = "sine";
            objOsc.frequency.value = intIndex ? 1046.5 : 784;       // sol, luego do
            const dblStart = objAudio.currentTime + dblWhen;
            objGain.gain.setValueAtTime(0.0001, dblStart);
            objGain.gain.exponentialRampToValueAtTime(0.22, dblStart + 0.02);
            objGain.gain.exponentialRampToValueAtTime(0.0001, dblStart + 0.16);
            objOsc.connect(objGain).connect(objAudio.destination);
            objOsc.start(dblStart);
            objOsc.stop(dblStart + 0.18);
        });
    } catch (objError) { /* No audio allowed yet, or none at all: the notice still shows */ }
};

// Fires once per match, when the live clock passes the minute the figures say is the best to go
const callLeaveTime = (objLive, intBestMinute) => {
    if (!objLive || intBestMinute == null) return;
    const strFile = objLive.match.file;
    const dblMinutes = (Date.now() - new Date(objLive.match.startedAt).getTime()) / 60000;
    if (dblMinutes < intBestMinute || dblMinutes > intBestMinute + 3) return;   // too late to be news
    if (objApp.strLeaveCalled === strFile) return;

    objApp.strLeaveCalled = strFile;
    playLeaveCue();
    showToast(
        `Minuto ${intBestMinute}: hora de salir`,
        "A partir de aquí rinde más una partida nueva que seguir en esta. Sale de tus propias cifras.",
        "gold", 10000
    );
};

const OBJ_TOAST_ICONS = { good: "✓", gold: "★", warn: "!", info: "●" };
// The asterisk on a match number. Counted by an older version of the reader, and its replay is
// no longer in the folder, so there is nothing to recount it from. Said on demand rather than in
// the status bar: it is unfixable by design, and a line of prose that is always on screen about
// something nobody can act on is a line that stops being read.
const explainOutdated = () => {
    const intOutdated = (objApp.objState?.matches ?? []).filter((objMatch) => objMatch.outdated).length;
    showToast(
        "Recuento de una versión anterior",
        `Esta partida se contó con una versión anterior del lector y su repetición ya no está en la carpeta, así que no se puede volver a contar. Sus cifras valen; puede que no incluyan algo que las versiones nuevas sí cuentan. ${intOutdated === 1 ? "Es la única así." : `Hay ${intOutdated} partidas así, marcadas con *.`}`,
        "info", 9000);
};

const showToast = (strTitle, strText = null, strKind = "info", intMs = 6000) => {
    const elToasts = document.getElementById("elToasts");
    const close = () => { elToast.classList.add("out"); setTimeout(() => elToast.remove(), 320); };
    const elToast = el("div", { class: `toast ${strKind}`, role: "status" }, [
        el("span", { class: "icon", text: OBJ_TOAST_ICONS[strKind] ?? "●" }),
        el("div", {}, [el("b", { text: strTitle }), strText ? el("p", { text: strText }) : null]),
        el("button", { text: "×", "aria-label": "Cerrar aviso", onclick: close })
    ]);
    elToasts.append(elToast);
    while (elToasts.children.length > 4) elToasts.firstElementChild.remove();
    setTimeout(close, intMs);
};

// Top bar and bottom-left chip while replays are being read (or about to be)
const updateBusy = () => {
    const objUpdate = objApp.objState?.update;
    if (objUpdate && ["downloading", "restarting"].includes(objUpdate.state) || objApp.bRestarting) {
        const bRestarting = objUpdate?.state === "restarting" || objApp.bRestarting;
        document.getElementById("elBusyBar").classList.add("on");
        document.getElementById("elBusyBar").classList.toggle("indeterminate", bRestarting);
        document.getElementById("elBusyBar").firstElementChild.style.width = `${Math.max(4, (objUpdate?.progress ?? 0) * 100)}%`;
        const elChip = document.getElementById("elBusyChip");
        elChip.classList.add("on");
        elChip.replaceChildren(el("i", { class: "spin" }), el("div", { style: { minWidth: "0", flex: "1" } }, [
            el("b", { text: bRestarting ? "Reiniciando con la versión nueva…" : "Descargando la actualización…" }),
            el("span", { text: bRestarting ? "La página se recarga sola en unos segundos." : `${Math.round((objUpdate?.progress ?? 0) * 100)} %` }),
            bRestarting ? null : el("div", { class: "meter" }, el("i", { style: { width: `${(objUpdate?.progress ?? 0) * 100}%` } }))
        ]));
        return;
    }
    const objStatus = objApp.objState?.status;
    const intTotal = objStatus?.batchTotal ?? 0;
    const intLeft = objStatus?.pendingCount ?? 0;
    const bReading = intLeft > 0 || !!objStatus?.parsingFile;
    const bExpecting = !bReading && Date.now() < (objApp.dblExpectWorkUntil ?? 0);
    const elBar = document.getElementById("elBusyBar");
    const elChip = document.getElementById("elBusyChip");
    elBar.classList.toggle("on", bReading || bExpecting);
    elChip.classList.toggle("on", bReading || bExpecting);
    if (!bReading && !bExpecting) return;

    const intDone = intTotal ? intTotal - intLeft : 0;
    const dblShare = intTotal ? Math.max(0.04, intDone / intTotal) : 0;
    elBar.classList.toggle("indeterminate", !intTotal);
    elBar.firstElementChild.style.width = `${dblShare * 100}%`;
    elChip.replaceChildren(
        el("i", { class: "spin" }),
        el("div", { style: { minWidth: "0", flex: "1" } }, [
            el("b", { text: bExpecting ? "Preparando la lectura…" : intTotal > 1 ? `Leyendo repeticiones: ${intDone} de ${intTotal}` : "Leyendo la repetición de una partida" }),
            el("span", { text: objStatus?.parsingFile ?? (bExpecting ? "En unos segundos empieza" : "") }),
            intTotal > 1 ? el("div", { class: "meter" }, el("i", { style: { width: `${dblShare * 100}%` } })) : null
        ])
    );
};

// Replays that could not be read: a banner that does not hide the page, with what to do about them
const getFailKey = (arrErrors) => arrErrors.map((objError) => `${objError.file}|${objError.attempts}`).join(";");
const replayAction = async (strUrl, arrFiles, strDone) => {
    try {
        await api("POST", strUrl, { files: arrFiles });
        showToast(strDone, null, "good");
    } catch (objError) {
        showToast("No se pudo hacer", objError.message, "warn", 9000);
    }
    await refresh(true);
    if (elDrawer.classList.contains("open")) renderDrawer();
};
const retryReplays = async () => {
    objApp.dblExpectWorkUntil = Date.now() + 6000;
    updateBusy();
    await api("POST", "/api/rescan?mode=failed");
    showToast("Reintentando las que fallaron", "Si vuelven a fallar, aparecerán aquí otra vez.", "info");
    await refresh(true);
};
const fmtMegabytes = (lngBytes) => `${new Intl.NumberFormat(STR_LOCALE, { maximumFractionDigits: 1 }).format(lngBytes / 1048576)} MB`;
const describeFailure = (objError) => `${objError.file} · ${fmtMegabytes(objError.size)} · ${fmtDate(objError.modifiedUtc)} · ${objError.attempts === 1 ? "1 intento" : `${objError.attempts} intentos`}\n${objError.message}`;

// Delete asks once more, in place, saying how many files go
const deleteButton = (arrFiles, strLabel) => {
    const elHolder = el("span", { class: "row" });
    const showButton = () => elHolder.replaceChildren(el("button", { class: "btn small danger", text: strLabel, onclick: showConfirm }));
    const showConfirm = () => elHolder.replaceChildren(
        el("button", { class: "btn small danger solid", text: arrFiles.length === 1 ? "Sí, borrar el archivo" : `Sí, borrar ${arrFiles.length} archivos`, onclick: () => replayAction("/api/replays/delete", arrFiles, arrFiles.length === 1 ? "Archivo borrado" : "Archivos borrados") }),
        el("button", { class: "btn small", text: "Cancelar", onclick: showButton })
    );
    showButton();
    return elHolder;
};

const renderFailures = () => {
    const elBar = document.getElementById("elFailBar");
    const arrErrors = objApp.objState?.status?.errors ?? [];
    let strHidden = null;
    try { strHidden = sessionStorage.getItem("fcc-failures-hidden"); } catch (objError) { /* storage unavailable */ }
    if (!arrErrors.length || strHidden === getFailKey(arrErrors)) { elBar.hidden = true; return; }
    // Do not redraw under the user's fingers while a confirmation is open
    if (!elBar.hidden && elBar.querySelector(".btn.danger.solid")) return;
    elBar.hidden = false;
    // Folded, the reason is one line with an ellipsis; opened, it is read whole
    elBar.classList.toggle("open", !!objApp.bFailDetails);

    const arrFiles = arrErrors.map((objError) => objError.file);
    const intRepeated = arrErrors.filter((objError) => objError.attempts > 1).length;
    const objFirst = arrErrors[0];
    // Nearly always they failed for the same reason: say it once instead of once per file
    const bSameReason = arrErrors.every((objError) => objError.message === objFirst.message);
    const strSummary = arrErrors.length === 1 || bSameReason
        ? objFirst.message
        : `La más reciente: ${objFirst.file}.${intRepeated ? " Alguna ya ha fallado más de una vez." : ""}`;

    // The detail list is null while it is folded; replaceChildren would print it as the text "null"
    elBar.replaceChildren(...[
        el("div", { class: "head" }, [
            el("span", { class: "icon", text: "!" }),
            el("b", { text: arrErrors.length === 1 ? "Una repetición no se pudo leer" : `${arrErrors.length} repeticiones no se pudieron leer` }),
            el("span", { class: "grow" }),
            el("button", { class: "btn small", text: "Reintentar", onclick: (objEvent) => { objEvent.target.classList.add("working"); retryReplays(); } }),
            el("button", { class: "btn small ghost", text: objApp.bFailDetails ? "Ocultar" : `Ver ${arrErrors.length === 1 ? "cuál es" : "cuáles son"}`, onclick: () => { objApp.bFailDetails = !objApp.bFailDetails; renderFailures(); } }),
            el("button", { class: "x", text: "×", title: "Ocultar este aviso hasta que haya un error nuevo", "aria-label": "Ocultar este aviso hasta que haya un error nuevo", onclick: () => { try { sessionStorage.setItem("fcc-failures-hidden", getFailKey(arrErrors)); } catch (objError) { /* storage unavailable */ } renderFailures(); } }),
            el("span", { class: "why", title: strSummary, text: strSummary })
        ]),
        objApp.bFailDetails ? el("div", { class: "list" }, el("ul", {}, arrErrors.map((objError) => el("li", {}, [
            el("span", { class: "file", title: objError.file, text: objError.file }),
            el("span", { class: "meta", text: `${fmtMegabytes(objError.size)} · ${fmtDate(objError.modifiedUtc)} · ${objError.attempts === 1 ? "1 intento" : `${objError.attempts} intentos`}` }),
            el("button", { class: "btn small", text: "No reintentar", title: "El archivo se queda en la carpeta, pero el programa deja de leerlo", onclick: () => replayAction("/api/replays/ignore", [objError.file], "No se volverá a intentar") }),
            deleteButton([objError.file], "Borrar"),
            bSameReason ? null : el("span", { class: "msg", title: objError.message, text: objError.message })
        ].filter(Boolean)))) ) : null,
        objApp.bFailDetails ? el("div", { class: "foot" }, [
            arrErrors.length === 1 ? null : el("button", { class: "btn small", text: "No volver a intentarlo con ninguna", title: "Los archivos se quedan en la carpeta, pero el programa deja de leerlos", onclick: () => replayAction("/api/replays/ignore", arrFiles, "No se volverán a intentar") }),
            arrErrors.length === 1 ? null : deleteButton(arrFiles, "Borrar los archivos"),
            el("button", { class: "btn small ghost", text: "Copiar detalles", onclick: async () => {
                try { await navigator.clipboard.writeText(arrErrors.map(describeFailure).join("\n\n")); showToast("Detalles copiados", "Pégalos donde quieras para reportar el problema.", "good"); }
                catch (objError) { showToast("No se pudo copiar", null, "warn"); }
            } }),
            el("span", { class: "meta", text: "El detalle también queda en chestcounter.log, en la carpeta de datos." })
        ].filter(Boolean)) : null
    ].filter(Boolean));
};

// ---------------------------------------------------------------------------
// What's new: the dialog the header button opens, filled from ARR_NEWS. Every
// version is in it, newest first. Nothing opens by itself: while the newest
// entry has not been read the button carries a dot, and opening it clears it.
// ---------------------------------------------------------------------------
const STR_NEWS_LATEST = ARR_NEWS[0]?.strVersion ?? "";
const OBJ_NEWS_TAGS = { nuevo: "Nuevo", mejorado: "Mejorado", arreglado: "Arreglado" };

const readNewsSeen = () => { try { return localStorage.getItem("fcc-news-seen"); } catch (objError) { return null; } };
const markNewsSeen = () => { try { localStorage.setItem("fcc-news-seen", STR_NEWS_LATEST); } catch (objError) { /* storage unavailable */ } };

// The date of an entry is written as yyyy-mm-dd; midday keeps it on that same day in every time zone
const fmtNewsDate = (strDate) => new Date(`${strDate}T12:00:00`).toLocaleDateString(STR_LOCALE, { day: "numeric", month: "long", year: "numeric" });

// A dot on the button while the newest version has not been read
const renderNewsButton = () => {
    const elButton = document.getElementById("elNewsOpen");
    const bUnread = !!ARR_NEWS.length && readNewsSeen() !== STR_NEWS_LATEST;
    elButton.hidden = !ARR_NEWS.length;
    elButton.classList.toggle("has-news", bUnread);
    elButton.title = bUnread ? "Esta versión trae novedades" : "Qué ha cambiado en cada versión";
};

const openNews = () => {
    const elDialog = document.getElementById("elNewsDialog");
    elDialog.replaceChildren(
        el("div", { class: "head" }, [
            el("b", { text: "Novedades" }),
            el("span", { class: "count", text: plural(ARR_NEWS.length, "versión", "versiones") }),
            el("span", { class: "grow" }),
            el("button", { class: "x", text: "×", title: "Cerrar las novedades", "aria-label": "Cerrar las novedades", onclick: () => elDialog.close() })
        ]),
        // The dialog gives the focus to the first thing that can take it: the scrolling body,
        // so it opens ready for the keyboard instead of with a ring drawn around its close button
        el("div", { class: "body", tabindex: "-1", autofocus: true }, ARR_NEWS.map((objEntry, intIndex) => el("section", { class: `entry${intIndex === 0 ? " latest" : ""}` }, [
            el("div", { class: "when" }, [
                el("b", { class: "ver figure", text: objEntry.strVersion }),
                el("span", { class: "date", text: fmtNewsDate(objEntry.strDate) })
            ]),
            // data-notr: each line is already in the reader's language, so the translator leaves it alone
            el("ul", {}, objEntry.arrItems.map((objItem) => el("li", {}, [
                el("span", { class: `tag ${objItem.strTag}`, text: OBJ_NEWS_TAGS[objItem.strTag] ?? objItem.strTag }),
                el("span", { class: "what", "data-notr": true, text: objItem[STR_LANG] ?? objItem.es })
            ])))
        ])))
    );

    markNewsSeen();
    renderNewsButton();
    if (!elDialog.open) elDialog.showModal();
};

document.getElementById("elNewsOpen").addEventListener("click", openNews);
// Esc already closes a modal dialog; this is the click outside it
document.getElementById("elNewsDialog").addEventListener("click", (objEvent) => {
    if (objEvent.target.id === "elNewsDialog") document.getElementById("elNewsDialog").close();
});

// ---------------------------------------------------------------------------
// Salvar el Mundo: the V-Bucks on offer today.
//
// A button in the header and a small list that drops out of it. It takes no room on any tab and

//

// ---------------------------------------------------------------------------

// What the page calls each mission, and what this one calls it. The rest of the languages come
// from the usual table; anything new Epic adds shows up in English until it is written in here.
const OBJ_STW_MISSIONS = {

    "Retrieve the Data": "Recupera los datos",
    "Ride the Lightning": "Monta el rayo",
    "Repair the Shelter": "Repara el refugio",
    "Evacuate the Shelter": "Evac\u00faa el refugio",
    "Rescue the Survivors": "Rescata a los supervivientes",
    "Destroy the Encampments": "Destruye los campamentos",
    "Deliver the Bomb": "Entrega la bomba",
    "Eliminate and Collect": "Elimina y recoge",
    "Build the Radar Grid": "Construye la red de radares",
    "Fuel the Homebase": "Abastece la base",
    "Launch the Rocket": "Lanza el cohete",
    "Resupply": "Reabastecimiento",
    // The storm alerts are named by category, here as the game itself names them
    "Category 1 Storm": "Lucha contra una tormenta de categor\u00eda 1",
    "Category 2 Storm": "Lucha contra una tormenta de categor\u00eda 2",
    "Category 3 Storm": "Lucha contra una tormenta de categor\u00eda 3",
    "Category 4 Storm": "Lucha contra una tormenta de categor\u00eda 4"
};

let objVbucksView = null;
let bVbucksBusy = false;
let intVbucksTick = 0;

const elVbucksPop = () => document.getElementById("elVbucksPop");

// The label under the total. The page the alerts come from carries their real expiry, so this is
// their own clock and not a guess about midnight.
// The clock the page itself counts down, which is the same instant either way: when today's
// alerts run out, the next ones are up. So it is worth saying on a day that pays nothing too --
// there it is the only thing the panel can answer, and waiting for the change is the whole
// question. The wording follows which of the two it is.
const sayVbucksLeft = (objView) => {
    if (!objView.expiresUtc) return null;
    const dblSeconds = (new Date(objView.expiresUtc).getTime() - Date.now()) / 1000;
    if (dblSeconds > 48 * 3600) return null;              // not a date about today's alerts
    if (!objView.missions.length) {
        return dblSeconds > 60 ? `misiones nuevas en ${fmtPlayed(dblSeconds)}` : "misiones nuevas ya";
    }
    return dblSeconds > 60 ? `caducan en ${fmtPlayed(dblSeconds)}` : "caducan ya";
};

const renderVbucks = () => {
    const elPop = elVbucksPop();
    const objView = objVbucksView;

    // Nothing to show yet: the first press waits for the answer
    if (!objView) {
        elPop.replaceChildren(el("p", { class: "none", text: bVbucksBusy ? "Buscando las alertas\u2026" : "No se pudieron leer las alertas de Salvar el Mundo." }));
        return;
    }

    const strLeft = sayVbucksLeft(objView);
    elPop.replaceChildren(...[
        // The figure only when there is one to give; the countdown on its own is reason enough
        // for the row, because on a day with no alerts it is all there is to say
        objView.missions.length || strLeft ? el("div", { class: "vb-head" }, [
            objView.missions.length ? el("b", { class: "figure", text: `${objView.total} pavos` }) : null,
            strLeft && el("span", { class: "tag", text: strLeft })
        ]) : null,
        objView.missions.length
            // The zone and the corner of it are a place and stay as the game writes them; hovering
            // a line is enough for something nobody needs to read every time
            ? el("ul", {}, objView.missions.map((objMission) => el("li", { title: [objMission.zone, objMission.area].filter(Boolean).join(" \u00b7 ") }, [
                el("b", { class: "pay figure", text: `${objMission.vbucks} pavos` }),
                el("span", { class: "what", text: `Nivel ${objMission.power}, ${OBJ_STW_MISSIONS[objMission.mission] ?? objMission.mission}` })
            ])))
            : el("p", { class: "none", text: "Hoy no hay ninguna misi\u00f3n que d\u00e9 pavos." }),
        el("p", { class: "src" }, [
            el("span", { "data-notr": true, text: "freethevbucks.com" }),
            objView.stale && el("span", { text: "puede estar desactualizado" })
        ])
    ].filter(Boolean));
    document.getElementById("elVbucksCount").textContent = objView.total ? String(objView.total) : "";
};

const closeVbucks = () => {
    elVbucksPop().hidden = true;
    document.getElementById("elVbucksOpen").setAttribute("aria-expanded", "false");
    if (intVbucksTick) { clearInterval(intVbucksTick); intVbucksTick = 0; }
};

const openVbucks = async () => {
    elVbucksPop().hidden = false;
    document.getElementById("elVbucksOpen").setAttribute("aria-expanded", "true");
    // The countdown keeps up while the panel is open, and stops the moment it closes
    if (!intVbucksTick) intVbucksTick = setInterval(() => { if (objVbucksView) renderVbucks(); }, 30000);
    renderVbucks();

    if (bVbucksBusy) return;
    bVbucksBusy = true;
    renderVbucks();
    try {
        // The program keeps the answer for twenty minutes, so asking on every press costs nothing
        objVbucksView = await api("GET", "/api/vbucks");
        if (objVbucksView?.failed) objVbucksView = null;
    } catch (objError) {
        objVbucksView = null;
    } finally {
        bVbucksBusy = false;
        renderVbucks();
    }
};

document.getElementById("elVbucksOpen").addEventListener("click", (objEvent) => {
    objEvent.stopPropagation();
    if (elVbucksPop().hidden) openVbucks(); else closeVbucks();
});
// Anywhere else, and Esc, puts it away
document.addEventListener("click", (objEvent) => {
    if (!elVbucksPop().hidden && !document.getElementById("elVbucks").contains(objEvent.target)) closeVbucks();
});
document.addEventListener("keydown", (objEvent) => {
    if (objEvent.key === "Escape" && !elVbucksPop().hidden) closeVbucks();
});

// A newer version: a bar under the header with the button that updates
const renderUpdate = () => {
    const objUpdate = objApp.objState?.update;
    const elBar = document.getElementById("elUpdateBar");
    let strDismissed = null;
    try { strDismissed = sessionStorage.getItem("fcc-update-later"); } catch (objError) { /* storage unavailable */ }
    const bShow = !!objUpdate?.enabled && objUpdate.available && (strDismissed !== objUpdate.latestVersion || objUpdate.state !== "idle");
    elBar.hidden = !bShow;
    if (!bShow) return;
    const bBusy = ["downloading", "restarting"].includes(objUpdate.state);
    elBar.replaceChildren(...[
        el("span", {}, [`Hay una versión nueva: `, el("b", { text: objUpdate.latestVersion })]),
        objUpdate.state === "error" ? el("span", { class: "warn", text: `No se pudo actualizar: ${objUpdate.error ?? ""}` }) : null,
        el("span", { class: "grow" }),
        objUpdate.releaseUrl ? el("a", { href: objUpdate.releaseUrl, target: "_blank", rel: "noopener", text: "Ver novedades" }) : null,
        bBusy ? null : el("button", { class: "btn small ghost", text: "Más tarde", onclick: () => { try { sessionStorage.setItem("fcc-update-later", objUpdate.latestVersion); } catch (objError) { /* storage unavailable */ } renderUpdate(); } }),
        el("button", { class: `btn primary${bBusy ? " working" : ""}`, text: "Actualizar", disabled: bBusy, onclick: async () => {
            objApp.dblExpectWorkUntil = Date.now() + 4000;
            try { await api("POST", "/api/update/apply"); } catch (objError) { showToast("No se pudo actualizar", objError.message, "warn"); }
            await refresh(true);
        } })
    ].filter(Boolean));
};

// Compare the state before and after a refresh and say what happened, briefly
const announceChanges = (objBefore, objAfter) => {
    if (!objBefore) return;
    const objStatusBefore = objBefore.status, objStatusAfter = objAfter.status;
    if (!objStatusBefore.batchTotal && objStatusAfter.batchTotal > 1) {
        showToast(`Leyendo ${objStatusAfter.batchTotal} repeticiones`, "Puedes seguir usando el panel; el progreso está abajo a la izquierda.", "info");
    }
    const setBefore = new Set(objBefore.matches.map((objMatch) => objMatch.file));
    const arrNew = objAfter.matches.filter((objMatch) => !setBefore.has(objMatch.file));
    if (objStatusBefore.batchTotal > 1 && !objStatusAfter.batchTotal) {
        showToast("Lectura terminada", `${plural(objAfter.matches.length, "partida guardada", "partidas guardadas")}${objStatusAfter.errors.length ? `, ${plural(objStatusAfter.errors.length, "con error", "con error")}` : ""}.`, "good");
    } else if (arrNew.length === 1 && !objStatusAfter.batchTotal) {
        const objMatch = arrNew[0];
        showToast(`Partida leída: ${plural(objMatch.chestsTotal, "cofre", "cofres")}`, `${new Date(objMatch.startedAt).toLocaleTimeString(STR_LOCALE, { hour: "2-digit", minute: "2-digit" })}, ${objMatch.position ? `puesto ${fmtPosition(objMatch.position)}, ` : ""}${plural(objMatch.kills ?? 0, "eliminación", "eliminaciones")}.`, "gold", 9000);
    }
    if (!objBefore.live && objAfter.live) showToast("Partida en curso", "La pestaña En vivo ya la está siguiendo.", "info");
    const objGameBefore = objBefore.game ?? {}, objGameAfter = objAfter.game ?? {};
    if (objGameAfter.matchFinishedUtc && objGameAfter.matchFinishedUtc !== objGameBefore.matchFinishedUtc) showToast("Partida finalizada", "El recuento aparece en cuanto Fortnite cierre la repetición.", "info");
    if (objGameAfter.searchingSinceUtc && objGameAfter.searchingSinceUtc !== objGameBefore.searchingSinceUtc) showToast("Buscando partida…", "El resumen de la anterior se queda hasta 60 segundos después de que empiece la nueva.", "info");
    if (objStatusAfter.errors.length > objStatusBefore.errors.length) showToast("Una repetición no se pudo leer", "El motivo está en Ajustes.", "warn", 9000);
    const objUpdateBefore = objBefore.update ?? {}, objUpdateAfter = objAfter.update ?? {};
    // Que haya cambiado la versión no se avisa aquí: la página se recarga, y el aviso se da al volver
    if (objUpdateAfter.available && objUpdateAfter.latestVersion !== objUpdateBefore.latestVersion) showToast(`Hay una versión nueva: ${objUpdateAfter.latestVersion}`, null, "gold", 9000);
    if (objUpdateAfter.state === "error" && objUpdateBefore.state !== "error") showToast("No se pudo actualizar", objUpdateAfter.error, "warn", 9000);
};
const plural = (intCount, strOne, strMany) => `${intCount} ${intCount === 1 ? strOne : strMany}`;

// ---------------------------------------------------------------------------
// Server
// ---------------------------------------------------------------------------

// A file the reader keeps: the browser does the saving, with the name the server gives it
const download = (strUrl) => {
    const elLink = el("a", { href: strUrl, download: "" });
    document.body.append(elLink);
    elLink.click();
    elLink.remove();
};

// El mapa de la temporada: se pide una vez y se queda
const loadMap = async () => {
    try { objApp.objMap = await api("GET", "/api/map"); }
    catch (objError) { objApp.objMap = { hasImage: false, places: [] }; }
};

const loadBackups = async () => {
    try { objApp.arrBackups = await api("GET", "/api/backups"); }
    catch (objError) { objApp.arrBackups = []; }
};

// The group looks at the cloud folders of this PC, which the main state never does: its own
// call, made when the settings open and again after anything that changes the group.
const loadSquad = async (bFresh = false) => {
    try { objApp.objSquad = await api("GET", `/api/squad${bFresh ? "?fresh=true" : ""}`); }
    catch (objError) { objApp.objSquad = null; }
};

// While somebody waits for a shared folder to arrive, the program looks again by itself every
// few seconds. OneDrive can take a couple of minutes to bring the folder down, and during that
// wait a button that says nothing is indistinguishable from a button that does nothing.
const startSquadWatch = () => {
    if (objApp.intSquadWatch) return;
    objApp.dblSquadWatchSince = Date.now();
    objApp.intSquadWatch = setInterval(async () => {
        // Only while the screen that is waiting for it is actually open
        if (objApp.strTab !== "escuadron" || objApp.strSquadView !== "join" || (objApp.objSquad?.found ?? []).length) {
            stopSquadWatch();
            return;
        }
        await loadSquad(true);
        renderSquad();
        if ((objApp.objSquad?.found ?? []).length) {
            stopSquadWatch();
            showToast("Lo he encontrado", "Ya puedes entrar en el escuadrón.", "good");
        }
    }, 5000);
};

const stopSquadWatch = () => {
    if (objApp.intSquadWatch) clearInterval(objApp.intSquadWatch);
    objApp.intSquadWatch = null;
};

const api = async (strMethod, strUrl, objBody) => {
    const objResponse = await fetch(strUrl, {
        method: strMethod,
        headers: objBody ? { "Content-Type": "application/json" } : undefined,
        body: objBody ? JSON.stringify(objBody) : undefined
    });
    if (!objResponse.ok) {
        const objError = new Error(`${strMethod} ${strUrl}: ${objResponse.status}`);
        objError.intStatus = objResponse.status;
        // The server explains a refusal in the body; without it there is nothing to show the reader
        try { objError.objBody = JSON.parse(await objResponse.text()); } catch (objIgnored) { /* no body, or not JSON */ }
        throw objError;
    }
    const strText = await objResponse.text();
    return strText ? JSON.parse(strText) : null;
};

const refresh = async (bForce = false) => {
    try {
        const { revision: lngRevision } = await api("GET", "/api/revision");
        const bWasDisconnected = !objApp.bConnected;
        objApp.bConnected = true;
        objApp.strServerError = null;
        if (!bForce && !bWasDisconnected && lngRevision === objApp.lngRevision) return;

        const objBefore = objApp.objState;
        objApp.objState = await api("GET", "/api/state");
        objApp.lngRevision = objApp.objState.revision;

        // Esta página viaja dentro del programa, así que una versión nueva trae su propio HTML y
        // la pestaña abierta se queda con el de la anterior: el arreglo está instalado y no se
        // ve. Pasó de verdad, con las barras descuadradas de esta misma tarjeta, ya corregidas.
        // Al cambiar la versión la página se recarga, que es lo que el aviso de reinicio promete.
        const strVersion = objApp.objState.update?.currentVersion ?? null;
        if (strVersion && objApp.strVersion && strVersion !== objApp.strVersion) {
            try { sessionStorage.setItem("fcc-updated-to", strVersion); } catch (objError) { /* storage unavailable */ }
            location.reload();
            return;
        }
        if (strVersion) objApp.strVersion = strVersion;
        announceChanges(objBefore, objApp.objState);
        objApp.bRestarting = false;
        updateBusy();
        renderUpdate();
        renderFailures();

        if (!objApp.objLayout) {
            let objSaved = objApp.objState.layout;
            if (!objSaved) { try { objSaved = JSON.parse(localStorage.getItem("contador-cofres-layout")); } catch (objError) { objSaved = null; } }
            objApp.objLayout = normalizeLayout(objSaved);
        }

        if (!objApp.objTreasure) objApp.objTreasure = normalizeTreasure(objApp.objState.treasure);

        // Keep showing the newest match unless the user picked an older one
        const arrAll = getNumberedMatches();
        if (objApp.bFollowLatest || !arrAll.some((objMatch) => objMatch.file === objApp.strSelectedFile)) {
            objApp.strSelectedFile = arrAll.at(-1)?.file ?? null;
            objApp.bFollowLatest = true;
        }
        showTab(true);
        celebrateChestWin();
        callLeaveTime(objApp.objState?.live, getHabits(objApp.objState?.live?.match?.file).intBestMinute);
        const bDrawerBusy = elDrawer.contains(document.activeElement) && ["INPUT", "SELECT"].includes(document.activeElement.tagName) || elDrawer.querySelector(".btn.danger.solid");
        if (elDrawer.classList.contains("open") && !bDrawerBusy && !bForce) renderDrawer();
    } catch (objError) {
        if (objApp.objState?.update?.state === "restarting") { objApp.bRestarting = true; updateBusy(); return; }
        const strServerError = objError.intStatus ? `código ${objError.intStatus}` : null;
        const bChanged = objApp.bConnected || objApp.strServerError !== strServerError;
        objApp.bConnected = false;
        objApp.strServerError = strServerError;
        if (bChanged && objApp.objState) renderChrome();
    }
};

let intResizeTimer = 0;
window.addEventListener("resize", () => { clearTimeout(intResizeTimer); intResizeTimer = setTimeout(() => { if (objApp.strTab === "vivo") renderLive(); else renderBoard(); }, 150); });

try { objApp.objDrawerOpen = JSON.parse(localStorage.getItem("contador-cofres-ajustes")) ?? {}; } catch (objError) { objApp.objDrawerOpen = {}; }
renderNewsButton();

// Al volver de una recarga por actualización: el aviso no se podía dar antes, porque la página
// que lo habría mostrado es la que se estaba yendo
try {
    const strUpdatedTo = sessionStorage.getItem("fcc-updated-to");
    if (strUpdatedTo) {
        sessionStorage.removeItem("fcc-updated-to");
        showToast(`Actualizado a la versión ${strUpdatedTo}`, "La página se ha recargado con la versión nueva.", "good", 9000);
    }
} catch (objError) { /* storage unavailable */ }

refresh(true);
setInterval(refresh, 1500);
setInterval(updateBusy, 1000);
</script>

</html>
