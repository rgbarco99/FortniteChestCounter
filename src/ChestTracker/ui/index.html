        ]),
        el("div", { class: "t-grid" }, getShownRewards().map((objReward) => renderTreasureCard(objReward, objWeek, arrMoments))),
        objApp.bTreasureEditing ? renderTreasureSettings(objWeek) : null,
        el("p", { class: "t-note", text: "Los dos porcentajes de arriba cuentan solo los tesoros sin tachar. Probabilidades por cofre publicadas por Epic (Fortnite Status, 7 de noviembre de 2026) para partidas normales. El cálculo usa los cofres, cofres especiales y cofres de espíritu de las partidas leídas, abiertos o rotos; Epic no ha dicho si todos los tipos de cofre cuentan igual. El cambio de semana (domingo, 14:00 UTC) y los objetos de cada semana no los publica Epic: ajústalos en «Editar tesoros». Las Horas del tesoro también se apuntan a mano: las horas son las que anunció Epic, pero algunos multiplicadores vienen de la prensa y no de Epic, así que conviene comprobarlos ahí mismo." })
    ].filter(Boolean));
    if (bFindFocus) {
        bFindFocus = false;
        const elFind = document.getElementById("elFind");
        if (elFind) { elFind.focus(); elFind.setSelectionRange(elFind.value.length, elFind.value.length); }
    }
    if (Math.abs(window.scrollY - dblScroll) > 1) window.scrollTo(0, dblScroll);
};

// The Treasure Hours are a countdown, so that panel redraws itself. Only that panel: the rest of
// the tab has boxes being typed into and must not be rebuilt under the player's fingers.
setInterval(() => {
    if (objApp.strTab !== "tesoros" || !objApp.objState || !objApp.objTreasure) return;
    document.getElementById("elTreasureHours")?.replaceWith(renderTreasureHours());
}, 1000);

// ---------------------------------------------------------------------------
// Map tab: where on the island you open your chests.
//
// The replay gives the position of each opening in the game's own metres, and the season's
// places come in those same metres, so both land on the picture with one transform. The
// picture covers 1350 m either side of the world's origin, which makes a pixel 1.32 m.
// ---------------------------------------------------------------------------

const INT_MAP_PIXELS = 2048;      // the picture is square, and this is its side

// What slice of the world the picture shows, in metres. Measured, not assumed: the obvious guess
// (1350 m each way from the origin) is close enough to look plausible and still lands chests tens
// of metres off, which is a whole building. These come from fitting this season's picture against
// 5.384 chests of known position and checking the named places by eye afterwards. The island is
// not quite centred, and the two axes are not quite the same scale.
const OBJ_MAP_FRAME = { dblHalfWidth: 1476, dblHalfHeight: 1512, dblMiddleX: 80, dblMiddleY: 14 };

// World metres to a 0..1 place on the picture. The world's Y grows southwards, like the image.
const mapFraction = (dblX, dblY) => ({
    dblLeft: (dblX - OBJ_MAP_FRAME.dblMiddleX) / (2 * OBJ_MAP_FRAME.dblHalfWidth) + 0.5,
    dblTop: (dblY - OBJ_MAP_FRAME.dblMiddleY) / (2 * OBJ_MAP_FRAME.dblHalfHeight) + 0.5
});

// Every opening of the given matches that the replay managed to place
const getMapOpenings = (arrMatches) => {
    const arrPoints = [];
    for (const objMatch of arrMatches) {
        for (const objOpening of objMatch.openings) {
            if (objOpening.x != null && objOpening.y != null && ARR_CHEST_CATEGORIES.includes(objOpening.category)) {
                arrPoints.push(objOpening);
            }
        }
    }
    return arrPoints;
};

// Each chest belongs to the nearest named place, as long as it is not out in the middle of nowhere
const INT_PLACE_REACH = 260;      // metres; beyond this a chest counts as being nowhere in particular
const nearestPlace = (arrPlaces, objPoint) => {
    let objNearest = null;
    let dblBest = INT_PLACE_REACH * INT_PLACE_REACH;
    for (const objPlace of arrPlaces) {
        const dblDistance = (objPlace.x - objPoint.x) ** 2 + (objPlace.y - objPoint.y) ** 2;
        if (dblDistance < dblBest) { dblBest = dblDistance; objNearest = objPlace; }
    }
    return objNearest;
};

const ARR_MAP_SCOPES = [
    { strId: "todas", strLabel: "Todas tus partidas" },
    { strId: "partida", strLabel: "Solo la partida elegida" }
];

// The heat: every chest a soft blob, the blobs piling up, then the pile coloured
const drawHeat = (elCanvas, arrPoints, intSide) => {
    const objPaint = elCanvas.getContext("2d");
    objPaint.clearRect(0, 0, intSide, intSide);
    if (!arrPoints.length) return;

    const dblRadius = Math.max(6, intSide / 120);
    objPaint.globalCompositeOperation = "lighter";
    for (const objPoint of arrPoints) {
        const { dblLeft, dblTop } = mapFraction(objPoint.x, objPoint.y);
        const dblX = dblLeft * intSide;
        const dblY = dblTop * intSide;
        const objBlob = objPaint.createRadialGradient(dblX, dblY, 0, dblX, dblY, dblRadius);
        objBlob.addColorStop(0, "rgba(255, 255, 255, 0.22)");
        objBlob.addColorStop(1, "rgba(255, 255, 255, 0)");
        objPaint.fillStyle = objBlob;
        objPaint.beginPath();
        objPaint.arc(dblX, dblY, dblRadius, 0, Math.PI * 2);
        objPaint.fill();
    }

    objPaint.globalCompositeOperation = "source-over";
    const objImage = objPaint.getImageData(0, 0, intSide, intSide);
    const arrPixels = objImage.data;

    // Measured against its own busy spots, so one match reads like a hundred do. Not against the
    // single busiest pixel: one corner you emptied twenty times would leave the rest invisible.
    const arrHistogram = new Uint32Array(256);
    let intLit = 0;
    for (let intIndex = 3; intIndex < arrPixels.length; intIndex += 4) {
        const intAlpha = arrPixels[intIndex];
        if (intAlpha > 2) { arrHistogram[intAlpha]++; intLit++; }
    }
    let intPeak = 1;
    for (let intLevel = 255, intSeen = 0; intLevel > 0; intLevel--) {
        intSeen += arrHistogram[intLevel];
        if (intSeen >= intLit * 0.02) { intPeak = Math.max(1, intLevel); break; }
    }

    // Chest gold where you pass by, through orange, to white where you farm hardest
    for (let intIndex = 0; intIndex < arrPixels.length; intIndex += 4) {
        const dblHeat = Math.pow(Math.min(1, arrPixels[intIndex + 3] / intPeak), 0.7);
        if (dblHeat <= 0.04) { arrPixels[intIndex + 3] = 0; continue; }
        arrPixels[intIndex] = 255;
        arrPixels[intIndex + 1] = Math.round(150 + 105 * Math.max(0, dblHeat - 0.3) / 0.7);
        arrPixels[intIndex + 2] = Math.round(20 + 225 * Math.max(0, dblHeat - 0.6) / 0.4);
        arrPixels[intIndex + 3] = Math.round(235 * Math.min(1, 0.3 + dblHeat * 0.9));
    }
    objPaint.putImageData(objImage, 0, 0);
};

const renderMap = () => {
    const objMap = objApp.objMap;
    if (!objMap) { loadMap().then(() => { if (objApp.strTab === "mapa") renderMap(); }); }

    const arrAll = getNumberedMatches();
    const strScope = objApp.objLayout?.strMapScope ?? "todas";
    const objSelected = getSelectedMatch(arrAll);
    const arrMatches = strScope === "partida" && objSelected ? [objSelected] : arrAll;
    const arrPoints = getMapOpenings(arrMatches);
    const arrPlaces = objMap?.places ?? [];

    const elHeat = el("canvas", { class: "heat", width: INT_MAP_PIXELS, height: INT_MAP_PIXELS });
    const elBoardMap = el("div", { class: "m-board" }, [
        objMap?.hasImage ? el("img", { src: "/api/map/image", alt: "", draggable: "false" }) : el("div", { class: "m-noimage" }),
        elHeat,
        ...arrPlaces.map((objPlace) => {
            const { dblLeft, dblTop } = mapFraction(objPlace.x, objPlace.y);
            return el("span", { class: "m-place", style: { left: `${dblLeft * 100}%`, top: `${dblTop * 100}%` } }, [
                el("i"), el("b", { "data-notr": true, text: objPlace.name })
            ]);
        })
    ]);

    // Chests per place, which is the question somebody farming actually asks
    const dicByPlace = new Map(arrPlaces.map((objPlace) => [objPlace.name, { strName: objPlace.name, intChests: 0 }]));
    let intNowhere = 0;
    for (const objPoint of arrPoints) {
        const objPlace = nearestPlace(arrPlaces, objPoint);
        if (objPlace) dicByPlace.get(objPlace.name).intChests++; else intNowhere++;
    }
    const arrRanking = [...dicByPlace.values()].filter((objPlace) => objPlace.intChests > 0).sort((objLeft, objRight) => objRight.intChests - objLeft.intChests);
    const intTop = arrRanking[0]?.intChests ?? 1;

    const intPlaced = arrPoints.length;
    const intChestsTotal = sum(arrMatches, (objMatch) => objMatch.chestsTotal);

    elMap.replaceChildren(
        el("div", { class: "m-top" }, [
            el("div", { class: "segmented" }, ARR_MAP_SCOPES.map((objScope) => el("button", {
                text: objScope.strLabel, "aria-pressed": String(objScope.strId === strScope),
                disabled: objScope.strId === "partida" && !objSelected,
                onclick: () => { objApp.objLayout.strMapScope = objScope.strId; saveLayout(); renderMap(); }
            }))),
            el("span", { class: "grow" }),
            el("span", { class: "m-count" }, [el("b", { text: fmtNumber(intPlaced) }), intPlaced === 1 ? " cofre situado en el mapa" : " cofres situados en el mapa"])
        ]),
        el("div", { class: "m-grid" }, [
            elBoardMap,
            el("div", { class: "m-side" }, [
                el("h2", { text: "Dónde abres los cofres" }),
                arrRanking.length
                    ? el("div", { class: "table-wrap scroll-y" }, el("table", { class: "m-rank" }, el("tbody", {}, arrRanking.map((objPlace) => el("tr", { style: { cursor: "default" } }, [
                        el("td", { class: "left", "data-notr": true, text: objPlace.strName }),
                        el("td", { class: "bar" }, el("i", { style: { width: `${(objPlace.intChests / intTop) * 100}%` } })),
                        el("td", { text: objPlace.intChests }),
                        el("td", { class: "share", text: fmtPercent(objPlace.intChests / Math.max(1, intPlaced)) })
                    ])))))
                    : el("p", { class: "hint", text: "Todavía no hay cofres situados en estas partidas." }),
                intNowhere ? el("p", { class: "hint", text: `${plural(intNowhere, "cofre lejos de cualquier sitio con nombre", "cofres lejos de cualquier sitio con nombre")}: barcos, islotes y lo que hay entre zonas.` }) : null,
                intChestsTotal > intPlaced ? el("p", { class: "hint", text: `${plural(intChestsTotal - intPlaced, "cofre no está en el mapa", "cofres no están en el mapa")}: son de partidas leídas antes de que el programa guardara la posición.` }) : null
            ])
        ])
    );

    drawHeat(elHeat, arrPoints, INT_MAP_PIXELS);
};

// ---------------------------------------------------------------------------
// Live tab: the match being played, read from the replay while Fortnite records it
// ---------------------------------------------------------------------------

const elLive = document.getElementById("elLive");
const elMap = document.getElementById("elMap");
const elSquad = document.getElementById("elSquad");
// Fallback for when there are not enough saved matches to work the best minute out: the first
// ten minutes used to be the rule of thumb. getBestMinute() replaces it once there is data.
const INT_RUSH_SECONDS = 600;

// Seconds the summary of the last match stays after the next one starts (loading screen, bus)
const INT_HOLD_SECONDS = 60;

// What the program is doing while the squad's figures are missing. A spinner says that something
// is happening; it does not say whether anything is being tried, which is exactly what somebody
// watching an empty card for two minutes wants to know. The waiting is mostly the cloud's, and
// the only honest thing to show is how often this end has looked and how often it will look again.
const sharingNote = () => {
    const objSharing = objApp.objState?.sharing;
    if (!objSharing) return null;
    const intEvery = Math.round(objSharing.everySec ?? 8);
    if (!objSharing.waitingSinceUtc || objSharing.waitReads < 2) {
        return el("p", { class: "quiet", text: `Acabo de mirar; vuelvo a hacerlo cada ${intEvery} s.` });
    }
    const dblWaited = Math.max(0, (Date.now() - new Date(objSharing.waitingSinceUtc).getTime()) / 1000);
    return el("p", { class: "quiet", text: `Lo he mirado ${objSharing.waitReads} veces en ${fmtClock(dblWaited)}, una cada ${intEvery} s.` });
};

// How the squad finished, once the match is over and everybody has published. While a match is
// running nobody has published anything yet, so this only appears afterwards; and until the last
// card syncs it says who is missing rather than crowning somebody on half the figures.
const squadScoreCard = (objMatch, bLive, strSize = "half") => {
    // Their cards come through the cloud, which takes as long as it takes: often longer than the
    // few seconds between leaving one match and dropping into the next. Waiting for them with
    // the card on screen only to have it vanish when the next match starts is the worst of both,
    // so during a live match the comparison of the one just finished stays up until it is stale.
    let bPrevious = false;
    if (bLive) {
        const objDone = getNumberedMatches().at(-1);
        if (!objDone || objDone.file === objMatch.file) return null;
        const dblMinutes = (Date.now() - new Date(objDone.startedAt).getTime() - objDone.durationSec * 1000) / 60000;
        if (dblMinutes > 15) return null;
        objMatch = objDone;
        bPrevious = true;
    }

    if (!objMatch.squad?.length) return null;

    const arrMates = objMatch.squad.filter((objMate) => !objMate.isYou);
    if (!arrMates.length) return null;

    // Nothing shared yet. If you are in a squad their cards are on the way, and the cloud takes
    // its time: an empty space where the comparison will be looks like it is never coming, so
    // the card goes up straight away saying it is waiting.
    if (!arrMates.some((objMate) => objMate.sharedChests != null)) {
        if (!objApp.objState?.inSquad) return null;      // not in a squad: nothing to wait for
        return el("div", { class: `l-card ${strSize} l-squad` }, [
            el("h2", { text: bPrevious ? "Cofres del squad en la partida anterior" : "Cofres del squad en esta partida" }),
            el("div", { class: "waiting" }, [
                el("b", {}, [el("span", { class: "spin" }), "Leyendo lo que ha publicado tu squad…"]),
                el("p", { class: "quiet", text: "Sus cifras vienen de vuestra carpeta compartida, y la nube tarda un poco en traerlas. Aparecen aquí solas." }),
                sharingNote()
            ])
        ]);
    }

    const arrRows = [
        { strName: objMatch.ownerName ?? "Tú", intChests: objMatch.chestsTotal, bYou: true, bGuess: false },
        ...arrMates.map((objMate) => ({
            strName: objMate.name ?? objMate.id.slice(0, 8),
            // What they shared, or failing that what your own replay saw them open nearby
            intChests: objMate.sharedChests ?? objMate.nearbyChests ?? 0,
            bYou: false,
            bGuess: objMate.sharedChests == null,
            // Never seen opening anything near you: no figure at all, rather than a hollow "≥0"
            bNone: objMate.sharedChests == null && !objMate.nearbyChests,
            // They share with you, so their figure is on its way: not the same as there being none
            bPending: !!objMate.pending
        }))
    ].sort((objLeft, objRight) => objRight.intChests - objLeft.intChests);

    const intTop = arrRows[0].intChests;
    const intTotal = arrRows.reduce((intSum, objRow) => intSum + objRow.intChests, 0);
    const arrGuessed = arrRows.filter((objRow) => objRow.bGuess && !objRow.bNone);

    // The live tab redraws often; the crown should land once and then just sit there
    const strKey = objMatch.sessionId ?? objMatch.file;
    const bFirstTime = objApp.strCrownShown !== strKey;
    if (bFirstTime) objApp.strCrownShown = strKey;

    return el("div", { class: `l-card ${strSize} l-squad` }, [
        el("h2", { text: bPrevious ? "Cofres del squad en la partida anterior" : "Cofres del squad en esta partida" }),
        el("div", { class: "l-score" }, arrRows.map((objRow) => {
            // An estimate can never win: it is a floor, and crowning it would be made up
            const bWinner = objRow.intChests === intTop && arrRows.length > 1 && !objRow.bGuess;
            return el("div", { class: `l-row${objRow.bYou ? " you" : ""}${bWinner ? " winner" : ""}${objRow.bGuess ? " guess" : ""}` }, [
                // The crown sits in a slot of its own, kept in every row whether or not it holds
                // anything. Hung on the end it stole width from the winner's bar, so the row with
                // the most chests drew the shortest bar of the four.
                el("span", { class: "crownslot" }, bWinner ? el("span", { class: `crown${bFirstTime ? " pop" : ""}`, title: "Más cofres de la partida", text: "♛" }) : null),
                // Name and tag share one cell of fixed width. Loose in the row they pushed the
                // bar along by however wide they happened to be, so no two bars started or ended
                // in the same place and the lengths could not be compared by eye.
                el("span", { class: "whocell" }, [
                    el("span", { class: `who${bWinner ? " champ" : ""}`, "data-notr": true, text: objRow.strName }),
                    objRow.bYou ? el("span", { class: "tag", text: "tú" }) : null,
                    objRow.bGuess && !objRow.bNone ? el("span", { class: "tag", text: "estimado" }) : null,
                    objRow.bNone ? el("span", {
                        class: "tag",
                        title: objRow.bPending
                            ? "Comparte contigo, pero su ficha de esta partida todavía no ha llegado a vuestra carpeta compartida"
                            : "No comparte, y tu repetición no le vio abrir ningún cofre cerca de ti",
                        text: objRow.bPending ? "esperando" : "sin datos"
                    }) : null
                ]),
                el("span", { class: "track" }, el("i", { style: { width: `${intTop && !objRow.bNone ? (objRow.intChests / intTop) * 100 : 0}%` } })),
                objRow.bNone
                    ? el("span", { class: "nodata", "data-notr": true, text: "—" })
                    : el("b", { class: "figure", "data-notr": true, text: `${objRow.bGuess ? "≥" : ""}${objRow.intChests}` })
            ]);
        })),
        el("p", { class: "hint", text: arrGuessed.length
            ? `${intTotal} cofres entre los ${arrRows.length}. Los marcados «estimado» no están en tu escuadrón: es solo lo que tu repetición les vio abrir cerca de ti, así que abrieron eso o más.`
            : `${intTotal} cofres entre los ${arrRows.length}. Los de tus compañeros vienen de vuestra carpeta compartida.` })
    ]);
};

// A Treasure Hour running right now, as a badge for the live tab: it is the one moment where
// opening a chest is worth several, and it ends on a clock, so it belongs next to the timer.
const treasureHourPill = () => {
    const dblNow = Date.now();
    const objWindow = (objApp.objTreasure?.arrWindows ?? []).find((objItem) =>
        dblNow >= new Date(objItem.strStart).getTime() && dblNow < new Date(objItem.strEnd).getTime());
    if (!objWindow) return null;

    // Each treasure gets its own multiplier, and they differ a lot: the golden outfit can be at
    // ten while the token is at two. "Up to" is what keeps the biggest one from promising the rest.
    const dblBest = Math.max(1, ...Object.values(objWindow.objMultipliers ?? {}).map(Number).filter((dblValue) => dblValue > 0));
    const intLeft = Math.round((new Date(objWindow.strEnd).getTime() - dblNow) / 60000);
    return el("span", { class: "l-pill treasure", title: "Los cofres valen más ahora mismo" }, [
        el("i"),
        `HORA DEL TESORO · HASTA ×${fmtNumber(dblBest)} · ${intLeft} min`
    ]);
};

// What the live tab shows. The game's log (when it can be read) says when the match ends for you
// and whether you are already searching for the next one; the replay files say what happened.
const getLiveContext = () => {
    const objState = objApp.objState;
    const objGame = objState.game ?? {};
    const objLive = objState.live;
    const objLast = getNumberedMatches().at(-1) ?? null;
    const toMs = (strUtc) => strUtc ? new Date(strUtc).getTime() : null;
    const dblRecording = toMs(objGame.recordingSinceUtc);
    const dblFinished = toMs(objGame.matchFinishedUtc);
    const dblSearching = toMs(objGame.searchingSinceUtc);
    const bFinishedNow = !!objGame.logFound && dblFinished != null && (dblRecording == null || dblFinished >= dblRecording);
    const bSearching = dblSearching != null && (dblFinished == null || dblSearching >= dblFinished);
    const strFinishedPill = bSearching ? "FINALIZADA · BUSCANDO PARTIDA" : "PARTIDA FINALIZADA";

    if (objLive && !bFinishedNow) {
        // A new match has started: the previous summary stays a little longer
        const dblSinceStart = (Date.now() - new Date(objLive.match.startedAt).getTime()) / 1000;
        if (objLast && objLast.file !== objLive.match.file && dblSinceStart >= 0 && dblSinceStart < INT_HOLD_SECONDS) {
            return { strStage: "hold", objMatch: objLast, bLive: false, bLocked: false, strPill: "PARTIDA FINALIZADA", strPillClass: "done", dblHoldEnds: new Date(objLive.match.startedAt).getTime() + INT_HOLD_SECONDS * 1000 };
        }
        return { strStage: "live", objMatch: objLive.match, bLive: true, bLocked: objLive.locked, dblReadAt: toMs(objLive.writtenUtc), strPill: "EN CURSO", strPillClass: "on" };
    }
    if (objLive && bFinishedNow) {
        // Over for you, but the game keeps the replay open (spectating, or "play again"):
        // the counts arrive when it closes it
        return {
            strStage: "ending", objMatch: objLive.match, bLive: false, bLocked: objLive.locked, bEnding: true,
            dblFixedSeconds: Math.max(0, (dblFinished - new Date(objLive.match.startedAt).getTime()) / 1000),
            strPill: strFinishedPill, strPillClass: bSearching ? "search" : "done"
        };
    }
    if (!objLast) return null;
    return { strStage: "finished", objMatch: objLast, bLive: false, bLocked: false, strPill: objGame.logFound ? strFinishedPill : "FINALIZADA", strPillClass: bSearching ? "search" : "done" };
};

// Seconds into the match right now. The replay is stamped with the PC clock when recording
// starts, so the clock needs nothing but that stamp; the last write is the fallback.
const getLiveSeconds = (objContext) => {
    if (objContext.dblFixedSeconds != null) return objContext.dblFixedSeconds;
    if (!objContext.bLive) return objContext.objMatch.aliveSec;
    const dblSinceStart = (Date.now() - new Date(objContext.objMatch.startedAt).getTime()) / 1000;
    if (dblSinceStart >= 0 && dblSinceStart < 4 * 3600) return dblSinceStart;
    return objContext.objMatch.durationSec + Math.min(45, Math.max(0, (Date.now() - objContext.dblReadAt) / 1000));
};

// What you usually do, from the saved matches: chests per minute of match, and running total
const mean = (arrItems, fnValue) => arrItems.length ? sum(arrItems, fnValue) / arrItems.length : null;

// "up" when a figure beats the reference, "down" when it falls short, nothing when there is no telling
const getTone = (dblValue, dblReference, bLowerIsBetter = false) => {
    if (dblValue == null || dblReference == null || Math.abs(dblValue - dblReference) < 1e-9) return null;
    return (dblValue > dblReference) !== bLowerIsBetter ? "up" : "down";
};
const OBJ_TREND_MARKS = { up: "▲", down: "▼" };

const getHabits = (strExceptFile) => {
    const arrHistory = getNumberedMatches().filter((objMatch) => objMatch.file !== strExceptFile);
    const arrPerMinute = [], arrReached = [];
    for (const objMatch of arrHistory) {
        const intMinutes = Math.ceil(objMatch.aliveSec / 60);
        for (let intMinute = 0; intMinute < intMinutes; intMinute++) arrReached[intMinute] = (arrReached[intMinute] ?? 0) + 1;
        for (const objOpening of objMatch.openings) {
            if (!ARR_CHEST_CATEGORIES.includes(objOpening.category)) continue;
            const intMinute = Math.floor(objOpening.t / 60);
            arrPerMinute[intMinute] = (arrPerMinute[intMinute] ?? 0) + 1;
        }
    }
    const arrAverage = arrReached.map((intMatches, intMinute) => (arrPerMinute[intMinute] ?? 0) / intMatches);
    const rate = (intFrom, intTo) => { const arrSlice = arrAverage.slice(intFrom, intTo); return arrSlice.length ? sum(arrSlice, (dblValue) => dblValue) / arrSlice.length : null; };

    // Minutes lost between leaving one match and the next one starting: menu, queue and lobby.
    // Measured from your own matches, because it is what decides whether restarting pays.
    const arrGaps = [];
    for (let intIndex = 1; intIndex < arrHistory.length; intIndex++) {
        const objBefore = arrHistory[intIndex - 1];
        const dblEnded = new Date(objBefore.startedAt).getTime() + objBefore.durationSec * 1000;
        const dblGap = (new Date(arrHistory[intIndex].startedAt).getTime() - dblEnded) / 60000;
        if (dblGap > 0 && dblGap < 10) arrGaps.push(dblGap);     // longer than that is a break, not a queue
    }
    arrGaps.sort((dblLeft, dblRight) => dblLeft - dblRight);
    const dblOverhead = arrGaps.length ? arrGaps[Math.floor(arrGaps.length / 2)] : 0.5;

    // The best minute to leave, by the marginal value theorem: a match is a patch that runs dry,
    // and the moment to jump to a fresh one is when its yield falls below what the whole cycle
    // averages, restart included. Maximising chests/(minutes + overhead) finds exactly that.
    let intBestMinute = null;
    if (arrHistory.length >= 8) {
        let dblBestRate = 0, dblRunning = 0;
        for (let intMinute = 0; intMinute < arrAverage.length; intMinute++) {
            dblRunning += arrAverage[intMinute];
            const dblRate = dblRunning / (intMinute + 1 + dblOverhead);
            if (dblRate > dblBestRate) { dblBestRate = dblRate; intBestMinute = intMinute + 1; }
        }
    }

    return {
        intMatches: arrHistory.length,
        arrAverage,
        dblOverhead,
        // Null until there are enough matches to mean anything; callers fall back to ten minutes
        intBestMinute,
        // Average running total at a given second, counting only matches that lasted that long
        totalAt: (dblSeconds) => { let dblTotal = 0; for (let intMinute = 0; intMinute < arrAverage.length && intMinute * 60 < dblSeconds; intMinute++) dblTotal += arrAverage[intMinute] * Math.min(1, (dblSeconds - intMinute * 60) / 60); return dblTotal; },
        bestAt: (dblSeconds) => Math.max(0, ...arrHistory.map((objMatch) => objMatch.openings.filter((objOpening) => ARR_CHEST_CATEGORIES.includes(objOpening.category) && objOpening.t <= dblSeconds).length)),
        dblRushRate: rate(0, 10),
        dblLateRate: rate(10, arrAverage.length),
        dblMeanTotal: mean(arrHistory, (objMatch) => objMatch.chestsTotal),
        dblMeanPace: mean(arrHistory, (objMatch) => objMatch.chestsPerMin),
        dblMeanKills: mean(arrHistory, (objMatch) => objMatch.kills),
        dblMeanPosition: mean(arrHistory.filter((objMatch) => objMatch.position), (objMatch) => objMatch.position),
        dblMeanFirstChest: mean(arrHistory.filter((objMatch) => objMatch.firstChestSec != null), (objMatch) => objMatch.firstChestSec),
        intRecord: arrHistory.length ? Math.max(...arrHistory.map((objMatch) => objMatch.chestsTotal)) : 0
    };
};

// Chests per minute of this match as bars, with your usual figure for that minute as a tick
const drawLivePace = (elHost, objMatch, objHabits, dblNow, bLive = false, bLocked = false) => {
    const intWidth = Math.max(elHost.clientWidth, 300), intHeight = 190;
    const objPad = { intTop: 16, intRight: 8, intBottom: 26, intLeft: 26 };
    const arrMine = [];
    for (const objOpening of objMatch.openings) if (ARR_CHEST_CATEGORIES.includes(objOpening.category)) { const intMinute = Math.floor(objOpening.t / 60); arrMine[intMinute] = (arrMine[intMinute] ?? 0) + 1; }
    const intMinutes = Math.max(15, Math.ceil(dblNow / 60), arrMine.length);
    const dblMax = niceMax(Math.max(1, ...arrMine.filter(Boolean), ...objHabits.arrAverage.slice(0, intMinutes)));
    const dblBand = (intWidth - objPad.intLeft - objPad.intRight) / intMinutes;
    const dblPlot = intHeight - objPad.intTop - objPad.intBottom;
    const toY = (dblValue) => objPad.intTop + dblPlot - (dblValue / dblMax) * dblPlot;
    const elSvg = svg("svg", { width: intWidth, height: intHeight, viewBox: `0 0 ${intWidth} ${intHeight}`, role: "img", "aria-label": "Cofres por minuto de esta partida frente a tu media" });

    for (let intTick = 0; intTick <= 4; intTick++) {
        const dblY = toY((dblMax / 4) * intTick);
        elSvg.append(svg("line", { class: "grid", x1: objPad.intLeft, x2: intWidth - objPad.intRight, y1: dblY, y2: dblY }), svg("text", { x: objPad.intLeft - 6, y: dblY + 4, "text-anchor": "end", text: fmtNumber((dblMax / 4) * intTick) }));
    }
    // Where the rush ends
    // The line marks the minute your own figures say is the best to leave, not a fixed ten
    const intLeaveMinute = objHabits.intBestMinute ?? INT_RUSH_SECONDS / 60;
    const dblRushX = objPad.intLeft + dblBand * intLeaveMinute;
    elSvg.append(svg("line", { x1: dblRushX, x2: dblRushX, y1: objPad.intTop - 4, y2: intHeight - objPad.intBottom, stroke: "var(--ink-3)", "stroke-dasharray": "4 4" }), svg("text", { x: dblRushX + 5, y: objPad.intTop + 4, text: `minuto ${intLeaveMinute}` }));

    for (let intMinute = 0; intMinute < intMinutes; intMinute++) {
        const dblCenter = objPad.intLeft + dblBand * (intMinute + 0.5);
        const dblWidth = Math.max(4, Math.min(24, dblBand - 6));
        const intMine = arrMine[intMinute] ?? 0;
        const dblUsual = objHabits.arrAverage[intMinute];
        const elGroup = svg("g", { class: "bar" });
        if (intMine > 0) {
            const dblTop = toY(intMine), dblBottom = toY(0), dblRadius = Math.min(4, dblBottom - dblTop, dblWidth / 2), dblX = dblCenter - dblWidth / 2;
            elGroup.append(svg("path", { class: "seg", fill: dblUsual != null && intMine >= dblUsual ? "var(--good)" : "var(--chest)", d: `M${dblX},${dblBottom} V${dblTop + dblRadius} Q${dblX},${dblTop} ${dblX + dblRadius},${dblTop} H${dblX + dblWidth - dblRadius} Q${dblX + dblWidth},${dblTop} ${dblX + dblWidth},${dblTop + dblRadius} V${dblBottom} Z` }));
        }
        if (dblUsual != null && bLocked && dblUsual > 0) {
            const dblTop = toY(dblUsual), dblBottom = toY(0), dblRadius = Math.min(4, dblBottom - dblTop, dblWidth / 2), dblX = dblCenter - dblWidth / 2;
            elGroup.append(svg("path", { class: "seg", fill: "var(--chest)", opacity: intMinute < Math.floor(dblNow / 60) ? 0.45 : 1, d: `M${dblX},${dblBottom} V${dblTop + dblRadius} Q${dblX},${dblTop} ${dblX + dblRadius},${dblTop} H${dblX + dblWidth - dblRadius} Q${dblX + dblWidth},${dblTop} ${dblX + dblWidth},${dblTop + dblRadius} V${dblBottom} Z` }));
        } else if (dblUsual != null && !bLocked) {
            elGroup.append(svg("rect", { x: dblCenter - dblWidth / 2 - 2, y: toY(dblUsual) - 1, width: dblWidth + 4, height: 2, fill: "var(--ink)" }));
        }
        if (intMinute % Math.max(1, Math.ceil(30 / dblBand)) === 0) elGroup.append(svg("text", { x: dblCenter, y: intHeight - objPad.intBottom + 16, "text-anchor": "middle", text: `${intMinute}'` }));
        elGroup.append(svg("rect", { x: dblCenter - dblBand / 2, y: objPad.intTop, width: dblBand, height: dblPlot + objPad.intBottom, fill: "transparent" }));
        elGroup.addEventListener("pointermove", (objEvent) => bLocked
            ? showTip(objEvent, dblUsual != null ? `${fmtNumber(dblUsual)} cofres de media` : "Sin datos", [`Minuto ${intMinute}, en tus partidas guardadas`])
            : showTip(objEvent, `${intMine} ${intMine === 1 ? "cofre" : "cofres"}`, [`Minuto ${intMinute} de esta partida`, dblUsual != null ? `Tu media en ese minuto: ${fmtNumber(dblUsual)}` : null]));
        elGroup.addEventListener("pointerleave", hideTip);
        elSvg.append(elGroup);
    }
    if (bLive) {
        const dblNowX = objPad.intLeft + dblBand * Math.min(intMinutes, dblNow / 60);
        elSvg.append(svg("line", { id: "elPaceNow", "data-left": objPad.intLeft, "data-band": dblBand, "data-max": intMinutes, x1: dblNowX, x2: dblNowX, y1: objPad.intTop - 4, y2: intHeight - objPad.intBottom, stroke: "var(--gold)", "stroke-width": 2 }));
    }
    elHost.append(elSvg, el("div", { class: "legend" }, [
        bLocked ? null : el("span", {}, [el("i", { style: { background: "var(--good)" } }), "Minuto por encima de tu media"]),
        bLocked ? null : el("span", {}, [el("i", { style: { background: "var(--chest)" } }), "Minuto por debajo"]),
        bLive ? el("span", {}, [el("i", { style: { background: "var(--gold)", height: "12px", width: "2px", borderRadius: "0" } }), "Ahora"]) : null,
        bLocked ? el("span", {}, [el("i", { style: { background: "var(--chest)" } }), "Tu media en ese minuto"])
            : el("span", {}, [el("i", { style: { background: "var(--ink)", height: "2px", width: "16px", borderRadius: "0" } }), "Tu media en ese minuto"])
    ]));
};

const getStageKey = (objContext) => objContext ? `${objContext.strStage}|${objContext.objMatch.file}|${objContext.strPill}|${objContext.bLocked}` : "none";

const renderLive = () => {
    if (!objApp.objState) return;
    hideTip();
    const objContext = getLiveContext();
    objApp.strLiveStage = getStageKey(objContext);
    if (!objContext) {
        elLive.replaceChildren(el("div", { class: "empty l-card full" }, [el("strong", { text: "Esperando la primera partida" }), el("p", { text: "En cuanto empieces una, aparecerá aquí sola. Fortnite escribe la repetición cada 20 segundos, así que los datos llegan con ese pequeño retraso." })]));
        return;
    }

    const { objMatch, bLive } = objContext;
    const objHabits = getHabits(objMatch.file);
    const dblNow = getLiveSeconds(objContext);
    const intChests = objMatch.chestsTotal;
    const intKills = bLive ? objMatch.killEvents.filter((objKill) => !objKill.isKnock).length : objMatch.kills;
    const intKnocks = objMatch.killEvents.filter((objKill) => objKill.isKnock).length;
    const dblUsualNow = objHabits.intMatches ? objHabits.totalAt(dblNow) : null;
    const dblAhead = dblUsualNow != null ? intChests - dblUsualNow : null;
    const dblPace = dblNow > 30 ? intChests / (dblNow / 60) : 0;

    // Flash the counter only when it actually went up since the last look
    const bBump = objApp.objLiveSeen.strFile === objMatch.file && intChests > objApp.objLiveSeen.intChests;
    objApp.objLiveSeen = { strFile: objMatch.file, intChests };

    // Odds that this match alone has rolled one of the treasures
    // Odds that this match gave a treasure still missing in its week, chest by chest (Treasure Hours included)
    const arrMissing = objApp.objTreasure ? getMissingRewards(getWeekAt(new Date(objMatch.startedAt))) : [];
    const dblMatchStart = new Date(objMatch.startedAt).getTime();
    let dblNoNewTreasure = 1;
    for (const objOpening of objMatch.openings) {
        if (!ARR_CHEST_CATEGORIES.includes(objOpening.category)) continue;
        for (const objReward of arrMissing) dblNoNewTreasure *= 1 - chanceAt(objReward, dblMatchStart + objOpening.t * 1000);
    }
    const strMissingNote = arrMissing.length ? `Sobre ${arrMissing.length === 1 ? "el tesoro que te falta" : `los ${arrMissing.length} tesoros que te faltan`}; los Gizmos no cuentan` : "No te falta ningún tesoro esta semana";

    const strRecord = !objHabits.intMatches ? "Aún no hay récord que batir"
        : intChests > objHabits.intRecord ? `Récord nuevo: el anterior era ${objHabits.intRecord}`
        : intChests === objHabits.intRecord ? "Has igualado tu récord"
        : `Te faltan ${objHabits.intRecord - intChests} para igualarlo`;

    const tile = (strValue, strLabel, strSub = null, strTone = null) => el("div", { class: `l-card${strTone ? ` ${strTone}` : ""}` }, [
        el("div", { class: "value figure", text: strValue }),
        el("div", { class: "label", text: strLabel }),
        strSub ? el("div", { class: "sub" }, [OBJ_TREND_MARKS[strTone] ? el("span", { class: "trend", text: OBJ_TREND_MARKS[strTone] }) : null, strSub]) : null
    ]);
    // The minute your own figures say is the best to leave, worked out by the marginal value
    // theorem. Ten minutes was a rule of thumb; this is the real answer for how you play.
    const intBestMinute = objHabits.intBestMinute;
    const dblLeaveSeconds = (intBestMinute ?? INT_RUSH_SECONDS / 60) * 60;
    const bInRush = bLive && dblNow < dblLeaveSeconds;

    // Rush hour: the message changes at the best minute, with your own numbers
    let elRush;
    if (bLive && dblNow < dblLeaveSeconds) {
        elRush = el("div", { class: "l-card full l-rush rush" }, [
            el("span", {}, ["Hora punta: quedan ", el("b", { id: "elRushLeft", class: "figure", text: fmtClock(dblLeaveSeconds - dblNow) }), ` hasta el minuto ${Math.round(dblLeaveSeconds / 60)}. ${objHabits.dblRushRate != null && objHabits.dblLateRate != null ? `Ahora sueles abrir ${fmtNumber(objHabits.dblRushRate)} cofres por minuto; después, ${fmtNumber(objHabits.dblLateRate)}.` : "Es cuando más cofres caen."}`]),
            el("div", { class: "bar" }, el("i", { id: "elRushBar", style: { width: `${(dblNow / dblLeaveSeconds) * 100}%` } }))
        ]);
    } else if (bLive) {
        elRush = el("div", { class: "l-card full l-rush" }, el("span", { text: `Minuto ${Math.round(dblLeaveSeconds / 60)} superado: a partir de aquí rinde más una partida nueva. ${objHabits.dblRushRate != null && objHabits.dblLateRate != null ? `Tu media baja de ${fmtNumber(objHabits.dblRushRate)} a ${fmtNumber(objHabits.dblLateRate)} cofres por minuto.` : "Cada cofre cuesta más."}` }));
    } else if (objContext.bEnding) {
        elRush = el("div", { class: "l-card full l-rush rush" }, el("span", { text: `Partida terminada a los ${fmtClock(dblNow)}. El recuento aparece en cuanto Fortnite cierre la repetición.` }));
    } else {
        const strFinalTone = getTone(intChests, objHabits.dblMeanTotal);
        elRush = el("div", { class: `l-card full l-rush${strFinalTone ? ` ${strFinalTone}` : ""}` }, el("span", {}, [
            objMatch.position ? `Partida terminada con ${intChests} ${intChests === 1 ? "cofre" : "cofres"}, puesto ${fmtPosition(objMatch.position)}.` : `Partida terminada con ${intChests} ${intChests === 1 ? "cofre" : "cofres"}.`,
            objHabits.dblMeanTotal != null ? ` ${intChests >= objHabits.dblMeanTotal ? "Por encima" : "Por debajo"} de tu media de ${fmtNumber(objHabits.dblMeanTotal)}.` : null,
            " Los datos se quedan aquí hasta que empiece la siguiente."
        ]));
    }

    if (objContext.bLocked) {
        const intBest = objHabits.bestAt(dblNow);
        const dblUsualMinute = objHabits.arrAverage[Math.floor(dblNow / 60)];
        const objLast = getNumberedMatches().at(-1);
        const elUsualPace = el("div");
        elLive.replaceChildren(
            el("div", { class: "l-top" }, [
                el("span", { class: `l-pill ${objContext.strPillClass}` }, [el("i"), objContext.strPill]),
                treasureHourPill(),
                el("div", { class: "l-meta" }, [el("b", { text: `Partida de las ${new Date(objMatch.startedAt).toLocaleTimeString(STR_LOCALE, { hour: "2-digit", minute: "2-digit" })}` }), objContext.bEnding ? "Recuento en camino" : "El recuento sale al terminar"]),
                el("span", { class: "grow" }),
                el("div", { class: `l-timer figure${bInRush ? " rush" : ""}` }, [el("span", { id: "elLiveTimer", text: fmtClock(dblNow) }), el("small", { text: objContext.bEnding ? "duración de tu partida" : "minuto de partida" })])
            ]),
            el("div", { class: "l-grid" }, [
                objContext.bEnding ? el("div", { class: "l-card hero" }, [
                    el("div", { class: "value figure", text: "…" }),
                    el("div", { class: "label", text: "cofres: llegan en cuanto Fortnite cierre la repetición" }),
                    el("div", { class: "sub", text: "Al volver a la sala, o al empezar la siguiente partida si has pulsado «Volver a jugar»" })
                ]) : el("div", { class: "l-card hero" }, [
                    el("div", { class: "value figure", id: "elLiveTarget", text: objHabits.intMatches ? objNumberFormat1.format(dblUsualNow) : "–" }),
                    el("div", { class: "label", text: "cofres que sueles llevar a estas alturas" }),
                    el("div", { class: "sub", id: "elLiveBest", text: objHabits.intMatches ? `Tu mejor partida llevaba ${intBest}` : "Cuando haya partidas guardadas, aquí verás tu ritmo habitual" })
                ]),
                tile(dblUsualMinute != null ? fmtNumber(dblUsualMinute) : "–", "cofres que sueles abrir en este minuto", null),
                tile(objHabits.intMatches ? String(objHabits.intRecord) : "–", "tu récord de cofres", "El número a batir", objHabits.intMatches ? "gold" : null),
                tile(objLast ? String(objLast.chestsTotal) : "–", "cofres en tu última partida", objLast?.position ? `Puesto ${fmtPosition(objLast.position)}` : null),
                tile(String(objHabits.intMatches), objHabits.intMatches === 1 ? "partida guardada" : "partidas guardadas", "De ahí salen las medias"),
                tile(objHabits.intMatches ? fmtNumber(objHabits.totalAt(dblLeaveSeconds)) : "–", `cofres que sueles llevar en el minuto ${Math.round(dblLeaveSeconds / 60)}`, null),
                tile(objHabits.intMatches ? String(objHabits.bestAt(dblLeaveSeconds)) : "–", "tu mejor hora punta", `Cofres antes del minuto ${Math.round(dblLeaveSeconds / 60)}`),
                tile(objHabits.intMatches ? fmtNumber(objHabits.dblMeanTotal) : "–", "cofres de media por partida", null),
                tile(arrMissing.length ? fmtPercent(1 - arrMissing.reduce((dblNone, objReward) => dblNone * (1 - chanceAt(objReward, Date.now())), 1)) : "–", "de tesoro nuevo en cada cofre", strMissingNote),
                elRush,
                el("div", { class: "l-card wide" }, [el("h2", { text: "Tu ritmo habitual, minuto a minuto" }), elUsualPace]),
                objContext.bEnding ? el("div", { class: "l-card side" }, [
                    el("h2", { text: "Partida terminada" }),
                    el("p", { class: "hint", text: "Fortnite sigue grabando mientras miras a tu squad o esperas la siguiente partida, y no escribe la clave de la repetición hasta cerrarla." }),
                    el("p", { class: "hint", text: "Cuando la cierre, el resumen aparecerá aquí y se quedará hasta 60 segundos después de que empiece la siguiente partida." })
                // Explaining why there is no live count belonged here when there was nothing
                // better to put in its place. How the squad did in the match just played is
                // better, every time, so that is what this slot is for now.
                ]) : squadScoreCard(objMatch, true, "side")
            ])
        );
        drawLivePace(elUsualPace, { openings: [] }, objHabits, dblNow, true, true);
        return;
    }

    const elPace = el("div");

    elLive.replaceChildren(...[
        el("div", { class: "l-top" }, [
            el("span", { class: `l-pill ${objContext.strPillClass}` }, [el("i"), objContext.strPill]),
            el("div", { class: "l-meta" }, [el("b", { text: `Partida de las ${new Date(objMatch.startedAt).toLocaleTimeString(STR_LOCALE, { hour: "2-digit", minute: "2-digit" })}` }), `${objMatch.modeLabel}${objMatch.ownerName ? `, ${objMatch.ownerName}` : ""}`]),
            el("span", { class: "grow" }),
            el("div", { class: `l-timer figure${bInRush ? " rush" : ""}` }, [el("span", { id: "elLiveTimer", text: fmtClock(dblNow) }), el("small", { text: bLive ? "minuto de partida" : "duración de tu partida" })])
        ]),
        objContext.dblHoldEnds ? el("div", { class: "l-hold" }, [
            "Ha empezado otra partida. Este resumen se queda",
            el("b", { id: "elHoldLeft", class: "figure", text: fmtClock(Math.max(0, (objContext.dblHoldEnds - Date.now()) / 1000)) }),
            el("div", { class: "bar" }, el("i", { id: "elHoldBar", style: { width: `${Math.max(0, (objContext.dblHoldEnds - Date.now()) / (INT_HOLD_SECONDS * 10))}%` } }))
        ]) : null,
        el("div", { class: "l-grid" }, [
            el("div", { class: "l-card hero" }, [
                el("div", { class: `value figure${bBump ? " bump" : ""}`, text: intChests }),
                el("div", { class: "label", text: intChests === 1 ? "cofre abierto" : "cofres abiertos" }),
                el("div", { class: "sub", text: `${objMatch.counts.cofre} normales, ${objMatch.counts.especial} especiales, ${objMatch.counts.espiritu} de espíritu` })
            ]),
            tile(dblAhead == null ? "–" : `${dblAhead >= 0 ? "+" : "−"}${fmtNumber(Math.abs(dblAhead))}`, "frente a tu media a estas alturas", dblUsualNow != null ? `Sueles llevar ${fmtNumber(dblUsualNow)}` : "Hace falta alguna partida guardada", getTone(intChests, dblUsualNow)),
            tile(objNumberFormat2.format(dblPace), "cofres por minuto", objHabits.dblMeanPace != null ? `Tu media: ${objNumberFormat2.format(objHabits.dblMeanPace)}` : null, getTone(dblPace, objHabits.dblMeanPace)),
            tile(String(intKills), intKills === 1 ? "eliminación" : "eliminaciones", `${intKnocks} ${intKnocks === 1 ? "derribo" : "derribos"}${objHabits.dblMeanKills != null ? `; tu media, ${fmtNumber(objHabits.dblMeanKills)}` : ""}`, bLive && intKills < (objHabits.dblMeanKills ?? 0) ? null : getTone(intKills, objHabits.dblMeanKills)),
            tile(objHabits.intMatches ? String(objHabits.intRecord) : "–", "tu récord de cofres", strRecord, objHabits.intMatches && intChests >= objHabits.intRecord ? "gold" : null),
            tile(arrMissing.length ? fmtPercent(1 - dblNoNewTreasure) : "–", "de que esta partida te haya dado un tesoro nuevo", strMissingNote),
            tile(String(objMatch.counts.municion + objMatch.counts.otros), "munición y otros", null),
            tile(bLive ? "–" : fmtPosition(objMatch.position), "puesto", bLive ? "Se sabe al terminar" : `${objMatch.totalPlayers ? `de ${objMatch.totalPlayers}` : ""}${objHabits.dblMeanPosition != null ? `${objMatch.totalPlayers ? "; " : ""}tu media, ${fmtNumber(objHabits.dblMeanPosition)}` : ""}` || null, bLive ? null : (objMatch.position === 1 ? "gold" : getTone(objMatch.position, objHabits.dblMeanPosition, true))),
            tile(objMatch.firstChestSec != null ? fmtClock(objMatch.firstChestSec) : "–", "primer cofre", objMatch.firstChestSec != null ? (objHabits.dblMeanFirstChest != null ? `Tu media: ${fmtClock(objHabits.dblMeanFirstChest)}` : "Minuto en que cayó") : "Todavía ninguno", getTone(objMatch.firstChestSec, objHabits.dblMeanFirstChest, true)),
            elRush,
            squadScoreCard(objMatch, bLive),
            el("div", { class: "l-card half" }, [el("h2", { text: "Cofres minuto a minuto" }), elPace])
        ].filter(Boolean)),
        el("p", { class: "t-note", text: bLive ? "Fortnite escribe la repetición cada 20 segundos: lo que ves llega con ese retraso. El puesto y las estadísticas oficiales se cierran al terminar la partida." : null })
    ].filter(Boolean));

    drawLivePace(elPace, objMatch, objHabits, dblNow, bLive);
};

// The clock, the countdowns and the rush bar move every second without redrawing the tab
setInterval(() => {
    if (objApp.strTab !== "vivo" || !objApp.objState) return;
    const objContext = getLiveContext();
    if (getStageKey(objContext) !== objApp.strLiveStage) { renderLive(); return; }
    if (!objContext) return;
    const setText = (strId, strText) => { const elTarget = document.getElementById(strId); if (elTarget) elTarget.textContent = strText; };
    if (objContext.dblHoldEnds) {
        const dblLeft = Math.max(0, (objContext.dblHoldEnds - Date.now()) / 1000);
        setText("elHoldLeft", fmtClock(dblLeft));
        const elHoldBar = document.getElementById("elHoldBar");
        if (elHoldBar) elHoldBar.style.width = `${(dblLeft / INT_HOLD_SECONDS) * 100}%`;
        return;
    }
    if (!objContext.bLive) return;
    const dblNow = getLiveSeconds(objContext);
    const dblLeave = (getHabits(objApp.objState?.live?.match?.file).intBestMinute ?? INT_RUSH_SECONDS / 60) * 60;
    if (document.getElementById("elRushBar") && dblNow >= dblLeave) { renderLive(); return; }
    setText("elLiveTimer", fmtClock(dblNow));
    setText("elRushLeft", fmtClock(Math.max(0, dblLeave - dblNow)));
    const elBar = document.getElementById("elRushBar");
    if (elBar) elBar.style.width = `${Math.min(100, (dblNow / dblLeave) * 100)}%`;
    const elNow = document.getElementById("elPaceNow");
    if (elNow) { const dblX = Number(elNow.dataset.left) + Number(elNow.dataset.band) * Math.min(Number(elNow.dataset.max), dblNow / 60); elNow.setAttribute("x1", dblX); elNow.setAttribute("x2", dblX); }
    if (objContext.bLocked && document.getElementById("elLiveTarget")) {
        const objHabits = getHabits(objContext.objMatch.file);
        if (objHabits.intMatches) { setText("elLiveTarget", objNumberFormat1.format(objHabits.totalAt(dblNow))); setText("elLiveBest", `Tu mejor partida llevaba ${objHabits.bestAt(dblNow)}`); }
    }
}, 1000);

// ---------------------------------------------------------------------------
// Layout: order, hidden widgets, sizes, table columns, range
// ---------------------------------------------------------------------------

const INT_LAYOUT_VERSION = 2;

const defaultLayout = () => ({
    // La partida y «¿Vas mejorando?» comparten la primera fila
    arrOrder: (() => {
        const arrIds = ARR_WIDGETS.map((objWidget) => objWidget.strId).filter((strId) => strId !== "progreso");
        arrIds.splice(arrIds.indexOf("partida") + 1, 0, "progreso");
        return arrIds;
    })(),
    objHidden: Object.fromEntries(ARR_WIDGETS.filter((objWidget) => objWidget.bHidden).map((objWidget) => [objWidget.strId, true])),
    objSizes: {},
    objColumns: {},
    objCollapsed: {},
    objTable: {},
    strRange: "todo",
    intVersion: INT_LAYOUT_VERSION
});

// A layout saved before the top row was split in two keeps «¿Vas mejorando?» at the very bottom,
// where it goes unnoticed. This moves it up beside the match once, and leaves it alone after that.
// intSavedVersion is the version of what was on disk: the merged layout always carries the
// current one, because the defaults do, so asking it would say every layout is already upgraded.
const upgradeLayout = (objLayout, intSavedVersion) => {
    if (intSavedVersion >= INT_LAYOUT_VERSION) return;
    objLayout.intVersion = INT_LAYOUT_VERSION;
    const arrOrder = objLayout.arrOrder.filter((strId) => strId !== "progreso");
    const intMatch = arrOrder.indexOf("partida");
    arrOrder.splice(intMatch < 0 ? 0 : intMatch + 1, 0, "progreso");
    objLayout.arrOrder = arrOrder;
    objLayout.objHidden = { ...objLayout.objHidden, progreso: false };
    // Both halves of the row go back to their new default width
    delete objLayout.objSizes.partida;
    delete objLayout.objSizes.progreso;
};

// Saved layouts survive new versions: unknown widgets are dropped, new ones appended
const normalizeLayout = (objSaved) => {
    // A layout with no version written in it was saved before versions existed: that is version 1
    const intSavedVersion = objSaved ? (objSaved.intVersion ?? 1) : INT_LAYOUT_VERSION;
    const objLayout = { ...defaultLayout(), ...(objSaved ?? {}) };
    const arrKnown = (objLayout.arrOrder ?? []).filter((strId) => OBJ_WIDGETS[strId]);
    const arrMissing = ARR_WIDGETS.map((objWidget) => objWidget.strId).filter((strId) => !arrKnown.includes(strId));
    objLayout.arrOrder = [...arrKnown, ...arrMissing];
    objLayout.objHidden = { ...(objLayout.objHidden ?? {}) };
    if (objSaved) arrMissing.forEach((strId) => { if (OBJ_WIDGETS[strId].bHidden) objLayout.objHidden[strId] = true; });
    objLayout.objSizes = { ...(objLayout.objSizes ?? {}) };
    objLayout.objColumns = { ...(objLayout.objColumns ?? {}) };
    objLayout.objCollapsed = { ...(objLayout.objCollapsed ?? {}) };
    objLayout.objTable = { ...(objLayout.objTable ?? {}) };
    if (!ARR_RANGES.some((objRange) => objRange.strId === objLayout.strRange)) objLayout.strRange = "todo";
    upgradeLayout(objLayout, intSavedVersion);
    return objLayout;
};

let intSaveTimer = 0;
const saveLayout = () => {
    try { localStorage.setItem("contador-cofres-layout", JSON.stringify(objApp.objLayout)); } catch (objError) { /* storage unavailable */ }
    clearTimeout(intSaveTimer);
    intSaveTimer = setTimeout(() => api("PUT", "/api/layout", objApp.objLayout).catch(() => {}), 400);
};

const getSize = (objWidget) => objApp.objLayout.objSizes[objWidget.strId] ?? objWidget.intSize;

const moveWidget = (strId, intDelta) => {
    const arrVisible = objApp.objLayout.arrOrder.filter((strOther) => !objApp.objLayout.objHidden[strOther]);
    const intFrom = arrVisible.indexOf(strId);
    const intTo = intFrom + intDelta;
    if (intTo < 0 || intTo >= arrVisible.length) return;
    arrVisible.splice(intTo, 0, arrVisible.splice(intFrom, 1)[0]);
    applyVisibleOrder(arrVisible);
};

const applyVisibleOrder = (arrVisible) => {
    const arrHidden = objApp.objLayout.arrOrder.filter((strId) => objApp.objLayout.objHidden[strId]);
    objApp.objLayout.arrOrder = [...arrVisible, ...arrHidden];
    saveLayout();
    renderBoard();
};

const resizeWidget = (objWidget, intDelta) => {
    const intSize = getSize(objWidget) + intDelta;
    if (intSize < INT_MIN_SIZE || intSize > INT_MAX_SIZE) return;
    objApp.objLayout.objSizes[objWidget.strId] = intSize;
    saveLayout();
    renderBoard();
};

const toggleCollapsed = (strId) => {
    if (objApp.objLayout.objCollapsed[strId]) delete objApp.objLayout.objCollapsed[strId]; else objApp.objLayout.objCollapsed[strId] = true;
    saveLayout();
    renderBoard();
};

const setHidden = (strId, bHidden) => {
    if (bHidden) objApp.objLayout.objHidden[strId] = true; else delete objApp.objLayout.objHidden[strId];
    saveLayout();
    renderBoard();
};

const elBoard = document.getElementById("elBoard");
let strDraggedId = null;

const buildWidget = (objWidget, objContext, intVisibleIndex, intVisibleCount) => {
    const intSize = getSize(objWidget);
    const elBody = el("div", { class: "body" });

    // Panels can be minimised to their title; the small figure tiles cannot
    const bCollapsible = objWidget.strKind !== "kpi";
    const bCollapsed = bCollapsible && !!objApp.objLayout.objCollapsed[objWidget.strId];
    const elCollapse = bCollapsible ? el("button", {
        class: "btn small ghost collapse", text: bCollapsed ? "Desplegar" : "Minimizar", "aria-expanded": String(!bCollapsed),
        "aria-label": `${bCollapsed ? "Desplegar" : "Minimizar"} ${objWidget.strTitle}`, onclick: () => toggleCollapsed(objWidget.strId)
    }) : null;
    const elTitle = el("h2", {}, [objWidget.strSwatch ? el("i", { class: "swatch", style: { display: "inline-block", width: "10px", height: "10px", borderRadius: "2px", marginRight: "7px", background: objWidget.strSwatch } }) : null, objWidget.strTitle]);
    // A widget that names itself in its own content only needs this heading while minimised
    const bOwnHeading = objWidget.bNoHeading && !bCollapsed;

    const elWidget = el("section", {
        class: `widget${bCollapsed ? " collapsed" : ""}`, "data-id": objWidget.strId, "data-kind": objWidget.strKind,
        style: { "--span": intSize }, draggable: objApp.bEditing ? "true" : null
    }, [
        el("div", { class: "edit-bar" }, [
            el("span", { class: "name", text: "Arrastra para mover" }),
            el("button", { text: "←", title: "Mover antes", "aria-label": `Mover ${objWidget.strTitle} antes`, disabled: intVisibleIndex === 0, onclick: () => moveWidget(objWidget.strId, -1) }),
            el("button", { text: "→", title: "Mover después", "aria-label": `Mover ${objWidget.strTitle} después`, disabled: intVisibleIndex === intVisibleCount - 1, onclick: () => moveWidget(objWidget.strId, 1) }),
            el("button", { text: "−", title: "Más estrecho", "aria-label": `Hacer ${objWidget.strTitle} más estrecho`, disabled: intSize <= INT_MIN_SIZE, onclick: () => resizeWidget(objWidget, -1) }),
            el("button", { text: "+", title: "Más ancho", "aria-label": `Hacer ${objWidget.strTitle} más ancho`, disabled: intSize >= INT_MAX_SIZE, onclick: () => resizeWidget(objWidget, 1) }),
            el("button", { class: "wide", text: "Ocultar", onclick: () => setHidden(objWidget.strId, true) })
        ]),
        bOwnHeading ? null : (bCollapsible ? el("div", { class: "head" }, [elTitle, elCollapse]) : elTitle),
        bCollapsed ? null : elBody
    ]);

    elWidget.addEventListener("dragstart", (objEvent) => {
        strDraggedId = objWidget.strId;
        objEvent.dataTransfer.effectAllowed = "move";
        objEvent.dataTransfer.setData("text/plain", objWidget.strId);
        requestAnimationFrame(() => elWidget.classList.add("dragging"));
    });
    elWidget.addEventListener("dragover", (objEvent) => {
        if (!strDraggedId || strDraggedId === objWidget.strId) return;
        objEvent.preventDefault();
        const elDragged = elBoard.querySelector(`[data-id="${strDraggedId}"]`);
        const objRect = elWidget.getBoundingClientRect();
        const bAfter = objEvent.clientX > objRect.left + objRect.width / 2;
        const elReference = bAfter ? elWidget.nextSibling : elWidget;
        if (elReference !== elDragged && elDragged.nextSibling !== elReference) elBoard.insertBefore(elDragged, elReference);
    });
    elWidget.addEventListener("dragend", () => {
        strDraggedId = null;
        applyVisibleOrder([...elBoard.querySelectorAll(".widget")].map((elItem) => elItem.dataset.id));
    });

    return { elWidget, elBody, bCollapsed, elCollapse };
};

const renderEmpty = () => {
    const objStatus = objApp.objState.status;
    const objSettings = objApp.objState.settings;
    const bHasExcluded = objApp.objState.matches.length > 0;
    const elEmpty = el("div", { class: "empty widget", style: { "--span": 12 } });

    if (!objStatus.demosFolderExists) {
        elEmpty.append(
            el("strong", { text: "No encuentro la carpeta de repeticiones" }),
            el("p", {}, ["Busco en ", el("code", { text: objSettings.demosPath }), ". Si Fortnite guarda las repeticiones en otro sitio, cambia la carpeta en Ajustes."])
        );
    } else if (bHasExcluded) {
        elEmpty.append(el("strong", { text: "No hay partidas en este periodo" }), el("p", { text: "Elige «Todas» arriba para ver el historial completo." }));
    } else if (objStatus.liveFile) {
        elEmpty.append(el("strong", { text: "Partida en curso" }), el("p", { text: "Aparecerá aquí en cuanto termine y Fortnite cierre la repetición." }));
    } else {
        elEmpty.append(
            el("strong", { text: "Todavía no hay partidas" }),
            el("p", { text: "Juega una partida con la grabación de repeticiones activada en los ajustes de Fortnite. Al terminar aparecerá aquí sola." })
        );
    }
    return elEmpty;
};

const renderBoard = () => {
    if (!objApp.objState) return;
    hideTip();
    if (objApp.strTab !== "partidas") { renderChrome(); return; }

    const arrMatches = getMatchesInRange();
    const objContext = { arrMatches, objSelected: getSelectedMatch(arrMatches), objTotals: getTotals(arrMatches) };
    const arrVisible = objApp.objLayout.arrOrder.filter((strId) => !objApp.objLayout.objHidden[strId]).map((strId) => OBJ_WIDGETS[strId]);

    // The board is rebuilt from scratch: hold its height and put every scroll back where it was,
    // so a click on a filter or a column never throws the page to the top
    const dblPageScroll = window.scrollY;
    const objInnerScroll = Object.fromEntries([...elBoard.querySelectorAll(".widget")].map((elItem) => [elItem.dataset.id, elItem.querySelector(".scroll-y")?.scrollTop ?? 0]));
    elBoard.style.minHeight = `${elBoard.offsetHeight}px`;
    elBoard.replaceChildren();

    if (arrMatches.length === 0) {
        elBoard.append(renderEmpty());
    } else {
        // Attach first, fill second: charts measure their host to size themselves
        const arrBuilt = arrVisible.map((objWidget, intIndex) => ({ objWidget, ...buildWidget(objWidget, objContext, intIndex, arrVisible.length) }));
        arrBuilt.forEach((objBuilt) => elBoard.append(objBuilt.elWidget));
        arrBuilt.forEach((objBuilt) => {
            if (objBuilt.bCollapsed) return;
            try { objBuilt.objWidget.fnRender(objBuilt.elBody, { ...objContext, elCollapse: objBuilt.elCollapse }); }
            catch (objError) { console.error(objBuilt.objWidget.strId, objError); objBuilt.elBody.append(el("p", { class: "hint", text: "No se pudo dibujar este bloque." })); }
            const elScroller = objBuilt.elBody.querySelector(".scroll-y");
            if (elScroller && objInnerScroll[objBuilt.objWidget.strId]) elScroller.scrollTop = objInnerScroll[objBuilt.objWidget.strId];
        });
    }

    renderChrome();
    elBoard.style.minHeight = "";
    if (Math.abs(window.scrollY - dblPageScroll) > 1) window.scrollTo(0, dblPageScroll);
};

// Header controls, status line and the tray of hidden widgets
const renderChrome = () => {
    // Which version is running, small but on screen: the first thing worth knowing when
    // something behaves oddly, and asking somebody to open Settings to find it is a step too many
    const elVersion = document.getElementById("elVersion");
    if (elVersion) elVersion.textContent = objApp.objState?.update?.currentVersion ? `v${objApp.objState.update.currentVersion}` : "";

    document.body.classList.toggle("editing", objApp.bEditing);
    document.getElementById("elEditToggle").textContent = objApp.bEditing ? "Terminar de editar" : "Editar panel";
    document.getElementById("elEditToggle").classList.toggle("primary", objApp.bEditing);

    document.getElementById("elRange").replaceChildren(...ARR_RANGES.map((objRange) => el("button", {
        text: objRange.strLabel, "aria-pressed": String(objApp.objLayout.strRange === objRange.strId),
        onclick: () => { objApp.objLayout.strRange = objRange.strId; saveLayout(); renderBoard(); }
    })));

    const objStatus = objApp.objState.status;
    const elStatus = document.getElementById("elStatus");
    elStatus.replaceChildren();
    if (!objApp.bConnected) {
        elStatus.append(el("span", { class: "warn" }, [el("i", { class: "dot off" }), objApp.strServerError
            ? `El programa respondió con un error (${objApp.strServerError}). El detalle está en chestcounter.log, en la carpeta de datos.`
            : "Sin conexión con el programa. Comprueba que sigue abierto: su icono está junto al reloj."]));
    } else {
        elStatus.append(el("span", {}, [el("i", { class: `dot${objStatus.demosFolderExists ? "" : " off"}` }), objStatus.demosFolderExists ? `Vigilando ${objApp.objState.settings.demosPath}` : "Carpeta de repeticiones no encontrada"]));
        elStatus.append(el("span", { text: `${objApp.objState.matches.length} ${objApp.objState.matches.length === 1 ? "partida guardada" : "partidas guardadas"}, ${objStatus.replayFilesFound} ${objStatus.replayFilesFound === 1 ? "repetición" : "repeticiones"} en la carpeta` }));
        if (objStatus.pendingCount > 0) elStatus.append(el("span", { class: "live" }, [el("i", { class: "spin-dot" }), `Leyendo repeticiones: ${objStatus.pendingCount === 1 ? "queda 1" : `quedan ${objStatus.pendingCount}`}`]));
        if (objStatus.liveFile) elStatus.append(el("span", { class: "live", text: "Partida en curso: síguela en la pestaña En vivo" }));
        const objGame = objApp.objState.game ?? {};
        const openLogSettings = () => { objApp.objDrawerOpen.registro = true; renderDrawer(); setDrawerOpen(true); elDrawer.querySelector("#elSection-registro")?.scrollIntoView(); };
        elStatus.append(el("span", { title: objGame.logPath ?? "" }, [
            el("i", { class: `dot${objGame.logFound ? "" : " off"}` }),
            el("button", { class: "linkish", text: objGame.logFound ? "Leyendo el registro de Fortnite" : "Registro de Fortnite no encontrado", onclick: openLogSettings })
        ]));
        const intOutdated = objApp.objState.matches.filter((objMatch) => objMatch.outdated).length;
        if (intOutdated && !objStatus.pendingCount) elStatus.append(el("span", { text: `${intOutdated} ${intOutdated === 1 ? "partida conserva" : "partidas conservan"} el recuento antiguo (marcadas con *): su repetición ya no está` }));
        if (objStatus.errors.length) elStatus.append(el("button", {
            class: "btn small ghost warn", style: { padding: "0 6px" },
            text: `${objStatus.errors.length} ${objStatus.errors.length === 1 ? "repetición no se pudo leer" : "repeticiones no se pudieron leer"}. Ver por qué`,
            onclick: () => { try { sessionStorage.removeItem("fcc-failures-hidden"); } catch (objError) { /* storage unavailable */ } objApp.bFailDetails = true; renderFailures(); window.scrollTo({ top: 0, behavior: "smooth" }); }
        }));
    }

    const arrHidden = objApp.objLayout.arrOrder.filter((strId) => objApp.objLayout.objHidden[strId]);
    document.getElementById("elTray").replaceChildren(
        el("span", { class: "label", text: arrHidden.length ? "Bloques ocultos, pulsa para añadirlos:" : "Todos los bloques están a la vista." }),
        ...arrHidden.map((strId) => el("button", { class: "btn small", onclick: () => setHidden(strId, false) }, ["+ ", OBJ_WIDGETS[strId].strTitle])),
        el("span", { class: "grow" }),
        el("button", { class: "btn small ghost", text: "Restablecer el panel", onclick: () => { objApp.objLayout = { ...defaultLayout(), strRange: objApp.objLayout.strRange }; saveLayout(); renderBoard(); } })
    );
};

// What the program is doing: toasts, top bar, progress chip
