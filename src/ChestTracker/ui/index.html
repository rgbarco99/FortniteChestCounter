<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortnite Chest Counter</title>
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'><rect x='2' y='2' width='60' height='60' rx='15' fill='%232e2558'/><rect x='2.5' y='2.5' width='59' height='59' rx='14.5' fill='none' stroke='%23f0b429' stroke-opacity='.55'/><path d='M13 30c0-9 8-15 19-15s19 6 19 15z' fill='%23f0b429'/><rect x='13' y='30' width='38' height='20' rx='3' fill='%23c98500'/><rect x='13' y='30' width='38' height='5' fill='%238a5a00'/><rect x='21' y='15.6' width='4.5' height='34.4' fill='%238a5a00' opacity='.6'/><rect x='38.5' y='15.6' width='4.5' height='34.4' fill='%238a5a00' opacity='.6'/><rect x='28' y='29' width='8' height='10' rx='2' fill='%23fff1c1'/><circle cx='32' cy='33.5' r='1.4' fill='%238a5a00'/></svg>">
<style>
/* ------------------------------------------------------------------ tokens */
:root {
    color-scheme: dark;
    --page: #1e1938;          /* storm violet, the page */
    --card: #272049;          /* widget surface (chart surface) */
    --card-raised: #30285a;
    --line: #3c3370;
    --ink: #f4f0ff;
    --ink-2: #bdb4de;
    --ink-3: #8e84b8;
    --gold: #f0b429;          /* interface accent: focus, primary actions */
    --chest: #c98500;         /* series: cofres */
    --special: #3987e5;       /* series: cofres especiales */
    --spirit: #199e70;        /* series: cofres de espíritu */
    --quiet: #6f6699;         /* de-emphasis marks: ammo and other containers */
    --danger: #e66767;
    --good: #1fa890;          /* better than your own average (always with an arrow or a sign) */
    --radius: 10px;
    --font: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
    background: var(--page);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Figures use the condensed width of the same family */
.figure { font-stretch: 75%; font-weight: 700; letter-spacing: -0.01em; line-height: 1; }

/* ------------------------------------------------------------------ header */
.top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 18px 24px 10px;
}
.top h1 { margin: 0; font-size: 26px; font-stretch: 75%; font-weight: 700; letter-spacing: 0.01em; }
.brand { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.brand svg { width: 42px; height: 42px; flex: none; filter: drop-shadow(0 0 10px rgba(240, 180, 41, 0.28)); }
.brand .brand-game { font-weight: 400; color: var(--ink-2); }
.brand .brand-name { font-weight: 700; color: var(--ink); }
.segmented.lang button { min-width: 38px; font-size: 13px; }
.update-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 24px 14px; padding: 10px 16px; border-radius: var(--radius); background: var(--card); border-left: 4px solid var(--gold); }
.update-bar[hidden], .fail-bar[hidden] { display: none; }
.fail-bar { margin: 0 24px 14px; padding: 12px 16px; border-radius: var(--radius); background: var(--card); border-left: 4px solid var(--danger); }
.fail-bar .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.fail-bar .head .icon { width: 24px; height: 24px; border-radius: 50%; background: var(--danger); color: #1e1938; font-weight: 800; display: grid; place-items: center; flex: none; }
.fail-bar .head b { font-size: 15px; }
.fail-bar .head .why { color: var(--ink-2); font-size: 13.5px; flex-basis: 100%; padding-left: 36px; }
.fail-bar .grow { flex: 1; }
.fail-bar .x { background: none; border: 0; color: var(--ink-3); font-size: 18px; cursor: pointer; padding: 0 4px; }
.fail-bar ul { list-style: none; margin: 12px 0 0 36px; padding: 0; display: grid; gap: 10px; }
.fail-bar li { background: var(--card-raised); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.fail-bar li .file { font-weight: 600; word-break: break-all; }
.fail-bar li .meta { color: var(--ink-3); font-size: 12.5px; }
.fail-bar li .msg { color: var(--ink-2); font-size: 13px; word-break: break-word; }
.fail-bar .row { display: flex; flex-wrap: wrap; gap: 8px; }

/* What went into each version: a dialog over the dashboard, opened from the header */
.btn.has-news::after {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); margin-left: 8px; vertical-align: 1px;
}
.news { display: none; width: min(720px, calc(100vw - 32px)); max-height: min(78vh, 880px); padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); overflow: hidden; }
.news[open] { display: flex; flex-direction: column; }
.news::backdrop { background: rgba(14, 10, 32, 0.66); }
.news .head { display: flex; align-items: center; gap: 12px; padding: 15px 20px; background: var(--card-raised); border-bottom: 1px solid var(--line); }
.news .head b { font-size: 17px; }
.news .head .count { color: var(--ink-3); font-size: 13px; }
.news .head .grow { flex: 1; }
.news .head .x { background: none; border: 0; color: var(--ink-3); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 4px; }
.news .head .x:hover { color: var(--ink); }
.news .body { overflow-y: auto; padding: 0 20px 18px; }
.news .body:focus { outline: none; }
.news .entry { padding: 16px 0; border-top: 1px solid var(--line); }
.news .entry:first-child { border-top: 0; }
.news .entry .when { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.news .entry .ver { font-stretch: 75%; font-size: 19px; letter-spacing: 0.02em; color: var(--ink-2); }
.news .entry.latest .ver { color: var(--gold); }
.news .entry .when .date { color: var(--ink-3); font-size: 13px; }
.news ul { list-style: none; margin: 11px 0 0; padding: 0; display: grid; gap: 9px; }
.news li { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: baseline; }
.news li .tag { justify-self: start; background: var(--card-raised); border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.news li .tag.nuevo { color: var(--good); }
.news li .tag.mejorado { color: var(--special); }
.news li .tag.arreglado { color: var(--danger); }
.news li .what { color: var(--ink-2); }
@media (max-width: 560px) {
    .news li { grid-template-columns: 1fr; }
}

.status button.linkish { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; text-decoration: underline dotted; }
.update-bar b { color: var(--gold); }
.update-bar .grow { flex: 1; }
.update-bar a { color: var(--ink-2); }
.top .grow { flex: 1; }
.status { padding: 0 24px 14px; color: var(--ink-3); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.status .live { color: var(--ink); }
.status .warn, .status .btn.warn { color: var(--danger); }
.status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--spirit); margin-right: 6px; }
.status .dot.off { background: var(--danger); }

.segmented { display: inline-flex; background: var(--card); border-radius: 8px; padding: 3px; }
.segmented button {
    border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: var(--ink-2);
}
.segmented button[aria-pressed="true"] { background: var(--card-raised); color: var(--ink); }

.btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 7px 14px; border-radius: 8px; cursor: pointer;
}
.btn:hover { background: var(--card-raised); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #241a00; font-weight: 600; }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--card-raised); color: var(--ink); }

/* ------------------------------------------------------------------ grid */
.board {
    display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px;
    padding: 0 24px 40px; align-items: stretch;
}
.widget {
    grid-column: span var(--span, 6);
    background: var(--card); border-radius: var(--radius);
    padding: 16px 18px; min-width: 0; position: relative;
    display: flex; flex-direction: column;
}
.widget h2 { margin: 0 0 10px; font-size: 15px; font-weight: 500; color: var(--ink-2); }
.widget .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.widget .head h2 { margin: 0; flex: 1; }
.widget.collapsed .head { margin-bottom: 0; }
.widget.collapsed { align-self: start; }
.btn.collapse { padding: 2px 8px; font-size: 12.5px; }
.widget .body { flex: 1; min-width: 0; }
.widget .hint { color: var(--ink-3); font-size: 13px; margin: 8px 0 0; }

@media (max-width: 1000px) {
    .board { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .widget { grid-column: span 6; }
    .widget[data-kind="kpi"] { grid-column: span 2; }
}
@media (max-width: 620px) {
    .top, .status, .board { padding-left: 14px; padding-right: 14px; }
    .widget[data-kind="kpi"] { grid-column: span 3; }
}

/* Edit mode */
.edit-bar { display: none; align-items: center; flex-wrap: wrap; gap: 4px; margin: -6px -8px 8px; }
.widget[data-kind="kpi"] .edit-bar .name { display: none; }
.widget[data-kind="kpi"] .edit-bar button { width: 24px; height: 24px; font-size: 13px; }
.widget[data-kind="kpi"] .edit-bar button.wide { width: auto; padding: 0 7px; font-size: 12.5px; }
body.editing .edit-bar { display: flex; }
body.editing .widget { outline: 1px dashed var(--ink-3); outline-offset: -1px; cursor: grab; }
body.editing .widget.dragging { opacity: 0.45; }
.edit-bar .name { flex: 1; font-size: 13px; color: var(--ink-2); padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.edit-bar button {
    border: 0; background: var(--card-raised); color: var(--ink); width: 28px; height: 28px; border-radius: 6px;
    cursor: pointer; display: grid; place-items: center; font-size: 15px; padding: 0;
}
.edit-bar button:hover { background: var(--line); }
.edit-bar button:disabled { opacity: 0.35; cursor: default; }
.edit-bar button.wide { width: auto; padding: 0 9px; font-size: 13px; }

.tray {
    display: none; margin: 0 24px 14px; padding: 12px 14px; border: 1px dashed var(--ink-3); border-radius: var(--radius);
    flex-wrap: wrap; gap: 8px; align-items: center;
}
body.editing .tray { display: flex; }
.tray .label { color: var(--ink-2); margin-right: 6px; }
.tray .grow { flex: 1; }

/* ------------------------------------------------------------------ KPI tiles */
.kpi .value { font-size: 44px; }
.kpi .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 8px; }
.kpi .sub + .sub { margin-top: 2px; color: var(--ink-3); }
.kpi .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; }

/* ------------------------------------------------------------------ match widget */
.match-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 14px; }
.match-head .title { font-size: 22px; font-stretch: 75%; font-weight: 700; color: var(--ink); }
.match-head .meta { color: var(--ink-2); }
.match-head .grow { flex: 1; }
.scoreline { display: flex; flex-wrap: wrap; gap: 14px 34px; margin-bottom: 16px; }
.score .value { font-size: 56px; display: flex; align-items: baseline; gap: 6px; }
.score .value small { font-size: 18px; font-weight: 500; color: var(--ink-3); font-stretch: 100%; }
.score .label { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; display: flex; align-items: center; }
.score .label .swatch { width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--ink-2); font-size: 13.5px; margin-top: 12px; }
.chips b { color: var(--ink); font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink-2); font-size: 13px; margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.legend svg { display: block; }

svg text { font-family: var(--font); fill: var(--ink-3); font-size: 12px; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .lane-label { fill: var(--ink-2); font-size: 12.5px; }
svg .value-label { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
svg .bar { cursor: pointer; }
svg .bar:hover .seg, svg .bar:focus-visible .seg { filter: brightness(1.25); }
svg .bar:focus-visible { outline: none; }
svg .bar.selected text { fill: var(--ink); }

/* ------------------------------------------------------------------ tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; }
th { color: var(--ink-3); font-weight: 500; font-size: 13px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; }
th:first-child, td:first-child, th.left, td.left { text-align: left; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--card-raised); }
tbody tr.selected td { background: var(--card-raised); }
tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
tbody tr.excluded td { color: var(--ink-3); text-decoration: line-through; }
tbody tr.excluded td:last-child { text-decoration: none; }
td .win { color: var(--ink); font-weight: 700; }
.scroll-y { max-height: 330px; overflow-y: auto; }
.scroll-y thead th { position: sticky; top: 0; background: var(--card); }
.columns-pick { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 10px; color: var(--ink-2); font-size: 13px; background: var(--card-raised); border-radius: 8px; padding: 10px 12px; }
.table-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; font-size: 13.5px; color: var(--ink-2); }
.table-tools select { background: var(--card-raised); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
.table-tools .grow { flex: 1; }
.table-more { margin-top: 10px; display: flex; gap: 10px; align-items: center; color: var(--ink-3); font-size: 13px; }
.columns-pick label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }

/* ------------------------------------------------------------------ are you getting better */
table.progress td.now { font-weight: 700; color: var(--ink); }
table.progress td.before { color: var(--ink-3); }
table.progress td.change { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
table.progress td.change.good { color: var(--good); }
table.progress td.change.bad { color: var(--danger); }
table.progress tbody tr:hover { background: var(--card-raised); }

/* ------------------------------------------------------------------ map tab */
.map { padding: 0 24px 40px; }
.m-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
.m-top .grow { flex: 1; }
.m-count { color: var(--ink-2); font-size: 14px; }
.m-count b { color: var(--ink); font-size: 17px; font-stretch: 75%; }
.m-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
.m-board { position: relative; aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; background: #0e2a44; border: 1px solid var(--line); }
.m-board img, .m-board canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.m-board canvas { mix-blend-mode: hard-light; }
.m-noimage { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); }
.m-place { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; pointer-events: none; }
.m-place i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, 0.85); box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45); }
.m-place b { font-size: 11.5px; font-stretch: 75%; letter-spacing: 0.03em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 3px #000, 0 0 8px #000; white-space: nowrap; }
.m-side h2 { margin: 0 0 10px; font-size: 16px; }
.m-side .scroll-y { max-height: 60vh; }
table.m-rank td { padding: 5px 7px; }
table.m-rank td.bar { width: 100%; padding: 5px 4px; }
table.m-rank td.bar i { display: block; height: 7px; border-radius: 4px; background: var(--chest); min-width: 2px; }
table.m-rank td.share { color: var(--ink-3); font-size: 12.5px; }
@media (max-width: 1100px) {
    .m-grid { grid-template-columns: minmax(0, 1fr); }
    .m-side .scroll-y { max-height: none; }
}

/* ------------------------------------------------------------------ treasure tab */
.segmented.tabs button[aria-pressed="true"] { background: var(--gold); color: #241a00; font-weight: 600; }
body:not([data-tab="partidas"]) #elRange, body:not([data-tab="partidas"]) #elEditToggle, body:not([data-tab="partidas"]) .tray { display: none; }
.treasure { padding: 0 24px 40px; }
.treasure[hidden], .board[hidden], .live[hidden] { display: none; }

/* ------------------------------------------------------------------ live tab */
.live { padding: 0 24px 40px; }
.l-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; background: var(--card); border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px; }
.l-top .grow { flex: 1; }
.l-pill { display: inline-flex; align-items: center; gap: 9px; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-stretch: 75%; font-size: 18px; letter-spacing: 0.04em; border: 2px solid var(--ink-3); color: var(--ink-2); }
.l-pill i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-3); }
.l-pill.on { border-color: var(--spirit); color: var(--ink); }
.l-pill.on i { background: var(--spirit); animation: l-blink 1.2s ease-in-out infinite; }
.l-pill.done { border-color: var(--ink-2); color: var(--ink); }
.l-pill.done i { background: var(--ink-2); }
.l-pill.search { border-color: var(--gold); color: var(--ink); }
.l-pill.search i { background: var(--gold); animation: l-blink 0.8s ease-in-out infinite; }
.l-hold { display: flex; align-items: center; gap: 14px; background: var(--card); border-left: 4px solid var(--gold); border-radius: var(--radius); padding: 12px 18px; margin-bottom: 14px; font-size: 16px; }
.l-hold b { font-size: 26px; color: var(--gold); font-variant-numeric: tabular-nums; }
.l-hold .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--card-raised); overflow: hidden; }
.l-hold .bar i { display: block; height: 100%; background: var(--gold); transition: width 1s linear; }

/* ------------------------------------------------------------------ background work: top bar, chip, toasts */
.busy-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
.busy-bar.on { opacity: 1; }
.busy-bar i { display: block; height: 100%; background: var(--gold); box-shadow: 0 0 10px var(--gold); transition: width 0.6s ease; }
.busy-bar.indeterminate i { width: 30% !important; animation: busy-slide 1.1s ease-in-out infinite; }
@keyframes busy-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
.busy-chip { position: fixed; left: 20px; bottom: 20px; z-index: 55; display: flex; align-items: center; gap: 12px; background: var(--card-raised); border: 1px solid var(--gold); border-radius: 12px; padding: 12px 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); max-width: min(440px, calc(100vw - 40px)); transform: translateY(140%); transition: transform 0.35s ease; }
.busy-chip.on { transform: translateY(0); }
.busy-chip .spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(240, 180, 41, 0.25); border-top-color: var(--gold); animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.busy-chip b { display: block; font-size: 15px; }
.busy-chip span { display: block; color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.busy-chip .meter { height: 5px; border-radius: 3px; background: var(--card); margin-top: 7px; overflow: hidden; }
.busy-chip .meter i { display: block; height: 100%; background: var(--gold); transition: width 0.6s ease; }
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 56; display: flex; flex-direction: column-reverse; gap: 10px; width: min(360px, calc(100vw - 40px)); pointer-events: none; }
.toast { pointer-events: auto; display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 10px; align-items: start; background: var(--card-raised); border-left: 4px solid var(--tone, var(--special)); border-radius: 10px; padding: 12px 12px 12px 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); animation: toast-in 0.35s ease-out; }
.toast.out { animation: toast-out 0.3s ease-in forwards; }
.toast .icon { font-size: 18px; line-height: 22px; color: var(--tone, var(--special)); text-align: center; }
.toast b { display: block; font-size: 14.5px; }
.toast p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }
.toast button { background: none; border: 0; color: var(--ink-3); cursor: pointer; font-size: 16px; padding: 0 2px; }
.toast.good { --tone: var(--good); }
.toast.gold { --tone: var(--gold); }
.toast.warn { --tone: var(--danger); }
@keyframes toast-in { from { transform: translateX(110%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toast-out { to { transform: translateX(110%); opacity: 0; } }

    ["Los dos porcentajes de arriba cuentan solo los tesoros sin tachar. Probabilidades por cofre publicadas por Epic (Fortnite Status, 7 de noviembre de 2026) para partidas normales. El cálculo usa los cofres, cofres especiales y cofres de espíritu de las partidas leídas, abiertos o rotos; Epic no ha dicho si todos los tipos de cofre cuentan igual. El cambio de semana (domingo, 14:00 UTC) y los objetos de cada semana no los publica Epic: ajústalos en «Editar tesoros». Las Horas del tesoro también se apuntan a mano: las horas son las que anunció Epic, pero algunos multiplicadores vienen de la prensa y no de Epic, así que conviene comprobarlos ahí mismo.", "The two percentages above only count treasures you have not crossed out. Per-chest odds published by Epic (Fortnite Status, 7 November 2026) for regular matches. The calculation uses the chests, special chests and spirit chests of the matches read, opened or broken; Epic has not said whether every chest type counts the same. Epic does not publish the weekly reset (Sunday, 14:00 UTC) or each week's items: adjust them in “Edit treasures”. Treasure Hours are written down by hand too: the times are the ones Epic announced, but some multipliers come from the press rather than from Epic, so they are worth checking there as well.", "Les deux pourcentages ci-dessus ne comptent que les trésors non cochés. Probabilités par coffre publiées par Epic (Fortnite Status, 7 novembre 2026) pour les parties normales. Le calcul utilise les coffres, coffres spéciaux et coffres d'esprit des parties lues, ouverts ou cassés ; Epic n'a pas dit si tous les types de coffres comptent pareil. Epic ne publie ni le changement de semaine (dimanche, 14:00 UTC) ni les objets de chaque semaine : ajuste-les dans « Modifier les trésors ». Les Heures du trésor sont aussi notées à la main : les horaires sont ceux annoncés par Epic, mais certains multiplicateurs viennent de la presse et non d'Epic, donc mieux vaut les vérifier au même endroit."],

// every text that reaches the page is looked up, whole or as a pattern with changing parts.

const OBJ_LANGS = { en: { strName: "English", strLocale: "en-GB" }, es: { strName: "Español", strLocale: "es-ES" }, fr: { strName: "Français", strLocale: "fr-FR" } };
const STR_LANG = (() => {
    try { const strSaved = localStorage.getItem("fcc-language"); if (OBJ_LANGS[strSaved]) return strSaved; } catch (objError) { /* storage unavailable */ }
    const strBrowser = (navigator.language || "en").slice(0, 2).toLowerCase();
    return OBJ_LANGS[strBrowser] ? strBrowser : "en";
})();
const STR_LOCALE = OBJ_LANGS[STR_LANG].strLocale;
document.documentElement.lang = STR_LANG;

const objTranslator = (() => {
    const intColumn = { en: 1, fr: 2 }[STR_LANG];
    const dicExact = new Map();
    const arrPatterns = [];
    const escapeRegex = (strText) => strText.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

            const strSource = arrEntry[0];
            if (!/\{\d+\}/.test(strSource)) { dicExact.set(strSource, arrEntry[intColumn]); continue; }
            const strLiteral = strSource.replace(/\{\d+\}/g, "");
            if (!/[A-Za-zÀ-ÿ]{2}/.test(strLiteral)) continue;     // nothing to recognise it by
            arrPatterns.push({
                bWeak: strLiteral.replace(/[^A-Za-zÀ-ÿ]/g, "").length < 4,
                reSource: new RegExp(`^${strSource.split(/\{\d+\}/).map(escapeRegex).join("([\\s\\S]*?)")}$`),
                arrSlots: [...strSource.matchAll(/\{(\d+)\}/g)].map((arrMatch) => Number(arrMatch[1])),
                strTarget: arrEntry[intColumn],
                intWeight: strLiteral.length
            });
        }
        arrPatterns.sort((objLeft, objRight) => objRight.intWeight - objLeft.intWeight);
    }

    const dicCache = new Map();
    const translate = (strText, intDepth = 0) => {
        if (!intColumn || !strText || intDepth > 5 || !/[A-Za-zÀ-ÿ]/.test(strText)) return strText;
        if (intDepth === 0 && dicCache.has(strText)) return dicCache.get(strText);
        const strResult = translateUncached(strText, intDepth);
        if (intDepth === 0) {
            if (dicCache.size > 20000) dicCache.clear();
            dicCache.set(strText, strResult);
        }
        return strResult;
    };
    const translateUncached = (strText, intDepth) => {
        if (dicExact.has(strText)) return dicExact.get(strText);
        const [, strLead, strCore, strTrail] = /^(\s*)([\s\S]*?)(\s*)$/.exec(strText);
        if (strCore !== strText && dicExact.has(strCore)) return strLead + dicExact.get(strCore) + strTrail;
        for (const strCandidate of strCore !== strText ? [strText, strCore] : [strText]) {
            for (const objPattern of arrPatterns) {

                if (!arrMatch) continue;
                if (objPattern.bWeak && arrMatch.slice(1).some((strPart) => !/\d/.test(strPart))) continue;

        const arrCount = /^([+−-]?[\d.,  ]*\d[\d.,]*\s*%?)(\s+)([\s\S]+)$/.exec(strCore);

            const strRest = translate(arrCount[3], intDepth + 1);

        return strText;

const el = (strTag, objProps = {}, arrChildren = []) => {
    const elNode = document.createElement(strTag);
    for (const [strKey, varValue] of Object.entries(objProps)) {
        if (varValue == null || varValue === false) continue;
        if (strKey === "text") elNode.textContent = varValue;
        else if (strKey === "class") elNode.className = varValue;
        else if (strKey.startsWith("on")) elNode.addEventListener(strKey.slice(2), varValue);
        else if (strKey === "style") {
            // Custom properties (--span) need setProperty; plain ones can be assigned
            for (const [strProp, varProp] of Object.entries(varValue)) {
                if (strProp.startsWith("--")) elNode.style.setProperty(strProp, varProp); else elNode.style[strProp] = varProp;
            }
        }
        else elNode.setAttribute(strKey, varValue === true ? "" : varValue);
    }
    for (const varChild of [].concat(arrChildren)) {
        if (varChild == null || varChild === false) continue;
        elNode.append(varChild);
    }
    return elNode;
};

// Matches that count, oldest first, each with its running number
const getNumberedMatches = () => {
    const arrMatches = (objApp.objState?.matches ?? []).filter((objMatch) => !objMatch.excluded);
    arrMatches.forEach((objMatch, intIndex) => { objMatch.intNumber = intIndex + 1; });
    return arrMatches;
};

// A session ends when more than three hours pass between two matches
const getLastSession = (arrMatches) => {
    const arrSession = [];
    for (let intIndex = arrMatches.length - 1; intIndex >= 0; intIndex--) {
        const objNewer = arrSession[0];
        if (objNewer && new Date(objNewer.startedAt) - new Date(arrMatches[intIndex].startedAt) > 3 * 3600 * 1000) break;
        arrSession.unshift(arrMatches[intIndex]);
    }
    return arrSession;
};

const getMatchesInRange = () => {
    const arrMatches = getNumberedMatches();
    const dtNow = new Date();
    switch (objApp.objLayout.strRange) {
        case "sesion": return getLastSession(arrMatches);
        case "hoy": return arrMatches.filter((objMatch) => new Date(objMatch.startedAt).toDateString() === dtNow.toDateString());
        case "semana": return arrMatches.filter((objMatch) => dtNow - new Date(objMatch.startedAt) < 7 * 24 * 3600 * 1000);
        default: return arrMatches;
    }
};

const getSelectedMatch = (arrMatches) =>
    arrMatches.find((objMatch) => objMatch.file === objApp.strSelectedFile) ?? arrMatches[arrMatches.length - 1] ?? null;

const getTotals = (arrMatches) => {
    const intMatches = arrMatches.length;
    const dblAliveMinutes = sum(arrMatches, (objMatch) => objMatch.aliveSec) / 60;
    const intChests = sum(arrMatches, (objMatch) => objMatch.chestsTotal);
    const arrWithStats = arrMatches.filter((objMatch) => objMatch.stats);
    const arrWithPosition = arrMatches.filter((objMatch) => objMatch.position != null);
    const arrWithFirstChest = arrMatches.filter((objMatch) => objMatch.firstChestSec != null);
    const arrWithAccuracy = arrMatches.filter((objMatch) => objMatch.stats?.accuracy != null);
    const best = (fnValue) => arrMatches.reduce((objBest, objMatch) => (objBest == null || fnValue(objMatch) > fnValue(objBest)) ? objMatch : objBest, null);

    return {
        intMatches,
        intChests,
        objCounts: Object.fromEntries(Object.keys(OBJ_SERIES).map((strCategory) => [strCategory, sum(arrMatches, (objMatch) => objMatch.counts[strCategory])])),
        intKills: sum(arrMatches, (objMatch) => objMatch.kills),
        intWins: arrMatches.filter((objMatch) => objMatch.position === 1).length,
        dblAliveSeconds: dblAliveMinutes * 60,
        dblChestsPerMin: dblAliveMinutes > 0 ? intChests / dblAliveMinutes : 0,
        dblAveragePosition: arrWithPosition.length ? sum(arrWithPosition, (objMatch) => objMatch.position) / arrWithPosition.length : null,
        intBestPosition: arrWithPosition.length ? Math.min(...arrWithPosition.map((objMatch) => objMatch.position)) : null,
        dblAccuracy: arrWithAccuracy.length ? sum(arrWithAccuracy, (objMatch) => objMatch.stats.accuracy) / arrWithAccuracy.length : null,
        intDamage: sum(arrWithStats, (objMatch) => objMatch.stats.damageDealt),
        intDamageTaken: sum(arrWithStats, (objMatch) => objMatch.stats.damageTaken),
        dblDistanceKm: sum(arrWithStats, (objMatch) => objMatch.stats.distanceKm),
        dblFirstChest: arrWithFirstChest.length ? sum(arrWithFirstChest, (objMatch) => objMatch.firstChestSec) / arrWithFirstChest.length : null,
        objBestChests: best((objMatch) => objMatch.chestsTotal),
        objBestKills: best((objMatch) => objMatch.kills)
    };
};

// ---------------------------------------------------------------------------
// Tooltip shared by every chart
// ---------------------------------------------------------------------------

const elTip = document.getElementById("elTip");

const showTip = (objEvent, strValue, arrLines = []) => {
    elTip.replaceChildren(el("strong", { text: strValue }), ...arrLines.filter(Boolean).map((strLine) => el("span", { text: strLine })));
    elTip.style.display = "block";
    const objRect = elTip.getBoundingClientRect();
    const dblLeft = Math.min(objEvent.clientX + 14, window.innerWidth - objRect.width - 8);
    const dblTop = objEvent.clientY - objRect.height - 12 < 8 ? objEvent.clientY + 16 : objEvent.clientY - objRect.height - 12;
    elTip.style.left = `${Math.max(8, dblLeft)}px`;
    elTip.style.top = `${dblTop}px`;
};

const hideTip = () => { elTip.style.display = "none"; };

// ---------------------------------------------------------------------------
// Charts
// ---------------------------------------------------------------------------

// Axis top as four whole steps (1, 2, 5, 10, 20, 50...) so every tick is a clean number
const niceMax = (dblMax) => {
    for (let dblPower = 1; ; dblPower *= 10) {
        for (const intStep of [1, 2, 5]) if (dblMax <= intStep * dblPower * 4) return intStep * dblPower * 4;
    }
};

// Column chart, optionally stacked. Bars are at most 24px wide, grow from one baseline,
// stacked parts are separated by a 2px gap and only the top end is rounded.
const drawColumns = (elHost, { arrBars, arrSeries, intHeight = 230 }) => {
    const intWidth = Math.max(elHost.clientWidth, 260);
    const objPad = { intTop: 22, intRight: 8, intBottom: arrBars.some((objBar) => objBar.strSubLabel) ? 40 : 26, intLeft: 30 };
    const dblPlotWidth = intWidth - objPad.intLeft - objPad.intRight;
    const dblPlotHeight = intHeight - objPad.intTop - objPad.intBottom;
    const dblMax = niceMax(Math.max(1, ...arrBars.map((objBar) => sum(objBar.arrParts, (objPart) => objPart.dblValue))));
    const dblBand = dblPlotWidth / Math.max(arrBars.length, 1);
    const dblBarWidth = Math.max(4, Math.min(24, dblBand - 6));
    const toY = (dblValue) => objPad.intTop + dblPlotHeight - (dblValue / dblMax) * dblPlotHeight;
    // Label only as many bars as fit without touching
    const intLabelEvery = Math.max(1, Math.ceil(30 / dblBand));
    // A value on every bar only when there are few; otherwise just the tallest one
    const dblTallest = Math.max(...arrBars.map((objBar) => sum(objBar.arrParts, (objPart) => objPart.dblValue)));
    const bLabelAll = arrBars.length <= 8 && dblBand >= 26;
    let bTallestLabelled = false;

    const elSvg = svg("svg", { width: intWidth, height: intHeight, viewBox: `0 0 ${intWidth} ${intHeight}`, role: "img" });

    for (let intTick = 0; intTick <= 4; intTick++) {
        const dblValue = (dblMax / 4) * intTick;
        const dblY = toY(dblValue);
        elSvg.append(
            svg("line", { class: "grid", x1: objPad.intLeft, x2: intWidth - objPad.intRight, y1: dblY, y2: dblY }),
            svg("text", { x: objPad.intLeft - 6, y: dblY + 4, "text-anchor": "end", text: fmtNumber(dblValue) })
        );
    }

    arrBars.forEach((objBar, intIndex) => {
        const dblCenter = objPad.intLeft + dblBand * (intIndex + 0.5);
        const elGroup = svg("g", { class: `bar${objBar.bSelected ? " selected" : ""}`, tabindex: 0 });
        const arrVisible = objBar.arrParts.filter((objPart) => objPart.dblValue > 0);
        let dblRunning = 0;

        arrVisible.forEach((objPart, intPartIndex) => {
            const dblBottom = toY(dblRunning);
            dblRunning += objPart.dblValue;
            const dblTop = toY(dblRunning);
            const bIsTop = intPartIndex === arrVisible.length - 1;
            const dblGap = bIsTop ? 0 : 2;
            const dblHeight = Math.max(1, dblBottom - dblTop - dblGap);
            const strColor = arrSeries.find((objSeries) => objSeries.strKey === objPart.strKey).strColor;
            const dblX = dblCenter - dblBarWidth / 2;

            if (bIsTop) {
                // Rounded data end, square towards the baseline
                const dblRadius = Math.min(4, dblHeight, dblBarWidth / 2);
                const dblYTop = dblTop + dblGap;
                elGroup.append(svg("path", {
                    class: "seg", fill: strColor,
                    d: `M${dblX},${dblYTop + dblHeight} V${dblYTop + dblRadius} Q${dblX},${dblYTop} ${dblX + dblRadius},${dblYTop} H${dblX + dblBarWidth - dblRadius} Q${dblX + dblBarWidth},${dblYTop} ${dblX + dblBarWidth},${dblYTop + dblRadius} V${dblYTop + dblHeight} Z`
                }));
            } else {
                elGroup.append(svg("rect", { class: "seg", x: dblX, y: dblTop + dblGap, width: dblBarWidth, height: dblHeight, fill: strColor }));
            }
        });

        const bLabelThis = dblRunning > 0 && (bLabelAll || (!bTallestLabelled && dblRunning === dblTallest));
        if (bLabelThis) {
            bTallestLabelled = true;
            elGroup.append(svg("text", { class: "value-label", x: dblCenter, y: toY(dblRunning) - 6, "text-anchor": "middle", text: fmtNumber(dblRunning) }));
        }
        if (intIndex % intLabelEvery === 0 || objBar.bSelected) {
            elGroup.append(svg("text", { x: dblCenter, y: intHeight - objPad.intBottom + 16, "text-anchor": "middle", text: objBar.strLabel }));
            if (objBar.strSubLabel) elGroup.append(svg("text", { x: dblCenter, y: intHeight - objPad.intBottom + 31, "text-anchor": "middle", text: objBar.strSubLabel }));
        }
        // The selected match is marked under its label, never by repainting the bar
        if (objBar.bSelected) {
            elGroup.append(svg("rect", { x: dblCenter - 9, y: intHeight - objPad.intBottom + (objBar.strSubLabel ? 36 : 21), width: 18, height: 2, rx: 1, fill: "var(--gold)" }));
        }

        // Hit area: the whole band, far bigger than the painted bar
        const elHit = svg("rect", { x: dblCenter - dblBand / 2, y: objPad.intTop, width: dblBand, height: dblPlotHeight + objPad.intBottom, fill: "transparent" });
        elGroup.append(elHit);
        elGroup.addEventListener("pointermove", (objEvent) => showTip(objEvent, objBar.strTipValue, objBar.arrTipLines));
        elGroup.addEventListener("pointerleave", hideTip);
        elGroup.addEventListener("focus", () => {
            const objRect = elHit.getBoundingClientRect();
            showTip({ clientX: objRect.left + objRect.width / 2, clientY: objRect.top }, objBar.strTipValue, objBar.arrTipLines);
        });
        elGroup.addEventListener("blur", hideTip);
        if (objBar.fnClick) {
            elGroup.addEventListener("click", objBar.fnClick);
            elGroup.addEventListener("keydown", (objEvent) => { if (objEvent.key === "Enter") objBar.fnClick(); });
        }
        elSvg.append(elGroup);
    });

    elHost.append(elSvg);
    if (arrSeries.length > 1) {
        elHost.append(el("div", { class: "legend" }, arrSeries.map((objSeries) =>
            el("span", {}, [el("i", { style: { background: objSeries.strColor } }), objSeries.strLabel]))));
    }
};

// The match on one line: every chest, kill and death at the minute it happened
const drawTimeline = (elHost, objMatch) => {
    const intWidth = Math.max(elHost.clientWidth, 320);
    const intLabelWidth = 76;
    const objLanes = { dblChests: 16, dblOther: 36, dblKills: 56, dblYou: 76 };
    const intHeight = 108;
    const dblDuration = Math.max(objMatch.durationSec, 60);
    const dblPlotWidth = intWidth - intLabelWidth - 14;
    const toX = (dblSeconds) => intLabelWidth + (Math.min(dblSeconds, dblDuration) / dblDuration) * dblPlotWidth;

    const elSvg = svg("svg", { width: intWidth, height: intHeight, viewBox: `0 0 ${intWidth} ${intHeight}`, role: "img" });

    // Minute grid
    const intMinutes = Math.floor(dblDuration / 60);
    const intStep = intMinutes > 24 ? 5 : intMinutes > 12 ? 2 : 1;
    for (let intMinute = 0; intMinute <= intMinutes; intMinute += intStep) {
        const dblX = toX(intMinute * 60);
        elSvg.append(
            svg("line", { class: "grid", x1: dblX, x2: dblX, y1: 5, y2: 88 }),
            svg("text", { x: dblX, y: 101, "text-anchor": "middle", text: `${intMinute}'` })
        );
    }

    // Time spent watching after your last elimination
    if (objMatch.aliveSec < objMatch.durationSec - 5) {
        const dblX = toX(objMatch.aliveSec);
        elSvg.append(
            svg("rect", { x: dblX, y: 5, width: intWidth - 14 - dblX, height: 83, fill: "var(--page)", opacity: 0.55 }),
            svg("text", { x: Math.min(dblX + 8, intWidth - 80), y: 14, text: "espectador" })
        );
    }

    for (const [strLabel, dblY] of [["Cofres", objLanes.dblChests], ["Otros", objLanes.dblOther], ["Kills", objLanes.dblKills], ["Tú", objLanes.dblYou]]) {
        elSvg.append(svg("text", { class: "lane-label", x: 0, y: dblY + 4, text: strLabel }));
    }

    // Every mark also goes in this list so the pointer only has to be near one
    const arrMarks = [];

    for (const objOpening of objMatch.openings) {
        const bChest = ARR_CHEST_CATEGORIES.includes(objOpening.category);
        const dblX = toX(objOpening.t);
        const dblY = bChest ? objLanes.dblChests : objLanes.dblOther;
        const intTickHeight = bChest ? 15 : 9;
        elSvg.append(svg("rect", {
            x: dblX - 2, y: dblY - intTickHeight / 2, width: 4, height: intTickHeight, rx: 2,
            fill: OBJ_SERIES[objOpening.category]?.strColor ?? "var(--quiet)",
            stroke: "var(--card)", "stroke-width": 1
        }));
        arrMarks.push({ dblX, dblY, strValue: fmtClock(objOpening.t), arrLines: [OBJ_SERIES[objOpening.category]?.strLabel ?? "Contenedor", describeMethod(objOpening), objOpening.containerClass] });
    }

    for (const objKill of objMatch.killEvents) {
        const dblX = toX(objKill.t);
        const dblY = objLanes.dblKills;
        // Diamond: filled for an elimination, hollow for a knock
        elSvg.append(svg("path", {
            d: `M${dblX},${dblY - 6} L${dblX + 5},${dblY} L${dblX},${dblY + 6} L${dblX - 5},${dblY} Z`,
fill: objKill.isKnock ? "var(--card)" : "var(--ink)", stroke: objKill.isKnock ? "var(--ink)" : "var(--card)", "stroke-width": 1.5
        }));
        arrMarks.push({
            dblX, dblY, strValue: fmtClock(objKill.t),
            arrLines: [objKill.isKnock ? "Derribo" : "Eliminación", objKill.victimName, objKill.distanceM != null ? `a ${fmtNumber(objKill.distanceM)} m` : null]
        });
    }

    for (const objDeath of objMatch.deaths) {
        const dblX = toX(objDeath.t);
        const dblY = objLanes.dblYou;
        if (objDeath.isKnock) {
            elSvg.append(svg("circle", { cx: dblX, cy: dblY, r: 4.5, fill: "var(--card)", stroke: "var(--danger)", "stroke-width": 1.5 }));
        } else {
            elSvg.append(svg("path", { d: `M${dblX - 5},${dblY - 5} L${dblX + 5},${dblY + 5} M${dblX + 5},${dblY - 5} L${dblX - 5},${dblY + 5}`, stroke: "var(--danger)", "stroke-width": 2.5, "stroke-linecap": "round" }));
        }
        arrMarks.push({ dblX, dblY, strValue: fmtClock(objDeath.t), arrLines: [objDeath.isKnock ? "Te derriban" : "Te eliminan"] });
    }

    const elOverlay = svg("rect", { x: intLabelWidth - 8, y: 4, width: dblPlotWidth + 16, height: 92, fill: "transparent" });
    elOverlay.addEventListener("pointermove", (objEvent) => {
        const objRect = elSvg.getBoundingClientRect();
        const dblPointerX = objEvent.clientX - objRect.left;
        const dblPointerY = objEvent.clientY - objRect.top;
        let objNearest = null;
        let dblNearest = 18;
        for (const objMark of arrMarks) {
            const dblDistance = Math.abs(objMark.dblX - dblPointerX) + (Math.abs(objMark.dblY - dblPointerY) > 16 ? 100 : 0);
            if (dblDistance < dblNearest) { dblNearest = dblDistance; objNearest = objMark; }
        }
        if (objNearest) showTip(objEvent, objNearest.strValue, objNearest.arrLines); else hideTip();
    });
    elOverlay.addEventListener("pointerleave", hideTip);
    elSvg.append(elOverlay);
    elHost.append(elSvg);

    const key = (elMark, strText) => el("span", {}, [elMark, strText]);
    const miniSvg = (elShape) => { const elMini = svg("svg", { width: 14, height: 14, viewBox: "0 0 14 14" }); elMini.append(elShape); return elMini; };
    elHost.append(el("div", { class: "legend" }, [
        key(el("i", { style: { background: "var(--chest)" } }), "Cofre"),
        key(el("i", { style: { background: "var(--special)" } }), "Cofre especial"),
        key(el("i", { style: { background: "var(--spirit)" } }), "Cofre de espíritu"),
        key(el("i", { style: { background: "var(--quiet)" } }), "Munición y otros"),
        key(miniSvg(svg("path", { d: "M7,1 L13,7 L7,13 L1,7 Z", fill: "var(--ink)" })), "Eliminación"),
        key(miniSvg(svg("path", { d: "M7,1.5 L12.5,7 L7,12.5 L1.5,7 Z", fill: "none", stroke: "var(--ink)", "stroke-width": 1.5 })), "Derribo"),
        key(miniSvg(svg("path", { d: "M2,2 L12,12 M12,2 L2,12", stroke: "var(--danger)", "stroke-width": 2.5, "stroke-linecap": "round" })), "Te eliminan")
    ]));
};

                if (objMate.isYou) continue;
                const objFriend = dicFriends.get(objMate.id) ?? { strId: objMate.id, strName: null, intMatches: 0, intKills: 0, intYourChests: 0, dblYourMinutes: 0, arrPositions: [], strLast: "" };

                objFriend.intKills += objMate.kills ?? 0;

                objFriend.dblYourMinutes += objMatch.aliveSec / 60;
                if (objMatch.position) objFriend.arrPositions.push(objMatch.position);
                // Matches come oldest first, so the last name seen is the current one
                if (objMatch.startedAt >= objFriend.strLast) { objFriend.strLast = objMatch.startedAt; objFriend.strName = objMate.name ?? objFriend.strName; }
            }

        const arrEveryone = [...dicFriends.values()].sort((objLeft, objRight) => objRight.intMatches - objLeft.intMatches || objRight.strLast.localeCompare(objLeft.strLast));

        const arrRepeated = arrEveryone.filter((objFriend) => objFriend.intMatches > 1);
        const arrFriends = arrRepeated.length ? arrRepeated : arrEveryone;
        const intOneOff = arrEveryone.length - arrFriends.length;

        const intSolo = arrMatches.filter((objMatch) => !objMatch.squad.some((objMate) => !objMate.isYou)).length;

            ["Mejor puesto", (objFriend) => objFriend.arrPositions.length ? fmtPosition(Math.min(...objFriend.arrPositions)) : "–"],
            ["Tus cofres en esas partidas", (objFriend) => fmtNumber(objFriend.intYourChests / objFriend.intMatches)],
            ["Última vez", (objFriend) => new Date(objFriend.strLast).toLocaleDateString(STR_LOCALE, { day: "numeric", month: "short" })]
        ];
        elBody.append(el("div", { class: "table-wrap scroll-y" }, el("table", {}, [
            el("thead", {}, el("tr", {}, arrColumns.map(([strHead, , strAlign]) => el("th", { class: strAlign ?? null, text: strHead, style: { cursor: "default" } })))),
            el("tbody", {}, arrFriends.slice(0, 25).map((objFriend) => el("tr", { style: { cursor: "default" } },
                arrColumns.map(([, fnValue, strAlign]) => el("td", { class: strAlign ?? null, text: fnValue(objFriend) })))))
        ])));
        elBody.append(el("p", { class: "hint" }, [
            `«Tus cofres en esas partidas» es tu media de cofres cuando jugáis juntos; tu media general en este periodo es ${fmtNumber(dblOverall)}.`,
            intOneOff ? ` No se muestran ${intOneOff} ${intOneOff === 1 ? "compañero" : "compañeros"} de una sola partida.` : null,

        ]));
    }
});

// Whether you are getting better. Its own windows of time, so the range buttons at the top
// never change what it compares: a period against the one right before it, like for like.
const ARR_PROGRESS_SPANS = [
    { strId: "semana", strLabel: "Esta semana", strBefore: "la anterior", intDays: 7, strWindow: "los últimos 7 días con los 7 anteriores" },
    { strId: "dia", strLabel: "Hoy", strBefore: "ayer", intDays: 1, strWindow: "las últimas 24 horas con las 24 anteriores" },
    { strId: "mes", strLabel: "Este mes", strBefore: "el anterior", intDays: 30, strWindow: "los últimos 30 días con los 30 anteriores" }
];

// Matches of the window that ends now and goes intDays back, and of the one just before it
const splitForProgress = (arrMatches, intDays) => {
    const dblNow = Date.now();
    const dblSpan = intDays * 86400000;
    const inWindow = (objMatch, dblFrom, dblTo) => {
        const dblWhen = new Date(objMatch.startedAt).getTime();
        return dblWhen >= dblFrom && dblWhen < dblTo;
    };
    return {
        arrNow: arrMatches.filter((objMatch) => inWindow(objMatch, dblNow - dblSpan, dblNow + 1)),
        arrBefore: arrMatches.filter((objMatch) => inWindow(objMatch, dblNow - 2 * dblSpan, dblNow - dblSpan))
    };
};

ARR_WIDGETS.push({
    strId: "progreso", strTitle: "¿Vas mejorando?", strKind: "panel", intSize: 6, bHidden: false,
    fnRender: (elBody) => {
        const arrAll = getNumberedMatches();
        const strSpan = objApp.objLayout.strProgressSpan ?? "semana";
        const objSpan = ARR_PROGRESS_SPANS.find((objItem) => objItem.strId === strSpan) ?? ARR_PROGRESS_SPANS[0];

        elBody.append(el("div", { class: "segmented", style: { marginBottom: "12px" } }, ARR_PROGRESS_SPANS.map((objItem) => el("button", {
            text: objItem.strLabel, "aria-pressed": String(objItem.strId === objSpan.strId),
            onclick: () => { objApp.objLayout.strProgressSpan = objItem.strId; saveLayout(); renderBoard(); }
        }))));

        const { arrNow, arrBefore } = splitForProgress(arrAll, objSpan.intDays);
        if (!arrNow.length && !arrBefore.length) {
            elBody.append(el("p", { class: "hint", text: "Todavía no hay partidas en este periodo ni en el anterior." }));
            return;
        }

        // Average per match, so a period with more matches does not look better just for being longer
        const per = (arrMatches, fnValue) => arrMatches.length ? sum(arrMatches, fnValue) / arrMatches.length : null;
        const arrRows = [
            { strLabel: "Partidas", fnNow: (arrMatches) => arrMatches.length, bMoreIsBetter: null, intDecimals: 0 },
            { strLabel: "Cofres por partida", fnNow: (arrMatches) => per(arrMatches, (objMatch) => objMatch.chestsTotal), bMoreIsBetter: true },
            { strLabel: "Cofres por minuto", fnNow: (arrMatches) => per(arrMatches, (objMatch) => objMatch.chestsPerMin), bMoreIsBetter: true, intDecimals: 2 },
            { strLabel: "Primer cofre (min)", fnNow: (arrMatches) => per(arrMatches.filter((objMatch) => objMatch.firstChestSec != null), (objMatch) => objMatch.firstChestSec / 60), bMoreIsBetter: false },
            { strLabel: "Kills por partida", fnNow: (arrMatches) => per(arrMatches, (objMatch) => objMatch.kills ?? 0), bMoreIsBetter: true },
            { strLabel: "Puesto medio", fnNow: (arrMatches) => per(arrMatches.filter((objMatch) => objMatch.position != null), (objMatch) => objMatch.position), bMoreIsBetter: false },
            { strLabel: "Victorias", fnNow: (arrMatches) => arrMatches.filter((objMatch) => objMatch.position === 1).length, bMoreIsBetter: true, intDecimals: 0 },
            { strLabel: "Minutos por partida", fnNow: (arrMatches) => per(arrMatches, (objMatch) => objMatch.aliveSec / 60), bMoreIsBetter: null }
        ];

        // Chests per minute move in hundredths: rounded to one, two periods look equal and still differ
        const fmtCell = (dblValue, intDecimals) =>
            dblValue == null ? "–"
                : intDecimals === 0 ? String(Math.round(dblValue))
                : intDecimals ? dblValue.toLocaleString(STR_LOCALE, { minimumFractionDigits: intDecimals, maximumFractionDigits: intDecimals })
                : fmtNumber(dblValue);

        elBody.append(el("div", { class: "table-wrap" }, el("table", { class: "progress" }, [
            el("thead", {}, el("tr", {}, [
                el("th", { class: "left", text: "", style: { cursor: "default" } }),
                el("th", { text: objSpan.strLabel, style: { cursor: "default" } }),
                el("th", { text: objSpan.strBefore, style: { cursor: "default" } }),
                el("th", { text: "Cambio", style: { cursor: "default" } })
            ])),
            el("tbody", {}, arrRows.map((objRow) => {
                const dblNow = objRow.fnNow(arrNow);
                const dblBefore = objRow.fnNow(arrBefore);
                const bComparable = dblNow != null && dblBefore != null && dblBefore !== 0;
                const dblChange = bComparable ? (dblNow - dblBefore) / Math.abs(dblBefore) : null;
                const bUp = dblNow != null && dblBefore != null && dblNow > dblBefore;
                const bSame = dblNow != null && dblBefore != null && dblNow === dblBefore;
                // Fewer minutes to the first chest, or a lower place, is better
                const strTone = objRow.bMoreIsBetter == null || bSame || dblChange == null ? ""
                    : bUp === objRow.bMoreIsBetter ? "good" : "bad";
                return el("tr", { style: { cursor: "default" } }, [
                    el("td", { class: "left", text: objRow.strLabel }),
                    el("td", { class: "now", text: fmtCell(dblNow, objRow.intDecimals) }),
                    el("td", { class: "before", text: fmtCell(dblBefore, objRow.intDecimals) }),
                    el("td", { class: `change ${strTone}`, text: dblChange == null ? "–" : `${bSame ? "=" : bUp ? "▲" : "▼"} ${fmtNumber(Math.abs(dblChange) * 100)} %` })
                ]);
            }))
        ])));

        elBody.append(el("p", { class: "hint" }, [
            `Compara ${objSpan.strWindow}. `,
            arrBefore.length ? null : el("b", { text: "Todavía no hay partidas en el periodo anterior, así que aún no hay con qué comparar. " }),
            "El color dice si el cambio es a mejor, no si el número sube. Las cifras son medias por partida, para que un periodo con más partidas no parezca mejor solo por ser más largo."
        ]));
    }
});

// Odds per chest published by Epic (Fortnite Status, 7 Nov 2026) for the Treasure Hunters season.
// Everything here can be edited from the tab, so a new season only needs new numbers.
// Bumped when this file brings data an older copy cannot have: on loading, normalizeTreasure
// folds in what is new (today's Treasure Hours) without touching what the player edited.
const INT_TREASURE_VERSION = 4;

const defaultTreasure = () => ({

        { strStart: "2026-11-08T02:00:00Z", strEnd: "2026-11-08T04:00:00Z", objMultipliers: { token: 2, gold: 10 } },
        // 14 Nov, the "Cursed" ones. Epic gave the hours (19:00 UTC, and 02:00 UTC the day after,
        // two hours each); the multipliers below are what the press reported, and the second
        // window's 2x is last week's pattern rather than a figure Epic confirmed. Editable.
        { strStart: "2026-11-14T19:00:00Z", strEnd: "2026-11-14T21:00:00Z", objMultipliers: { token: 1.5, gold: 7.5, vehicle: 10 } },
        { strStart: "2026-11-15T02:00:00Z", strEnd: "2026-11-15T04:00:00Z", objMultipliers: { token: 2, gold: 10 } }

// The official treasures of each week, as Epic hands them out. They are not shop cosmetics: they
// are unique items that only come out of chests that week, so there is no API that lists them and
// they are written down here by hand, one per square. Keyed exactly like objItems, by the start of
// the reward week in UTC. Anything typed in the tab wins over this, field by field.
//
// The pictures are the official icons. Most were matched by Epic's own internal id —
// Pickaxe_SpillStrikeReward and Backpack_RumbaShowyReward carry the "Reward" suffix, and
// loadingscreen_delilahthw / thw2 carry "thw" for treasure-hunt week — and then checked by eye
// against the rewards as the game shows them.
const STR_ICON = "https://fortnite-api.com/images/cosmetics";
const OBJ_WEEK_ITEMS = {

    // Semana 2 — Lil Uzi Vert. La piel dorada del Cadillac no tiene icono propio en la API

    "2026-11-08T14|gold": { strName: "Lil Uzi Vert de oro macizo", strImage: `${STR_ICON}/br/character_rumbashowy/icon.png` },
    "2026-11-08T14|vehicle": { strName: "Cadillac CT5-V Blackwing dorado", strImage: `${STR_ICON}/cars/carbody_burnishedraven/large.png` },
    "2026-11-08T14|pickaxe": { strName: "Lil' Uzi Crew", strImage: `${STR_ICON}/br/backpack_rumbashowyreward/icon.png` },
    "2026-11-08T14|jam": { strName: "London", strImage: "https://cdn.fortnite-api.com/tracks/14bc957c9a025056.jpg" },
    "2026-11-08T14|loading": { strName: "So Kawaii", strImage: `${STR_ICON}/br/loadingscreen_delilahthw2/icon.png` },
    // El token no cambia de semana: la temporada entera reparte los dos
    "season|token": { strName: "Acceso a la Tienda pirata (2026 y 2027)" }
};

// What a square shows: what you wrote, falling back to the official item for that week
const getItem = (strKey) => ({ ...(OBJ_WEEK_ITEMS[strKey] ?? {}), ...(objApp.objTreasure.objItems[strKey] ?? {}) });

const normalizeTreasure = (objSaved) => {
    const objDefault = defaultTreasure();
    if (!objSaved || !Array.isArray(objSaved.arrRewards)) return objDefault;
    const objOut = { ...objDefault, ...objSaved, objItems: { ...(objSaved.objItems ?? {}) }, objWon: { ...(objSaved.objWon ?? {}) }, objExtraWeek: { ...(objSaved.objExtraWeek ?? {}) }, arrWindows: [...(objSaved.arrWindows ?? [])] };

    // Treasure Hours that Epic announced after this copy last saved. Folded in by start time and
    // only once, so a window edited or deleted on purpose does not come back on every start.
    const intSaved = Number(objSaved.intVersion) || 1;
    if (intSaved < 2) {
        const setStarts = new Set(objOut.arrWindows.map((objWindow) => objWindow.strStart));
        for (const objWindow of objDefault.arrWindows) if (!setStarts.has(objWindow.strStart)) objOut.arrWindows.push(objWindow);
        objOut.arrWindows.sort((objLeft, objRight) => String(objLeft.strStart).localeCompare(String(objRight.strStart)));
    }
    // Gizmos put away, without losing how many were counted
    if (intSaved < 3) {
        objOut.arrRewards = objOut.arrRewards.map((objReward) => (objReward.strId === "gizmo" ? { ...objReward, bHidden: true } : objReward));
    }
    // Until now there was no official list, so whatever was written in those squares was a
    // stand-in: a pasted screenshot, or a name picked while trying the search. The official
    // treasure takes over once, and "Volver al oficial" keeps it reversible from here on.
    // Only where the official entry brings its picture too: the pirate token has no icon in the
    // API, so a screenshot pasted for it is better than nothing and stays put.
    if (intSaved < 4) {
        for (const [strKey, objOfficial] of Object.entries(OBJ_WEEK_ITEMS)) {
            if (objOfficial.strImage) delete objOut.objItems[strKey];
        }
    }
    if (intSaved < INT_TREASURE_VERSION) objOut.intVersion = INT_TREASURE_VERSION;
    return objOut;
};

let intTreasureTimer = 0;
const saveTreasure = () => {
    clearTimeout(intTreasureTimer);
    intTreasureTimer = setTimeout(() => api("PUT", "/api/treasure", objApp.objTreasure).catch(() => {}), 300);
};
const changeTreasure = (fnChange) => { fnChange(objApp.objTreasure); saveTreasure(); renderTreasure(); };

// Start of the reward week that contains a moment: the last "weekday at hour, UTC" before it
const getWeekStart = (dtMoment) => {
    const objTreasure = objApp.objTreasure;
    const dtStart = new Date(Date.UTC(dtMoment.getUTCFullYear(), dtMoment.getUTCMonth(), dtMoment.getUTCDate(), objTreasure.intWeekStartHourUtc));
    while (dtStart.getUTCDay() !== objTreasure.intWeekStartDay || dtStart > dtMoment) dtStart.setUTCDate(dtStart.getUTCDate() - 1);
    return dtStart;
};
const INT_WEEK_MS = 7 * 24 * 3600 * 1000;

// What the event spans. Both dates count whole, in the PC's own time: the end date is included.
const getSeasonBounds = () => {
    const objTreasure = objApp.objTreasure;
    const dtTo = new Date(`${objTreasure.strSeasonEnd}T00:00:00`);
    dtTo.setDate(dtTo.getDate() + 1);
    return { dblFrom: new Date(`${objTreasure.strSeasonStart}T00:00:00`).getTime(), dblTo: dtTo.getTime() };
};

// The reset that opens the event's first week: the first weekly reset from the start date on.
// An event starts on a reset, not at midnight, so its first week is whole and not a few hours.
const getFirstWeekStart = () => {
    const dblFrom = getSeasonBounds().dblFrom;
    const dtReset = getWeekStart(new Date(dblFrom));
    if (dtReset.getTime() < dblFrom) dtReset.setUTCDate(dtReset.getUTCDate() + 7);
    return dtReset;
};

// One reward week, cut to the event. The event ends on a day of its own, so the last week is
// short: the key stays the uncut start, which is what the crossed squares are saved under.
const makeWeek = (dtRawStart, objBounds, intIndex, intCount) => {
    const dblRawEnd = dtRawStart.getTime() + INT_WEEK_MS;
    const dtStart = new Date(Math.max(dtRawStart.getTime(), objBounds.dblFrom));
    const dtEnd = new Date(Math.min(dblRawEnd, objBounds.dblTo));
    return {
        dtStart, dtEnd, intIndex, intCount,
        strKey: dtRawStart.toISOString().slice(0, 13),
        bShort: dtEnd.getTime() - dtStart.getTime() < INT_WEEK_MS
    };
};

// Every reward week of the event, in order. Capped so an end date typed wrong cannot hang the tab.
const getEventWeeks = () => {
    const objBounds = getSeasonBounds();
    const arrStarts = [];
    for (let dblStart = getFirstWeekStart().getTime(); dblStart < objBounds.dblTo && arrStarts.length < 520; dblStart += INT_WEEK_MS) arrStarts.push(dblStart);
    if (!arrStarts.length) arrStarts.push(getWeekStart(new Date()).getTime());     // end date before the start
    return arrStarts.map((dblStart, intIndex) => makeWeek(new Date(dblStart), objBounds, intIndex, arrStarts.length));
};

// The event week we are in now; before the event that is the first, after it the last
const getNowWeekIndex = (arrWeeks) => {
    const dblNow = Date.now();
    const intIndex = arrWeeks.findIndex((objWeek) => dblNow < objWeek.dtEnd.getTime());
    return intIndex < 0 ? arrWeeks.length - 1 : intIndex;
};

// The week on screen. The offset is kept inside the event, so the arrows cannot walk out of it.
const getSelectedWeek = () => {
    const arrWeeks = getEventWeeks();
    const intNow = getNowWeekIndex(arrWeeks);
    const intWanted = Math.min(arrWeeks.length - 1, Math.max(0, intNow + objApp.intWeekOffset));
    objApp.intWeekOffset = intWanted - intNow;
    return arrWeeks[intWanted];
};

// Every chest of the matches that count, with the real moment it was opened
const getChestMoments = () => {
    const arrMoments = [];
    for (const objMatch of (objApp.objState?.matches ?? [])) {
        if (objMatch.excluded) continue;
        const dblStart = new Date(objMatch.startedAt).getTime();
        for (const objOpening of objMatch.openings) {
            if (ARR_CHEST_CATEGORIES.includes(objOpening.category)) arrMoments.push(dblStart + objOpening.t * 1000);
        }
    }
    return arrMoments;
};

// The reward week a given moment falls in. A match from outside the event keeps its own plain
// week, so the squares it was counted against are still found under the same key.
const getWeekAt = (dtMoment) => {
    const arrWeeks = getEventWeeks();
    const dblMoment = dtMoment.getTime();
    return arrWeeks.find((objWeek) => dblMoment >= objWeek.dtStart.getTime() && dblMoment < objWeek.dtEnd.getTime())
        ?? makeWeek(getWeekStart(dtMoment), getSeasonBounds(), -1, arrWeeks.length);
};

// Treasures still to get in a week: not crossed out, and never the repeatable ones (Gizmos)
// The squares the tab shows. A hidden one keeps its data and its tally; it just stays out of sight.
const getShownRewards = () => objApp.objTreasure.arrRewards.filter((objReward) => !objReward.bHidden);

const getMissingRewards = (objWeek) => getShownRewards().filter((objReward) => !objReward.bRepeatable && !objApp.objTreasure.objWon[getScopeKey(objReward, objWeek)]);

const getScopeKey = (objReward, objWeek) => `${objReward.bWeekly ? objWeek.strKey : "season"}|${objReward.strId}`;

// Chance per chest at a given moment, with any Treasure Hours multiplier applied
const chanceAt = (objReward, dblMoment) => {
    let dblMultiplier = 1;
    for (const objWindow of objApp.objTreasure.arrWindows) {
        if (dblMoment >= new Date(objWindow.strStart).getTime() && dblMoment < new Date(objWindow.strEnd).getTime()) {
            dblMultiplier = Math.max(dblMultiplier, Number(objWindow.objMultipliers?.[objReward.strId]) || 1);
        }
    }
    return Math.min(1, dblMultiplier / objReward.dblOneIn);
};

// Odds of a reward over the chests in its scope: this week for weekly rewards, the season for the rest
const getRewardOdds = (objReward, objWeek, arrMoments) => {
    const objTreasure = objApp.objTreasure;
    const objBounds = getSeasonBounds();
    const dblFrom = objReward.bWeekly ? objWeek.dtStart.getTime() : objBounds.dblFrom;
    const dblTo = objReward.bWeekly ? objWeek.dtEnd.getTime() : objBounds.dblTo;
    const arrInScope = arrMoments.filter((dblMoment) => dblMoment >= dblFrom && dblMoment < dblTo);
    const intExtra = Math.max(0, Number(objReward.bWeekly ? objTreasure.objExtraWeek[objWeek.strKey] : objTreasure.intExtraSeason) || 0);
    const dblBase = 1 / objReward.dblOneIn;

    let dblNone = Math.pow(1 - dblBase, intExtra);
    let dblExpected = intExtra * dblBase;
    let intBoosted = 0;
    for (const dblMoment of arrInScope) {
        const dblChance = chanceAt(objReward, dblMoment);
        if (dblChance > dblBase * 1.0001) intBoosted++;
        dblNone *= 1 - dblChance;
        dblExpected += dblChance;
    }
    return {
        intChests: arrInScope.length + intExtra,
        intBoosted,
        dblPerChest: dblBase,
        dblAtLeastOne: 1 - dblNone,
        dblExpected,
        intForHalf: Math.ceil(Math.log(0.5) / Math.log(1 - dblBase))
    };
};

// Small percentages need more digits than big ones to say anything
const fmtPercent = (dblShare) => {
    const dblPercent = dblShare * 100;
    if (dblPercent === 0) return "0 %";
    const intDigits = dblPercent >= 10 ? 1 : dblPercent >= 1 ? 2 : dblPercent >= 0.01 ? 3 : dblPercent >= 0.0001 ? 5 : 7;
    return `${new Intl.NumberFormat(STR_LOCALE, { maximumFractionDigits: intDigits, minimumFractionDigits: Math.min(intDigits, 2) }).format(dblPercent)} %`;
};
const fmtWhole = (dblValue) => new Intl.NumberFormat(STR_LOCALE, { maximumFractionDigits: 0 }).format(dblValue);
const fmtDay = (dtDate) => dtDate.toLocaleDateString(STR_LOCALE, { day: "numeric", month: "short" });

// Shrinks a pasted or chosen picture and stores it inside the treasure data
const storeImage = async (strItemKey, objBlob) => {
    const objBitmap = await createImageBitmap(objBlob);
    const dblScale = Math.min(1, 480 / Math.max(objBitmap.width, objBitmap.height));
    const elCanvas = document.createElement("canvas");
    elCanvas.width = Math.round(objBitmap.width * dblScale);
    elCanvas.height = Math.round(objBitmap.height * dblScale);
    elCanvas.getContext("2d").drawImage(objBitmap, 0, 0, elCanvas.width, elCanvas.height);
    let strData = elCanvas.toDataURL("image/webp", 0.85);
    if (!strData.startsWith("data:image/webp")) strData = elCanvas.toDataURL("image/jpeg", 0.85);
    changeTreasure((objTreasure) => { objTreasure.objItems[strItemKey] = { ...(objTreasure.objItems[strItemKey] ?? {}), strImage: strData }; });
};

document.addEventListener("paste", (objEvent) => {

const elTreasure = document.getElementById("elTreasure");

// ---------------------------------------------------------------------------
// The official name and icon, from fortnite-api.com
//
// The weekly item's picture used to be a screenshot pasted by hand. The API serves the icon
// Epic ships and the name already translated, so searchLanguage has to be the same language the
// name is typed in: searching "Banano" while the API looks in English finds nothing at all.
// ---------------------------------------------------------------------------

const STR_FIND_URL = "https://fortnite-api.com/v2/cosmetics/br/search/all";

// Cars, jam tracks and instruments are not in the battle royale catalogue and have no search
// endpoint of their own, so each whole list is fetched once and sifted here: about 1,5 MB between
// the three. The battle royale catalogue is searched by the API instead, because downloading it
// means 20 MB. Without this, "Cadillac CT5" — a real weekly treasure — could not be found at all.
const ARR_CATALOGUES = [
    { strFamily: "cars", strUrl: "https://fortnite-api.com/v2/cosmetics/cars" },
    { strFamily: "tracks", strUrl: "https://fortnite-api.com/v2/cosmetics/tracks" },
    { strFamily: "instruments", strUrl: "https://fortnite-api.com/v2/cosmetics/instruments" }
];

// The shapes the API answers with, made into one. Battle royale items carry images.icon, cars and
// instruments only small and large, and a jam track has no name at all: it has a title and an
// artist, with the album art for a picture.
const readCosmetic = (objItem, strFamily) => {
    if (strFamily === "tracks") return { strName: objItem?.title, strKind: objItem?.artist ?? "", strImage: objItem?.albumArt ?? null };
    const strKind = [objItem?.type?.displayValue, objItem?.rarity?.displayValue].filter(Boolean).join(" · ");
    if (strFamily === "br") return { strName: objItem?.name, strKind, strImage: objItem?.images?.icon ?? objItem?.images?.smallIcon ?? objItem?.images?.featured ?? null };
    return { strName: objItem?.name, strKind, strImage: objItem?.images?.large ?? objItem?.images?.small ?? null };
};

// Accents and capitals out of the way, so "cadillac" finds "Cadillac CT5-V Blackwing"
const foldText = (strText) => String(strText ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

// The three lists, asked for once a run and kept. Started when the editing begins, so by the time
// anything is typed they are usually already here.
let objCataloguesWait = null;
const loadCatalogues = () => {
    if (objCataloguesWait) return objCataloguesWait;
    objCataloguesWait = Promise.all(ARR_CATALOGUES.map(async (objWhich) => {
        try {
            const objUrl = new URL(objWhich.strUrl);
            objUrl.search = new URLSearchParams({ language: STR_LANG });
            const objResponse = await fetch(objUrl);
            if (!objResponse.ok) throw new Error(String(objResponse.status));
            return [].concat((await objResponse.json())?.data ?? [])
                .map((objItem) => readCosmetic(objItem, objWhich.strFamily))
                .filter((objHit) => objHit.strName && objHit.strImage);
        } catch (objError) {
            return [];                 // one list missing must not sink the whole search
        }
    })).then((arrLists) => arrLists.flat());
    return objCataloguesWait;
};

let objFindAbort = null;
let bFindFocus = false;

const findCosmetics = async (strKey, strQuery) => {
    objFindAbort?.abort();
    const strTerm = strQuery.trim();
    bFindFocus = true;
    if (strTerm.length < 2) {
        objApp.objFind = { strKey, strQuery, bBusy: false, arrHits: [], strSaid: "Escribe al menos dos letras." };
        renderTreasure();
        return;
    }
    objApp.objFind = { strKey, strQuery, bBusy: true, arrHits: [], strSaid: "" };
    renderTreasure();

    const objAbort = new AbortController();
    objFindAbort = objAbort;
    let bFailed = false;

    // Battle royale is searched by the API; cars, tracks and instruments, here
    const findBattleRoyale = async () => {
        const objUrl = new URL(STR_FIND_URL);
        objUrl.search = new URLSearchParams({ language: STR_LANG, searchLanguage: STR_LANG, matchMethod: "contains", name: strTerm });
        const objResponse = await fetch(objUrl, { signal: objAbort.signal });
        if (!objResponse.ok && objResponse.status !== 404) throw new Error(String(objResponse.status));
        // 404 is how the API says "nothing by that name"
        const arrData = objResponse.status === 404 ? [] : [].concat((await objResponse.json())?.data ?? []);
        return arrData.map((objItem) => readCosmetic(objItem, "br")).filter((objHit) => objHit.strName && objHit.strImage);
    };
    const findInCatalogues = async () => {
        const strWanted = foldText(strTerm);
        return (await loadCatalogues()).filter((objHit) => foldText(objHit.strName).includes(strWanted));
    };

    const [arrBattleRoyale, arrRest] = await Promise.all([
        findBattleRoyale().catch(() => { bFailed = true; return []; }),
        findInCatalogues().catch(() => { bFailed = true; return []; })
    ]);
    if (objAbort.signal.aborted) return;

    const arrHits = [...arrBattleRoyale, ...arrRest].slice(0, 36);
    objApp.objFind = {
        strKey, strQuery, bBusy: false, arrHits,
        strSaid: arrHits.length ? "" : bFailed
            ? "No se pudo consultar fortnite-api.com. Revisa la conexión o pega una captura."
            : "Nada con ese nombre. Un objeto recién salido puede tardar en estar en la API: pega una captura."
    };
    bFindFocus = true;
    renderTreasure();
};

// Takes the name and the icon of the chosen one. The address shows straight away; then a copy is
// shrunk into the data, so the picture is still there without internet, like a pasted screenshot.
const takeCosmetic = async (strItemKey, objHit) => {
    changeTreasure((objData) => {
        const objItem = objData.objItems[strItemKey] ?? {};
        objData.objItems[strItemKey] = { ...objItem, strName: objHit.strName, strImage: objHit.strImage ?? objItem.strImage ?? null };
    });
    objApp.objFind = null;
    if (!objHit.strImage) { renderTreasure(); return; }
    try {
        const objResponse = await fetch(objHit.strImage);
        if (objResponse.ok) await storeImage(strItemKey, await objResponse.blob());
    } catch (objError) { /* the address stays, and that still shows while there is internet */ }
    renderTreasure();
};

// ---------------------------------------------------------------------------
// Treasure Hours: the same instant everywhere, so every PC shows its own clock
//
// Epic announces one world-wide window, and the press writes it in whatever zone it happens to
// use. Stored in UTC, read here in the zone this PC is set to, with the zone named next to it so
// it can be checked: a player in Madrid and one in Los Angeles see different hours, same moment.
// ---------------------------------------------------------------------------

const STR_TIME_ZONE = (() => {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (objError) { return ""; }
})();

const fmtZoneOffset = (dtMoment) => {
    const intMinutes = -dtMoment.getTimezoneOffset();
    const intAbs = Math.abs(intMinutes);
    return `UTC${intMinutes < 0 ? "−" : "+"}${Math.floor(intAbs / 60)}${intAbs % 60 ? `:${String(intAbs % 60).padStart(2, "0")}` : ""}`;
};
const strZoneLabel = (dtMoment) => (STR_TIME_ZONE ? `${STR_TIME_ZONE} (${fmtZoneOffset(dtMoment)})` : fmtZoneOffset(dtMoment));
const fmtTimeOfDay = (dtMoment) => dtMoment.toLocaleTimeString(STR_LOCALE, { hour: "2-digit", minute: "2-digit" });
const fmtWeekDay = (dtMoment) => dtMoment.toLocaleDateString(STR_LOCALE, { weekday: "short", day: "numeric", month: "short" });
const fmtUtcTime = (dtMoment) => `${String(dtMoment.getUTCHours()).padStart(2, "0")}:${String(dtMoment.getUTCMinutes()).padStart(2, "0")}`;

// "2 h 14 min", "14 min", "45 s": the closer it gets, the finer
const fmtLeft = (dblMs) => {
    const intSeconds = Math.max(0, Math.round(dblMs / 1000));
    if (intSeconds >= 3600) return `${Math.floor(intSeconds / 3600)} h ${Math.floor((intSeconds % 3600) / 60)} min`;
    if (intSeconds >= 60) return `${Math.floor(intSeconds / 60)} min`;
    return `${intSeconds} s`;
};

const renderTreasureHours = () => {
    const objTreasure = objApp.objTreasure;
    const dblNow = Date.now();
    const objBounds = getSeasonBounds();

    const arrAll = objTreasure.arrWindows
        .map((objWindow) => ({ objWindow, dblStart: new Date(objWindow.strStart).getTime(), dblEnd: new Date(objWindow.strEnd).getTime() }))
        .filter((objRow) => Number.isFinite(objRow.dblStart) && Number.isFinite(objRow.dblEnd) && objRow.dblEnd > objRow.dblStart && objRow.dblEnd > objBounds.dblFrom)
        .sort((objLeft, objRight) => objLeft.dblStart - objRight.dblStart);

    // Everything still to come, and the last one that went by, so the panel stays small
    const arrGone = arrAll.filter((objRow) => objRow.dblEnd <= dblNow);
    const arrShown = [...arrGone.slice(-1), ...arrAll.filter((objRow) => objRow.dblEnd > dblNow)];

    const arrRows = arrShown.map(({ objWindow, dblStart, dblEnd }) => {
        const dtStart = new Date(dblStart);
        const dtEnd = new Date(dblEnd);
        const bLive = dblNow >= dblStart && dblNow < dblEnd;
        const bGone = dblEnd <= dblNow;
        const bSameDay = dtStart.toDateString() === dtEnd.toDateString();
        const arrBoost = getShownRewards()
            .filter((objReward) => Number(objWindow.objMultipliers?.[objReward.strId]) > 1)
            .map((objReward) => el("span", { class: "mult" }, [
                el("b", { "data-notr": true, text: `×${fmtNumber(Number(objWindow.objMultipliers[objReward.strId]))}` }),
                objReward.strName
            ]));

        return el("li", { class: bLive ? "live" : bGone ? "past" : "soon" }, [
            // Already the reader's own clock and language, so the translator leaves it alone
            el("div", { class: "when", "data-notr": true }, [
                el("b", { text: `${fmtWeekDay(dtStart)}, ${fmtTimeOfDay(dtStart)} – ${bSameDay ? "" : `${fmtWeekDay(dtEnd)}, `}${fmtTimeOfDay(dtEnd)}` }),
                el("small", { text: `${fmtUtcTime(dtStart)} – ${fmtUtcTime(dtEnd)} UTC` })
            ]),
            el("div", { class: "state", text: bLive ? `en directo, queda ${fmtLeft(dblEnd - dblNow)}` : bGone ? "ya pasó" : `empieza en ${fmtLeft(dblStart - dblNow)}` }),
            el("div", { class: "boost" }, arrBoost.length ? arrBoost : el("span", { class: "none", text: "sin multiplicadores apuntados" }))
        ]);
    });

    return el("section", { class: "t-hours", id: "elTreasureHours" }, [
        el("header", {}, [
            el("h2", { text: "Horas del tesoro" }),
            el("p", {}, [
                "Son el mismo instante en todo el mundo. Tu PC está en ",
                el("b", { "data-notr": true, text: strZoneLabel(new Date()) }),
                ", así que las horas de abajo ya son las tuyas."
            ])
        ]),
        arrRows.length ? el("ul", {}, arrRows) : el("p", { class: "empty", text: "Aún no hay Horas del tesoro apuntadas. Se añaden en «Editar tesoros»." })
    ]);
};
