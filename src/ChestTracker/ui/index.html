<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortnite Chest Counter</title>
<link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'><rect x='2' y='2' width='60' height='60' rx='15' fill='%232e2558'/><rect x='2.5' y='2.5' width='59' height='59' rx='14.5' fill='none' stroke='%23f0b429' stroke-opacity='.55'/><path d='M13 30c0-9 8-15 19-15s19 6 19 15z' fill='%23f0b429'/><rect x='13' y='30' width='38' height='20' rx='3' fill='%23c98500'/><rect x='13' y='30' width='38' height='5' fill='%238a5a00'/><rect x='21' y='15.6' width='4.5' height='34.4' fill='%238a5a00' opacity='.6'/><rect x='38.5' y='15.6' width='4.5' height='34.4' fill='%238a5a00' opacity='.6'/><rect x='28' y='29' width='8' height='10' rx='2' fill='%23fff1c1'/><circle cx='32' cy='33.5' r='1.4' fill='%238a5a00'/></svg>">
<style>
/* ------------------------------------------------------------------ tokens */
:root {
    color-scheme: dark;
    --page: #1e1938;          /* storm violet, the page */
    --card: #272049;          /* widget surface (chart surface) */
    --card-raised: #30285a;
    --line: #3c3370;
    --ink: #f4f0ff;
    --ink-2: #bdb4de;
    --ink-3: #8e84b8;
    --gold: #f0b429;          /* interface accent: focus, primary actions */
    --chest: #c98500;         /* series: cofres */
    --special: #3987e5;       /* series: cofres especiales */
    --spirit: #199e70;        /* series: cofres de espíritu */
    --quiet: #6f6699;         /* de-emphasis marks: ammo and other containers */
    --danger: #e66767;
    --good: #1fa890;          /* better than your own average (always with an arrow or a sign) */
    --radius: 10px;
    --font: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
/* With the drawer open the page behind it must not scroll too: two scrollbars at once, and the
   wheel moving whichever happened to be under the pointer. Taking the scrollbar away widens the
   page, so setDrawerOpen pads the body by exactly its width and nothing shifts sideways. */
body.drawer-open { overflow: hidden; }
body {
    background: var(--page);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Figures use the condensed width of the same family */
.figure { font-stretch: 75%; font-weight: 700; letter-spacing: -0.01em; line-height: 1; }

/* ------------------------------------------------------------------ header */
.top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 18px 24px 10px;
}
.top h1 { margin: 0; font-size: 26px; font-stretch: 75%; font-weight: 700; letter-spacing: 0.01em; }
.brand { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.brand svg { width: 42px; height: 42px; flex: none; filter: drop-shadow(0 0 10px rgba(240, 180, 41, 0.28)); }
.brand .brand-game { font-weight: 400; color: var(--ink-2); }
.brand-version { display: block; font-size: 11px; font-weight: 400; font-stretch: 100%; color: var(--ink-3); letter-spacing: 0.02em; line-height: 1; margin-top: 2px; }
.brand .brand-name { font-weight: 700; color: var(--ink); }
.segmented.lang button { min-width: 38px; font-size: 13px; }
.update-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 24px 14px; padding: 10px 16px; border-radius: var(--radius); background: var(--card); border-left: 4px solid var(--gold); }
.update-bar[hidden], .fail-bar[hidden] { display: none; }
.fail-bar { margin: 0 24px 10px; padding: 9px 14px; border-radius: var(--radius); background: var(--card); border-left: 4px solid var(--danger); }
.fail-bar .head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.fail-bar .head .icon { width: 20px; height: 20px; border-radius: 50%; background: var(--danger); color: #1e1938; font-weight: 800; font-size: 13px; display: grid; place-items: center; flex: none; }
.fail-bar .head b { font-size: 14.5px; }
/* The reason goes under the title: folded it is one line, opened it is read whole */
.fail-bar .head .why { color: var(--ink-2); font-size: 13px; flex-basis: 100%; min-width: 0; padding-left: 30px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fail-bar .grow { flex: 1; }
.fail-bar .x { background: none; border: 0; color: var(--ink-3); font-size: 18px; cursor: pointer; padding: 0 4px; }
/* However many there are, the list never takes more than a corner of the screen */
.fail-bar .list { margin-top: 8px; max-height: min(34vh, 290px); overflow-y: auto; overscroll-behavior: contain; }
.fail-bar.open .head .why { white-space: normal; }
.fail-bar ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.fail-bar li { background: var(--card-raised); border-radius: 7px; padding: 5px 9px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.fail-bar li .file { font-weight: 600; font-size: 13px; flex: 1 1 220px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fail-bar li .meta { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.fail-bar li .msg { color: var(--ink-2); font-size: 12.5px; flex-basis: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fail-bar li .btn.small { padding: 2px 8px; font-size: 12px; }
.fail-bar .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.fail-bar .row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Salvar el Mundo: the V-Bucks on offer today, hanging from a button in the header */
.vbucks { position: relative; display: flex; }
.btn .n:not(:empty) { margin-left: 7px; color: var(--gold); font-weight: 700; }
.vb-pop {
    position: absolute; top: calc(100% + 7px); right: 0; z-index: 60;
    width: 274px; max-width: calc(100vw - 32px);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); padding: 11px 13px;
}
.vb-pop[hidden] { display: none; }
.vb-pop .vb-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.vb-pop .vb-head b { font-size: 20px; color: var(--gold); }
.vb-pop .vb-head .tag { font-size: 11.5px; color: var(--ink-3); }
.vb-pop ul { list-style: none; margin: 8px 0 0; padding: 0; }
.vb-pop li { display: flex; align-items: baseline; gap: 7px; font-size: 13px; line-height: 1.35; border-top: 1px solid var(--line); padding: 5px 0; }
.vb-pop li .pay { color: var(--gold); white-space: nowrap; font-size: 14px; }
.vb-pop li .what { color: var(--ink-2); }
.vb-pop .none { margin: 7px 0 0; font-size: 13px; color: var(--ink-2); }
.vb-pop .src { margin: 8px 0 0; font-size: 11px; color: var(--ink-3); }
.vb-pop .src span + span::before { content: " \00b7  "; }

/* What went into each version: a dialog over the dashboard, opened from the header */
.btn.has-news::after {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); margin-left: 8px; vertical-align: 1px;
}
.news { display: none; width: min(720px, calc(100vw - 32px)); max-height: min(78vh, 880px); padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); overflow: hidden; }
.news[open] { display: flex; flex-direction: column; }
.news::backdrop { background: rgba(14, 10, 32, 0.66); }
.news .head { display: flex; align-items: center; gap: 12px; padding: 15px 20px; background: var(--card-raised); border-bottom: 1px solid var(--line); }
.news .head b { font-size: 17px; }
.news .head .count { color: var(--ink-3); font-size: 13px; }
.news .head .grow { flex: 1; }
.news .head .x { background: none; border: 0; color: var(--ink-3); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 4px; }
.news .head .x:hover { color: var(--ink); }
.news .body { overflow-y: auto; padding: 0 20px 18px; }
.news .body:focus { outline: none; }
.news .entry { padding: 16px 0; border-top: 1px solid var(--line); }
.news .entry:first-child { border-top: 0; }
.news .entry .when { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.news .entry .ver { font-stretch: 75%; font-size: 19px; letter-spacing: 0.02em; color: var(--ink-2); }
.news .entry.latest .ver { color: var(--gold); }
.news .entry .when .date { color: var(--ink-3); font-size: 13px; }
.news ul { list-style: none; margin: 11px 0 0; padding: 0; display: grid; gap: 9px; }
.news li { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: baseline; }
.news li .tag { justify-self: start; background: var(--card-raised); border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
.news li .tag.nuevo { color: var(--good); }
.news li .tag.mejorado { color: var(--special); }
.news li .tag.arreglado { color: var(--danger); }
.news li .what { color: var(--ink-2); }
@media (max-width: 560px) {
    .news li { grid-template-columns: 1fr; }
}

/* The asterisk on a match number: a mark you can ask about. Raised a little and in the gold of
   the interface's own prompts, so it reads as an offer and not as part of the figure. */
td .star { background: none; border: 0; padding: 0 0 0 3px; color: var(--gold); font: inherit; line-height: 1; cursor: help; vertical-align: super; font-size: 12px; }
td .star:hover, td .star:focus-visible { color: var(--ink); }

.status button.linkish { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; text-decoration: underline dotted; }
.update-bar b { color: var(--gold); }
.update-bar .grow { flex: 1; }
.update-bar a { color: var(--ink-2); }
.top .grow { flex: 1; }
.status { padding: 0 24px 14px; color: var(--ink-3); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.status .live { color: var(--ink); }
.status .warn, .status .btn.warn { color: var(--danger); }
.status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--spirit); margin-right: 6px; }
.status .dot.off { background: var(--danger); }

.segmented { display: inline-flex; background: var(--card); border-radius: 8px; padding: 3px; }
.segmented button {
    border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; cursor: pointer; color: var(--ink-2);
}
.segmented button[aria-pressed="true"] { background: var(--card-raised); color: var(--ink); }

.btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 7px 14px; border-radius: 8px; cursor: pointer;
}
.btn:hover { background: var(--card-raised); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #241a00; font-weight: 600; }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--card-raised); color: var(--ink); }

/* ------------------------------------------------------------------ grid */
.board {
    display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px;
    padding: 0 24px 40px; align-items: stretch;
}
.widget {
    grid-column: span var(--span, 6);
    background: var(--card); border-radius: var(--radius);
    padding: 16px 18px; min-width: 0; position: relative;
    display: flex; flex-direction: column;
}
.widget h2 { margin: 0 0 10px; font-size: 15px; font-weight: 500; color: var(--ink-2); }
.widget .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.squad-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 12px; }
.squad-bar .scope { color: var(--ink-2); font-size: 13.5px; }
.squad-bar .scope small { display: block; color: var(--ink-3); font-size: 12.5px; }
.squad-bar .grow { flex: 1; }
.squad-more { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; }
.squad-more .hint { margin: 0; }
.widget .head h2 { margin: 0; flex: 1; }
.widget.collapsed .head { margin-bottom: 0; }
.widget.collapsed { align-self: start; }
.btn.collapse { padding: 2px 8px; font-size: 12.5px; }
.widget .body { flex: 1; min-width: 0; }
.widget .hint { color: var(--ink-3); font-size: 13px; margin: 8px 0 0; }

@media (max-width: 1000px) {
    .board { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .widget { grid-column: span 6; }
    .widget[data-kind="kpi"] { grid-column: span 2; }
}
@media (max-width: 620px) {
    .top, .status, .board { padding-left: 14px; padding-right: 14px; }
    .widget[data-kind="kpi"] { grid-column: span 3; }
}

/* Edit mode */
.edit-bar { display: none; align-items: center; flex-wrap: wrap; gap: 4px; margin: -6px -8px 8px; }
.widget[data-kind="kpi"] .edit-bar .name { display: none; }
.widget[data-kind="kpi"] .edit-bar button { width: 24px; height: 24px; font-size: 13px; }
.widget[data-kind="kpi"] .edit-bar button.wide { width: auto; padding: 0 7px; font-size: 12.5px; }
body.editing .edit-bar { display: flex; }
body.editing .widget { outline: 1px dashed var(--ink-3); outline-offset: -1px; cursor: grab; }
body.editing .widget.dragging { opacity: 0.45; }
.edit-bar .name { flex: 1; font-size: 13px; color: var(--ink-2); padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.edit-bar button {
    border: 0; background: var(--card-raised); color: var(--ink); width: 28px; height: 28px; border-radius: 6px;
    cursor: pointer; display: grid; place-items: center; font-size: 15px; padding: 0;
}
.edit-bar button:hover { background: var(--line); }
.edit-bar button:disabled { opacity: 0.35; cursor: default; }
.edit-bar button.wide { width: auto; padding: 0 9px; font-size: 13px; }

.tray {
    display: none; margin: 0 24px 14px; padding: 12px 14px; border: 1px dashed var(--ink-3); border-radius: var(--radius);
    flex-wrap: wrap; gap: 8px; align-items: center;
}
body.editing .tray { display: flex; }
.tray .label { color: var(--ink-2); margin-right: 6px; }
.tray .grow { flex: 1; }

/* ------------------------------------------------------------------ KPI tiles */
.kpi .value { font-size: 44px; }
.kpi .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 8px; }
.kpi .sub + .sub { margin-top: 2px; color: var(--ink-3); }
.kpi .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; }

/* ------------------------------------------------------------------ match widget */
.match-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; margin-bottom: 14px; }
.match-head .title { font-size: 22px; font-stretch: 75%; font-weight: 700; color: var(--ink); }
.match-head .meta { color: var(--ink-2); }
.match-head .grow { flex: 1; }
.scoreline { display: flex; flex-wrap: wrap; gap: 14px 34px; margin-bottom: 16px; }
.score .value { font-size: 56px; display: flex; align-items: baseline; gap: 6px; }
.score .value small { font-size: 18px; font-weight: 500; color: var(--ink-3); font-stretch: 100%; }
.score .label { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; display: flex; align-items: center; }
.score .label .swatch { width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 22px; color: var(--ink-2); font-size: 13.5px; margin-top: 12px; }
.chips b { color: var(--ink); font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink-2); font-size: 13px; margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
.legend svg { display: block; }

svg text { font-family: var(--font); fill: var(--ink-3); font-size: 12px; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .lane-label { fill: var(--ink-2); font-size: 12.5px; }
svg .value-label { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
svg .bar { cursor: pointer; }
svg .bar:hover .seg, svg .bar:focus-visible .seg { filter: brightness(1.25); }
svg .bar:focus-visible { outline: none; }
svg .bar.selected text { fill: var(--ink); }

/* ------------------------------------------------------------------ tables */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; }
th { color: var(--ink-3); font-weight: 500; font-size: 13px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; }
th:first-child, td:first-child, th.left, td.left { text-align: left; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--card-raised); }
tbody tr.selected td { background: var(--card-raised); }
tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--gold); }
tbody tr.excluded td { color: var(--ink-3); text-decoration: line-through; }
tbody tr.excluded td:last-child { text-decoration: none; }
td .win { color: var(--ink); font-weight: 700; }
.scroll-y { max-height: 330px; overflow-y: auto; }
.scroll-y thead th { position: sticky; top: 0; background: var(--card); }
.columns-pick { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 10px; color: var(--ink-2); font-size: 13px; background: var(--card-raised); border-radius: 8px; padding: 10px 12px; }
.table-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; font-size: 13.5px; color: var(--ink-2); }
.table-tools select { background: var(--card-raised); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; }
.table-tools .grow { flex: 1; }
.table-more { margin-top: 10px; display: flex; gap: 10px; align-items: center; color: var(--ink-3); font-size: 13px; }
.columns-pick label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }

/* ------------------------------------------------------------------ are you getting better */
table.progress td.now { font-weight: 700; color: var(--ink); }
table.progress td.before { color: var(--ink-3); }
table.progress td.change { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
table.progress td.change.good { color: var(--good); }
table.progress td.change.bad { color: var(--danger); }
table.progress tbody tr:hover { background: var(--card-raised); }

/* ------------------------------------------------------------------ map tab */
main.map { padding: 0 24px 40px; }

/* ------------------------------------------------------------------ shop tab */
main.shop { padding: 0 24px 40px; }
.shop[hidden] { display: none; }
.sh-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 10px; }
.sh-bar .count-down { display: flex; flex-direction: column; gap: 2px; }
.sh-bar .count-down .label { color: var(--ink-2); font-size: 13.5px; }
.sh-clock { font-size: 32px; font-stretch: 75%; font-weight: 700; color: var(--gold); line-height: 1.05; }
.sh-clock small { font-size: 15px; font-weight: 400; font-stretch: 100%; color: var(--ink-2); margin: 0 9px 0 3px; }
.sh-clock small:last-child { margin-right: 0; }
.sh-bar .at { color: var(--ink-3); font-size: 12.5px; }
.sh-bar .grow { flex: 1; }
.sh-sum { color: var(--ink-2); font-size: 13.5px; margin: 0 0 16px; }
.sh-sum .old { color: var(--gold); }
.sh-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 18px; }
.sh-find { background: var(--card-raised); border: 1px solid var(--line); border-radius: 7px; padding: 8px 11px; flex: 1; min-width: 200px; max-width: 360px; }
.sh-sort { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13.5px; }
.sh-sort select { background: var(--card-raised); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; color: var(--ink); }
.sh-block { margin-bottom: 28px; }
.sh-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; }
.sh-head h2 { margin: 0; font-size: 21px; font-stretch: 75%; font-weight: 700; }
.sh-head .count { color: var(--ink-3); font-size: 14px; }
.sh-block .why { margin: 0 0 12px; color: var(--ink-2); font-size: 13.5px; }
.sh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(166px, 1fr)); gap: 12px; }
.sh-card { background: var(--card); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; border-top: 3px solid var(--line); }
.sh-card .pic { aspect-ratio: 1 / 1; background: var(--card-raised); position: relative; overflow: hidden; }
.sh-card .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sh-card .pic .glyph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 52px; font-stretch: 75%; font-weight: 700; color: var(--line); }
.sh-card .flags { position: absolute; top: 7px; left: 7px; right: 7px; display: flex; flex-wrap: wrap; gap: 5px; }
.sh-flag { font-size: 10px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; background: var(--card); color: var(--ink); }
.sh-flag.new { background: var(--gold); color: #241a00; }
.sh-flag.out { background: var(--danger); color: #1e1938; }
.sh-flag.off { background: var(--spirit); color: #e9fff8; }
.sh-card .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.sh-card h3 { margin: 0; font-size: 15px; font-stretch: 75%; font-weight: 700; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sh-card .what { margin: 0; color: var(--ink-2); font-size: 12px; }
.sh-card .price { margin: 5px 0 0; display: flex; align-items: center; gap: 6px; font-size: 17px; font-stretch: 75%; }
.sh-card .price img { width: 17px; height: 17px; display: block; }
.sh-card .price s { color: var(--ink-3); font-size: 13px; font-stretch: 100%; }
.sh-card .where { margin: auto 0 0; padding-top: 7px; color: var(--ink-3); font-size: 11.5px; }
/* The colour band is the game's own rarity, which is how anybody reads a shop tile */
.sh-card.r-common { border-top-color: #8e95a8; }
.sh-card.r-uncommon { border-top-color: #5eb21a; }
.sh-card.r-rare { border-top-color: #2e9bdc; }
.sh-card.r-epic { border-top-color: #9b4dff; }
.sh-card.r-legendary { border-top-color: #f08020; }
.sh-card.r-mythic { border-top-color: #eaba2a; }
.sh-card.r-icon { border-top-color: #3edcd0; }
.sh-card.r-marvel { border-top-color: #d9372a; }
.sh-card.r-dc { border-top-color: #4f7ce0; }
.sh-card.r-starwars { border-top-color: #1f8df0; }
.sh-card.r-dark { border-top-color: #c4249b; }
.sh-card.r-gaminglegends { border-top-color: #5b4bd6; }
.sh-card.r-shadow { border-top-color: #585b66; }
.sh-card.r-slurp { border-top-color: #1cc3cf; }
.sh-card.r-lava { border-top-color: #e0792c; }
.sh-card.r-frozen { border-top-color: #8fd8f2; }
.sh-card.r-platform { border-top-color: #4ca8c9; }
.sh-card { cursor: pointer; }
.sh-card:hover .pic img { transform: scale(1.04); }
.sh-card .pic img { transition: transform 0.18s ease; }
.sh-card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.shop-view { display: none; width: min(560px, calc(100vw - 32px)); max-height: min(88vh, 900px); padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); overflow: hidden; }
.shop-view[open] { display: flex; flex-direction: column; }
.shop-view::backdrop { background: rgba(14, 10, 32, 0.72); }
.shop-view .head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; background: var(--card-raised); border-bottom: 1px solid var(--line); }
.shop-view .head b { font-size: 18px; font-stretch: 75%; line-height: 1.2; }
.shop-view .head .grow { flex: 1; }
.shop-view .head .x { background: none; border: 0; color: var(--ink-3); font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; }
.shop-view .head .x:hover { color: var(--ink); }
.shop-view .body { overflow-y: auto; padding: 0 0 16px; }
.shop-view .body:focus { outline: none; }
.shop-view .shot { position: relative; aspect-ratio: 1 / 1; background: var(--card-raised); overflow: hidden; }
.shop-view .shot img { width: 100%; height: 100%; object-fit: contain; display: block; }
.shop-view .shot .glyph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 120px; font-stretch: 75%; font-weight: 700; color: var(--line); }
.shop-view .shot .flags { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.shop-view .what { margin: 14px 18px 0; color: var(--ink-2); font-size: 14px; }
.shop-view .price { margin: 10px 18px 0; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 30px; font-stretch: 75%; font-weight: 700; }
.shop-view .price img { width: 26px; height: 26px; display: block; }
.shop-view .price s { color: var(--ink-3); font-size: 18px; font-weight: 400; font-stretch: 100%; }
.shop-view .price .saved { font-size: 13px; font-weight: 800; font-stretch: 100%; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: var(--spirit); color: #e9fff8; }
.shop-view .note { margin: 12px 18px 0; color: var(--ink-2); font-size: 13.5px; background: var(--card-raised); border-radius: 8px; padding: 9px 12px; }
.shop-view .when { margin: 12px 18px 0; color: var(--ink-3); font-size: 12.5px; }

/* A squadmate's profile: a duel, and read as one. A list of names raises exactly one question,
   and every row here answers it the same way: one of their figures on the left, the same figure
   of yours on the right, and a bar underneath split between the two, so the shape of the row
   says who is ahead before a single number is read. */
.mate-view { display: none; width: min(560px, calc(100vw - 32px)); max-height: min(88vh, 900px); padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); overflow: hidden; }
.mate-view[open] { display: flex; flex-direction: column; }
.mate-view::backdrop { background: rgba(14, 10, 32, 0.72); }
.mate-view .head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 13px 18px; background: var(--card-raised); border-bottom: 1px solid var(--line); }
.mate-view .head b { font-size: 19px; font-stretch: 75%; line-height: 1.2; }
.mate-view .head .grow { flex: 1; }
.mate-view .head .tag { background: var(--card); border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.mate-view .head .x { background: none; border: 0; color: var(--ink-3); font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; }
.mate-view .head .x:hover { color: var(--ink); }
.mate-view .body { overflow-y: auto; padding: 15px 18px 18px; display: grid; gap: 13px; }
.mate-view .body:focus { outline: none; }

/* The verdict: the one sentence somebody opened this for, and the two figures it is made of */
.m-verdict { background: var(--card-raised); border-radius: var(--radius); padding: 12px 14px 11px; text-align: center; }
.m-verdict .say { margin: 0 0 10px; font-size: 14.5px; font-weight: 600; line-height: 1.3; }
.m-verdict.tie .say { color: var(--ink-2); font-weight: 500; }
.m-verdict .pair { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.m-verdict .pair > div { min-width: 0; }
.m-verdict .pair b { display: block; font-size: 31px; font-stretch: 75%; line-height: 1; font-variant-numeric: tabular-nums; }
.m-verdict .pair small { display: block; margin-top: 4px; font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-verdict .vs { font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }
.m-verdict .what { margin: 9px 0 0; font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.05em; }

/* Not who averages more, but how often they beat you: one blowout cannot carry this one */
.m-score { background: var(--card-raised); border-radius: var(--radius); padding: 11px 14px 12px; }
.m-score h3 { margin: 0 0 6px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); }
.m-score .line { display: flex; align-items: baseline; gap: 9px; }
.m-score .line b { font-size: 26px; font-stretch: 75%; line-height: 1; font-variant-numeric: tabular-nums; }
.m-score .line .dash { color: var(--ink-3); font-size: 19px; }
.m-score .line .grow { flex: 1; }
.m-score .line small { color: var(--ink-3); font-size: 12px; text-align: right; }

.m-rows { display: grid; gap: 11px; }
.m-duel { display: grid; grid-template-columns: 72px 1fr 72px; align-items: baseline; gap: 2px 8px; }
.m-duel b { font-size: 19px; font-stretch: 75%; font-variant-numeric: tabular-nums; }
.m-duel .his { text-align: left; }
.m-duel .yours { text-align: right; }
.m-duel .label { text-align: center; font-size: 12.5px; color: var(--ink-2); line-height: 1.25; }
.m-duel .label small { display: block; font-size: 11px; color: var(--ink-3); }
.m-duel .track { grid-column: 1 / -1; display: flex; gap: 3px; height: 8px; margin-top: 4px; }
/* Gold is the winning side and muted is the losing one, whichever side each falls on. The
   board gives you the chest colour and a rival the neutral one, but there the two sit on rows
   of their own; here they meet end to end in one bar, and chest gold beside crown gold is a
   pair of colours nobody can tell apart at eight pixels tall. */
.m-duel .track i { display: block; height: 100%; min-width: 3px; border-radius: 999px; background: var(--ink-3); opacity: 0.5; }
.m-duel .track i.win { background: var(--gold); opacity: 1; }
/* Nothing on either side: a half-and-half bar would be a tidy lie, so the track stays flat */
.m-duel .track.empty i { background: var(--line); opacity: 1; min-width: 0; }

.mate-view .foot { margin: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.4; }
.mate-view .foot.small { font-size: 11.5px; color: var(--ink-3); }

/* A name you can open. It has to read as a name first and a control second, so it keeps the
   type it sits in and only the dotted underline says there is something behind it. */
.namelink { background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; font-size: inherit; font-weight: inherit; font-stretch: inherit; line-height: inherit; color: inherit; text-align: inherit; border-bottom: 1px dotted var(--ink-3); }
.namelink:hover { color: var(--gold); border-bottom-color: var(--gold); }
.namelink:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }

@media (max-width: 460px) {
    .m-duel { grid-template-columns: 58px 1fr 58px; }
    .m-duel b { font-size: 17px; }
    .m-verdict .pair b { font-size: 26px; }
}
@media (max-width: 760px) {
    main.shop { padding: 0 16px 40px; }
    .sh-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
.m-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
.m-top .grow { flex: 1; }
.m-count { color: var(--ink-2); font-size: 14px; }
.m-count b { color: var(--ink); font-size: 17px; font-stretch: 75%; }
.m-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 18px; align-items: start; }
.m-board { position: relative; aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; background: #0e2a44; border: 1px solid var(--line); }
.m-board img, .m-board canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.m-board canvas { mix-blend-mode: hard-light; }
.m-noimage { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); }
/* The way you went, and the chests of that one match, both drawn over the picture itself */
.m-board .m-route, .m-board .m-dots { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.m-wait { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 0 28px; text-align: center; color: var(--ink-2); font-size: 13.5px; }
.m-legend { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: 10px 0 0; font-size: 12px; color: var(--ink-2); }
.m-legend .grow { flex: 1; }
.m-legend .quiet { color: var(--ink-3); }
.m-legend span + span:not(.grow):not(.quiet) { margin-right: 10px; }
.m-legend .k-start, .m-legend .k-end, .m-legend .k-chest { width: 11px; height: 11px; border-radius: 50%; margin-right: -2px; }
.m-legend .k-start { border: 2.5px solid hsl(192 90% 70%); }
.m-legend .k-end { background: hsl(288 90% 62%); }
.m-legend .k-chest { background: rgba(240, 180, 41, 0.92); }
/* The route on its own, over whatever tab is being read */
.route-view { display: none; width: min(840px, calc(100vw - 32px)); max-height: min(92vh, 1000px); padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--ink); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); overflow: hidden; }
.route-view[open] { display: flex; flex-direction: column; }
.route-view::backdrop { background: rgba(14, 10, 32, 0.72); }
.route-view .head { display: flex; align-items: center; gap: 12px; padding: 13px 18px; background: var(--card-raised); border-bottom: 1px solid var(--line); }
.route-view .head b { font-size: 16px; font-stretch: 75%; }
.route-view .head .grow { flex: 1; }
.route-view .head .x { background: none; border: 0; color: var(--ink-3); font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; }
.route-view .head .x:hover { color: var(--ink); }
.route-view .body { overflow-y: auto; padding: 14px 18px 16px; }
.route-view .body:focus { outline: none; }
.m-place { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; pointer-events: none; }
.m-place i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, 0.85); box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45); }
.m-place b { font-size: 11.5px; font-stretch: 75%; letter-spacing: 0.03em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 3px #000, 0 0 8px #000; white-space: nowrap; }
.m-side h2 { margin: 0 0 10px; font-size: 16px; }
.m-side .scroll-y { max-height: 60vh; }
table.m-rank td { padding: 5px 7px; }
table.m-rank td.bar { width: 100%; padding: 5px 4px; }
table.m-rank td.bar i { display: block; height: 7px; border-radius: 4px; background: var(--chest); min-width: 2px; }
table.m-rank td.share { color: var(--ink-3); font-size: 12.5px; }
@media (max-width: 1100px) {
    .m-grid { grid-template-columns: minmax(0, 1fr); }
    .m-side .scroll-y { max-height: none; }
}

/* ------------------------------------------------------------------ treasure tab */
.segmented.tabs button[aria-pressed="true"] { background: var(--gold); color: #241a00; font-weight: 600; }
body:not([data-tab="partidas"]) #elRange, body:not([data-tab="partidas"]) #elEditToggle, body:not([data-tab="partidas"]) .tray { display: none; }
main.treasure { padding: 0 24px 20px; }
main.treasure[hidden], main.board[hidden], main.live[hidden] { display: none; }

/* ------------------------------------------------------------------ live tab */
main.live { padding: 0 24px 14px; }
.l-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; background: var(--card); border-radius: var(--radius); padding: 12px 20px; margin-bottom: 10px; }
.l-top .grow { flex: 1; }
.l-pill { display: inline-flex; align-items: center; gap: 9px; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-stretch: 75%; font-size: 18px; letter-spacing: 0.04em; border: 2px solid var(--ink-3); color: var(--ink-2); }
.l-pill i { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-3); }
.l-pill.on { border-color: var(--spirit); color: var(--ink); }
.l-pill.on i { background: var(--spirit); animation: l-blink 1.2s ease-in-out infinite; }
/* How the squad finished, one bar each */
.l-squad .l-score { display: grid; gap: 8px; margin-top: 10px; }
/* Fixed columns, so every bar starts and ends in the same place and their lengths mean something */
.l-row { display: grid; grid-template-columns: 18px minmax(0, 180px) 1fr 56px; align-items: center; gap: 10px; }
.l-row .crownslot { display: inline-flex; justify-content: center; }
.l-row .crownslot .crown { margin: 0; }
.l-row .whocell { display: flex; align-items: center; gap: 6px; min-width: 0; }
.l-row .who { font-weight: 600; font-stretch: 75%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.l-row .tag { background: var(--card-raised); border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--ink-2); }
.l-row .track { flex: 1; height: 12px; background: var(--card-raised); border-radius: 999px; overflow: hidden; }
.l-row .track i { display: block; height: 100%; background: var(--ink-3); border-radius: 999px; transition: width 0.5s ease; }
.l-row.you .track i { background: var(--chest); }
.l-row.winner .track i { background: var(--gold); }
.l-row.guess .track i { background: var(--ink-3); opacity: 0.55; }
.l-row.guess .who, .l-row.guess b { color: var(--ink-2); }
.l-row b, .l-row .nodata { text-align: right; }
.l-row .nodata { color: var(--ink-3); font-size: 19px; }
.l-row b { font-size: 19px; }
.l-row.winner b { color: var(--gold); }
/* The crown lands once, rather than being there from the start: it drops in spinning, lands
   heavy, and throws off a ring of light. Winning the chest count is the whole point of a
   Treasure Hour, so it is worth a moment. */
.crown.pop {
    position: relative; display: inline-block; transform-origin: 50% 90%;
    animation: crown-drop 0.9s cubic-bezier(0.18, 1.6, 0.36, 1) both, crown-glow 1.6s ease-out 0.35s both;
}
.crown.pop::after {
    content: ""; position: absolute; left: 50%; top: 55%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border-radius: 50%; border: 2px solid var(--gold); opacity: 0; pointer-events: none;
    animation: crown-ring 0.85s ease-out 0.38s both;
}
@keyframes crown-drop {
    0%   { transform: translateY(-26px) scale(0.2) rotate(-50deg); opacity: 0; }
    45%  { transform: translateY(3px) scale(1.65) rotate(12deg); opacity: 1; }
    65%  { transform: translateY(0) scale(0.92) rotate(-5deg); }
    82%  { transform: scale(1.12) rotate(2deg); }
    100% { transform: none; opacity: 1; }
}
@keyframes crown-glow {
    0%, 20% { text-shadow: 0 0 22px var(--gold), 0 0 44px rgba(240, 180, 41, 0.75); }
    100%    { text-shadow: 0 0 6px rgba(240, 180, 41, 0.45); }
}
@keyframes crown-ring {
    0%   { opacity: 0.9; transform: scale(0.3); border-width: 3px; }
    100% { opacity: 0; transform: scale(5.5); border-width: 1px; }
}
/* The winner's bar catches the light once, so the eye goes to the row and not just the icon */
.l-row.winner .track { position: relative; overflow: hidden; }
.l-row.winner .track::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, 0.75) 50%, transparent 80%);
    transform: translateX(-120%);
    animation: track-shine 1.1s ease-out 0.45s both;
}
@keyframes track-shine { to { transform: translateX(120%); } }
@media (prefers-reduced-motion: reduce) {
    .crown.pop, .crown.pop::after, .l-row.winner .track::after { animation: none; }
    .crown.pop::after { display: none; }
    .l-row .track i { transition: none; }
}
.squad .s-wrap { max-width: 860px; margin: 0 auto; padding: 8px 0 40px; }
.squad h1 { font-size: 30px; font-stretch: 75%; margin: 0 0 6px; }
.squad .lead { color: var(--ink-2); margin: 0 0 14px; max-width: 70ch; }

.squad .waiting p, .l-squad .waiting p { margin: 0; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink-3); border-top-color: var(--gold); animation: spin 0.9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.squad .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.squad input[type=text] { flex: 1; min-width: 220px; }
.squad .mate small.stale { color: var(--gold); }
.t-scope { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.t-scope .hint { color: var(--ink-2); font-size: 12.5px; }
.l-pill.treasure { border-color: var(--gold); color: var(--gold); font-size: 15px; }
.l-pill.treasure i { background: var(--gold); animation: l-blink 1.2s ease-in-out infinite; }
.l-pill.done { border-color: var(--ink-2); color: var(--ink); }
.l-pill.done i { background: var(--ink-2); }
.l-pill.search { border-color: var(--gold); color: var(--ink); }
.l-pill.search i { background: var(--gold); animation: l-blink 0.8s ease-in-out infinite; }
.l-hold { display: flex; align-items: center; gap: 14px; background: var(--card); border-left: 4px solid var(--gold); border-radius: var(--radius); padding: 12px 18px; margin-bottom: 14px; font-size: 16px; }
.l-hold b { font-size: 26px; color: var(--gold); font-variant-numeric: tabular-nums; }
.l-hold .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--card-raised); overflow: hidden; }
.l-hold .bar i { display: block; height: 100%; background: var(--gold); transition: width 1s linear; }

/* ------------------------------------------------------------------ background work: top bar, chip, toasts */
.busy-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
.busy-bar.on { opacity: 1; }
.busy-bar i { display: block; height: 100%; background: var(--gold); box-shadow: 0 0 10px var(--gold); transition: width 0.6s ease; }
.busy-bar.indeterminate i { width: 30% !important; animation: busy-slide 1.1s ease-in-out infinite; }
@keyframes busy-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
.busy-chip { position: fixed; left: 20px; bottom: 20px; z-index: 55; display: flex; align-items: center; gap: 12px; background: var(--card-raised); border: 1px solid var(--gold); border-radius: 12px; padding: 12px 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45); max-width: min(440px, calc(100vw - 40px)); transform: translateY(calc(100% + 28px)); transition: transform 0.35s ease; }
.busy-chip.on { transform: translateY(0); }

.t-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; }

.t-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
.t-card { background: var(--card); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; position: relative; }
.t-card .picture { aspect-ratio: 16 / 6.5; background: var(--card-raised); display: grid; place-items: center; position: relative; overflow: hidden; }
/* Entera y no recortada. La tira es baja para que la pestaña quepa en una pantalla, y a esa
   altura un recorte se queda con una franja del centro: del coche dorado solo se veía el techo.
   Cabiendo dentro, la foto se ve pequeña pero se ve, que es para lo que está.
   El place-self hace falta: con el place-items: center del contenedor, la imagen no se estira,
   su height: 100% se queda en auto y se sale de la caja, que es lo que la recortaba. */
.t-card .picture img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.t-card .picture .glyph { font-size: 64px; font-stretch: 75%; font-weight: 700; color: var(--line); }
.t-card .info { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }

.t-card .odds b { color: var(--ink); font-weight: 600; }

/* The cumulative-probability bar. Tall enough to be the thing you look at, because it is: the
   percentages it carries span four orders of magnitude and the eye cannot tell 0,0015 % from
   0,017 % written down. A floor of 1,5 % of the width keeps the hopeless ones visible as a
   sliver rather than as nothing, which is honest both ways: there is something there, and it is
   almost nothing. */

.treasure input[type="text"], .treasure input[type="number"], .treasure input[type="date"], .treasure input[type="datetime-local"], .treasure select {

}

.drawer .steps, .squad .steps { margin: 12px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 13px; display: grid; gap: 4px; }
.drawer .shared, .squad .shared { background: var(--card-raised); border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
.drawer .shared summary, .squad .shared summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.drawer .shared p, .squad .shared p { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
.drawer .steps.big { color: var(--ink); font-size: 14px; gap: 14px; margin-top: 14px; }
.drawer .steps.big li::marker { font-weight: 700; color: var(--gold); }
.drawer .paths, .squad .paths { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
@media (max-width: 560px) { .drawer .paths { grid-template-columns: 1fr; } }
.drawer .path, .squad .path { background: var(--card-raised); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.drawer .path p, .squad .path p { margin: 0; }
.drawer .path .btn, .squad .path .btn { width: 100%; margin-top: 4px; }
.drawer .group, .squad .group { background: var(--card-raised); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
.drawer .grouphead, .squad .grouphead { display: flex; align-items: center; gap: 8px; }
.drawer .grouphead b, .squad .grouphead b { font-size: 15px; font-stretch: 75%; }
.drawer .grouphead .tag, .squad .grouphead .tag { background: var(--card); border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--ink-2); }
.drawer .group .mate, .squad .group .mate { background: var(--card); }
.drawer .group .confirm, .squad .group .confirm { display: inline-flex; flex-direction: column; gap: 6px; }
.drawer .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.drawer .facts div { background: var(--card-raised); border-radius: 8px; padding: 8px 10px; }
.drawer .facts b { display: block; font-size: 24px; font-stretch: 75%; line-height: 1.1; }
.drawer .facts span { font-size: 12.5px; color: var(--ink-2); }
.drawer .action { display: grid; grid-template-columns: 190px 1fr; gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.drawer .action:first-of-type { border-top: 0; }
.drawer .action p { margin: 0; }
.drawer .action .btn { width: 100%; }
.drawer .action .confirm { display: flex; flex-direction: column; gap: 6px; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: #2a0808; font-weight: 600; }
@media (max-width: 560px) { .drawer .action { grid-template-columns: 1fr; } .drawer .facts { grid-template-columns: repeat(2, 1fr); } }
.drawer p { color: var(--ink-2); margin: 4px 0 10px; font-size: 14px; }
.drawer .row { display: flex; gap: 8px; flex-wrap: wrap; }
.drawer input[type="text"], .drawer select {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0;
}
.drawer input[type="text"] { flex: 1; }
.drawer table td, .drawer table th { text-align: left; padding: 6px 8px; }
.drawer table td.num, .drawer table th.num { text-align: right; }
.drawer .classname { font-size: 13.5px; color: var(--ink); word-break: break-all; white-space: normal; }
.drawer .close { position: absolute; top: 18px; right: 18px; }
.saved-note { color: var(--ink-2); font-size: 13px; align-self: center; }

.empty { padding: 26px 6px; color: var(--ink-2); max-width: 62ch; }
.empty strong { color: var(--ink); display: block; font-size: 18px; margin-bottom: 6px; }
.empty code { background: var(--card-raised); padding: 1px 6px; border-radius: 4px; font-family: inherit; }
</style>

    ["Los huecos de quien no comparte se estiman a {0} cofres por partida, la media de quien s\u00ed.", "Slots of players who do not share are estimated at {0} chests a match, the average of those who do.", "Les places de ceux qui ne partagent pas sont estim\u00e9es \u00e0 {0} coffres par partie, la moyenne de ceux qui partagent."],
    ["casillas tachadas", "squares crossed out", "cases cochées"],
    ["de que ya te hubiera tocado {0}", "chance you should already have got {0}", "de chances d'avoir déjà obtenu {0}"],
    ["no te falta ningún tesoro esta semana", "you are not missing any treasure this week", "il ne te manque aucun trésor cette semaine"],
    ["de que el próximo cofre te dé {0}", "chance your next chest gives you {0}", "de chances que ton prochain coffre te donne {0}"],
    ["nada nuevo que pueda salir", "nothing new left to drop", "plus rien de nouveau à obtenir"],
    ["Los dos porcentajes de arriba cuentan solo los tesoros sin tachar. Probabilidades por cofre publicadas por Epic (Fortnite Status, 7 de noviembre de 2026) para partidas normales. El cálculo usa los cofres, cofres especiales y cofres de espíritu de las partidas leídas, abiertos o rotos; Epic no ha dicho si todos los tipos de cofre cuentan igual. El cambio de semana (domingo, 14:00 UTC) no lo publica Epic: ajústalo en «Editar tesoros». Los objetos de cada semana tampoco salen en ninguna lista, así que el programa los busca en el catálogo del juego por el identificador interno con el que Epic marca los tesoros y rellena solo las casillas vacías; lo que escribas tú gana siempre. Las Horas del tesoro también se apuntan a mano: las horas son las que anunció Epic, pero algunos multiplicadores vienen de la prensa y no de Epic, así que conviene comprobarlos ahí mismo.", "The two percentages above only count treasures you have not crossed out. Per-chest odds published by Epic (Fortnite Status, 7 November 2026) for regular matches. The calculation uses the chests, special chests and spirit chests of the matches read, opened or broken; Epic has not said whether every chest type counts the same. Epic does not publish the weekly reset (Sunday, 14:00 UTC): adjust it in “Edit treasures”. Each week's items are not published as a list either, so the program looks for them in the game's own catalogue by the internal id Epic marks treasures with, and only fills in squares that are empty; anything you type always wins. Treasure Hours are written down by hand too: the times are the ones Epic announced, but some multipliers come from the press rather than from Epic, so they are worth checking there as well.", "Les deux pourcentages ci-dessus ne comptent que les trésors non cochés. Probabilités par coffre publiées par Epic (Fortnite Status, 7 novembre 2026) pour les parties normales. Le calcul utilise les coffres, coffres spéciaux et coffres d'esprit des parties lues, ouverts ou cassés ; Epic n'a pas dit si tous les types de coffres comptent pareil. Epic ne publie pas le changement de semaine (dimanche, 14:00 UTC) : ajuste-le dans « Modifier les trésors ». Les objets de chaque semaine ne sont pas publiés en liste non plus, donc le programme les cherche dans le catalogue du jeu par l'identifiant interne dont Epic marque les trésors, et ne remplit que les cases vides ; ce que tu écris gagne toujours. Les Heures du trésor sont aussi notées à la main : les horaires sont ceux annoncés par Epic, mais certains multiplicateurs viennent de la presse et non d'Epic, donc mieux vaut les vérifier au même endroit."],
    ["En «Probabilidad total» no se puede contar el cuarto hueco del escuadrón: casi cada partida lo llena alguien distinto, y la mayoría no usa el programa. Esos huecos se estiman a la media de cofres por partida de quien sí comparte, medida sobre vuestras partidas y no fijada en el programa. Las cifras que llevan algo estimado salen con «~» y dicen debajo de qué están hechas. Si la media se queda corta, tus probabilidades salen más bajas de lo que son, que es el lado bueno del que equivocarse.", "In “Total chance” the squad's fourth seat cannot be counted: almost every match somebody different fills it, and most of them do not use the program. Those seats are estimated at the average chests per match of the people who do share, measured over your own matches and not written into the program. Any figure carrying an estimate is shown with “~” and says underneath what it is made of. If that average falls short, your odds come out lower than they really are, which is the good side to be wrong on.", "Dans « Probabilité totale », la quatrième place de l'escouade ne peut pas être comptée : presque chaque partie, c'est quelqu'un de différent qui l'occupe, et la plupart n'utilisent pas le programme. Ces places sont estimées à la moyenne de coffres par partie de ceux qui partagent, mesurée sur vos parties et non inscrite dans le programme. Tout chiffre comportant une estimation s'affiche avec « ~ » et dit en dessous de quoi il est fait. Si cette moyenne est trop basse, tes probabilités sortent plus faibles qu'elles ne le sont, ce qui est le bon côté de l'erreur."],

    ["Fortnite borra sus repeticiones a los pocos días, así que una partida que solo esté aquí se pierde si se pierde esta carpeta. El programa guarda una copia al día por su cuenta; llévate una fuera del PC de vez en cuando.", "Fortnite deletes its replays within days, so a match that is only here is gone if this folder is lost. The program keeps a copy a day by itself; take one off this PC from time to time.", "Fortnite supprime ses rediffusions au bout de quelques jours : une partie qui n'est plus qu'ici est perdue si ce dossier l'est. Le programme garde une copie par jour tout seul ; emporte-en une hors du PC de temps en temps."],

    ["{0} cofres entre los {1}. Los marcados «estimado» son un mínimo: lo que tu repetición les vio abrir cerca de ti, así que abrieron eso o más.", "{0} chests between the {1} of you. The ones marked «estimate» are a floor: what your replay saw them open near you, so they opened that or more.", "{0} coffres à {1}. Ceux marqués « estimation » sont un minimum : ce que ta rediffusion leur a vu ouvrir près de toi, donc ils en ont ouvert autant ou plus."],
    ["Cofres de tus compañeros ahora mismo", "Your squadmates' chests right now", "Les coffres de tes coéquipiers en ce moment"],
    ["Cofres de tus compañeros en esta partida", "Your squadmates' chests in this match", "Les coffres de tes coéquipiers dans cette partie"],
    ["Comparte contigo: su cifra de verdad llega al terminar la partida", "They share with you: their real figure arrives when the match ends", "Il partage avec toi : son vrai chiffre arrive à la fin de la partie"],
    ["No comparte contigo: es solo lo que tu repetición le ve abrir cerca de ti", "Not sharing with you: it is only what your replay sees them open near you", "Il ne partage pas avec toi : c'est seulement ce que ta rediffusion lui voit ouvrir près de toi"],
    ["Tu repetición solo graba lo que se abre cerca de ti, así que estas cifras son mínimos. Las de verdad de quien comparte contigo llegan al terminar la partida.", "Your replay only records what is opened near you, so these figures are floors. The real ones, for whoever shares with you, arrive when the match ends.", "Ta rediffusion n'enregistre que ce qui est ouvert près de toi, donc ces chiffres sont des minimums. Les vrais, pour ceux qui partagent avec toi, arrivent à la fin de la partie."],
    ["Tu repetición solo graba lo que se abre cerca de ti, unos 300 m, así que estas cifras son mínimos: abrieron eso o más.", "Your replay only records what is opened near you, about 300 m, so these figures are floors: they opened that or more.", "Ta rediffusion n'enregistre que ce qui est ouvert près de toi, environ 300 m, donc ces chiffres sont des minimums : ils en ont ouvert autant ou plus."],
    ["No está en tu escuadrón: es lo que tu repetición le vio abrir cerca de ti", "Not in your squad: this is what your replay saw them open near you", "Pas dans ton escouade : c'est ce que ta rediffusion lui a vu ouvrir près de toi"],
    ["No está en tu escuadrón: es lo que tus repeticiones le vieron abrir cerca de ti", "Not in your squad: this is what your replays saw them open near you", "Pas dans ton escouade : c'est ce que tes rediffusions lui ont vu ouvrir près de toi"],
    ["{0} cofres entre los {1}. Los marcados «estimado» no están en tu escuadrón: es solo lo que tu repetición les vio abrir cerca de ti, así que abrieron eso o más.", "{0} chests between the {1} of you. The ones marked «estimate» are not in your squad: it is only what your replay saw them open near you, so they opened that or more.", "{0} coffres à {1}. Ceux marqués « estimation » ne sont pas dans ton escouade : c'est seulement ce que ta rediffusion leur a vu ouvrir près de toi, donc ils en ont ouvert autant ou plus."],
    ["Los cofres de un compañero son los que ha publicado en vuestra carpeta compartida. Un «*» avisa de que no publicó todas sus partidas, así que su total va corto. Un «≥» es alguien que no comparte: es lo que tus repeticiones le vieron abrir cerca de ti, así que abrió eso o más, y nunca gana la corona.", "A squadmate's chests are the ones they published in your shared folder. A “*” warns that they did not publish every match, so their total falls short. A “≥” is somebody not sharing: it is what your replays saw them open near you, so they opened that or more, and it never wins the crown.", "Les coffres d'un coéquipier sont ceux qu'il a publiés dans votre dossier partagé. Un « * » avertit qu'il n'a pas publié toutes ses parties, donc son total est en dessous. Un « ≥ » est quelqu'un qui ne partage pas : c'est ce que tes rediffusions lui ont vu ouvrir près de toi, donc il en a ouvert autant ou plus, et cela ne gagne jamais la couronne."],
    ["{0} cofres entre los {1}. Los de tus compañeros vienen de vuestra carpeta compartida.", "{0} chests between the {1} of you. Your squadmates' come from your shared folder.", "{0} coffres à {1}. Ceux de tes coéquipiers viennent de votre dossier partagé."],
    ["Tú", "You", "Toi"],
    ["Kills, derribos y veces derribado salen del registro de bajas de la partida, que es completo para todos.", "Kills, knocks and times knocked come from the match's own elimination log, which is complete for everybody.", "Éliminations, mises à terre et fois où il a été mis à terre viennent du journal des éliminations de la partie, complet pour tout le monde."],
    ["Partidas es cuántas de estas jugó contigo: sus kills, sus derribos y sus cofres suman solo esas.", "Matches is how many of these they played with you: their kills, their knocks and their chests add up only those.", "Parties, c'est combien de celles-ci il a jouées avec toi : ses éliminations, ses mises à terre et ses coffres n'additionnent que celles-là."],
    ["Sus cofres contigo", "Their chests with you", "Leurs coffres avec toi"],
    ["{0} en {1}", "{0} in {1}", "{0} en {1}"],
    ["♛ {0} cofres: ganas la partida", "♛ {0} chests: you win the match", "♛ {0} coffres : tu gagnes la partie"],
    ["{0} más que {1}, que llevó {2}.", "{0} more than {1}, who got {2}.", "{0} de plus que {1}, qui en a eu {2}."],
    ["{0} más que el segundo, que llevó {1}.", "{0} more than the runner-up, who got {1}.", "{0} de plus que le second, qui en a eu {1}."],

    // The best minute to leave, and Treasure Hours in the live tab
    ["Minuto {0}: hora de salir", "Minute {0}: time to leave", "Minute {0} : il est temps de partir"],
    ["A partir de aquí rinde más una partida nueva que seguir en esta. Sale de tus propias cifras.", "From here a fresh match pays better than staying in this one. It comes from your own figures.", "À partir d'ici, une nouvelle partie rapporte plus que de rester. Cela vient de tes propres chiffres."],
    ["Los cofres valen más ahora mismo", "Chests are worth more right now", "Les coffres valent plus en ce moment"],
    ["HORA DEL TESORO · HASTA ×{0} · {1} min", "TREASURE HOUR · UP TO ×{0} · {1} min", "HEURE DU TRÉSOR · JUSQU'À ×{0} · {1} min"],
    ["cofres que sueles llevar en el minuto {0}", "chests you usually have by minute {0}", "coffres que tu as d'habitude à la minute {0}"],
    ["Cofres antes del minuto {0}", "Chests before minute {0}", "Coffres avant la minute {0}"],

    // Treasure tab: whose chests the odds are counted over
    ["Probabilidad total", "Total chance", "Probabilité totale"],
    ["Mi probabilidad", "My chance", "Ma probabilité"],
    ["Cuenta tus cofres y los de {0} en vuestras partidas juntos.", "Counts your chests and those of {0} in the matches you played together.", "Compte tes coffres et ceux de {0} dans vos parties jouées ensemble."],
    ["Cuenta solo los cofres que has abierto tú.", "Counts only the chests you opened yourself.", "Compte uniquement les coffres que tu as ouverts."],
    ["compañero", "squadmate", "coéquipier"],
    ["compañeros", "squadmates", "coéquipiers"],

    // Squads: the shared folder and everything the settings say about it
    ["Escuadrones", "Squads", "Escouades"],
    ["Tu repetición solo graba los cofres que se abren cerca de ti, así que los de tus compañeros no están en tu archivo: están en el suyo. Una carpeta compartida junta lo que ha visto cada uno. Nada sale de tu PC hasta que entres en un escuadrón.", "Your replay only records the chests opened near you, so your squadmates' chests are not in your file: they are in theirs. A shared folder puts together what each of you saw. Nothing leaves your PC until you join a squad.", "Ta rediffusion n'enregistre que les coffres ouverts près de toi : ceux de tes coéquipiers ne sont pas dans ton fichier, ils sont dans le leur. Un dossier partagé réunit ce que chacun a vu. Rien ne quitte ton PC tant que tu n'as pas rejoint une escouade."],
    ["Buscando…", "Looking…", "Recherche…"],
    ["Todavía no se sabe tu ID de Epic, y es el nombre que lleva tu archivo dentro del escuadrón. Juega una partida y vuelve aquí.", "Your Epic id is not known yet, and it is the name your file carries inside the squad. Play a match and come back here.", "Ton ID Epic n'est pas encore connu, et c'est le nom que porte ton fichier dans l'escouade. Joue une partie et reviens ici."],

    // What is shared
    ["Qué se comparte exactamente", "Exactly what is shared", "Ce qui est partagé, exactement"],
    ["De cada partida sale una ficha de unos 250 bytes con nueve datos: el código de la partida, cuándo empezó, cuánto duraste, los cofres que abriste (normales, especiales y de espíritu), tus kills, tu puesto y el minuto de tu primer cofre.", "Each match sends a card of about 250 bytes with nine things: the match code, when it started, how long you lasted, the chests you opened (normal, special and spirit), your kills, your placement and the minute of your first chest.", "Chaque partie envoie une fiche d'environ 250 octets avec neuf données : le code de la partie, son heure de début, combien de temps tu as tenu, les coffres ouverts (normaux, spéciaux et d'esprit), tes éliminations, ton classement et la minute de ton premier coffre."],
    ["No sale nada más. Ni dónde estaban los cofres, ni los demás jugadores de la partida, ni tus repeticiones, ni el daño, ni la precisión, ni tu nombre de Windows. Las partidas que quites de tus estadísticas tampoco se comparten.", "Nothing else leaves. Not where the chests were, not the other players in the match, not your replays, not the damage, not the accuracy, not your Windows name. Matches you take out of your statistics are not shared either.", "Rien d'autre ne sort. Ni l'emplacement des coffres, ni les autres joueurs de la partie, ni tes rediffusions, ni les dégâts, ni la précision, ni ton nom Windows. Les parties que tu retires de tes statistiques ne sont pas partagées non plus."],
    ["Si entras en varios escuadrones, cada uno recibe tu ficha completa: los de uno ven también las partidas que jugaste con el otro.", "If you join several squads, each one gets your full card: the people in one also see the matches you played with the other.", "Si tu rejoins plusieurs escouades, chacune reçoit ta fiche complète : les membres de l'une voient aussi les parties jouées avec l'autre."],

    // The two ways in
    ["¿Te han invitado?", "Were you invited?", "On t'a invité ?"],
    ["Tu squad te ha pasado un enlace de OneDrive, Drive o Dropbox.", "Your squad sent you a OneDrive, Drive or Dropbox link.", "Ton squad t'a envoyé un lien OneDrive, Drive ou Dropbox."],
    ["Tengo una invitación", "I have an invitation", "J'ai une invitation"],
    ["¿Lo montas tú?", "Setting it up yourself?", "C'est toi qui la crées ?"],
    ["Solo hace falta que lo haga uno. Los demás entrarán con tu enlace.", "Only one of you needs to. The others will join with your link.", "Un seul d'entre vous doit le faire. Les autres entreront avec ton lien."],
    ["Crear un escuadrón", "Create a squad", "Créer une escouade"],
    ["← Volver", "← Back", "← Retour"],

    // Joining with an invitation
    ["Tu squad te ha pasado un enlace. Aceptarlo es lo que pone la carpeta en tu PC; a partir de ahí el programa la encuentra solo.", "Your squad sent you a link. Accepting it is what puts the folder on your PC; from there the program finds it by itself.", "Ton squad t'a envoyé un lien. L'accepter est ce qui met le dossier sur ton PC ; à partir de là, le programme le trouve tout seul."],
    ["Pega aquí el enlace que te han pasado.", "Paste the link they sent you here.", "Colle ici le lien qu'on t'a envoyé."],
    ["Abrir el enlace", "Open the link", "Ouvrir le lien"],
    ["Enlace de la invitación", "Invitation link", "Lien de l'invitation"],
    ["Enlace abierto en el navegador", "Link opened in the browser", "Lien ouvert dans le navigateur"],
    ["En la página que se abre, acepta el compartido y pulsa «Agregar acceso directo a Mis archivos». Eso es lo que lo baja a tu disco.", "On the page that opens, accept the share and click «Add shortcut to My files». That is what brings it down to your disk.", "Sur la page qui s'ouvre, accepte le partage et clique sur « Ajouter un raccourci à Mes fichiers ». C'est ce qui le télécharge sur ton disque."],
    ["Vuelve aquí. Lo busco yo solo cada pocos segundos.", "Come back here. I look for it by myself every few seconds.", "Reviens ici. Je le cherche tout seul toutes les quelques secondes."],
    ["Buscando la carpeta en tu disco…", "Looking for the folder on your disk…", "Recherche du dossier sur ton disque…"],
    ["Mirando en: ", "Looking in: ", "Je regarde dans : "],
    [" · llevo {0} s", " · {0}s so far", " · {0} s écoulées"],
    ["Aceptar el enlace no baja la carpeta al instante: OneDrive puede tardar un par de minutos en traerla. En cuanto esté, aparece aquí sola y no hay que pulsar nada.", "Accepting the link does not bring the folder down straight away: OneDrive can take a couple of minutes. As soon as it is here it shows up by itself, with nothing to press.", "Accepter le lien ne télécharge pas le dossier tout de suite : OneDrive peut mettre quelques minutes. Dès qu'il est là, il apparaît tout seul, sans rien à cliquer."],
    ["No encuentro OneDrive, Google Drive ni Dropbox en este PC. Sin uno de los tres no hay dónde buscar: instálalo y entra con tu cuenta, o escribe abajo la ruta a mano.", "I cannot find OneDrive, Google Drive or Dropbox on this PC. Without one of the three there is nowhere to look: install it and sign in, or type the path below by hand.", "Je ne trouve ni OneDrive, ni Google Drive, ni Dropbox sur ce PC. Sans l'un des trois, il n'y a nulle part où chercher : installe-le et connecte-toi, ou écris le chemin ci-dessous à la main."],
    ["Buscar ahora", "Look now", "Chercher maintenant"],
    ["Buscado otra vez", "Looked again", "Recherche refaite"],
    ["Abrir mi OneDrive", "Open my OneDrive", "Ouvrir mon OneDrive"],
    ["Lo he encontrado", "Found it", "Je l'ai trouvé"],
    ["Ya puedes entrar en el escuadrón.", "You can join the squad now.", "Tu peux maintenant rejoindre l'escouade."],
    ["Escuadrón", "Squad", "Escouade"],
    ["Los escuadrones tienen su propia pestaña, arriba: ahí se crean, se entra y se ve quién comparte.", "Squads have their own tab at the top: that is where you create one, join one and see who is sharing.", "Les escouades ont leur propre onglet en haut : c'est là qu'on en crée une, qu'on en rejoint une et qu'on voit qui partage."],
    ["Ir a Escuadrón", "Go to Squad", "Aller à Escouade"],
    ["Ya lo he aceptado, búscalo", "I have accepted it, look for it", "Je l'ai accepté, cherche-le"],
    ["Buscado", "Looked", "Recherche faite"],
    ["Todavía no lo veo en tu disco. La nube puede tardar un momento en bajarlo: espera unos segundos y vuelve a buscar.", "I still cannot see it on your disk. The cloud can take a moment to bring it down: wait a few seconds and look again.", "Je ne le vois toujours pas sur ton disque. Le cloud peut mettre un moment à le télécharger : attends quelques secondes et cherche à nouveau."],

    // Creating one
    ["Esto lo hace una sola persona del squad. Los demás entran con el enlace que les pases, y no tienen que crear nada.", "Only one person in the squad does this. The others join with the link you send them, and have nothing to create.", "Une seule personne du squad fait ceci. Les autres entrent avec le lien que tu leur envoies, sans rien créer."],
    ["Crea la carpeta del escuadrón.", "Create the squad folder.", "Crée le dossier de l'escouade."],
    ["Crear en {0}", "Create in {0}", "Créer dans {0}"],
    ["Escuadrón creado", "Squad created", "Escouade créée"],
    ["Se abrirá la carpeta. Compártela con tu squad con permiso de edición (no de solo lectura, o no podrán publicar sus cofres).", "The folder will open. Share it with your squad with edit permission (not read-only, or they will not be able to publish their chests).", "Le dossier s'ouvrira. Partage-le avec ton squad avec la permission de modification (pas en lecture seule, sinon ils ne pourront pas publier leurs coffres)."],
    ["Pásales el enlace por Discord o WhatsApp. Al aceptarlo les aparecerá solo en su programa.", "Send them the link on Discord or WhatsApp. Once accepted it shows up by itself in their program.", "Envoie-leur le lien sur Discord ou WhatsApp. Une fois accepté, il apparaîtra tout seul dans leur programme."],
    ["No encuentro OneDrive, Google Drive ni Dropbox en este PC. Instala uno de los tres, o escribe abajo la ruta de una carpeta que ya compartas.", "I cannot find OneDrive, Google Drive or Dropbox on this PC. Install one of the three, or type below the path of a folder you already share.", "Je ne trouve ni OneDrive, ni Google Drive, ni Dropbox sur ce PC. Installe l'un des trois, ou écris ci-dessous le chemin d'un dossier que tu partages déjà."],
    ["¿Usas otra nube, o una carpeta de red? Escribe aquí su ruta.", "Using another cloud, or a network folder? Type its path here.", "Tu utilises un autre cloud, ou un dossier réseau ? Écris son chemin ici."],
    ["Usar esta carpeta", "Use this folder", "Utiliser ce dossier"],
    ["Carpeta del escuadrón", "Squad folder", "Dossier de l'escouade"],

    // One that was found sitting on the disk
    ["He encontrado un escuadrón en tu {0}", "I found a squad in your {0}", "J'ai trouvé une escouade dans ton {0}"],
    ["Has jugado con {0} de ellos hace poco, así que es el tuyo.", "You played with {0} of them recently, so this is yours.", "Tu as joué avec {0} d'entre eux récemment : c'est bien la tienne."],
    ["Aún no has jugado con nadie de este escuadrón. Comprueba que es el de tu squad antes de entrar.", "You have not played with anyone in this squad yet. Check that it is your squad's before joining.", "Tu n'as encore joué avec personne de cette escouade. Vérifie que c'est bien celle de ton squad avant d'entrer."],
    ["Entrar en este escuadrón", "Join this squad", "Rejoindre cette escouade"],
    ["Ya estás en el escuadrón", "You are in the squad", "Tu es dans l'escouade"],
    ["Hay más de un escuadrón en tus carpetas de nube. Probablemente se crearon por error: aseguraos de entrar todos en el mismo.", "There is more than one squad in your cloud folders. They were probably created by mistake: make sure you all join the same one.", "Il y a plus d'une escouade dans tes dossiers cloud. Elles ont sans doute été créées par erreur : assurez-vous de rejoindre tous la même."],

    // The ones you are in
    ["Te han compartido la carpeta en solo lectura.", "The folder was shared with you as read-only.", "Le dossier t'a été partagé en lecture seule."],
    ["Ves a tu squad, pero tú no apareces para ellos. Pídeles que te la compartan otra vez con permiso de edición.", "You can see your squad, but you do not show up for them. Ask them to share it again with edit permission.", "Tu vois ton squad, mais tu n'apparais pas pour eux. Demande-leur de le repartager avec la permission de modification."],
    ["La carpeta de este escuadrón ya no está donde estaba.", "This squad's folder is no longer where it was.", "Le dossier de cette escouade n'est plus là où il était."],
    ["Si tu nube está sincronizando todavía, espera un momento. Si la has movido o borrado, sal y vuelve a entrar.", "If your cloud is still syncing, wait a moment. If you moved or deleted it, leave and join again.", "Si ton cloud synchronise encore, attends un instant. Si tu l'as déplacé ou supprimé, quitte et reviens."],
    ["No se puede escribir en esta carpeta.", "This folder cannot be written to.", "Impossible d'écrire dans ce dossier."],
    ["Puede estar ocupada por la nube en este momento. Si sigue así, sal y vuelve a entrar.", "The cloud may be busy with it right now. If it stays that way, leave and join again.", "Le cloud est peut-être en train de l'utiliser. Si cela persiste, quitte et reviens."],
    ["Juegas con ellos y aún no están aquí: ", "You play with them and they are not here yet: ", "Tu joues avec eux et ils ne sont pas encore ici : "],
    ["Todavía solo estás tú", "So far it is just you", "Pour l'instant, il n'y a que toi"],
    ["Abrir la carpeta", "Open the folder", "Ouvrir le dossier"],
    ["No se pudo abrir la carpeta.", "The folder could not be opened.", "Le dossier n'a pas pu être ouvert."],
    ["Volver a comprobar", "Check again", "Vérifier à nouveau"],
    ["Escuadrón comprobado", "Squad checked", "Escouade vérifiée"],
    ["Salir", "Leave", "Quitter"],
    ["Sí, salir", "Yes, leave", "Oui, quitter"],
    ["Has salido del escuadrón", "You left the squad", "Tu as quitté l'escouade"],
    ["Entrar en otro escuadrón", "Join another squad", "Rejoindre une autre escouade"],
    ["Estás en los {0} escuadrones que caben. Sal de uno para entrar en otro.", "You are in all {0} squads that fit. Leave one to join another.", "Tu es dans les {0} escouades possibles. Quittes-en une pour en rejoindre une autre."],
    ["Para que entren los demás: abre la carpeta, compártela con permiso de edición y pásales el enlace. Al aceptarlo les aparecerá solo.", "For the others to join: open the folder, share it with edit permission and send them the link. Once accepted it shows up by itself.", "Pour que les autres entrent : ouvre le dossier, partage-le avec la permission de modification et envoie-leur le lien. Une fois accepté, il apparaîtra tout seul."],
    ["No se pudo hacer. Inténtalo otra vez.", "That did not work. Try again.", "Cela n'a pas fonctionné. Réessaie."],

    ["Le ganas por {0} cofres por partida", "You beat them by {0} chests a match", "Tu le bats de {0} coffres par partie"],
    ["Con {0} partida suya publicada todavía no hay con qué decidir", "With {0} match of theirs published there is nothing to decide it on yet", "Avec {0} partie de lui publiée, il n'y a encore rien pour trancher"],
    ["Con {0} partidas suyas publicadas todavía no hay con qué decidir", "With {0} matches of theirs published there is nothing to decide it on yet", "Avec {0} parties de lui publiées, il n'y a encore rien pour trancher"],
    ["Comparte con vosotros, pero todavía no ha publicado ninguna de vuestras partidas", "They share with you, but have not published any of your matches yet", "Il partage avec vous, mais n'a encore publié aucune de vos parties"],

const OBJ_LANGS = { en: { strName: "English", strLocale: "en-GB" }, es: { strName: "Español", strLocale: "es-ES" }, fr: { strName: "Français", strLocale: "fr-FR" } };

    try { const strSaved = localStorage.getItem("fcc-language"); if (OBJ_LANGS[strSaved]) return strSaved; } catch (objError) { /* storage unavailable */ }

const objTranslator = (() => {
    const intColumn = { en: 1, fr: 2 }[STR_LANG];
    const dicExact = new Map();
    const arrPatterns = [];
    const escapeRegex = (strText) => strText.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    if (intColumn) {
        for (const arrEntry of ARR_I18N) {
            const strSource = arrEntry[0];

            const strLiteral = strSource.replace(/\{\d+\}/g, "");
            if (!/[A-Za-zÀ-ÿ]{2}/.test(strLiteral)) continue;     // nothing to recognise it by
            arrPatterns.push({
                bWeak: strLiteral.replace(/[^A-Za-zÀ-ÿ]/g, "").length < 4,
                reSource: new RegExp(`^${strSource.split(/\{\d+\}/).map(escapeRegex).join("([\\s\\S]*?)")}$`),
                arrSlots: [...strSource.matchAll(/\{(\d+)\}/g)].map((arrMatch) => Number(arrMatch[1])),
                strTarget: arrEntry[intColumn],
                intWeight: strLiteral.length
            });
        }
        arrPatterns.sort((objLeft, objRight) => objRight.intWeight - objLeft.intWeight);
    }

    const dicCache = new Map();
    const translate = (strText, intDepth = 0) => {
        if (!intColumn || !strText || intDepth > 5 || !/[A-Za-zÀ-ÿ]/.test(strText)) return strText;
        if (intDepth === 0 && dicCache.has(strText)) return dicCache.get(strText);
        const strResult = translateUncached(strText, intDepth);
        if (intDepth === 0) {
            if (dicCache.size > 20000) dicCache.clear();
            dicCache.set(strText, strResult);
        }
        return strResult;
    };
    const translateUncached = (strText, intDepth) => {
        if (dicExact.has(strText)) return dicExact.get(strText);
        const [, strLead, strCore, strTrail] = /^(\s*)([\s\S]*?)(\s*)$/.exec(strText);
        if (strCore !== strText && dicExact.has(strCore)) return strLead + dicExact.get(strCore) + strTrail;
        for (const strCandidate of strCore !== strText ? [strText, strCore] : [strText]) {
            for (const objPattern of arrPatterns) {
                const arrMatch = objPattern.reSource.exec(strCandidate);
                if (!arrMatch) continue;
                if (objPattern.bWeak && arrMatch.slice(1).some((strPart) => !/\d/.test(strPart))) continue;
                const arrValues = [];
                objPattern.arrSlots.forEach((intSlot, intIndex) => { arrValues[intSlot] = translate(arrMatch[intIndex + 1], intDepth + 1); });
                const strOut = objPattern.strTarget.replace(/\{(\d+)\}/g, (strAll, strSlot) => arrValues[Number(strSlot)] ?? "");
                return strCandidate === strText ? strOut : strLead + strOut + strTrail;
            }

        const arrCount = /^([+−-]?[\d.,  ]*\d[\d.,]*\s*%?)(\s+)([\s\S]+)$/.exec(strCore);

        if (isLeftAlone(elNode)) return;

            const strValue = elNode.getAttribute?.(strAttribute);

        observe();
    };
    return { translate, start };
})();
