# Publishes a new version: create a release with a new tag such as v1.2.0 on the GitHub website
# (or push the tag with git) and this builds FortniteChestCounter.exe on
# Windows and attaches it to a GitHub release. Copies already installed see it and offer to update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build the executable
        shell: pwsh
        run: |
          $strVersion = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish src/ChestTracker/ChestTracker.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:Version=$strVersion -p:UpdateRepository=${{ github.repository }} -o dist

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What the release says: docs/releases/<tag>.md when it is written, else a list of commits
          $strNotes = "docs/releases/${{ github.ref_name }}.md"
          if (Test-Path $strNotes) {
            $arrNotes = @("--notes-file", $strNotes)
          } else {
            $arrNotes = @("--generate-notes")
          }

          # The release may already exist (created from the GitHub website): then only attach the file
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" dist/FortniteChestCounter.exe --clobber
          } else {
            gh release create "${{ github.ref_name }}" dist/FortniteChestCounter.exe --title "${{ github.ref_name }}" @arrNotes
          }
          exit $LASTEXITCODE
